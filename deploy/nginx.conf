# ═══════════════════════════════════════════════════════════════════════
# deploy/nginx.conf
# ───────────────────────────────────────────────────────────────────────
# Reverse proxy для всего стека внутри docker-compose.
# Все апстримы — DNS-имена контейнеров в дефолтной сети compose.
# ═══════════════════════════════════════════════════════════════════════

upstream ai_office {
    server ai-office:8080;
}
upstream transcribe {
    server ai-transcribe:3000;
}

limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;

server {
    listen 80 default_server;
    server_name _;

    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/html
        text/plain
        text/xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── healthz через ai-office ───────────────────────────────────────
    location = /healthz {
        access_log off;
        proxy_pass http://ai_office/healthz;
    }

    # ── transcribe (Next.js) ──────────────────────────────────────────
    # Page routes + специфичные API префиксы.
    location /transcribe        { proxy_pass http://transcribe; include /etc/nginx/conf.d/proxy_common.conf; }
    location ^~ /transcribe/    { proxy_pass http://transcribe; include /etc/nginx/conf.d/proxy_common.conf; }
    location ^~ /me             { proxy_pass http://transcribe; include /etc/nginx/conf.d/proxy_common.conf; }
    location ^~ /assistants     { proxy_pass http://transcribe; include /etc/nginx/conf.d/proxy_common.conf; }
    location ^~ /api/transcribe { proxy_pass http://transcribe; include /etc/nginx/conf.d/proxy_common.conf; }
    location ^~ /api/tasks      { proxy_pass http://transcribe; include /etc/nginx/conf.d/proxy_common.conf; }
    location ^~ /api/me         { proxy_pass http://transcribe; include /etc/nginx/conf.d/proxy_common.conf; }
    location ^~ /api/assistants { proxy_pass http://transcribe; include /etc/nginx/conf.d/proxy_common.conf; }
    location ^~ /_next/         { proxy_pass http://transcribe; include /etc/nginx/conf.d/proxy_common.conf; }

    # Next.js kanban /admin доступен через отдельный путь чтобы не
    # конфликтовать с /admin = leads-inbox.html в ai-office.
    location = /board                { proxy_pass http://transcribe/admin; include /etc/nginx/conf.d/proxy_common.conf; }
    location /board/                 { rewrite ^/board(/.*)$ /admin$1 break; proxy_pass http://transcribe; include /etc/nginx/conf.d/proxy_common.conf; }

    # ── ai-office API с rate-limit ────────────────────────────────────
    location ^~ /api/ {
        limit_req zone=public_api burst=20 nodelay;
        proxy_pass http://ai_office;
        include /etc/nginx/conf.d/proxy_common.conf;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── всё остальное (статика ai-office, /files/voice-notes/*) ──────
    location / {
        proxy_pass http://ai_office;
        include /etc/nginx/conf.d/proxy_common.conf;
    }
}
