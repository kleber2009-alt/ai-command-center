# Self-hosted stack: Next.js app + Postgres (with pgvector) + yt-dlp + Caddy.
# Caddy handles HTTPS via Let's Encrypt automatically once you point a domain
# at the host. Set DOMAIN in .env to your domain (e.g. transcribe.example.com).
#
#   docker compose up -d --build
#   docker compose logs -f app

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}
      DATABASE_SSL: "0"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      YTDLP_SERVICE_URL: http://ytdlp:8080
      YTDLP_SERVICE_API_KEY: ${YTDLP_SERVICE_API_KEY:-}
    expose:
      - "3000"

  ytdlp:
    build:
      context: ./services/ytdlp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      YTDLP_SERVICE_API_KEY: ${YTDLP_SERVICE_API_KEY:-}
      COOKIES_B64: ${COOKIES_B64:-}
      INSTAGRAM_COOKIES_B64: ${INSTAGRAM_COOKIES_B64:-}
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set in .env, e.g. transcribe.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
