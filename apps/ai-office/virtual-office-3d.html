<!doctype html>
<html lang="ru">
<head>
<title>AICEX Virtual Office</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  AICEX Virtual Office: interactive 3D office for AI agents (Three.js, no build step).
  Three design variants: #night (default), #day, #neon. Pick one via the URL hash.
  Embed on any page:
    <iframe src="/virtual-office-3d.html#night" style="width:100%;height:720px;border:0" allow="fullscreen"></iframe>
  Rooms, agents and tasks live in the ROOMS / ROOM_AGENTS / ROOM_TASKS constants below:
  wire them to the real agents API when it is ready.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: full-bleed WebGL stage; floating glass chips for room labels, header, theme switcher and agent panel. */
:root {
  --bg: #07080b;
  --chip: rgba(17, 15, 13, .80);
  --chip-border: rgba(255, 214, 160, .16);
  --fg: #f4ede4;
  --muted: #b3a796;
  --accent: #e7a95a;
  --panel: rgba(14, 13, 12, .90);
  --ok: #3ee07a;
  --warn: #ffbf3c;
  --idle: #8a93a6;
  --font-ui: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Unbounded', 'Onest', system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-office="day"] {
  --bg: #e4ebf0;
  --chip: rgba(255, 255, 255, .86);
  --chip-border: rgba(25, 45, 40, .12);
  --fg: #17201d;
  --muted: #5d6a66;
  --accent: #2f6f5e;
  --panel: rgba(255, 255, 255, .93);
  --ok: #1f9d55;
  --warn: #c98a00;
  --idle: #7b8494;
  color-scheme: light;
}
:root[data-office="neon"] {
  --bg: #04030a;
  --chip: rgba(10, 8, 26, .80);
  --chip-border: rgba(0, 229, 255, .30);
  --fg: #eafcff;
  --muted: #9aa6d6;
  --accent: #00e5ff;
  --panel: rgba(8, 6, 22, .92);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#stage, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; isolation: isolate; }

.glass {
  background: var(--chip);
  border: 1px solid var(--chip-border);
  backdrop-filter: blur(10px) saturate(1.2);
  -webkit-backdrop-filter: blur(10px) saturate(1.2);
  box-shadow: 0 8px 28px rgba(0, 0, 0, .28);
}

/* Room labels (match the reference: icon tile + title + subtitle) */
.tag {
  pointer-events: auto; cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px 7px 7px; border-radius: 10px;
  text-align: left; white-space: nowrap;
  transition: transform .15s ease, border-color .15s ease;
}
.tag:hover, .tag.on { transform: translateY(-2px); border-color: var(--accent); }
.tag .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--fg) 10%, transparent); flex: none; }
.tag .ico svg { width: 17px; height: 17px; }
.tag b { display: block; font-weight: 600; font-size: 13.5px; letter-spacing: .01em; }
.tag small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.tag .cnt { margin-left: 4px; font-size: 11px; font-variant-numeric: tabular-nums; padding: 2px 6px; border-radius: 6px; background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--fg); }
#app.nolabels #labels { display: none; }

svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Header */
.top {
  position: absolute; z-index: 5;
  top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 12px; border-radius: 14px;
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .14em; }
.brand-sub { font-size: 12px; color: var(--muted); }
.live { display: flex; gap: 12px; font-size: 12.5px; font-variant-numeric: tabular-nums; padding-left: 14px; border-left: 1px solid var(--chip-border); }
.live span { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.work { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.dot.think { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
.dot.idle { background: var(--idle); }

/* Tools */
.tools { position: absolute; z-index: 5; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.tool { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; cursor: pointer; }
.tool svg { width: 18px; height: 18px; }
.tool[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

/* Theme switcher */
.themes {
  position: absolute; z-index: 5; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 6px; padding: 6px; border-radius: 16px; max-width: calc(100% - 32px); overflow-x: auto;
}
.theme-btn {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 11px;
  border: 1px solid transparent; background: transparent; cursor: pointer; text-align: left; white-space: nowrap;
}
.theme-btn:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
.theme-btn[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.sw { width: 38px; height: 38px; border-radius: 9px; flex: none; border: 1px solid rgba(255,255,255,.18); }
.sw.night { background: radial-gradient(circle at 70% 30%, #ffb35c 0 14%, transparent 15%), linear-gradient(135deg, #2b2621, #0b0c10); }
.sw.day { background: radial-gradient(circle at 70% 30%, #ffffff 0 14%, transparent 15%), linear-gradient(135deg, #f1ece4, #b9d3c4); }
.sw.neon { background: radial-gradient(circle at 70% 30%, #00e5ff 0 14%, transparent 15%), linear-gradient(135deg, #ff2bd6 -40%, #12093a 60%); }
.theme-btn b { display: block; font-size: 13px; font-weight: 600; }
.theme-btn small { display: block; font-size: 11.5px; color: var(--muted); }
.theme-num { font-family: var(--font-display); font-size: 10px; color: var(--muted); letter-spacing: .12em; display: block; }

/* Agent panel */
#panel {
  position: absolute; z-index: 6;
  top: calc(72px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  width: 340px; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
  background: var(--panel);
}
.p-head { display: flex; gap: 12px; align-items: flex-start; padding: 16px 16px 12px; }
.p-head .ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); flex: none; }
.p-head .ico svg { width: 20px; height: 20px; }
.p-head h2 { margin: 0; font-size: 17px; font-weight: 700; text-wrap: balance; }
.p-head p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }
.p-head .x { margin-left: auto; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--chip-border); background: transparent; cursor: pointer; display: grid; place-items: center; flex: none; }
.p-head .x svg { width: 16px; height: 16px; }
.p-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px 12px; }
.p-stats div { padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--fg) 6%, transparent); }
.p-stats b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.p-stats span { font-size: 11.5px; color: var(--muted); }
.p-list { list-style: none; margin: 0; padding: 0 8px 12px; overflow-y: auto; flex: 1; min-height: 0; }
.p-list button {
  width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center;
  padding: 9px 10px; border-radius: 10px; border: 1px solid transparent; background: transparent; cursor: pointer; text-align: left;
}
.p-list button:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
.p-list button.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.p-list .nm { font-weight: 600; font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-list .tk { grid-column: 2 / 4; font-size: 12px; color: var(--muted); min-width: 0; }
.chip { font-size: 11px; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.chip.work { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.chip.think { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.chip.idle { color: var(--idle); background: color-mix(in srgb, var(--idle) 16%, transparent); }

#tip { position: absolute; z-index: 7; pointer-events: none; padding: 8px 11px; border-radius: 10px; font-size: 12.5px; max-width: 260px; }
#tip b { display: block; font-size: 13px; }
#tip span { color: var(--muted); }

#loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 9; background: var(--bg); font-family: var(--font-display); letter-spacing: .2em; font-size: 13px; color: var(--muted); transition: opacity .6s ease; }
#loading.done { opacity: 0; pointer-events: none; }
#err { position: absolute; inset: 0; display: grid; place-items: center; z-index: 10; background: var(--bg); padding: 24px; text-align: center; color: var(--muted); }

@media (max-width: 760px) {
  .live { display: none; }
  .tag { padding: 5px 9px 5px 5px; gap: 7px; }
  .tag .ico { width: 24px; height: 24px; }
  .tag .ico svg { width: 14px; height: 14px; }
  .tag small, .tag .cnt { display: none; }
  .tag b { font-size: 12px; }
  .theme-btn small { display: none; }
  .theme-btn { padding: 6px 10px 6px 6px; }
  .sw { width: 30px; height: 30px; }
  #panel { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; top: auto; height: 46%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .tag, #loading { transition: none; }
}
</style>

<body>
<div id="app">

  <header class="top glass">

  <div id="loading">ЗАГРУЗКА ОФИСА…</div>
</div>

<script type="module">

/* ------------------------------------------------------------------ data */

const ICONS = {

const ROOM_AGENTS = {

const buckets = {};
const M = new THREE.Matrix4();
let curRy = 0;
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _v = new THREE.Vector3(), _s = new THREE.Vector3(), _e = new THREE.Euler();

function localMatrix(x, y, z, sx, sy, sz, ry, rx = 0) {
  _q.setFromEuler(_e.set(rx, ry, 0));
  return _m.compose(_v.set(x, y, z), _q, _s.set(sx, sy, sz));
}
function put(geo, role, x, y, z, sx = 1, sy = 1, sz = 1, ry = 0) {
  const g = geo.clone();
  g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(M, localMatrix(x, y, z, sx, sy, sz, ry)));
  (buckets[role] ||= []).push(g);
}
function grp(x, z, ry, fn) {
  const pm = M.clone(), pr = curRy;
  M.multiply(new THREE.Matrix4().makeRotationY(ry).setPosition(x, 0, z));
  curRy += ry;
  fn();
  M.copy(pm);
  curRy = pr;
}
const B = (x, y0, z, w, h, d, role, ry = 0) => put(BOX, role, x, y0 + h / 2, z, w, h, d, ry);
const C = (x, y0, z, r, h, role) => put(CYL, role, x, y0 + h / 2, z, r * 2, h, r * 2);

}

/* canvas-backed meshes (screens, signs, skyline) are redrawn on theme change */
const canvasItems = [];
function canvasPlane(x, y, z, w, h, ry, draw, { transparent = false, res = 1024 } = {}) {
  const cv = document.createElement('canvas');
  cv.width = res;
  cv.height = Math.max(64, Math.round((res * h) / w));
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const mat = new THREE.MeshBasicMaterial({ map: tex, toneMapped: false, transparent, depthWrite: !transparent });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  mesh.matrixAutoUpdate = false;
  mesh.matrix.multiplyMatrices(M, localMatrix(x, y, z, 1, 1, 1, ry));
  scene.add(mesh);
  const item = { cv, tex, mat, draw };
  canvasItems.push(item);
  return item;
}
function screenPanel(x, y, z, w, h, ry, kind, seed = 1) {
  grp(x, z, ry, () => {
    B(0, y - h / 2 - 0.05, -0.04, w + 0.12, h + 0.1, 0.06, 'bezel');

}

function plant(x, z, s = 1, tall = false) {
  C(x, 0, z, 0.27 * s, 0.5 * s, 'pot');

function planter(x0, x1, z, d = 0.55, h = 0.5, led = true, ledSide = 1) {
  const w = x1 - x0, cx = (x0 + x1) / 2;

function glassWall(ax, az, bx, bz, h = 2.8, gaps = []) {
  const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz), th = Math.atan2(-dz, dx);
  grp(ax, az, th, () => {
    let cuts = [[0, L]];
    for (const [g0, g1] of gaps) {
      cuts = cuts.flatMap(([s, e]) => (g1 <= s || g0 >= e ? [[s, e]] : [[s, g0], [g1, e]].filter(([a, b]) => b - a > 0.05)));
    }
    for (const [s, e] of cuts) {
      const w = e - s, m = (s + e) / 2;
      B(m, 0.06, 0, w, h - 0.12, 0.03, 'glass');
      B(m, 0, 0, w, 0.06, 0.08, 'frame');
      B(m, h - 0.06, 0, w, 0.06, 0.08, 'frame');
      B(m, h, 0, w, 0.025, 0.05, 'trim');
      const np = Math.max(1, Math.round(w / 2.2));
      for (let i = 0; i <= np; i++) B(s + (w * i) / np, 0, 0, 0.06, h, 0.08, 'frame');
    }
  });
}
function solidWall(ax, az, bx, bz, h = 3, role = 'wallInner', t = 0.16) {
  const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz), th = Math.atan2(-dz, dx);
  grp(ax, az, th, () => { B(L / 2, 0, 0, L + t, h, t, role); B(L / 2, h, 0, L + t, 0.025, t * 0.5, 'trim'); });
}

}

function drawScreen(ctx, w, h, T, kind, seed) {
  const U = T.ui, r = mulberry32(seed);
  ctx.fillStyle = U.panel; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = U.grid; ctx.lineWidth = 1;
  for (let x = 0; x <= w; x += w / 16) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y <= h; y += h / 9) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  const fs = h * 0.075;
  if (kind === 'brand') {
    const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.6);
    g.addColorStop(0, U.line + '55'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = U.text; ctx.textAlign = 'center';
    ctx.font = `700 ${h * 0.22}px Unbounded, sans-serif`; ctx.fillText('AICEX', w / 2, h * 0.55);
    ctx.font = `500 ${fs}px Onest, sans-serif`; ctx.fillStyle = U.sub; ctx.fillText('Еженедельный синк · 12:00', w / 2, h * 0.72);
    ctx.textAlign = 'left';
    return;
  }
  if (kind === 'code') {
    ctx.font = `500 ${h * 0.06}px ui-monospace, Menlo, monospace`;
    const lines = ['$ deploy transcribe --prod', '✓ build 42s', '✓ health check ok', '$ agents status', 'ops      24 online', 'tech      8 online', 'queue     3 pending', '$ backup verify', '✓ aisales 03:17 ok'];
    lines.forEach((l, i) => { ctx.fillStyle = l.startsWith('$') ? U.line : l.startsWith('✓') ? U.line2 : U.text; ctx.fillText(l, w * 0.05, h * (0.14 + i * 0.095)); });
    return;
  }
  const titles = { dash: 'Выручка и воронка', social: 'Охваты Instagram', team: 'Команда агентов' };
  ctx.fillStyle = U.text; ctx.font = `600 ${fs}px Onest, sans-serif`;
  ctx.fillText(titles[kind] || 'Метрики', w * 0.04, h * 0.12);
  const kpis = kind === 'social' ? [['+38%', 'охват'], ['1.2M', 'просмотры'], ['847', 'лидов']]
    : kind === 'team' ? [['64', 'агента'], ['92%', 'загрузка'], ['11', 'отделов']]
    : [['4.8M ₽', 'выручка'], ['3.2x', 'ROMI'], ['12.4%', 'конверсия']];
  kpis.forEach(([v, l], i) => {
    const x = w * (0.04 + i * 0.22);
    ctx.fillStyle = i === 0 ? U.line : U.text; ctx.font = `700 ${h * 0.1}px Onest, sans-serif`; ctx.fillText(v, x, h * 0.27);
    ctx.fillStyle = U.sub; ctx.font = `500 ${h * 0.05}px Onest, sans-serif`; ctx.fillText(l, x, h * 0.34);
  });
  // area chart
  const pts = []; let v = 0.3;
  for (let i = 0; i <= 24; i++) { v = Math.min(0.95, Math.max(0.1, v + (r() - 0.35) * 0.12)); pts.push([w * 0.04 + (i / 24) * w * 0.62, h * (0.94 - v * 0.5)]); }
  const grad = ctx.createLinearGradient(0, h * 0.4, 0, h);
  grad.addColorStop(0, U.line + '66'); grad.addColorStop(1, U.line + '00');
  ctx.beginPath(); ctx.moveTo(pts[0][0], h * 0.95); pts.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(pts[pts.length - 1][0], h * 0.95); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.strokeStyle = U.line; ctx.lineWidth = h * 0.012; ctx.stroke();
  const [ex, ey] = pts[pts.length - 1];
  ctx.fillStyle = U.line; ctx.beginPath(); ctx.arc(ex, ey, h * 0.018, 0, 7); ctx.fill();
  // bars
  for (let i = 0; i < 6; i++) {
    const bh = h * (0.12 + r() * 0.38), x = w * (0.72 + i * 0.043);
    ctx.fillStyle = i % 2 ? U.line2 : U.line; ctx.fillRect(x, h * 0.94 - bh, w * 0.028, bh);
  }
}

function drawSign(ctx, w, h, T, lines, variant, font) {
  ctx.clearRect(0, 0, w, h);
  const col = variant === 'light' ? '#f6efe4' : T.sign;
  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const n = lines.length, lh = h / n;
  const fam = font === 'display' ? 'Unbounded, sans-serif' : 'Onest, sans-serif';
  const weight = font === 'display' ? 700 : 600;
  lines.forEach((l, i) => {
    let size = lh * 0.72;
    ctx.font = `${weight} ${size}px ${fam}`;
    const tw = ctx.measureText(l).width;
    if (tw > w * 0.92) { size *= (w * 0.92) / tw; ctx.font = `${weight} ${size}px ${fam}`; }
    ctx.fillText(l, w / 2, lh * (i + 0.5));
  });
}

function drawSky(ctx, w, h, T) {
  const r = mulberry32(99), kind = T.sky;
  const g = ctx.createLinearGradient(0, 0, 0, h);
  if (kind === 'night') { g.addColorStop(0, '#04060c'); g.addColorStop(0.65, '#121829'); g.addColorStop(1, '#3a2a1c'); }
  else if (kind === 'day') { g.addColorStop(0, '#8fc0ea'); g.addColorStop(0.7, '#d7e8f4'); g.addColorStop(1, '#eef3f3'); }
  else { g.addColorStop(0, '#030212'); g.addColorStop(0.6, '#150a3a'); g.addColorStop(1, '#3a0d4a'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  for (let layer = 0; layer < 2; layer++) {
    let x = 0;
    while (x < w) {
      const bw = w * (0.012 + r() * 0.03), bh = h * (0.18 + r() * (layer ? 0.38 : 0.5));
      const top = h - bh;
      ctx.fillStyle = kind === 'night' ? (layer ? '#0b0e16' : '#121725') : kind === 'day' ? (layer ? '#a9b9c7' : '#c3d0db') : (layer ? '#0a0820' : '#120c30');
      ctx.fillRect(x, top, bw, bh);
      if (layer) {
        for (let wy = top + 6; wy < h - 4; wy += 9) for (let wx = x + 3; wx < x + bw - 3; wx += 7) {
          if (r() < (kind === 'day' ? 0.25 : 0.32)) {
            ctx.fillStyle = kind === 'night' ? `rgba(255,${190 + r() * 40},${120 + r() * 60},${0.5 + r() * 0.5})` : kind === 'day' ? 'rgba(235,244,250,.8)' : (r() < 0.5 ? 'rgba(0,229,255,.8)' : 'rgba(255,43,214,.75)');
            ctx.fillRect(wx, wy, 3, 4);
          }
        }
      }
      x += bw + w * 0.002;
    }
  }
}

    add(BOX, shirt, -0.235, 1.08, 0, 0.08, 0.56, 0.09);
    add(BOX, shirt, 0.235, 1.08, 0, 0.08, 0.56, 0.09);
    add(SPH, skin, 0, 1.57, 0, 0.26, 0.28, 0.26);
    add(SPH, hair, 0, 1.62, 0.025, 0.275, 0.2, 0.275);
  }
  const g = mergeGeometries(parts);
  geoCache.set(key, g);
  return g;
}

const DOT_GEO = new THREE.SphereGeometry(0.075, 12, 8);
const DOT_MATS = {
  work: new THREE.MeshBasicMaterial({ color: new THREE.Color('#3ee07a').multiplyScalar(1.6), toneMapped: false }),
  think: new THREE.MeshBasicMaterial({ color: new THREE.Color('#ffbf3c').multiplyScalar(1.6), toneMapped: false }),
  idle: new THREE.MeshBasicMaterial({ color: '#8a93a6', toneMapped: false }),
};

const agents = [];
const agentMeshes = [];
const rr = mulberry32(7);
function randomStatus(room) {
  const x = rr();
  if (room === 'lounge' || room === 'kitchen') return x < 0.7 ? 'idle' : 'think';
  return x < 0.66 ? 'work' : x < 0.86 ? 'think' : 'idle';
}
function makeAgent(room, name, base, pose, walker = null) {
  const colors = [pick(SHIRTS, rr), pick(SKIN, rr), pick(HAIR, rr), pick(PANTS, rr)];
  const mesh = new THREE.Mesh(personGeo(pose, colors), personMat);
  mesh.castShadow = true;
  mesh.position.copy(base.p);
  mesh.rotation.y = base.ry;
  const status = walker ? 'work' : randomStatus(room);
  const dot = new THREE.Mesh(DOT_GEO, DOT_MATS[status]);
  dot.position.y = pose === 'sit' ? 1.72 : 1.98;
  mesh.add(dot);
  scene.add(mesh);
  const a = { id: agents.length, room, name, pose, status, task: pick(ROOM_TASKS[room], rr), mesh, dot, base: { p: base.p.clone(), ry: base.ry }, ph: rr() * 6.28, walker };
  if (walker) a.task = walker.task;
  mesh.userData.agent = a;
  agents.push(a);
  agentMeshes.push(mesh);
  return a;
}

for (const room of ROOMS) {
  const list = seats[room.id] || [];
  const names = ROOM_AGENTS[room.id];
  let n = 0;
  for (const s of list) {
    if (rr() > OCCUPANCY[room.id]) continue;
    const name = names[n] || `Ассистент ${String(n + 1).padStart(2, '0')}`;
    n++;
    makeAgent(room.id, name, s, s.pose);
  }
}

// walkers follow closed loops through the corridors
const WALK_PATHS = [
  { pts: [[-9.3, 4.5], [9.6, 4.5], [9.6, -4.6], [-9.3, -4.6]], room: 'ops', name: 'Диспетчер задач', task: 'Разносит задачи по отделам', off: 0 },
  { pts: [[-9.3, 4.5], [9.6, 4.5], [9.6, -4.6], [-9.3, -4.6]], room: 'ops', name: 'Курьер данных', task: 'Несёт отчёт в аналитику', off: 0.5 },
  { pts: [[0.5, 12.2], [0.5, 4.5], [3.1, 4.5], [3.1, -4.6], [-3.1, -4.6], [-3.1, 4.5], [0.5, 4.5]], room: 'reception', name: 'Новый агент', task: 'Проходит экскурсию по офису', off: 0.2 },
  { pts: [[-5, -4.7], [-4, -6.6], [8.6, -6.6], [8.6, -4.7]], room: 'kitchen', name: 'Координатор', task: 'Идёт за кофе', off: 0.1 },
];
for (const w of WALK_PATHS) {
  const segs = []; let total = 0;
  for (let i = 0; i < w.pts.length; i++) {
    const a = w.pts[i], b = w.pts[(i + 1) % w.pts.length];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    segs.push({ a, b, len, s0: total }); total += len;
  }
  w.segs = segs; w.total = total;
  makeAgent(w.room, w.name, { p: new THREE.Vector3(w.pts[0][0], 0, w.pts[0][1]), ry: 0 }, 'stand', w);
}

const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.52, 40), new THREE.MeshBasicMaterial({ color: '#fff', toneMapped: false, transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
ring.rotation.x = -Math.PI / 2;
ring.visible = false;
scene.add(ring);

/* ---------------------------------------------------------------- labels */

const labelEls = {};
for (const r of ROOMS) {
  const el = document.createElement('button');
  el.className = 'tag glass';
  el.type = 'button';
  el.innerHTML = `<span class="ico">${icon(r.icon)}</span><span><b>${r.title}</b><small>${r.sub}</small></span><span class="cnt"></span>`;
  el.addEventListener('pointerdown', (e) => e.stopPropagation());
  el.addEventListener('click', (e) => { e.stopPropagation(); selectRoom(r.id); });
  const obj = new CSS2DObject(el);
  obj.position.set(...r.lab);
  scene.add(obj);
  labelEls[r.id] = el;
}

/* ------------------------------------------------------------- theming */

let themeKey = 'night';
function applyTheme(key) {
  const T = THEMES[key] || THEMES.night;
  themeKey = THEMES[key] ? key : 'night';
  document.documentElement.dataset.office = themeKey;
  for (const role of ROLES) {
    const s = T.roles[role], m = MATS[role];
    m.color.set(s.c);
    m.roughness = s.r ?? 0.6;
    m.metalness = s.m ?? 0;
    m.emissive.set(s.e || '#000000');
    m.emissiveIntensity = s.ei ?? 1;
    if (m.transparent) m.opacity = s.o ?? 0.15;
  }
  scene.background = new THREE.Color(T.bg);
  scene.fog.color.set(T.bg); scene.fog.near = T.fog[0]; scene.fog.far = T.fog[1];
  hemi.color.set(T.hemi[0]); hemi.groundColor.set(T.hemi[1]); hemi.intensity = T.hemi[2];
  amb.intensity = T.amb;
  sun.color.set(T.sun[0]); sun.intensity = T.sun[1];
  points.forEach((l, i) => { l.color.set(T.points.colors[i % T.points.colors.length]); l.intensity = T.points.power; l.visible = T.points.power > 0; });
  renderer.toneMappingExposure = T.exposure;
  [bloom.strength, bloom.radius, bloom.threshold] = T.bloom;
  ring.material.color.set(key === 'day' ? '#2f6f5e' : key === 'neon' ? '#00e5ff' : '#ffb35c');
  redrawCanvases();
  document.querySelectorAll('.theme-btn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.theme === themeKey)));
}
function redrawCanvases() {
  const T = THEMES[themeKey];
  for (const it of canvasItems) {
    const ctx = it.cv.getContext('2d');
    it.draw(ctx, it.cv.width, it.cv.height, T);
    it.tex.needsUpdate = true;
    const isSign = it.mat.transparent;
    it.mat.color.setScalar(isSign ? T.signGlow : T.glow);
  }
}

/* ------------------------------------------------------- camera & views */

const VIEW_DIR = new THREE.Vector3(0, 30, 30.5).normalize();
function fitDistance(halfW, halfD) {
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.max(halfW / (t * camera.aspect), (halfD * 1.25) / t);
}
function presetView() {
  const d = Math.min(140, fitDistance(21.5, 14.5));
  const target = new THREE.Vector3(0, 0, 0.8);
  return { target, pos: target.clone().addScaledVector(VIEW_DIR, d) };
}
let tween = null;
function flyTo(target, pos, dur = 1.1) {
  if (reduceMotion) dur = 0.01;
  tween = { t0: performance.now(), dur: dur * 1000, ft: controls.target.clone(), fp: camera.position.clone(), tt: target.clone(), tp: pos.clone() };
}
controls.addEventListener('start', () => { tween = null; });

/* ----------------------------------------------------------------- panel */

const panel = document.getElementById('panel');
let openRoom = null, selAgent = null;
function roomCounts(id) {
  const list = agents.filter((a) => a.room === id);
  return { list, work: list.filter((a) => a.status === 'work').length, think: list.filter((a) => a.status === 'think').length };
}
function renderPanel() {
  if (!openRoom) { panel.hidden = true; return; }
  const r = ROOM[openRoom], { list, work, think } = roomCounts(openRoom);
  panel.hidden = false;
  panel.innerHTML = `
    <div class="p-head"><span class="ico">${icon(r.icon)}</span><div><h2>${r.title}</h2><p>${r.sub}</p></div>
      <button class="x" type="button" aria-label="Закрыть">${icon('x')}</button></div>
    <div class="p-stats"><div><b>${list.length}</b><span>агентов</span></div><div><b>${work}</b><span>в работе</span></div><div><b>${think}</b><span>думают</span></div></div>
    <ul class="p-list">${list.map((a) => `<li><button type="button" data-id="${a.id}" class="${selAgent === a ? 'sel' : ''}">
      <i class="dot ${a.status}"></i><span class="nm">${a.name}</span><span class="chip ${a.status}">${STATUS_TEXT[a.status]}</span>
      <span class="tk">${a.task}</span></button></li>`).join('')}</ul>`;
  panel.querySelector('.x').onclick = closePanel;
  panel.querySelectorAll('.p-list button').forEach((b) => { b.onclick = () => selectAgent(agents[+b.dataset.id]); });
}
function closePanel() {
  openRoom = null; selAgent = null; ring.visible = false;
  Object.values(labelEls).forEach((el) => el.classList.remove('on'));
  renderPanel();
}
function selectRoom(id, fly = true) {
  openRoom = id; selAgent = null; ring.visible = false;
  Object.entries(labelEls).forEach(([k, el]) => el.classList.toggle('on', k === id));
  renderPanel();
  if (!fly) return;
  const r = ROOM[id];
  const target = new THREE.Vector3((r.x0 + r.x1) / 2, 0, (r.z0 + r.z1) / 2);
  const d = THREE.MathUtils.clamp(fitDistance((r.x1 - r.x0) / 2 + 1, (r.z1 - r.z0) / 2 + 1), 12, 70);
  flyTo(target, target.clone().addScaledVector(VIEW_DIR, d));
}
function selectAgent(a) {
  if (openRoom !== a.room) selectRoom(a.room, false);
  selAgent = a;
  ring.visible = true;
  renderPanel();
  const target = a.mesh.position.clone();
  flyTo(target, target.clone().addScaledVector(VIEW_DIR, 9));
}
function updateCounters() {
  const c = { work: 0, think: 0, idle: 0 };
  agents.forEach((a) => c[a.status]++);
  document.getElementById('cWork').textContent = c.work;
  document.getElementById('cThink').textContent = c.think;
  document.getElementById('cIdle').textContent = c.idle;
  for (const r of ROOMS) labelEls[r.id].querySelector('.cnt').textContent = agents.filter((a) => a.room === r.id).length;
}

// simulated live activity; swap for real agent status events from the API
setInterval(() => {
  const seated = agents.filter((a) => !a.walker);
  for (let k = 0; k < 2; k++) {
    const a = pick(seated, Math.random);
    a.status = randomStatus(a.room);
    a.task = pick(ROOM_TASKS[a.room], Math.random);
    a.dot.material = DOT_MATS[a.status];
  }
  updateCounters();
  if (openRoom) {
    const sc = panel.querySelector('.p-list')?.scrollTop || 0;
    renderPanel();
    const l = panel.querySelector('.p-list'); if (l) l.scrollTop = sc;
  }
}, 2600);

/* --------------------------------------------------------------- picking */

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const tip = document.getElementById('tip');
function setNdc(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  down = null;
  setNdc(e);
  const hit = ray.intersectObjects(agentMeshes, false)[0];
  if (hit) { selectAgent(hit.object.userData.agent); return; }
  const p = new THREE.Vector3();
  if (ray.ray.intersectPlane(floorPlane, p)) {
    const r = ROOMS.find((q) => p.x >= q.x0 && p.x <= q.x1 && p.z >= q.z0 && p.z <= q.z1);
    if (r) { selectRoom(r.id); return; }
  }
  closePanel();
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse' || e.buttons) { tip.hidden = true; return; }
  setNdc(e);
  const hit = ray.intersectObjects(agentMeshes, false)[0];
  renderer.domElement.style.cursor = hit ? 'pointer' : 'grab';
  if (!hit) { tip.hidden = true; return; }
  const a = hit.object.userData.agent;
  tip.innerHTML = `<b>${a.name}</b><span>${ROOM[a.room].title} · ${STATUS_TEXT[a.status]}</span><br>${a.task}`;
  tip.hidden = false;
  const rect = app.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX - rect.left + 14, rect.width - 270) + 'px';
  tip.style.top = (e.clientY - rect.top + 14) + 'px';
});
renderer.domElement.addEventListener('pointerleave', () => { tip.hidden = true; });

/* ------------------------------------------------------------------ UI */

document.querySelectorAll('.theme-btn').forEach((b) => b.addEventListener('click', () => {
  applyTheme(b.dataset.theme);
  history.replaceState(null, '', '#' + b.dataset.theme);
}));
document.getElementById('btnReset').addEventListener('click', () => { closePanel(); const v = presetView(); flyTo(v.target, v.pos); });
const btnLabels = document.getElementById('btnLabels');
btnLabels.addEventListener('click', () => {
  const on = app.classList.toggle('nolabels');
  btnLabels.setAttribute('aria-pressed', String(!on));
});
const btnRotate = document.getElementById('btnRotate');
btnRotate.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnRotate.setAttribute('aria-pressed', String(controls.autoRotate));
});
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (THEMES[k]) applyTheme(k); });

/* -------------------------------------------------------------- resize */

function resize() {
  const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  labelRenderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

/* ---------------------------------------------------------------- start */

const initial = location.hash.slice(1);
applyTheme(THEMES[initial] ? initial : 'night');
updateCounters();
if (document.fonts?.ready) document.fonts.ready.then(redrawCanvases);

const startView = presetView();
if (reduceMotion) {
  controls.target.copy(startView.target); camera.position.copy(startView.pos);
} else {
  controls.target.copy(startView.target);
  camera.position.copy(startView.target.clone().add(new THREE.Vector3(-26, 40, 52)));
  flyTo(startView.target, startView.pos, 2.2);
}

const clock = new THREE.Clock();
let t = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;
  if (tween) {
    let k = (performance.now() - tween.t0) / tween.dur;
    if (k >= 1) k = 1;
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    controls.target.lerpVectors(tween.ft, tween.tt, e);
    camera.position.lerpVectors(tween.fp, tween.tp, e);
    if (k === 1) tween = null;
  }
  for (const a of agents) {
    if (a.walker) {
      const w = a.walker;
      const s = ((t * 0.95 + w.off * w.total) % w.total + w.total) % w.total;
      const seg = w.segs.find((g) => s >= g.s0 && s < g.s0 + g.len) || w.segs[0];
      const k = (s - seg.s0) / seg.len;
      const dx = seg.b[0] - seg.a[0], dz = seg.b[1] - seg.a[1];
      a.mesh.position.set(seg.a[0] + dx * k, Math.abs(Math.sin(t * 8 + a.ph)) * 0.035, seg.a[1] + dz * k);
      const want = Math.atan2(-dx, -dz);
      let diff = want - a.mesh.rotation.y;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      a.mesh.rotation.y += diff * Math.min(1, dt * 8);
    } else if (!reduceMotion) {
      const amp = a.status === 'work' ? 0.05 : a.status === 'think' ? 0.14 : 0.03;
      const spd = a.status === 'think' ? 0.5 : 0.8;
      a.mesh.rotation.y = a.base.ry + Math.sin(t * spd + a.ph) * amp;
      a.mesh.position.y = a.base.p.y + (a.status === 'work' ? Math.abs(Math.sin(t * 7 + a.ph)) * 0.01 : 0);
    }
    a.dot.position.y = (a.pose === 'sit' ? 1.72 : 1.98) + Math.sin(t * 2.4 + a.ph) * 0.03;
  }
  if (selAgent) {
    ring.position.set(selAgent.mesh.position.x, 0.03, selAgent.mesh.position.z);
    ring.scale.setScalar(1 + Math.sin(t * 4) * 0.08);
  }
  controls.update();
  composer.render();
  labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}
window.__office = { camera, controls };
requestAnimationFrame(tick);
requestAnimationFrame(() => document.getElementById('loading').classList.add('done'));
</script>
</body>
</html>
