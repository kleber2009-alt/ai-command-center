<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff8f5;--card:#ffffff;--card2:#fff0f5;--border:rgba(40,30,80,.08);
  --text:#2a1a4a;--muted:#7c6e8e;--accent:#ff4080;--a2:#7e3ff2;--a3:#40d8ff;--a4:#fff060;--orange:#ff8040;
  --font:'JetBrains Mono',monospace;--uifont:'Inter',sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--uifont);overflow:hidden;width:100%;height:100vh}
#app{display:flex;flex-direction:column;height:100vh}

/* HEADER */
#hdr{display:flex;align-items:center;gap:10px;padding:9px 14px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);z-index:50;flex-shrink:0;backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(255,64,128,.06)}
.h-logo{font-size:12px;font-weight:800;background:linear-gradient(90deg,#ff4080,#7e3ff2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.3px}
.h-dot{width:7px;height:7px;border-radius:50%;background:#34d058;animation:pdot 1.5s infinite}
@keyframes pdot{0%,100%{box-shadow:0 0 0 0 rgba(52,208,88,.5)}70%{box-shadow:0 0 0 5px rgba(52,208,88,0)}}
.h-live{font-size:9px;color:#34d058;display:flex;align-items:center;gap:5px;font-weight:700}
.h-sep{width:1px;height:14px;background:var(--border)}
.h-st{display:flex;gap:10px}
.hsi{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted);font-weight:600}
.hsd{width:6px;height:6px;border-radius:50%}
#runBtn{margin-left:auto;background:linear-gradient(90deg,#ff4080,#7e3ff2);color:#fff;border:none;padding:8px 16px;border-radius:10px;font-size:10px;font-weight:800;cursor:pointer;font-family:var(--uifont);transition:all .15s;box-shadow:0 4px 14px rgba(255,64,128,.3)}
#runBtn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,64,128,.45)}
#runBtn:disabled{opacity:.5;cursor:not-allowed}
#quizBtn{background:#fff;border:1.5px solid rgba(126,63,242,.35);color:var(--a2);padding:7px 13px;border-radius:10px;font-size:10px;font-weight:700;cursor:pointer;font-family:var(--uifont)}
#soundBtn{background:#fff;border:1.5px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:9px;cursor:pointer;font-size:12px;transition:all .15s}
#soundBtn.on{border-color:rgba(255,64,128,.4);color:var(--accent)}

/* MAIN */
#main{flex:1;display:flex;overflow:hidden;position:relative}
#stage{flex:1;position:relative;overflow:hidden;background:linear-gradient(180deg,#fff5f8 0%,#f0e8ff 60%,#e8f4ff 100%);cursor:grab}
#stage:active{cursor:grabbing}
#three{display:block;width:100%;height:100%}

/* SIDEBAR */
#sidebar{width:230px;flex-shrink:0;background:rgba(255,255,255,.92);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(10px);box-shadow:-2px 0 12px rgba(40,30,80,.04)}
.sb-hd{padding:11px 14px;border-bottom:1px solid var(--border);font-size:8px;text-transform:uppercase;letter-spacing:1.8px;color:var(--accent);font-weight:800;background:linear-gradient(90deg,rgba(255,64,128,.04),transparent)}
#feed{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.fi{border-left:3px solid var(--border);padding:6px 10px;transition:all .3s;background:#fff;border-radius:0 8px 8px 0}
.fi.on{border-color:var(--accent);background:linear-gradient(90deg,rgba(255,64,128,.06),#fff)}
.fi-a{font-size:9px;font-weight:800;color:var(--accent);margin-bottom:2px}
.fi-t{font-size:9.5px;color:var(--text);line-height:1.4}
#chainBar{padding:10px 12px;border-top:1px solid var(--border);display:none;background:#fff5fa}
#chainBar.show{display:block}
.cb-t{font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--a2);margin-bottom:6px;font-weight:800}
.cbs{font-size:8px;padding:3px 6px;border-radius:6px;border:1.5px solid var(--border);color:rgba(40,30,80,.4);white-space:nowrap;transition:all .3s;font-weight:600}
.cbs.active{border-color:var(--a2);color:var(--a2);background:rgba(126,63,242,.08)}
.cbs.done{border-color:var(--accent);color:var(--accent);background:rgba(255,64,128,.06)}
.cba{color:rgba(40,30,80,.2);font-size:10px}

/* MODAL */
#agModal{position:fixed;z-index:100;background:#fff;border:2px solid rgba(255,64,128,.25);border-radius:18px;width:320px;display:none;overflow:hidden;box-shadow:0 24px 64px rgba(255,64,128,.15),0 0 0 1px rgba(255,255,255,.5)}
.am-hd{padding:14px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:11px;background:linear-gradient(135deg,rgba(255,64,128,.05),rgba(126,63,242,.05))}
.am-emo{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;border:2px solid rgba(255,64,128,.25);background:#fff}
.am-nm{font-size:15px;font-weight:800;color:var(--text)}
.am-rl{font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:3px 0;font-weight:700}
.am-bdg{display:inline-block;font-size:7.5px;padding:3px 8px;border-radius:6px;font-weight:800;color:#fff;letter-spacing:.5px}
.am-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}
.am-close:hover{color:var(--accent)}
.am-chat{padding:11px 14px;max-height:260px;overflow-y:auto;background:#fcfaff;font-size:10.5px;color:var(--text);line-height:1.55}
.am-msg-u{background:linear-gradient(135deg,rgba(255,64,128,.08),rgba(126,63,242,.05));border:1px solid rgba(255,64,128,.15);border-radius:12px;padding:8px 12px;margin-bottom:7px;color:var(--text);text-align:right}
.am-msg-a{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin-bottom:7px;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.03)}
.am-lbl{font-size:7.5px;font-weight:800;opacity:.55;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.am-ir{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;background:#fff}
.am-inp{flex:1;background:#fcfaff;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--text);font-family:var(--uifont);font-size:11px;outline:none}
.am-inp:focus{border-color:rgba(255,64,128,.4)}
.am-send{background:linear-gradient(90deg,#ff4080,#7e3ff2);color:#fff;border:none;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(255,64,128,.3)}
.am-send:disabled{opacity:.4;cursor:not-allowed}
.am-stream{white-space:pre-wrap;word-break:break-word}
.cur{display:inline-block;animation:blink .7s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* TABS */
#tabs{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;gap:4px;padding:8px 12px;background:rgba(255,255,255,.92);border-top:1px solid var(--border);z-index:30;backdrop-filter:blur(10px);box-shadow:0 -2px 12px rgba(40,30,80,.05);overflow-x:auto}
.iso-tab{padding:6px 11px;border-radius:9px;font-size:9.5px;font-weight:700;cursor:pointer;color:var(--muted);border:1.5px solid transparent;background:#fff;font-family:var(--uifont);transition:all .15s;white-space:nowrap}
.iso-tab:hover{background:#fff5fa;color:var(--accent);border-color:rgba(255,64,128,.2)}
.zbtn{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:700}
.zbtn:hover{background:#fff5fa;color:var(--accent)}

/* QUIZ */
#quizOvl{position:fixed;inset:0;z-index:200;background:rgba(40,30,80,.45);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
#quizOvl.show{display:flex}
.qsh{background:#fff;border-radius:22px 22px 0 0;border-top:3px solid var(--accent);padding:22px 20px 36px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.q-hdl{width:36px;height:4px;background:rgba(40,30,80,.15);border-radius:2px;margin:0 auto 16px}
.q-sn{font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px;font-weight:700}
.q-pg{height:4px;background:rgba(40,30,80,.06);border-radius:2px;margin-bottom:14px;overflow:hidden}
.q-pf{height:100%;background:linear-gradient(90deg,#ff4080,#7e3ff2);border-radius:2px;transition:width .3s}
.q-q{font-size:15px;font-weight:800;line-height:1.3;margin-bottom:13px;color:var(--text)}
.q-in{width:100%;background:#fcfaff;border:1.5px solid var(--border);border-radius:11px;padding:11px 14px;color:var(--text);font-family:var(--uifont);font-size:12px;outline:none;margin-bottom:8px}
.q-in:focus{border-color:rgba(255,64,128,.4)}
.q-os{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.qo{padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);cursor:pointer;font-size:11px;color:var(--muted);font-family:var(--uifont);text-align:left;background:#fff;transition:all .15s;font-weight:600}
.qo.sel{border-color:var(--accent);color:var(--accent);background:rgba(255,64,128,.05)}
.q-nv{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.qbk{background:none;border:1.5px solid var(--border);color:var(--muted);padding:10px 16px;border-radius:10px;font-size:10px;font-family:var(--uifont);cursor:pointer;font-weight:600}
.qnx{flex:1;background:linear-gradient(90deg,#ff4080,#7e3ff2);color:#fff;border:none;padding:11px;border-radius:10px;font-size:10.5px;font-weight:800;font-family:var(--uifont);cursor:pointer;box-shadow:0 3px 10px rgba(255,64,128,.3)}
.q-recs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;justify-content:center}
.q-rec{border:1.5px solid rgba(255,64,128,.4);color:var(--accent);font-size:10px;padding:6px 12px;border-radius:16px;font-weight:700;background:#fff}

/* PRELOADER */
#preloader{position:fixed;inset:0;background:radial-gradient(ellipse at center,#fff5fa 0%,#f0e8ff 60%,#e0e8ff 100%);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#preloader.fade{opacity:0;pointer-events:none}
.pl-logo{font-size:28px;font-weight:800;background:linear-gradient(90deg,#ff4080,#7e3ff2,#40d8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px;text-align:center;line-height:1.1}
.pl-sub{font-size:10px;color:var(--muted);font-family:var(--uifont);letter-spacing:2px;text-transform:uppercase;font-weight:700}
.pl-bar-wrap{width:280px;height:5px;background:rgba(40,30,80,.06);overflow:hidden;border-radius:3px}
.pl-bar{height:100%;background:linear-gradient(90deg,#ff4080,#7e3ff2,#40d8ff);width:0;transition:width .25s;box-shadow:0 0 16px rgba(255,64,128,.5)}
.pl-orbs{display:flex;gap:8px}
.pl-orb{width:14px;height:14px;border-radius:50%;background:rgba(255,64,128,.25);animation:bounce 1.2s infinite}
.pl-orb:nth-child(1){animation-delay:0s;background:#ff4080}
.pl-orb:nth-child(2){animation-delay:.1s;background:#ff8040}
.pl-orb:nth-child(3){animation-delay:.2s;background:#fff060}
.pl-orb:nth-child(4){animation-delay:.3s;background:#80ff80}
.pl-orb:nth-child(5){animation-delay:.4s;background:#40d8ff}
.pl-orb:nth-child(6){animation-delay:.5s;background:#7e3ff2}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1.1);opacity:1}}

/* TOOLTIP */
#roomTip{position:absolute;pointer-events:none;z-index:35;display:none;background:#fff;border:1.5px solid rgba(255,64,128,.3);border-radius:10px;padding:6px 12px;font-size:10px;font-weight:800;color:var(--accent);font-family:var(--uifont);white-space:nowrap;box-shadow:0 4px 14px rgba(255,64,128,.15)}

/* HUD */
.hud-label{position:absolute;pointer-events:none;transform:translate(-50%,-100%);transition:opacity .2s}
.hud-name{background:#fff;color:var(--text);font-size:10px;font-weight:800;padding:3px 10px;border-radius:8px;font-family:var(--uifont);white-space:nowrap;border:1.5px solid rgba(255,64,128,.25);box-shadow:0 2px 8px rgba(255,64,128,.12)}
.hud-status{display:inline-block;font-size:7px;font-weight:800;padding:2px 7px;border-radius:5px;color:#fff;margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px;font-family:var(--uifont);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.hud-bubble{background:#fff;color:var(--text);font-size:10px;font-weight:600;padding:5px 12px;border-radius:14px;font-family:var(--uifont);box-shadow:0 4px 14px rgba(40,30,80,.18);white-space:nowrap;position:relative;margin-bottom:5px;border:1.5px solid rgba(255,64,128,.2)}
.hud-bubble::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff}
</style>
</head>
<body>
<div id="preloader">
  <div class="pl-orbs"><div class="pl-orb"></div><div class="pl-orb"></div><div class="pl-orb"></div><div class="pl-orb"></div><div class="pl-orb"></div><div class="pl-orb"></div></div>
  <div class="pl-logo">AI MARKETING<br>OFFICE</div>

<script type="importmap">
{
  "imports": {

<script>
/* ── Standalone preloader timer (runs even if module fails to load) ── */
(function(){
  const msgs=['Открываем офис…','Расстановка мебели…','Запуск Reels-станций…','Подключаем дашборды…','Призываем 14 агентов…','Marketing Office online!'];
  let pi=0;
  const piInt=setInterval(()=>{
    pi++;
    const bar=document.getElementById('pl-bar');if(bar)bar.style.width=Math.min(100,pi*18)+'%';
    const txt=document.getElementById('pl-txt');if(txt)txt.textContent=msgs[Math.min(pi-1,msgs.length-1)];
    if(pi>=6){
      clearInterval(piInt);
      setTimeout(()=>{
        const pl=document.getElementById('preloader');
        if(pl){pl.classList.add('fade');setTimeout(()=>pl.remove(),700);}
      },300);
    }
  },200);
})();
/* ── Visible error overlay if module fails ── */
window.addEventListener('error',e=>{
  const id='_err_overlay';
  if(document.getElementById(id))return;
  const d=document.createElement('div');
  d.id=id;
  d.style.cssText='position:fixed;top:48px;left:14px;right:14px;z-index:999;background:#fff;color:#b00020;border:2px solid #b00020;border-radius:10px;padding:14px;font:12px/1.5 monospace;max-height:60vh;overflow:auto;box-shadow:0 12px 32px rgba(176,0,32,.2)';
  d.innerHTML='<strong style="font-size:13px;color:#b00020">3D Scene Error</strong><br><br>'+(e.message||e)+'<br><br><small style="color:#666">'+(e.filename||'')+':'+(e.lineno||'')+'</small>';
  document.body.appendChild(d);

controls.maxDistance=120;
controls.minPolarAngle=Math.PI*0.18;
controls.maxPolarAngle=Math.PI*0.44;
controls.enablePan=true;

controls.screenSpacePanning=false;

let autoRotate=false;

function resetCam(){
  controls.target.set(0,0,2);
  const start={x:camera.position.x,y:camera.position.y,z:camera.position.z};
  const t0=performance.now();
  function step(){
    const t=Math.min(1,(performance.now()-t0)/650);
    const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    camera.position.x=start.x+(CAM_DEFAULT.x-start.x)*e;
    camera.position.y=start.y+(CAM_DEFAULT.y-start.y)*e;
    camera.position.z=start.z+(CAM_DEFAULT.z-start.z)*e;
    if(t<1)requestAnimationFrame(step);
  }
  step();
}
function panToRoom(room){
  const r={
    cmo:       {x:13, z:-12},
    brand:     {x:-13,z:-12},
    content:   {x:-13,z:2},
    traffic:   {x:13, z:2},
    analytics: {x:-13,z:18},
    funnel:    {x:13, z:18},
  }[room];
  if(!r)return;
  const t0=performance.now();
  const start={x:controls.target.x,z:controls.target.z};
  const cs={x:camera.position.x,z:camera.position.z};
  function step(){
    const t=Math.min(1,(performance.now()-t0)/700);
    const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    controls.target.x=start.x+(r.x-start.x)*e;
    controls.target.z=start.z+(r.z-start.z)*e;
    camera.position.x=cs.x+(r.x-cs.x)*e;
    camera.position.z=cs.z+(r.z+25-cs.z)*e;
    if(t<1)requestAnimationFrame(step);
  }
  step();
}
function zoomCam(f){
  const dir=new THREE.Vector3().subVectors(camera.position,controls.target).normalize();
  const dist=camera.position.distanceTo(controls.target);
  const newDist=Math.max(28,Math.min(120,dist*f));
  camera.position.copy(controls.target).add(dir.multiplyScalar(newDist));
}
function toggleRotate(){autoRotate=!autoRotate;controls.autoRotate=autoRotate;controls.autoRotateSpeed=.5;}

function buildWhiteboard(x,z,rotY=0,mode='kanban'){

  g.add(mesh(G.box(3.7,2.7,.05),M.whiteboard,0,2.5,.08));
  if(mode==='kanban'){
    const cols=[M.stickyP,M.stickyY,M.stickyG];
    cols.forEach((mat,ci)=>{
      const cx=-1.2+ci*1.2;
      g.add(mesh(G.box(.95,.25,.02),mat,cx,3.5,.1));
      for(let r=0;r<3;r++){
        g.add(mesh(G.box(.5,.4,.02),mat,cx-.15+Math.random()*.3,2.9-r*.55,.1));
      }
    });
  } else if(mode==='matrix'){
    // Content matrix: grid of colored squares (rubrics)
    const cols=[M.stickyP,M.stickyY,M.stickyB,M.stickyG,M.stickyO];
    for(let r=0;r<3;r++)for(let c=0;c<5;c++){
      g.add(mesh(G.box(.55,.45,.02),cols[(r*5+c)%cols.length],-1.4+c*.7,3.6-r*.65,.1));
    }
  } else if(mode==='funnel'){
    // 5 horizontal bars getting smaller (funnel diagram)
    for(let i=0;i<5;i++){
      const w=3.2-i*.5;
      const col=[M.stickyB,M.stickyG,M.stickyY,M.stickyO,M.stickyP][i];
      g.add(mesh(G.box(w,.32,.02),col,0,3.7-i*.45,.1));
    }
  } else if(mode==='moodboard'){
    // brand moodboard: color swatches + photo squares
    for(let i=0;i<8;i++){
      const c=[0xff4080,0xfff060,0x40d8ff,0xff8040,0x80ff80,0xa040ff,0xff80c8,0x40e890][i];
      g.add(mesh(G.box(.7,.7,.02),new THREE.MeshBasicMaterial({color:c}),-1.4+(i%4)*.9,3.2-Math.floor(i/4)*.9,.1));

}

const charMeshes=[];

  const body=mesh(new THREE.CapsuleGeometry(.4,.7,4,8),bodyMat,0,1.2,0,true,false);
  g.add(body);
  g.add(mesh(G.cyl(.41,.12,16),accMat,0,1.55,0,false));
  const head=mesh(new THREE.SphereGeometry(.32,16,16),headMat,0,2.1,0,true);
  g.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(.33,16,16,0,Math.PI*2,0,Math.PI/2),hairMat);
  hair.position.set(0,2.1,0);hair.castShadow=true;
  g.add(hair);
  const eyeMat=new THREE.MeshBasicMaterial({color:0x111111});

  const legL=mesh(new THREE.CapsuleGeometry(.13,.5,4,6),bodyMat,-.18,.4,0);

  // Accessories per role

/* ══════════════════════ MOVEMENT ══════════════════════ */
const SPD=0.12;
function updAgents(t){
  AGENTS.forEach(a=>{
    const m=a.mesh, ud=m.userData;
    if(a.dest){
      const dx=a.dest.x-a.x, dz=a.dest.z-a.z;
      const dist=Math.hypot(dx,dz);
      a.moving=true;
      const targetFace=Math.atan2(dx,dz);
      let df=targetFace-a.facing;
      while(df>Math.PI)df-=Math.PI*2;
      while(df<-Math.PI)df+=Math.PI*2;
      a.facing+=df*.15;
      m.rotation.y=a.facing;
      if(dist<SPD+.05){
        a.x=a.dest.x;a.z=a.dest.z;a.dest=null;a.moving=false;
        if(a._cb){const cb=a._cb;a._cb=null;cb();}
      } else {
        a.x+=dx/dist*SPD;
        a.z+=dz/dist*SPD;
      }
      m.position.set(a.x,0,a.z);
    } else a.moving=false;
    if(a.moving){
      const bobAmt=Math.sin(t*0.012)*0.06;
      ud.body.position.y=1.2+bobAmt;
      ud.head.position.y=2.1+bobAmt;
      ud.hair.position.y=2.1+bobAmt;
      ud.legL.rotation.x=Math.sin(t*0.012)*0.4;
      ud.legR.rotation.x=-Math.sin(t*0.012)*0.4;
    } else {
      const idle=Math.sin(t*0.003+a.x)*0.04;
      ud.body.position.y=1.2+idle;
      ud.head.position.y=2.1+idle;
      ud.hair.position.y=2.1+idle;
      ud.legL.rotation.x*=.85;
      ud.legR.rotation.x*=.85;
    }
    if(a.halo){
      const c=new THREE.Color(SC[a.st]||'#fff');
      a.halo.material.color.copy(c);
      a.halo.material.opacity=.35+Math.sin(t*0.004)*0.15;
      a.halo.scale.setScalar(1+Math.sin(t*0.003)*0.05);
    }
  });
}

/* ══════════════════════ BEAMS ══════════════════════ */
const beams=[];
function spawnBeam(fA,tA){
  const start=new THREE.Vector3(fA.x,2.5,fA.z);
  const end=new THREE.Vector3(tA.x,2.5,tA.z);
  const mid=new THREE.Vector3().lerpVectors(start,end,.5);
  mid.y+=Math.min(7,start.distanceTo(end)*.28+2);
  const curve=new THREE.QuadraticBezierCurve3(start,mid,end);
  const tubeGeo=new THREE.TubeGeometry(curve,32,.09,8,false);
  const color=fA.acc;
  const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:.85});
  const tube=new THREE.Mesh(tubeGeo,mat);
  scene.add(tube);
  const orb=mesh(G.sph(.28,12),new THREE.MeshBasicMaterial({color}),0,0,0,false);
  const orbLight=new THREE.PointLight(color,1.8,9);
  orb.add(orbLight);
  scene.add(orb);
  beams.push({tube,orb,curve,t:0,life:1});
}
function updBeams(dt){
  for(let i=beams.length-1;i>=0;i--){
    const b=beams[i];
    b.t+=dt*.025;b.life-=dt*.018;
    const pt=b.curve.getPoint(Math.min(b.t,1));
    b.orb.position.copy(pt);
    b.tube.material.opacity=Math.max(0,b.life*.85);
    if(b.life<=0){scene.remove(b.tube);scene.remove(b.orb);b.tube.geometry.dispose();b.tube.material.dispose();beams.splice(i,1);}
  }
}

/* ══════════════════════ ANIMATE FURNITURE ══════════════════════ */
function animateFurn(t){
  world.traverse(o=>{
    if(o.userData){
      if(o.userData.isFloating){
        o.position.y=o.userData.baseY+Math.sin(t*.0015+o.position.x)*.15;
        o.rotation.y=t*.0008;
      }
      if(o.userData.halo){
        o.userData.halo.rotation.z=t*.002;
        o.userData.halo.scale.setScalar(1+Math.sin(t*.003)*.1);
      }
      if(o.userData.crystal){
        o.userData.crystal.rotation.y=t*.001;
      }
      // carousel cards subtle wobble
      for(let i=0;i<5;i++){
        if(o.userData[`card_${i}`]){
          o.userData[`card_${i}`].position.y=1.5+Math.sin(t*.001+i)*.04;
        }
      }
    }
  });
}

/* ══════════════════════ CLICK / RAYCAST ══════════════════════ */
const raycaster=new THREE.Raycaster();
const mouseNDC=new THREE.Vector2();
let _dragStart=null,_didDrag=false;
canvas.addEventListener('mousedown',e=>{_dragStart={x:e.clientX,y:e.clientY};_didDrag=false;});
canvas.addEventListener('mousemove',e=>{
  if(_dragStart && Math.hypot(e.clientX-_dragStart.x,e.clientY-_dragStart.y)>4)_didDrag=true;
});
canvas.addEventListener('click',e=>{
  if(_didDrag){_dragStart=null;return;}
  _dragStart=null;
  const rect=canvas.getBoundingClientRect();
  mouseNDC.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouseNDC.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouseNDC,camera);
  const hits=[];
  AGENTS.forEach(a=>{
    const arr=[];a.mesh.traverse(o=>{if(o.isMesh)arr.push(o);});
    const ints=raycaster.intersectObjects(arr,false);
    if(ints.length)hits.push({a,dist:ints[0].distance});
  });
  if(hits.length){hits.sort((p,q)=>p.dist-q.dist);openModal(hits[0].a,e.clientX,e.clientY);}
  else closeModal();
});

canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  mouseNDC.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouseNDC.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouseNDC,camera);
  const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
  const point=new THREE.Vector3();
  raycaster.ray.intersectPlane(plane,point);
  if(point){
    const room=ROOMS_DEF.find(r=>point.x>=r.x1&&point.x<r.x2&&point.z>=r.z1&&point.z<r.z2);
    const tip=document.getElementById('roomTip');
    if(room){
      tip.style.display='block';
      tip.textContent=room.label;
      tip.style.left=(e.clientX+14)+'px';
      tip.style.top=(e.clientY-28)+'px';
    } else tip.style.display='none';
  }
});
canvas.addEventListener('mouseleave',()=>{document.getElementById('roomTip').style.display='none';});

/* ══════════════════════ MODAL + AI ══════════════════════ */
let activeAgent=null,isStreaming=false;
function openModal(a,cx,cy){
  activeAgent=a;
  const m=document.getElementById('agModal');
  const ww=window.innerWidth,wh=window.innerHeight;
  let left=cx+14,top=Math.max(cy-180,8);
  if(left+336>ww)left=cx-342;
  if(top+500>wh)top=wh-508;
  m.style.left=Math.max(8,left)+'px';m.style.top=Math.max(8,top)+'px';m.style.display='block';
  document.getElementById('am-emo').textContent=a.emoji;
  document.getElementById('am-emo').style.background='#'+a.body.toString(16).padStart(6,'0')+'22';
  document.getElementById('am-nm').textContent=a.nm;
  document.getElementById('am-rl').textContent=a.role;
  const b=document.getElementById('am-bdg');b.textContent=SL[a.st];b.style.background=SC[a.st];
  document.getElementById('am-chat').innerHTML='<div style="text-align:center;color:var(--muted);font-size:10px;padding:14px 0" id="am-empty">Задай вопрос агенту ↓</div>';
  document.getElementById('am-inp').value='';document.getElementById('am-inp').focus();
}
window.closeModal=()=>{document.getElementById('agModal').style.display='none';activeAgent=null;};

window.sendMsg=async function(){
  if(!activeAgent||isStreaming)return;
  const inp=document.getElementById('am-inp');
  const msg=inp.value.trim();if(!msg)return;
  inp.value='';isStreaming=true;document.getElementById('am-snd').disabled=true;
  const chat=document.getElementById('am-chat');
  const e=document.getElementById('am-empty');if(e)e.remove();
  const um=document.createElement('div');um.className='am-msg-u';
  um.innerHTML=`<div class="am-lbl">Вы</div>${msg}`;chat.appendChild(um);
  const am=document.createElement('div');am.className='am-msg-a';
  am.innerHTML=`<div class="am-lbl">${activeAgent.nm}</div><span class="am-stream" id="am-str"></span><span class="cur">▋</span>`;
  chat.appendChild(am);chat.scrollTop=chat.scrollHeight;
  const prev={st:activeAgent.st,bub:activeAgent.bub};
  setSt(activeAgent.id,'working','Думает…');
  addFeed(activeAgent.nm,`Отвечает на: "${msg.slice(0,35)}…"`);
  try{
    const res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:600,stream:true,
        system:activeAgent.prompt,messages:[{role:'user',content:msg}]})
    });
    const reader=res.body.getReader();const dec=new TextDecoder();let full='';
    while(true){
      const {done,value}=await reader.read();if(done)break;
      for(const line of dec.decode(value,{stream:true}).split('\n')){
        const t=line.trim();
        if(t.startsWith('data:')){try{const j=JSON.parse(t.slice(5));const d=j.delta?.text;if(d){full+=d;const s=document.getElementById('am-str');if(s)s.textContent=full;chat.scrollTop=chat.scrollHeight;}}catch{}}
      }
    }
    am.innerHTML=`<div class="am-lbl">${activeAgent.nm}</div><span class="am-stream">${full}</span>`;
    setSt(activeAgent.id,'done',full.split(/[.!?]/)[0]?.slice(0,48)+'…'||'Готово!');
    setTimeout(()=>setSt(activeAgent.id,prev.st,prev.bub),4000);
  }catch(err){
    const s=document.getElementById('am-str');
    if(s)s.textContent='Нужен API ключ Anthropic для живых ответов агентов.';
    setSt(activeAgent.id,prev.st,prev.bub);
  }
  isStreaming=false;document.getElementById('am-snd').disabled=false;document.getElementById('am-inp').focus();
};

function addFeed(agNm,text){
  const f=document.getElementById('feed');
  const e=f.querySelector('div[style]');if(e)e.remove();
  const item=document.createElement('div');item.className='fi on';
  item.innerHTML=`<div class="fi-a">${agNm}</div><div class="fi-t">${text}</div>`;
  f.insertBefore(item,f.firstChild);
  if(f.children.length>14)f.removeChild(f.lastChild);
  setTimeout(()=>item.classList.remove('on'),3500);
}
function updHSt(){
  const cnt={ready:0,thinking:0,working:0,checking:0};
  AGENTS.forEach(a=>{if(cnt[a.st]!==undefined)cnt[a.st]++;});
  document.getElementById('hSt').innerHTML=Object.entries(cnt).map(([k,v])=>
    `<div class="hsi"><div class="hsd" style="background:${SC[k]}"></div>${v}</div>`
  ).join('');
}
updHSt();

/* ══════════════════════ QUIZ ══════════════════════ */
const QUIZ=[
  {q:'Что запускаете?',type:'text',ph:'Например: новый курс по AI…'},
  {q:'Что главное усилить?',type:'multi',opts:['Контент','Reels','Трафик','Воронку','Аналитику','Бренд']},
  {q:'Бюджет на ads?',type:'single',opts:['Без бюджета (только органика)','До 50 тыс.','50–200 тыс.','Более 200 тыс.']},
  {q:'Аудитория готова?',type:'single',opts:['Нет, только начинаю','Маленькая, < 1k','Есть теплая база','Большое комьюнити']},
  {q:'Главная боль?',type:'single',opts:['Нет контента','Слабые охваты','Не продаётся','Нет аналитики','Размытый бренд']},
];
const RECS={'Контент':['Sofia','Maverick','Hunter','Nova','Echo'],'Reels':['Maverick','Hunter','Pulse'],'Трафик':['Pulse','Scout','Vector'],'Воронку':['Leo','Selene','Nika'],'Аналитику':['Nika','Oracle'],'Бренд':['Aura','Atlas']};
let qStep=0,qAnswers={};
window.openQuiz=()=>{qStep=0;qAnswers={};renderQuiz();document.getElementById('quizOvl').classList.add('show');};
window.closeQuiz=()=>{document.getElementById('quizOvl').classList.remove('show');};
function renderQuiz(){
  const inner=document.getElementById('quizInner');
  if(qStep>=QUIZ.length){
    const sel=qAnswers[1]||[];const recs=[];
    sel.forEach(s=>(RECS[s]||[]).forEach(r=>!recs.includes(r)&&recs.push(r)));
    if(!recs.length)recs.push('Atlas','Sofia','Maverick');
    inner.innerHTML=`<div style="text-align:center"><div style="font-size:20px;font-weight:800;background:linear-gradient(90deg,#ff4080,#7e3ff2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px">Команда запуска готова ✓</div><div style="font-size:11px;color:#7c6e8e;margin-bottom:16px;line-height:1.65">Эти агенты возьмут запуск под себя</div><div class="q-recs">${recs.map(r=>`<span class="q-rec">${r}</span>`).join('')}</div><button onclick="closeQuiz()" style="width:100%;background:linear-gradient(90deg,#ff4080,#7e3ff2);color:#fff;border:none;padding:13px;border-radius:11px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:var(--uifont);box-shadow:0 4px 14px rgba(255,64,128,.3)">Запустить команду ↗</button></div>`;
    return;
  }
  const q=QUIZ[qStep];const prog=Math.round(qStep/QUIZ.length*100);
  let input=q.type==='text'
    ?`<input class="q-in" id="qi" placeholder="${q.ph}" value="${qAnswers[qStep]||''}">`
    :`<div class="q-os">${q.opts.map(o=>{const cur=qAnswers[qStep]||(q.type==='multi'?[]:'');const sel=q.type==='multi'?(cur.includes(o)):cur===o;return`<button class="qo${sel?' sel':''}" onclick="selO('${o}',${q.type==='multi'})">${o}</button>`;}).join('')}</div>`;
  inner.innerHTML=`<div class="q-sn">Вопрос ${qStep+1} из ${QUIZ.length}</div><div class="q-pg"><div class="q-pf" style="width:${prog}%"></div></div><div class="q-q">${q.q}</div>${input}<div class="q-nv">${qStep>0?`<button class="qbk" onclick="qBk()">← Назад</button>`:''}<button class="qnx" onclick="qNx()">${qStep>=QUIZ.length-1?'Готово →':'Далее →'}</button></div>`;
}
window.selO=(val,multi)=>{if(multi){const c=qAnswers[qStep]||[];qAnswers[qStep]=c.includes(val)?c.filter(v=>v!==val):[...c,val];}else qAnswers[qStep]=val;renderQuiz();};
window.qNx=()=>{if(QUIZ[qStep]?.type==='text'){const i=document.getElementById('qi');if(i)qAnswers[qStep]=i.value;}qStep++;renderQuiz();};
window.qBk=()=>{qStep--;renderQuiz();};

/* ══════════════════════ SOUND ══════════════════════ */
let audioCtx=null,soundOn=false;
function getAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTone(freq,dur,type='sine',vol=.08,delay=0){
  if(!soundOn)return;
  try{const ac=getAudio();const osc=ac.createOscillator();const g=ac.createGain();
    osc.connect(g);g.connect(ac.destination);
    osc.type=type;osc.frequency.value=freq;
    const t=ac.currentTime+delay;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.01);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    osc.start(t);osc.stop(t+dur+.05);}catch(e){}
}
function playStep(){playTone(180+Math.random()*40,.06,'triangle',.04);}
function playNotif(){playTone(523,.1,'sine',.1);playTone(659,.1,'sine',.1,.1);playTone(784,.15,'sine',.12,.2);}
function playBeam(){playTone(880,.05,'sine',.06);playTone(1100,.08,'sine',.05,.05);playTone(1320,.12,'sine',.04,.1);}
let stepTimer=0;
function tickSteps(now){if(now-stepTimer<280)return;stepTimer=now;AGENTS.forEach(a=>{if(a.moving)playStep();});}
window.toggleSound=()=>{
  soundOn=!soundOn;
  const b=document.getElementById('soundBtn');
  b.textContent=soundOn?'🔊':'🔇';
  b.classList.toggle('on',soundOn);
  if(soundOn){getAudio();playNotif();}
};

  tickIdle(now);tickSt(now);updAgents(now);updBeams(dt);animateFurn(now);tickSteps(now);

  renderer.render(scene,camera);

}
resetCam();
requestAnimationFrame(loop);
