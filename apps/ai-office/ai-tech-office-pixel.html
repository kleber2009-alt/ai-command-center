<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0d1a;--s1:#13162a;--s2:#1c2040;--border:rgba(255,255,255,.10);
  --text:#e0e6f0;--muted:#7a82a0;--accent:#60c8f0;--a2:#c8f060;--orange:#f06420;--red:#f04848;
  --font:'JetBrains Mono',monospace;--pixfont:'Press Start 2P',monospace;
}
html,body{background:#000;color:var(--text);font-family:var(--font);overflow:hidden;width:100%;height:100vh}
#app{display:flex;flex-direction:column;height:100vh}

/* HEADER */
#hdr{display:flex;align-items:center;gap:10px;padding:9px 14px;background:rgba(10,13,26,.97);border-bottom:1px solid var(--border);z-index:50;flex-shrink:0}
.h-logo{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.h-dot{width:7px;height:7px;border-radius:50%;background:#2ecc40;animation:pdot 1.5s infinite}
@keyframes pdot{0%,100%{box-shadow:0 0 0 0 rgba(46,204,64,.5)}70%{box-shadow:0 0 0 5px rgba(46,204,64,0)}}
.h-live{font-size:8px;color:#2ecc40;display:flex;align-items:center;gap:5px}
.h-sep{width:1px;height:14px;background:var(--border)}
.h-st{display:flex;gap:10px}
.hsi{display:flex;align-items:center;gap:4px;font-size:8px;color:var(--muted)}
.hsd{width:6px;height:6px;border-radius:50%}
#runBtn{margin-left:auto;background:var(--accent);color:#0a0d1a;border:none;padding:7px 14px;border-radius:10px;font-size:9px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .15s}
#runBtn:hover{background:#40b8e0}
#runBtn:disabled{opacity:.4;cursor:not-allowed}
#quizBtn{background:none;border:1px solid rgba(200,240,96,.35);color:var(--a2);padding:7px 12px;border-radius:10px;font-size:9px;font-weight:700;cursor:pointer;font-family:var(--font)}
#soundBtn{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 9px;border-radius:9px;cursor:pointer;font-size:11px;transition:all .15s}
#soundBtn.on{border-color:rgba(96,200,240,.5);color:var(--accent)}

/* MAIN */
#main{flex:1;display:flex;overflow:hidden;position:relative}
#stage{flex:1;position:relative;overflow:hidden;background:#06080f;cursor:grab}
#stage:active{cursor:grabbing}
#gc{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#beamCv{position:absolute;inset:0;pointer-events:none;z-index:22}

/* SIDEBAR */
#sidebar{width:220px;flex-shrink:0;background:rgba(10,13,26,.97);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-hd{padding:10px 14px;border-bottom:1px solid var(--border);font-size:7.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);font-weight:700}
#feed{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:5px}
.fi{border-left:2px solid var(--border);padding:5px 8px;transition:border-color .3s}
.fi.on{border-color:var(--accent)}
.fi-a{font-size:7.5px;font-weight:700;color:var(--accent);margin-bottom:2px}
.fi-t{font-size:8px;color:var(--muted);line-height:1.4}
#chainBar{padding:9px 12px;border-top:1px solid var(--border);display:none;background:rgba(10,13,26,.7)}
#chainBar.show{display:block}
.cb-t{font-size:7px;text-transform:uppercase;letter-spacing:1px;color:var(--a2);margin-bottom:5px;font-weight:700}
.cbs{font-size:7px;padding:2px 5px;border-radius:3px;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.3);white-space:nowrap;transition:all .3s}
.cbs.active{border-color:var(--a2);color:var(--a2);background:rgba(200,240,96,.1)}
.cbs.done{border-color:var(--accent);color:var(--accent);background:rgba(96,200,240,.07)}
.cba{color:rgba(255,255,255,.15);font-size:9px}

/* AGENT MODAL */
#agModal{position:fixed;z-index:100;background:rgba(10,13,26,.98);border:2px solid rgba(96,200,240,.3);border-radius:6px;width:300px;display:none;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.7)}
.am-hd{padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;background:rgba(255,255,255,.02)}
.am-emo{width:42px;height:42px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:2px solid rgba(96,200,240,.3)}
.am-nm{font-size:13px;font-weight:700;color:var(--accent)}
.am-rl{font-size:7.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:2px 0}
.am-bdg{display:inline-block;font-size:7px;padding:2px 7px;border-radius:3px;font-weight:700;color:#fff}
.am-close{position:absolute;top:9px;right:10px;background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:13px;font-family:var(--font)}
.am-close:hover{color:#fff}
.am-chat{padding:10px 14px;max-height:240px;overflow-y:auto;background:rgba(0,0,0,.2);font-size:9.5px;color:var(--muted);line-height:1.55}
.am-msg-u{background:rgba(96,200,240,.07);border:1px solid rgba(96,200,240,.15);border-radius:6px;padding:7px 10px;margin-bottom:6px;color:var(--text);text-align:right}
.am-msg-a{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;padding:7px 10px;margin-bottom:6px;color:var(--text)}
.am-lbl{font-size:7px;font-weight:700;opacity:.5;margin-bottom:3px}
.am-ir{padding:9px 12px;border-top:1px solid var(--border);display:flex;gap:7px}
.am-inp{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:5px;padding:8px 10px;color:var(--text);font-family:var(--font);font-size:10px;outline:none}
.am-inp:focus{border-color:rgba(96,200,240,.5)}
.am-send{background:var(--accent);color:#0a0d1a;border:none;padding:8px 12px;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer}
.am-send:disabled{opacity:.4;cursor:not-allowed}
.am-stream{white-space:pre-wrap;word-break:break-word}
.cur{display:inline-block;animation:blink .7s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* TABS */
#tabs{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;gap:3px;padding:7px 12px;background:rgba(10,13,26,.94);border-top:1px solid var(--border);z-index:30}
.iso-tab{padding:5px 10px;border-radius:6px;font-size:8.5px;font-weight:700;cursor:pointer;color:rgba(255,255,255,.5);border:none;background:none;font-family:var(--font);transition:all .15s}
.iso-tab:hover{background:rgba(255,255,255,.08);color:#fff}
.zbtn{width:26px;height:26px;border-radius:5px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.zbtn:hover{background:rgba(255,255,255,.1);color:#fff}

/* QUIZ */
#quizOvl{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.78);display:none;align-items:flex-end;justify-content:center}
#quizOvl.show{display:flex}
.qsh{background:var(--s1);border-radius:18px 18px 0 0;border-top:2px solid rgba(96,200,240,.25);padding:20px 18px 36px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto}
.q-hdl{width:34px;height:3px;background:rgba(255,255,255,.12);border-radius:2px;margin:0 auto 16px}
.q-sn{font-size:7.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:5px}
.q-pg{height:3px;background:rgba(255,255,255,.07);border-radius:2px;margin-bottom:14px}
.q-pf{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.q-q{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:13px}
.q-in{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 13px;color:var(--text);font-family:var(--font);font-size:11px;outline:none;margin-bottom:7px}
.q-in:focus{border-color:rgba(96,200,240,.5)}
.q-os{display:flex;flex-direction:column;gap:5px;margin-bottom:7px}
.qo{padding:10px 13px;border-radius:7px;border:1px solid rgba(255,255,255,.1);cursor:pointer;font-size:10px;color:rgba(255,255,255,.6);font-family:var(--font);text-align:left;background:none;transition:all .15s}
.qo.sel{border-color:var(--accent);color:var(--accent);background:rgba(96,200,240,.07)}
.q-nv{display:flex;gap:8px;margin-top:11px;justify-content:flex-end}
.qbk{background:none;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.35);padding:9px 14px;border-radius:7px;font-size:9px;font-family:var(--font);cursor:pointer}
.qnx{flex:1;background:var(--accent);color:#0a0d1a;border:none;padding:10px;border-radius:7px;font-size:9.5px;font-weight:700;font-family:var(--font);cursor:pointer}
.q-recs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;justify-content:center}
.q-rec{border:1px solid rgba(96,200,240,.35);color:var(--accent);font-size:9px;padding:5px 11px;border-radius:14px}

/* PRELOADER */
#preloader{position:fixed;inset:0;background:#0a0d1a;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .6s}
#preloader.fade{opacity:0;pointer-events:none}
.pl-logo{font-size:14px;color:var(--accent);font-family:var(--pixfont);text-align:center;line-height:1.6}
.pl-sub{font-size:9px;color:var(--muted);font-family:var(--font);letter-spacing:1px}
.pl-bar-wrap{width:240px;height:6px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.pl-bar{height:100%;background:var(--accent);width:0;transition:width .25s}
.pl-agents{display:flex;gap:6px;margin-top:4px}
.pl-dot{width:10px;height:10px;background:rgba(255,255,255,.1);transition:background .2s}
.pl-dot.done{background:var(--accent)}

/* ROOM TOOLTIP */
#roomTip{position:absolute;pointer-events:none;z-index:35;display:none;background:rgba(10,13,26,.94);border:1px solid rgba(96,200,240,.4);border-radius:4px;padding:5px 10px;font-size:8.5px;font-weight:700;color:var(--accent);font-family:var(--font);white-space:nowrap}

/* MINIMAP */
#minimap{position:absolute;right:10px;bottom:48px;width:160px;height:104px;background:rgba(10,13,26,.92);border:2px solid rgba(96,200,240,.25);border-radius:4px;z-index:35;overflow:hidden;cursor:pointer;image-rendering:pixelated}
#mm-label{position:absolute;top:3px;left:6px;font-size:6px;text-transform:uppercase;letter-spacing:1px;color:rgba(96,200,240,.7);font-family:var(--font);font-weight:700;z-index:2}
</style>
</head>
<body>
<div id="preloader">
  <div class="pl-logo">AI TECH<br>OFFICE</div>
  <div class="pl-sub">Engineering Department</div>
  <div class="pl-agents" id="pl-agents"></div>
  <div class="pl-bar-wrap"><div class="pl-bar" id="pl-bar"></div></div>
  <div class="pl-sub" id="pl-txt">Загрузка команды…</div>
</div>

<div id="app">
<div id="hdr">
  <div class="h-logo">⚙️ AI TECH OFFICE</div>
  <div class="h-live"><div class="h-dot"></div>Live</div>
  <div class="h-sep"></div>
  <div class="h-st" id="hSt"></div>
  <button id="soundBtn" onclick="toggleSound()" title="Звук">🔇</button>
  <button id="runBtn" onclick="startScenario()">▶ Запустить релиз</button>
  <button id="quizBtn" onclick="openQuiz()">◈ Брифинг</button>
</div>

<div id="main">
<div id="stage">
  <canvas id="gc"></canvas>
  <canvas id="beamCv"></canvas>

  <div id="minimap" onclick="minimapClick(event)">
    <div id="mm-label">⊞ ETAGE</div>
    <canvas id="mmCv" width="160" height="104"></canvas>
  </div>

  <div id="roomTip"></div>

  <div id="tabs">
    <button class="iso-tab" onclick="resetCam()">⊞ Весь офис</button>
    <button class="iso-tab" onclick="panToRoom('product')">Product</button>
    <button class="iso-tab" onclick="panToRoom('engineering')">Engineering</button>
    <button class="iso-tab" onclick="panToRoom('control')">Control</button>
    <div style="margin-left:auto;display:flex;gap:4px">
      <button class="zbtn" onclick="zoom(1.15)">+</button>
      <button class="zbtn" onclick="zoom(0.87)">−</button>
    </div>
  </div>
</div>

<div id="sidebar">
  <div class="sb-hd">◉ Активность команды</div>
  <div id="feed"><div style="font-size:9px;color:var(--muted);text-align:center;padding:20px 0;line-height:1.6">Нажми «Запустить релиз»<br>или кликни на агента</div></div>
  <div id="chainBar">
    <div class="cb-t">⟶ Pipeline</div>
    <div style="display:flex;flex-wrap:wrap;gap:2px;align-items:center" id="cbSteps"></div>
  </div>
</div>
</div>
</div>

<div id="agModal">
  <button class="am-close" onclick="closeModal()">✕</button>
  <div class="am-hd">
    <div class="am-emo" id="am-emo"></div>
    <div><div class="am-nm" id="am-nm"></div><div class="am-rl" id="am-rl"></div><div class="am-bdg" id="am-bdg"></div></div>
  </div>
  <div class="am-chat" id="am-chat"><div style="text-align:center;color:var(--muted);font-size:9px;padding:14px 0" id="am-empty">Задай вопрос агенту разработки ↓</div></div>
  <div class="am-ir">
    <input class="am-inp" id="am-inp" placeholder="Спроси агента…" onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="am-send" id="am-snd" onclick="sendMsg()">↑</button>
  </div>
</div>

<div id="quizOvl" onclick="if(event.target===this)closeQuiz()">
  <div class="qsh"><div class="q-hdl"></div><div id="quizInner"></div></div>
</div>

<script>
'use strict';

/* ══════════════════════ CANVAS ══════════════════════ */
const cv=document.getElementById('gc'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
let W,H;
function resize(){
  const w=document.getElementById('stage');
  W=w.clientWidth; H=w.clientHeight-40;
  cv.width=W; cv.height=H;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  const bc=document.getElementById('beamCv');
  bc.width=W;bc.height=H;bc.style.width=W+'px';bc.style.height=H+'px';
}
resize(); window.addEventListener('resize',resize);

/* ══════════════════════ CAMERA ══════════════════════ */
const TS=20;                // tile size
const MAP_W=34, MAP_H=22;
let cam={x:0,y:0,s:1,tx:0,ty:0,ts:1};
function updCam(){cam.x+=(cam.tx-cam.x)*.12;cam.y+=(cam.ty-cam.y)*.12;cam.s+=(cam.ts-cam.s)*.12}
function resetCam(){const fit=Math.min(W/(MAP_W*TS),H/(MAP_H*TS))*.92;cam.ts=fit;cam.tx=W/2-MAP_W*TS*fit/2;cam.ty=H/2-MAP_H*TS*fit/2;}
function zoom(f){cam.ts=Math.max(.45,Math.min(2.4,cam.ts*f))}
function panToRoom(room){
  const r={product:{x:5,y:10},engineering:{x:17,y:10},control:{x:28,y:10}}[room];
  if(!r)return;
  cam.tx=W/2-r.x*TS*cam.ts; cam.ty=H/2-r.y*TS*cam.ts;
}

let drag=false,_dx=0,_dy=0,_didDrag=false;
const stage=document.getElementById('stage');
stage.addEventListener('mousedown',e=>{drag=true;_didDrag=false;_dx=e.clientX-cam.tx;_dy=e.clientY-cam.ty});
window.addEventListener('mousemove',e=>{if(drag){const nx=e.clientX-_dx,ny=e.clientY-_dy;if(Math.abs(nx-cam.tx)>2||Math.abs(ny-cam.ty)>2)_didDrag=true;cam.tx=nx;cam.ty=ny}});
window.addEventListener('mouseup',()=>setTimeout(()=>drag=false,10));
stage.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.91)},{passive:false});

let _pd=0,_ps=1;
stage.addEventListener('touchstart',e=>{
  if(e.touches.length===2){_pd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);_ps=cam.ts;}
  else{drag=true;_didDrag=false;_dx=e.touches[0].clientX-cam.tx;_dy=e.touches[0].clientY-cam.ty;}
},{passive:true});
stage.addEventListener('touchmove',e=>{
  if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);cam.ts=Math.max(.45,Math.min(2.4,_ps*d/_pd));}
  else if(drag){const nx=e.touches[0].clientX-_dx,ny=e.touches[0].clientY-_dy;if(Math.abs(nx-cam.tx)>2||Math.abs(ny-cam.ty)>2)_didDrag=true;cam.tx=nx;cam.ty=ny;}
},{passive:true});
stage.addEventListener('touchend',()=>setTimeout(()=>drag=false,10));

/* ══════════════════════ PALETTE ══════════════════════ */
const PAL={
  wallDark:'#161a2e',wallMid:'#22273f',wallLight:'#353c60',wallTop:'#4d5680',
  // Product Room — light blue-cyan tiles (creative/data)
  prod1:'#5ab0d8',prod2:'#4a9ec8',prodLine:'#2a6890',prodSpec:'#90d4f0',
  // Engineering Room — dark gray devmode floor
  eng1:'#2c3045',eng2:'#262a3e',engLine:'#15172a',engSpec:'#3e4566',engNeon:'#3aff8a',
  // Control Room — deep blue + red accents
  ctrl1:'#2a3a6a',ctrl2:'#243260',ctrlLine:'#15204a',ctrlSpec:'#5070a8',
  shelf:'#5c3a18',shelfTop:'#7a5028',shelfBack:'#3a2410',
  bookR:'#d83828',bookB:'#2854c8',bookG:'#28a040',bookY:'#e4b428',bookP:'#8838b8',bookO:'#e0641a',bookC:'#28a8a8',
  desk:'#3a3d52',deskTop:'#4a4e68',deskLine:'#22253a',
  desk2:'#8a5828',desk2Top:'#a87038',desk2Line:'#5a3818',
  monBezel:'#0a0c14',monScreen:'#0d2548',monGlow:'#60c8f0',
  codeGreen:'#3aff8a',codeBlue:'#60c8f0',codeYellow:'#f0e060',
  chairBack:'#3a8fc4',chairSeat:'#2a78b0',chairDark:'#1a5a8a',
  chairBack2:'#c44848',chairSeat2:'#a83838',chairDark2:'#702020',
  plantPot:'#7a4218',plantPotL:'#9a5828',plant1:'#2a8a30',plant2:'#48b04a',plant3:'#7ad07a',

const M=(()=>{
  const m=[];
  for(let y=0;y<MAP_H;y++){const r=[];for(let x=0;x<MAP_W;x++)r.push(0);m.push(r);}
  // Three rooms side-by-side:
  // Product: cols 1-10, rows 1-20
  // Engineering: cols 12-22, rows 1-20
  // Control: cols 24-32, rows 1-20
  // Walls at col 0, 11, 23, 33
  for(let y=1;y<=20;y++){
    for(let x=1;x<=10;x++)m[y][x]=1;
    for(let x=12;x<=22;x++)m[y][x]=2;
    for(let x=24;x<=32;x++)m[y][x]=4;
  }
  // Outer walls
  for(let x=0;x<MAP_W;x++){m[0][x]=3;m[21][x]=3;}
  for(let y=0;y<MAP_H;y++){m[y][0]=3;m[y][33]=3;}
  // Inner dividing walls between rooms
  for(let y=1;y<=20;y++){m[y][11]=3;m[y][23]=3;}
  // Doorways at row 10 between rooms
  m[10][11]=5;m[11][11]=5;
  m[10][23]=5;m[11][23]=5;

  // Engineering room neon accent strip near top
  for(let x=12;x<=22;x++)m[1][x]=6;

  return m;
})();

/* ══════════════════════ SPRITES ══════════════════════ */
const SPRITE_W=16, SPRITE_H=24, SPRITE_SCALE=2;
const sheets={};

function px(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x|0,y|0,w|0,h|0);}

function makeSprite(a){
  const oc=document.createElement('canvas');
  oc.width=SPRITE_W*4; oc.height=SPRITE_H*2;
  const c=oc.getContext('2d');
  c.imageSmoothingEnabled=false;

  const shade=(hex,amt)=>{
    const n=parseInt(hex.slice(1),16);
    const r=Math.max(0,Math.min(255,(n>>16&255)+amt));
    const g=Math.max(0,Math.min(255,(n>>8&255)+amt));
    const b=Math.max(0,Math.min(255,(n&255)+amt));
    return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
  };
  const bodyD=shade(a.body,-28);
  const headD=shade(a.head,-22);
  const hairD=shade(a.hair,-22);

  for(let frame=0;frame<2;frame++){
    for(let dir=0;dir<4;dir++){
      const ox=dir*SPRITE_W, oy=frame*SPRITE_H;
      const lift=frame===1?-1:0;

      px(c,ox+3,oy+22,10,2,'rgba(0,0,0,.35)');

      const lc=bodyD;
      if(dir===0||dir===2){
        if(frame===0){px(c,ox+5,oy+17,3,5,lc);px(c,ox+8,oy+17,3,5,lc);}
        else{px(c,ox+5,oy+17,3,4,lc);px(c,ox+8,oy+17,3,5,lc);px(c,ox+4,oy+21,4,1,lc);}
        px(c,ox+4,oy+21,4,1,'#1a1a1a');px(c,ox+8,oy+21,4,1,'#1a1a1a');
      } else {
        if(frame===0){px(c,ox+6,oy+17,4,5,lc);}
        else{px(c,ox+6,oy+17,4,4,lc);px(c,ox+5,oy+21,5,1,lc);}
        px(c,ox+5,oy+21,5,1,'#1a1a1a');
      }

      const by=oy+10+lift;
      px(c,ox+4,by,8,8,a.body);
      px(c,ox+10,by,2,8,bodyD);
      px(c,ox+5,by,6,1,a.acc||'#c8f060');
      if(dir===0){
        px(c,ox+3,by+1,1,6,a.body);px(c,ox+12,by+1,1,6,a.body);
        px(c,ox+3,by+7,1,1,a.head);px(c,ox+12,by+7,1,1,a.head);
      } else if(dir===2){
        px(c,ox+3,by+1,1,6,a.body);px(c,ox+12,by+1,1,6,a.body);
      } else if(dir===1){
        px(c,ox+3,by+1,1,6,a.body);px(c,ox+3,by+7,1,1,a.head);
      } else {
        px(c,ox+12,by+1,1,6,a.body);px(c,ox+12,by+7,1,1,a.head);
      }

      const hy=oy+3+lift;
      px(c,ox+5,hy,6,6,a.head);
      px(c,ox+5,hy+5,6,1,headD);
      px(c,ox+7,hy+6,2,1,headD);

      if(dir===2){
        px(c,ox+4,hy-1,8,5,a.hair);
        px(c,ox+5,hy+4,6,1,hairD);
      } else if(dir===0){
        px(c,ox+4,hy-1,8,3,a.hair);
        px(c,ox+4,hy+2,1,3,a.hair);
        px(c,ox+11,hy+2,1,3,a.hair);
        px(c,ox+6,hy+3,1,1,'#fff');px(c,ox+9,hy+3,1,1,'#fff');
        px(c,ox+6,hy+3,1,1,'#222');px(c,ox+9,hy+3,1,1,'#222');
        px(c,ox+7,hy+5,2,1,shade(a.head,-40));
        if(a.id!=='cto'&&a.id!=='ai'){
          c.globalAlpha=.3;
          px(c,ox+5,hy+4,1,1,'#ff7a7a');px(c,ox+10,hy+4,1,1,'#ff7a7a');
          c.globalAlpha=1;
        }
      } else if(dir===1){
        px(c,ox+4,hy-1,7,3,a.hair);px(c,ox+4,hy+2,1,3,a.hair);
        px(c,ox+6,hy+3,1,1,'#222');
      } else {
        px(c,ox+5,hy-1,7,3,a.hair);px(c,ox+11,hy+2,1,3,a.hair);
        px(c,ox+9,hy+3,1,1,'#222');
      }

      // Per-agent accessories
      if(a.id==='cto'&&dir===0){
        px(c,ox+7,by+1,2,5,'#c8f060'); // tie
      }
      if(a.id==='ai'){
        // headphones
        px(c,ox+3,hy,1,4,'#c084fc');
        px(c,ox+12,hy,1,4,'#c084fc');
        px(c,ox+4,hy-2,8,1,'#c084fc');
      }
      if(a.id==='ops'){
        // cap
        px(c,ox+4,hy-2,8,2,'#1a1a1a');
        if(dir===3)px(c,ox+11,hy-1,2,1,'#1a1a1a');
        if(dir===1)px(c,ox+3,hy-1,2,1,'#1a1a1a');
      }
      if(a.id==='qa'&&dir===0){
        // glasses
        px(c,ox+5,hy+3,3,1,'#222');px(c,ox+8,hy+3,3,1,'#222');
        px(c,ox+5,hy+2,3,1,'#222');px(c,ox+8,hy+2,3,1,'#222');
        px(c,ox+6,hy+3,1,1,'#fff');px(c,ox+9,hy+3,1,1,'#fff');
      }
      if(a.id==='data'&&dir===0){
        // monocle glasses
        px(c,ox+5,hy+3,3,1,'#888');px(c,ox+9,hy+3,3,1,'#888');
      }
      if(a.id==='ux'){
        // hair ribbon / artistic
        px(c,ox+9,hy-1,3,2,'#ff80ab');
      }
      if(a.id==='fe'||a.id==='be'){
        // hoodie hood hint
        px(c,ox+3,by-1,10,2,a.body);
      }
      if(a.id==='auto'){
        // headset (work-from-anywhere)
        px(c,ox+3,hy+1,1,3,'#888');
        px(c,ox+12,hy+1,1,3,'#888');
        px(c,ox+4,hy-1,8,1,'#888');
      }
    }
  }
  return oc;
}

/* ══════════════════════ TILE DRAWING ══════════════════════ */
function drawTile(x,y,t,now){
  const sx=x*TS, sy=y*TS;
  if(t===0){px(ctx,sx,sy,TS,TS,'#06080f');return;}
  if(t===1){
    // Product floor — cyan tile
    px(ctx,sx,sy,TS,TS,PAL.prod2);
    px(ctx,sx+1,sy+1,TS-2,TS-2,PAL.prod1);
    px(ctx,sx+2,sy+2,3,1,PAL.prodSpec);
    px(ctx,sx+1,sy+2,1,2,PAL.prodSpec);
    px(ctx,sx,sy,TS,1,PAL.prodLine);
    px(ctx,sx,sy,1,TS,PAL.prodLine);
    return;
  }
  if(t===2){
    // Engineering floor — dark tech
    px(ctx,sx,sy,TS,TS,PAL.eng1);
    px(ctx,sx+1,sy+1,TS-2,TS-2,PAL.eng2);
    px(ctx,sx,sy,TS,1,PAL.engLine);
    px(ctx,sx,sy,1,TS,PAL.engLine);
    // subtle neon grid dot
    if((x*5+y*3)%7===0){
      const flick=Math.sin(now*.003+x+y)>0?1:.5;
      ctx.globalAlpha=.5*flick;
      px(ctx,sx+TS-3,sy+TS-3,2,2,PAL.engNeon);
      ctx.globalAlpha=1;
    }
    return;
  }
  if(t===3){
    px(ctx,sx,sy,TS,TS,PAL.wallMid);
    px(ctx,sx,sy,TS,3,PAL.wallTop);
    px(ctx,sx,sy+3,TS,1,PAL.wallLight);
    px(ctx,sx,sy+TS-2,TS,2,PAL.wallDark);
    px(ctx,sx+TS/2,sy+4,1,TS-6,'rgba(0,0,0,.18)');
    return;
  }
  if(t===4){
    // Control floor — deep blue
    px(ctx,sx,sy,TS,TS,PAL.ctrl2);
    px(ctx,sx+1,sy+1,TS-2,TS-2,PAL.ctrl1);
    px(ctx,sx+2,sy+2,3,1,PAL.ctrlSpec);
    px(ctx,sx,sy,TS,1,PAL.ctrlLine);
    px(ctx,sx,sy,1,TS,PAL.ctrlLine);
    return;
  }
  if(t===5){
    px(ctx,sx,sy,TS,TS,PAL.wallMid);
    px(ctx,sx+2,sy+2,TS-4,TS-4,'#5a3818');
    px(ctx,sx+3,sy+TS/2,TS-6,1,'rgba(255,255,255,.15)');
    return;
  }
  if(t===6){
    // Engineering accent — neon strip
    px(ctx,sx,sy,TS,TS,PAL.wallMid);
    px(ctx,sx,sy+TS-4,TS,3,'#1a3340');
    const flick=.6+Math.sin(now*.004+x)*.25;
    ctx.globalAlpha=flick;
    px(ctx,sx,sy+TS-3,TS,1,PAL.engNeon);
    ctx.globalAlpha=1;
    px(ctx,sx,sy,TS,3,PAL.wallTop);
    return;
  }
}

/* ══════════════════════ FURNITURE DRAWING ══════════════════════ */
function drawFurn(f,now){
  const sx=f.x*TS, sy=f.y*TS, sw=f.w*TS, sh=f.h*TS;
  switch(f.type){

    case 'shelf':{
      px(ctx,sx,sy,sw,sh*.85,PAL.shelfBack);
      px(ctx,sx,sy+sh*.85,sw,sh*.15,PAL.shelfTop);
      px(ctx,sx,sy+sh*.85,sw,1,'rgba(255,255,255,.18)');
      const bookCols=[PAL.bookR,PAL.bookB,PAL.bookG,PAL.bookY,PAL.bookP,PAL.bookO,PAL.bookC];
      const bw=Math.max(3,Math.floor(sw/8));
      const nb=Math.floor(sw/bw);
      for(let i=0;i<nb;i++){
        const c=bookCols[(i+Math.floor(f.x*3))%bookCols.length];
        const bh=sh*.7 + ((i*7)%3)*2;
        const bx=sx+i*bw+1, by=sy+sh*.85-bh;
        px(ctx,bx,by,bw-1,bh,c);
        px(ctx,bx,by,1,bh,'rgba(255,255,255,.18)');
        px(ctx,bx,by,bw-1,1,'rgba(0,0,0,.3)');
      }
      px(ctx,sx,sy+sh-2,sw,2,PAL.shelf);
      break;
    }

    case 'kanban':{
      // Kanban board with 3 columns of sticky notes
      px(ctx,sx,sy,sw,sh,PAL.wbFrame);
      px(ctx,sx+1,sy+1,sw-2,sh-2,PAL.wbBoard);
      // header line
      px(ctx,sx+1,sy+sh*.18,sw-2,1,'#cccccc');
      // columns
      const cols=['#f8e060','#80c8f0','#98e898'];
      const colW=(sw-6)/3;
      for(let i=0;i<3;i++){
        const cx=sx+2+i*colW;
        // header label tab
        px(ctx,cx+2,sy+sh*.05,colW-2,sh*.12,cols[i]);
        // sticky notes
        for(let j=0;j<2;j++){
          const stx=cx+3, sty=sy+sh*.22+j*sh*.32;
          px(ctx,stx,sty,colW-6,sh*.26,cols[i]);
          px(ctx,stx+1,sty+sh*.04,colW-10,1,'rgba(0,0,0,.2)');
          px(ctx,stx+1,sty+sh*.10,colW-12,1,'rgba(0,0,0,.2)');
        }
      }
      break;
    }

    case 'roadmap':{
      px(ctx,sx,sy,sw,sh,PAL.picFrame);
      px(ctx,sx+2,sy+2,sw-4,sh-4,'#1a1d2c');
      // graph lines
      const baseY=sy+sh*.7;
      px(ctx,sx+3,baseY,sw-6,1,'#3a3d52');
      // bars
      const colors=[PAL.codeGreen,PAL.codeBlue,PAL.codeYellow,'#ff4858'];
      for(let i=0;i<5;i++){
        const bh=sh*.15+((i*7)%4)*sh*.08;
        const bx=sx+4+i*(sw-8)/5, by=baseY-bh;
        px(ctx,bx,by,(sw-8)/5-1,bh,colors[i%colors.length]);
      }
      // trend line
      px(ctx,sx+3,sy+sh*.6,(sw-6)*.3,1,'#fff');
      px(ctx,sx+3+(sw-6)*.3,sy+sh*.5,(sw-6)*.3,1,'#fff');
      px(ctx,sx+3+(sw-6)*.6,sy+sh*.35,(sw-6)*.3,1,'#fff');
      break;
    }

    case 'pmdesk':{
      px(ctx,sx,sy,sw,sh,PAL.desk2);
      px(ctx,sx,sy,sw,2,PAL.desk2Top);
      px(ctx,sx,sy+sh-2,sw,2,PAL.desk2Line);
      // laptop
      const lw=sw*.5, lh=sh*.65;
      const lx=sx+sw*.08, ly=sy+2;
      px(ctx,lx,ly,lw,lh*.18,'#888'); // back
      px(ctx,lx,ly+lh*.18,lw,lh*.6,PAL.monBezel);
      px(ctx,lx+2,ly+lh*.18+2,lw-4,lh*.6-4,'#c084fc');
      // text lines
      ctx.globalAlpha=.6;
      px(ctx,lx+3,ly+lh*.3,lw*.6,1,'#fff');
      px(ctx,lx+3,ly+lh*.45,lw*.4,1,'#fff');
      px(ctx,lx+3,ly+lh*.6,lw*.5,1,'#fff');
      ctx.globalAlpha=1;
      // notes
      px(ctx,sx+sw*.62,sy+sh*.2,sw*.3,sh*.55,'#f0e8d0');
      px(ctx,sx+sw*.64,sy+sh*.3,sw*.26,1,'rgba(0,0,0,.3)');
      px(ctx,sx+sw*.64,sy+sh*.4,sw*.22,1,'rgba(0,0,0,.3)');
      px(ctx,sx+sw*.64,sy+sh*.5,sw*.20,1,'rgba(0,0,0,.3)');
      // coffee
      px(ctx,sx+sw*.88,sy+sh*.5,sw*.1,sh*.35,'#fff');
      px(ctx,sx+sw*.89,sy+sh*.55,sw*.08,sh*.22,'#6a4220');
      break;
    }

    case 'designdesk':{
      px(ctx,sx,sy,sw,sh,PAL.desk2);
      px(ctx,sx,sy,sw,2,PAL.desk2Top);
      px(ctx,sx,sy+sh-2,sw,2,PAL.desk2Line);
      // big drawing tablet
      const tw=sw*.5, th=sh*.7;
      const tx=sx+sw*.06, ty=sy+sh*.15;
      px(ctx,tx,ty,tw,th,'#1a1d2c');
      px(ctx,tx+1,ty+1,tw-2,th-2,'#22273f');
      // colorful UI mockup
      px(ctx,tx+3,ty+3,tw-6,th*.2,'#e91e63');
      px(ctx,tx+3,ty+3+th*.22,tw*.4,th*.18,'#60c8f0');
      px(ctx,tx+3+tw*.42,ty+3+th*.22,(tw-6)*.5,th*.18,'#c8f060');
      px(ctx,tx+3,ty+3+th*.44,tw-6,th*.18,'#f0c060');
      // stylus
      px(ctx,sx+sw*.6,sy+sh*.3,sw*.04,sh*.4,'#888');
      px(ctx,sx+sw*.6,sy+sh*.28,sw*.05,sh*.05,'#222');
      // color palette tray
      const cp=['#e91e63','#60c8f0','#c8f060','#f0c060','#c084fc'];
      cp.forEach((co,i)=>px(ctx,sx+sw*.7+i*sw*.05,sy+sh*.7,sw*.045,sh*.18,co));
      break;
    }

    case 'analystdesk':{
      px(ctx,sx,sy,sw,sh,PAL.desk2);
      px(ctx,sx,sy,sw,2,PAL.desk2Top);
      px(ctx,sx,sy+sh-2,sw,2,PAL.desk2Line);
      // monitor with chart
      const mw=sw*.55, mh=sh*.65;
      const mx=sx+sw*.06, my=sy+2;
      px(ctx,mx,my,mw,mh,PAL.monBezel);
      px(ctx,mx+2,my+2,mw-4,mh-4,PAL.monScreen);
      // bar chart on screen
      const colors=['#f0e060','#60c8f0','#c8f060','#f06420','#c084fc'];
      const baseY=my+mh-4;
      for(let i=0;i<5;i++){
        const bh=4+(((i*7+f.x*3)|0)%6)*2;
        px(ctx,mx+4+i*(mw-8)/5,baseY-bh,(mw-8)/5-1,bh,colors[i]);
      }
      // line on top
      ctx.globalAlpha=.6;
      px(ctx,mx+3,my+mh*.3,mw-6,1,'#fff');
      ctx.globalAlpha=1;
      // notebook
      px(ctx,sx+sw*.66,sy+sh*.25,sw*.28,sh*.55,'#f0e8d0');
      for(let r=0;r<4;r++) px(ctx,sx+sw*.68,sy+sh*.32+r*sh*.1,sw*.22,1,'rgba(0,0,0,.3)');
      // calculator
      px(ctx,sx+sw*.4,sy+sh*.7,sw*.18,sh*.2,'#888');
      px(ctx,sx+sw*.41,sy+sh*.71,sw*.16,sh*.05,'#1a1d2c');
      break;
    }

    case 'devdesk':{
      // dual-monitor dev desk
      px(ctx,sx,sy,sw,sh,PAL.desk);
      px(ctx,sx,sy,sw,2,PAL.deskTop);
      px(ctx,sx,sy+sh-2,sw,2,PAL.deskLine);
      // monitor 1
      const mw=sw*.42, mh=sh*.6;
      const mx1=sx+sw*.04, my=sy+2;
      const mx2=sx+sw*.54;
      [mx1,mx2].forEach((mx,idx)=>{
        px(ctx,mx,my,mw,mh,PAL.monBezel);
        px(ctx,mx+1,my+1,mw-2,mh-2,'#0a1428');
        // code lines (different per monitor)
        const lines=f.code==='frontend'
          ?[[PAL.codeBlue,.7],[PAL.codeYellow,.5],[PAL.codeGreen,.6],[PAL.codeBlue,.4],['#f06420',.55]]
          :f.code==='backend'
          ?[[PAL.codeGreen,.5],[PAL.codeGreen,.7],[PAL.codeYellow,.6],[PAL.codeGreen,.4],[PAL.codeBlue,.65]]
          :f.code==='ai'
          ?[[PAL.codeGreen,.6],[PAL.codeBlue,.8],[PAL.codeYellow,.5],[PAL.codeGreen,.7],[PAL.codeBlue,.55]]
          :[[PAL.codeYellow,.7],[PAL.codeBlue,.5],[PAL.codeGreen,.6],[PAL.codeYellow,.4],[PAL.codeGreen,.55]];
        const flick=(Math.sin(now*0.003+f.x+idx)+1)/2;
        ctx.globalAlpha=.7+flick*.2;
        lines.forEach((ln,j)=>{
          px(ctx,mx+3,my+3+j*((mh-6)/lines.length),Math.floor((mw-6)*ln[1]),1,ln[0]);
        });
        ctx.globalAlpha=1;
        // cursor blink
        if(Math.floor(now/400)%2===0){
          px(ctx,mx+3+Math.floor((mw-6)*lines[2][1])+1,my+3+2*((mh-6)/lines.length),1,1,'#fff');
        }
        // stand
        px(ctx,mx+mw/2-1,my+mh-2,3,3,'#1a1a22');
      });
      // mechanical keyboard
      px(ctx,sx+sw*.18,sy+sh*.7,sw*.62,sh*.18,'#1a1d2c');
      // RGB strip
      const rgb=['#ff4858','#f0c060','#3aff8a','#60c8f0','#c084fc'];
      for(let i=0;i<8;i++) px(ctx,sx+sw*.2+i*sw*.07,sy+sh*.71,sw*.05,1,rgb[(i+Math.floor(now/500))%rgb.length]);
      // mouse
      px(ctx,sx+sw*.85,sy+sh*.72,sw*.08,sh*.12,'#2a2e3a');
      break;
    }

    case 'server':{
      // Tall server rack
      px(ctx,sx,sy,sw,sh,PAL.rack);
      px(ctx,sx+1,sy+1,sw-2,sh-2,PAL.rackL);
      px(ctx,sx+1,sy+1,sw-2,2,PAL.rackDoor);
      // server slots with LEDs
      const slots=6;
      for(let i=0;i<slots;i++){
        const slY=sy+3+i*((sh-4)/slots);
        const slH=(sh-4)/slots-1;
        px(ctx,sx+2,slY,sw-4,slH,PAL.rackDoor);
        // 3 LEDs per slot
        const flick=Math.sin(now*.005+i+f.x*3);
        const ledCol=i%2===0?(flick>0?PAL.ledG:PAL.ledR):PAL.ledB;
        px(ctx,sx+3,slY+1,2,1,ledCol);
        px(ctx,sx+6,slY+1,2,1,flick>.3?PAL.ledG:'#1a1a22');
        px(ctx,sx+sw-5,slY+1,2,1,PAL.ledG);
        // ventilation slit
        for(let v=0;v<3;v++)px(ctx,sx+3+v*3,slY+slH-2,2,1,'rgba(255,255,255,.1)');
      }
      break;
    }

    case 'archboard':{
      // Architecture whiteboard with boxes & arrows
      px(ctx,sx,sy,sw,sh,PAL.wbFrame);
      px(ctx,sx+1,sy+1,sw-2,sh-2,PAL.wbBoard);
      // boxes (nodes)
      const nodes=[
        {x:.1,y:.2,w:.18,h:.25,c:PAL.codeBlue},
        {x:.4,y:.15,w:.18,h:.25,c:PAL.codeGreen},
        {x:.7,y:.2,w:.18,h:.25,c:PAL.codeYellow},
        {x:.25,y:.6,w:.18,h:.25,c:'#f898c8'},
        {x:.55,y:.6,w:.18,h:.25,c:'#c084fc'},
      ];
      nodes.forEach(n=>{
        const nx=sx+1+n.x*(sw-2), ny=sy+1+n.y*(sh-2);
        const nw=n.w*(sw-2), nh=n.h*(sh-2);
        px(ctx,nx,ny,nw,nh,n.c);
        px(ctx,nx,ny,nw,1,'rgba(0,0,0,.3)');
      });
      // arrows
      ctx.strokeStyle='#1a1a22';ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(sx+1+.28*(sw-2),sy+1+.3*(sh-2));ctx.lineTo(sx+1+.4*(sw-2),sy+1+.27*(sh-2));
      ctx.moveTo(sx+1+.58*(sw-2),sy+1+.27*(sh-2));ctx.lineTo(sx+1+.7*(sw-2),sy+1+.3*(sh-2));
      ctx.moveTo(sx+1+.49*(sw-2),sy+1+.4*(sh-2));ctx.lineTo(sx+1+.4*(sw-2),sy+1+.6*(sh-2));
      ctx.moveTo(sx+1+.49*(sw-2),sy+1+.4*(sh-2));ctx.lineTo(sx+1+.6*(sw-2),sy+1+.6*(sh-2));
      ctx.stroke();
      break;
    }

    case 'gpurig':{
      // GPU rig — small server with bright fans
      px(ctx,sx,sy,sw,sh,PAL.rack);
      px(ctx,sx+1,sy+1,sw-2,sh-2,PAL.rackL);
      // glass front
      px(ctx,sx+2,sy+sh*.2,sw-4,sh*.55,PAL.rackDoor);
      // GPU fans
      const fans=2;
      for(let i=0;i<fans;i++){
        const fy=sy+sh*.22+i*sh*.28;
        const fx=sx+sw*.2;
        const fw=sw*.6;
        px(ctx,fx,fy,fw,sh*.22,'#1a1a22');
        // rotating fan center
        const ang=now*.01+i;
        const ccx=fx+fw/2, ccy=fy+sh*.11;
        px(ctx,ccx-2,ccy-2,4,4,PAL.codeGreen);
        ctx.save();
        ctx.translate(ccx,ccy);ctx.rotate(ang);
        ctx.fillStyle='rgba(58,255,138,.7)';
        ctx.fillRect(-4,-1,8,2);ctx.fillRect(-1,-4,2,8);
        ctx.restore();
      }
      // glow underneath
      ctx.globalAlpha=.4+Math.sin(now*.004)*.2;
      px(ctx,sx+2,sy+sh*.78,sw-4,2,PAL.codeGreen);
      ctx.globalAlpha=1;
      break;
    }

    case 'coffeebar':{
      // Coffee station/counter for dev room
      px(ctx,sx,sy,sw,sh,'#3a3d52');
      px(ctx,sx,sy,sw,2,'#5a5e78');
      px(ctx,sx,sy+sh-3,sw,3,'#1a1d2c');
      // coffee machine
      px(ctx,sx+sw*.1,sy+2,sw*.22,sh*.7,'#22253a');
      px(ctx,sx+sw*.12,sy+sh*.35,sw*.18,sh*.2,'#0a0c14');
      px(ctx,sx+sw*.18,sy+sh*.55,sw*.06,4,'#888');
      // cup
      px(ctx,sx+sw*.35,sy+sh*.45,sw*.08,sh*.35,'#fff');
      px(ctx,sx+sw*.36,sy+sh*.55,sw*.06,sh*.2,'#6a4220');
      // mugs (multiple)
      for(let i=0;i<3;i++){
        px(ctx,sx+sw*.5+i*sw*.1,sy+sh*.5,sw*.07,sh*.3,'#'+['e0641a','60c8f0','f0c060'][i]);
        px(ctx,sx+sw*.51+i*sw*.1,sy+sh*.55,sw*.05,sh*.2,'#6a4220');
      }
      // sugar / snacks
      px(ctx,sx+sw*.85,sy+sh*.5,sw*.12,sh*.3,'#c8f060');
      break;
    }

    case 'devsofa':{
      // Pair-programming sofa with laptop
      px(ctx,sx,sy,sw,sh,'#1a3340');
      px(ctx,sx+1,sy+1,sw-2,sh-2,'#244a58');
      // backrest
      px(ctx,sx,sy,sw,sh*.3,'#2c5a70');
      px(ctx,sx,sy,sw,2,'rgba(255,255,255,.15)');
      // cushions
      const nc=4;
      for(let i=0;i<nc;i++){
        const cx=sx+(i*sw/nc)+2, cy=sy+sh*.4;
        px(ctx,cx,cy,sw/nc-4,sh*.45,'#1a3a48');
        px(ctx,cx,cy,sw/nc-4,1,'#3a7a90');
      }
      // laptop on sofa
      const lx=sx+sw*.4, ly=sy+sh*.35, lw=sw*.2, lh=sh*.3;
      px(ctx,lx,ly,lw,lh,'#1a1d2c');
      px(ctx,lx+1,ly+1,lw-2,lh-3,PAL.codeGreen);
      ctx.globalAlpha=.8;
      px(ctx,lx+2,ly+2,lw*.6,1,'#0a0a0a');
      px(ctx,lx+2,ly+lh*.5,lw*.4,1,'#0a0a0a');
      ctx.globalAlpha=1;
      break;
    }

    case 'plant':{
      const pw=sw*.6, ph=sh*.35;
      const px0=sx+(sw-pw)/2, py0=sy+sh-ph;
      px(ctx,px0,py0,pw,ph,PAL.plantPot);
      px(ctx,px0,py0,pw,2,PAL.plantPotL);
      const lw=sw*.85, lh=sh*.7;
      const lx=sx+(sw-lw)/2, ly=sy;
      px(ctx,lx+2,ly+2,lw-4,lh-4,PAL.plant1);
      px(ctx,lx+1,ly+lh*.2,2,lh*.5,PAL.plant1);
      px(ctx,lx+lw-3,ly+lh*.2,2,lh*.5,PAL.plant1);
      px(ctx,lx+3,ly+3,lw*.4,2,PAL.plant2);
      px(ctx,lx+lw*.5,ly+lh*.4,lw*.3,2,PAL.plant2);
      px(ctx,lx+4,ly+4,3,1,PAL.plant3);
      break;
    }

    case 'sofa':{
      px(ctx,sx,sy,sw,sh,PAL.sofaD);
      px(ctx,sx+1,sy+1,sw-2,sh-2,PAL.sofa);
      px(ctx,sx,sy,sw,sh*.3,PAL.sofaL);
      px(ctx,sx,sy,sw,2,'rgba(255,255,255,.18)');
      const nc=3;
      for(let i=0;i<nc;i++){
        const cx=sx+(i*sw/nc)+2, cy=sy+sh*.4;
        px(ctx,cx,cy,sw/nc-4,sh*.45,PAL.sofa);
        px(ctx,cx,cy,sw/nc-4,1,PAL.sofaL);
      }
      break;
    }

    case 'ltable':{
      px(ctx,sx,sy,sw,sh,'#5a3818');
      px(ctx,sx+1,sy+1,sw-2,sh-2,'#7a5028');
      // mug + papers
      px(ctx,sx+sw*.55,sy+sh*.25,sw*.18,sh*.55,'#fafafa');
      px(ctx,sx+sw*.56,sy+sh*.32,sw*.16,1,'rgba(0,0,0,.3)');
      px(ctx,sx+sw*.15,sy+sh*.35,sw*.15,sh*.4,'#fff');
      px(ctx,sx+sw*.16,sy+sh*.42,sw*.12,sh*.22,'#6a4220');
      break;
    }

    case 'monwall':{
      // wall-mounted monitors with live graphs
      px(ctx,sx,sy,sw,sh,'#0a0c14');
      px(ctx,sx+1,sy+1,sw-2,sh-2,PAL.monBezel);
      // split into 2 screens
      const sw1=(sw-3)/2;
      for(let i=0;i<2;i++){
        const ox=sx+2+i*(sw1+1);
        px(ctx,ox,sy+2,sw1,sh-4,'#0a1428');
        // Graph
        const baseY=sy+sh-6;
        const cols=[PAL.codeGreen,PAL.codeBlue];
        ctx.strokeStyle=cols[i];ctx.lineWidth=1;
        ctx.beginPath();
        for(let j=0;j<sw1;j+=2){
          const y=baseY-((Math.sin(j*0.2+now*.002+i)+1)*sh*.15)-sh*.1;
          if(j===0) ctx.moveTo(ox+j,y); else ctx.lineTo(ox+j,y);
        }
        ctx.stroke();
        // grid
        ctx.globalAlpha=.2;
        for(let g=0;g<3;g++)px(ctx,ox+1,sy+3+g*((sh-6)/3),sw1-2,1,cols[i]);
        ctx.globalAlpha=1;
        // header bar
        px(ctx,ox,sy+2,sw1,2,cols[i]);
      }
      break;
    }

    case 'statuslight':{
      // Status light panel: green/red/yellow indicators
      px(ctx,sx,sy,sw,sh,PAL.rack);
      px(ctx,sx+1,sy+1,sw-2,sh-2,PAL.rackL);
      const lights=[PAL.ledG,PAL.ledG,PAL.ledG,PAL.ledR,PAL.ledG,'#f0c060'];
      lights.forEach((col,i)=>{
        const cy=sy+sh*.1+i*sh*.13;
        const cx=sx+sw*.25;
        const flick=Math.sin(now*.005+i*1.3);
        ctx.globalAlpha=col===PAL.ledR?(flick>0?1:.3):.85;
        px(ctx,cx,cy,sw*.18,sh*.08,col);
        ctx.globalAlpha=1;
        // label line
        px(ctx,cx+sw*.25,cy+sh*.025,sw*.5,1,'rgba(255,255,255,.4)');
      });
      break;
    }

    case 'ctodesk':{
      // Executive CTO desk with big monitor
      px(ctx,sx,sy,sw,sh,'#3a2814');
      px(ctx,sx+1,sy+1,sw-2,sh-2,'#5a3818');
      px(ctx,sx,sy,sw,2,'#7a5028');
      // huge monitor
      const mw=sw*.55, mh=sh*.7;
      const mx=sx+sw*.08, my=sy+2;
      px(ctx,mx,my,mw,mh,PAL.monBezel);
      px(ctx,mx+1,my+1,mw-2,mh-2,'#0a0a14');
      // multi-panel dashboard
      px(ctx,mx+2,my+2,mw*.45-3,mh*.5-3,'#0a1428');
      px(ctx,mx+mw*.5,my+2,mw*.5-3,mh*.5-3,'#0a1428');
      px(ctx,mx+2,my+mh*.5,mw*.45-3,mh*.5-3,'#0a1428');

/* ══════════════════════ AGENTS DRAWING ══════════════════════ */
function drawAgent(a,now){
  const sh=sheets[a.id]; if(!sh) return;
  const sx=a.gx*TS, sy=a.gy*TS;
  const bob=a.moving?0:Math.sin(now/600+a.gx*.4)*1.2;
  const frame=a.moving?Math.floor(now/200)%2:0;
  const dw=SPRITE_W*SPRITE_SCALE/1.5, dh=SPRITE_H*SPRITE_SCALE/1.5;
  const dx=sx-dw/2, dy=sy-dh+bob;

  ctx.fillStyle='rgba(0,0,0,.32)';
  ctx.beginPath();ctx.ellipse(sx,sy+2,8,3,0,0,Math.PI*2);ctx.fill();

  if(a.st==='working'||a.st==='thinking'){
    ctx.save();ctx.globalAlpha=.25+Math.sin(now*0.005)*0.1;
    const g=ctx.createRadialGradient(sx,dy+dh/2,0,sx,dy+dh/2,18);
    g.addColorStop(0,SC[a.st]); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,dy+dh/2,18,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(sh, a.dir*SPRITE_W, frame*SPRITE_H, SPRITE_W, SPRITE_H, dx, dy, dw, dh);

  ctx.font='bold 7px JetBrains Mono';
  const lbl=SL[a.st];
  const tw=ctx.measureText(lbl).width+8;
  ctx.fillStyle=SC[a.st];
  ctx.fillRect(sx-tw/2,dy-10,tw,9);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText(lbl,sx,dy-9);

  ctx.font='bold 8px JetBrains Mono';
  const nw=ctx.measureText(a.nm).width+8;
  ctx.fillStyle='rgba(10,13,26,.85)';
  ctx.fillRect(sx-nw/2,dy+dh+2,nw,10);
  ctx.fillStyle=a.acc||'#60c8f0';
  ctx.fillText(a.nm,sx,dy+dh+3);

  if(a.bub){
    ctx.font='bold 8px JetBrains Mono';
    const bw=ctx.measureText(a.bub).width+12,bh=14;
    const bx=sx-bw/2, by=dy-26;
    ctx.fillStyle='rgba(255,255,255,.96)';
    ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#1a1a1a';
    ctx.fillRect(bx,by,bw,1); ctx.fillRect(bx,by+bh-1,bw,1);
    ctx.fillRect(bx,by,1,bh); ctx.fillRect(bx+bw-1,by,1,bh);
    ctx.fillStyle='rgba(255,255,255,.96)';
    ctx.fillRect(sx-2,by+bh,4,3); ctx.fillRect(sx-1,by+bh+3,2,2);
    ctx.fillStyle='#1a1a1a';
    ctx.fillRect(sx-2,by+bh+2,1,1); ctx.fillRect(sx+1,by+bh+2,1,1);
    ctx.fillRect(sx-1,by+bh+4,1,1); ctx.fillRect(sx,by+bh+4,1,1);
    ctx.fillStyle='#111';
    ctx.fillText(a.bub,sx,by+3);
  }
}

/* ══════════════════════ MOVEMENT ══════════════════════ */
const SPD=0.08;
const dirTo=(ax,ay,tx,ty)=>{
  const dx=tx-ax,dy=ty-ay;
  return Math.abs(dx)>Math.abs(dy) ? (dx>0?3:1) : (dy>0?0:2);
};
function updAgents(){
  AGENTS.forEach(a=>{
    if(!a.dest){a.moving=false;return;}
    const dx=a.dest.gx-a.gx,dy=a.dest.gy-a.gy,dist=Math.sqrt(dx*dx+dy*dy);
    a.moving=true; a.dir=dirTo(a.gx,a.gy,a.dest.gx,a.dest.gy);
    if(dist<SPD+.02){
      a.gx=a.dest.gx;a.gy=a.dest.gy;a.dest=null;a.moving=false;
      if(a._cb){const cb=a._cb;a._cb=null;cb();}
    } else {a.gx+=dx/dist*SPD;a.gy+=dy/dist*SPD;}
  });
}

const IDLE_RADIUS=1.0;
let lastIdle=0;
function tickIdle(now){
  if(now-lastIdle<2400)return;lastIdle=now;if(scenRunning)return;
  const a=AGENTS[Math.floor(Math.random()*AGENTS.length)];
  if(a.dest)return;
  const tx=a._home.gx + (Math.random()-.5)*IDLE_RADIUS*2;
  const ty=a._home.gy + (Math.random()-.5)*IDLE_RADIUS*2;
  a.dest={gx:Math.max(1.5,Math.min(MAP_W-2,tx)), gy:Math.max(1.5,Math.min(MAP_H-2,ty))};
}

let lastStC=0;
function tickSt(now){
  if(now-lastStC<4200)return;lastStC=now;if(scenRunning)return;
  const a=AGENTS[Math.floor(Math.random()*AGENTS.length)];
  const opts=['ready','ready','thinking','working','checking'];
  const ns=opts[Math.floor(Math.random()*opts.length)];
  a.st=ns;
  a.bub={thinking:'Думает…',working:'Работает…',checking:'Проверяет…'}[ns]||null;
  updHSt();
}

function updChain(done){

    `<span class="cbs${i<=done?' done':i===done+1?' active':''}">${n}</span>${i<CHAIN_NM.length-1?'<span class="cba">→</span>':''}`

function startScenario(){
  if(scenRunning)return;scenRunning=true;
  document.getElementById('runBtn').disabled=true;
  document.getElementById('chainBar').classList.add('show');
  AGENTS.forEach(a=>{a.st='ready';a.bub=null;a.dest=null;a.moving=false;});
  setSt('pm','working','User stories…');updChain(-1);
  addFeed('София','Готовит user story и критерии готовности');
  let step=0;
  function doStep(){
    if(step>=STEPS.length){
      setTimeout(()=>{
        setSt('cto','done','✅ Релиз принят!');
        setSt('data','working','Сбор метрик…');
        addFeed('Макс','Релиз принят. CTO даёт зелёный свет 🚀');
        setTimeout(()=>{
          setSt('data','done','Метрики собраны');
          addFeed('Ника','Метрики первого дня готовы. Конверсия растёт.');
          setTimeout(()=>{
            scenRunning=false;
            document.getElementById('runBtn').disabled=false;
            AGENTS.forEach(a=>{a.dest={gx:a._home.gx,gy:a._home.gy};});
          },2400);
        },1800);
      },400);return;
    }
    const s=STEPS[step];
    const fA=AGENTS.find(x=>x.id===s.f),tA=AGENTS.find(x=>x.id===s.t);
    fA.bub=s.bF; fA.st='working'; updHSt();
    addFeed(fA.nm,s.feed);
    fA._cb=()=>{
      fA.st='done';fA.bub=null;
      tA.bub=s.bT;tA.st='working';
      spawnBeam(fA,tA);
      playBeam();playNotif();
      updChain(step);step++;
      setTimeout(doStep,700);
    };
    fA.dest={gx:s.fd.gx,gy:s.fd.gy};
  }
  doStep();
}

async function sendMsg(){
  if(!activeAgent||isStreaming)return;
  const inp=document.getElementById('am-inp');
  const msg=inp.value.trim();if(!msg)return;
  inp.value='';isStreaming=true;document.getElementById('am-snd').disabled=true;
  const chat=document.getElementById('am-chat');
  const e=document.getElementById('am-empty');if(e)e.remove();
  const um=document.createElement('div');um.className='am-msg-u';
  um.innerHTML=`<div class="am-lbl">Вы</div>${msg}`;chat.appendChild(um);
  const am=document.createElement('div');am.className='am-msg-a';
  am.innerHTML=`<div class="am-lbl">${activeAgent.nm}</div><span class="am-stream" id="am-str"></span><span class="cur">▋</span>`;
  chat.appendChild(am);chat.scrollTop=chat.scrollHeight;
  const prev={st:activeAgent.st,bub:activeAgent.bub};
  setSt(activeAgent.id,'working','Думает…');
  addFeed(activeAgent.nm,`Отвечает на: "${msg.slice(0,35)}…"`);
  try{
    const res=await fetch('/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:300,stream:true,
        system:activeAgent.prompt,messages:[{role:'user',content:msg}]})
    });
    const reader=res.body.getReader();const dec=new TextDecoder();let full='';
    while(true){
      const {done,value}=await reader.read();if(done)break;
      for(const line of dec.decode(value,{stream:true}).split('\n')){
        const t=line.trim();
        if(t.startsWith('data:')){try{const j=JSON.parse(t.slice(5));const d=j.delta?.text;if(d){full+=d;const s=document.getElementById('am-str');if(s)s.textContent=full;chat.scrollTop=chat.scrollHeight;}}catch{}}
      }
    }
    am.innerHTML=`<div class="am-lbl">${activeAgent.nm}</div><span class="am-stream">${full}</span>`;
    setSt(activeAgent.id,'done',full.split(/[.!?]/)[0]?.slice(0,48)+'…'||'Готово!');
    setTimeout(()=>setSt(activeAgent.id,prev.st,prev.bub),4000);
  }catch(err){
    const s=document.getElementById('am-str');
    if(s)s.textContent='Нужен API ключ Anthropic для живых ответов агентов.';
    setSt(activeAgent.id,prev.st,prev.bub);
  }
  isStreaming=false;document.getElementById('am-snd').disabled=false;document.getElementById('am-inp').focus();
}

function addFeed(agNm,text){
  const f=document.getElementById('feed');
  const e=f.querySelector('div[style]');if(e)e.remove();
  const item=document.createElement('div');item.className='fi on';
  item.innerHTML=`<div class="fi-a">${agNm}</div><div class="fi-t">${text}</div>`;
  f.insertBefore(item,f.firstChild);
  if(f.children.length>14)f.removeChild(f.lastChild);

}

  {q:'Что важнее всего?',type:'multi',opts:['Frontend','Backend','AI-логика','Интеграции','Тесты','Деплой']},
  {q:'Текущий стек?',type:'single',opts:['Next.js + Node','React + Python','Только AI/n8n','Стек ещё не выбран']},
  {q:'Срок MVP?',type:'single',opts:['1 неделя','2–4 недели','1–3 месяца','Не горит']},
  {q:'Главный риск?',type:'single',opts:['Не сделаем UI','Не успеем по срокам','Сложно с AI','Нет тестов','Не задеплоим']},
];
const RECS={'Frontend':['Кодер','Мира'],'Backend':['Арчи','Деплой'],'AI-логика':['Нейрон','Авто'],'Интеграции':['Авто','Арчи'],'Тесты':['Вера','Кодер'],'Деплой':['Деплой','Макс']};
let qStep=0,qAnswers={};
function openQuiz(){qStep=0;qAnswers={};renderQuiz();document.getElementById('quizOvl').classList.add('show');}
function closeQuiz(){document.getElementById('quizOvl').classList.remove('show');}
function renderQuiz(){
  const inner=document.getElementById('quizInner');
  if(qStep>=QUIZ.length){
    const sel=qAnswers[1]||[];const recs=[];
    sel.forEach(s=>(RECS[s]||[]).forEach(r=>!recs.includes(r)&&recs.push(r)));
    if(!recs.length)recs.push('Макс','София','Кодер');
    inner.innerHTML=`<div style="text-align:center"><div style="font-size:18px;font-weight:700;color:#60c8f0;margin-bottom:8px">Команда собрана ✓</div><div style="font-size:10px;color:#6b6880;margin-bottom:14px;line-height:1.65">Эти агенты возьмут твою задачу в работу</div><div class="q-recs">${recs.map(r=>`<span class="q-rec">${r}</span>`).join('')}</div><button onclick="closeQuiz()" style="width:100%;background:#60c8f0;color:#0a0d1a;border:none;padding:12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font)">Запустить команду ↗</button></div>`;
    return;
  }
  const q=QUIZ[qStep];const prog=Math.round(qStep/QUIZ.length*100);
  let input=q.type==='text'
    ?`<input class="q-in" id="qi" placeholder="${q.ph}" value="${qAnswers[qStep]||''}">`
    :`<div class="q-os">${q.opts.map(o=>{const cur=qAnswers[qStep]||(q.type==='multi'?[]:'');const sel=q.type==='multi'?(cur.includes(o)):cur===o;return`<button class="qo${sel?' sel':''}" onclick="selO('${o}',${q.type==='multi'})">${o}</button>`;}).join('')}</div>`;
  inner.innerHTML=`<div class="q-sn">Вопрос ${qStep+1} из ${QUIZ.length}</div><div class="q-pg"><div class="q-pf" style="width:${prog}%"></div></div><div class="q-q">${q.q}</div>${input}<div class="q-nv">${qStep>0?`<button class="qbk" onclick="qBk()">← Назад</button>`:''}<button class="qnx" onclick="qNx()">${qStep>=QUIZ.length-1?'Готово →':'Далее →'}</button></div>`;
}
function selO(val,multi){if(multi){const c=qAnswers[qStep]||[];qAnswers[qStep]=c.includes(val)?c.filter(v=>v!==val):[...c,val];}else qAnswers[qStep]=val;renderQuiz();}
function qNx(){if(QUIZ[qStep]?.type==='text'){const i=document.getElementById('qi');if(i)qAnswers[qStep]=i.value;}qStep++;renderQuiz();}
function qBk(){qStep--;renderQuiz();}

/* ══════════════════════ ROOM HOVER ══════════════════════ */
let hoveredRoom=null;
stage.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  const sx=(e.clientX-r.left), sy=(e.clientY-r.top);
  const wx=(sx-cam.x)/cam.s, wy=(sy-cam.y)/cam.s;
  const gx=wx/TS, gy=wy/TS;
  const room=ROOMS.find(rb => gx>=rb.x1 && gx<rb.x2 && gy>=rb.y1 && gy<rb.y2);
  const tip=document.getElementById('roomTip');
  if(room){
    hoveredRoom=room;
    tip.textContent=room.label;
    tip.style.display='block';
    tip.style.left=(e.clientX+14)+'px';
    tip.style.top=(e.clientY-26)+'px';
  } else {
    hoveredRoom=null;
    tip.style.display='none';
  }
});
stage.addEventListener('mouseleave',()=>{document.getElementById('roomTip').style.display='none';hoveredRoom=null;});

function drawRoomHover(){
  if(!hoveredRoom)return;
  ctx.save();
  ctx.globalAlpha=0.10+Math.sin(now_g*0.004)*0.04;
  ctx.fillStyle='#60c8f0';
  ctx.fillRect(hoveredRoom.x1*TS,hoveredRoom.y1*TS,(hoveredRoom.x2-hoveredRoom.x1)*TS,(hoveredRoom.y2-hoveredRoom.y1)*TS);
  ctx.globalAlpha=.5;
  ctx.strokeStyle='#60c8f0';ctx.lineWidth=1.5;
  ctx.strokeRect(hoveredRoom.x1*TS,hoveredRoom.y1*TS,(hoveredRoom.x2-hoveredRoom.x1)*TS,(hoveredRoom.y2-hoveredRoom.y1)*TS);
  ctx.restore();
}

/* ══════════════════════ BEAM ══════════════════════ */
const beamCv=document.getElementById('beamCv');
const bctx=beamCv.getContext('2d');
const beams=[];
function spawnBeam(fromA,toA){
  beams.push({x1:fromA.gx*TS,y1:fromA.gy*TS-12,x2:toA.gx*TS,y2:toA.gy*TS-12,life:1,progress:0,color:fromA.acc||'#60c8f0'});
}
function updateBeams(){for(let i=beams.length-1;i>=0;i--){const b=beams[i];b.progress+=.025;b.life-=.018;if(b.life<=0||b.progress>=1.3)beams.splice(i,1);}}
function drawBeams(){
  bctx.clearRect(0,0,W,H);
  bctx.save();
  bctx.translate(cam.x,cam.y); bctx.scale(cam.s,cam.s);
  beams.forEach(b=>{
    const p=Math.min(b.progress,1);
    const hx=b.x1+(b.x2-b.x1)*p, hy=b.y1+(b.y2-b.y1)*p;
    const grad=bctx.createLinearGradient(b.x1,b.y1,hx,hy);
    grad.addColorStop(0,'transparent');
    grad.addColorStop(.6,b.color+'55');
    grad.addColorStop(1,b.color+'ee');
    bctx.strokeStyle=grad; bctx.lineWidth=2.5;
    bctx.shadowColor=b.color; bctx.shadowBlur=10;
    bctx.beginPath();bctx.moveTo(b.x1,b.y1);bctx.lineTo(hx,hy);bctx.stroke();
    bctx.shadowBlur=0;
    const og=bctx.createRadialGradient(hx,hy,0,hx,hy,9);
    og.addColorStop(0,'#fff'); og.addColorStop(.3,b.color); og.addColorStop(1,'transparent');
    bctx.save();bctx.globalAlpha=b.life*.9;
    bctx.fillStyle=og;bctx.beginPath();bctx.arc(hx,hy,9,0,Math.PI*2);bctx.fill();
    for(let s=0;s<5;s++){
      const a=(now_g*.003+s*1.26);
      const r=8+Math.sin(now_g*.005+s)*3;
      bctx.fillStyle=b.color; bctx.globalAlpha=b.life*.5;
      bctx.beginPath();bctx.arc(hx+Math.cos(a)*r,hy+Math.sin(a)*r*.5,1.5,0,Math.PI*2);bctx.fill();
    }
    bctx.restore();
  });
  bctx.restore();
}

/* ══════════════════════ MINIMAP ══════════════════════ */
const mmCv=document.getElementById('mmCv'), mmCtx=mmCv.getContext('2d');
const MM_W=160, MM_H=104;
function gridToMM(gx,gy){return {x:gx/MAP_W*MM_W, y:gy/MAP_H*MM_H};}
function drawMinimap(){
  mmCtx.fillStyle='#06080f'; mmCtx.fillRect(0,0,MM_W,MM_H);
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    const t=M[y][x]; let col='#06080f';
    if(t===1)col='#4a9ec8'; else if(t===2)col='#262a3e'; else if(t===3)col='#22273f';
    else if(t===4)col='#243260'; else if(t===5)col='#5a3818'; else if(t===6)col='#3aff8a';
    mmCtx.fillStyle=col;
    const p=gridToMM(x,y), p2=gridToMM(x+1,y+1);
    mmCtx.fillRect(p.x,p.y,p2.x-p.x+.5,p2.y-p.y+.5);
  }
  AGENTS.forEach(a=>{
    const p=gridToMM(a.gx,a.gy);
    mmCtx.fillStyle=SC[a.st]||'#fff';
    mmCtx.shadowColor=SC[a.st]||'#fff'; mmCtx.shadowBlur=4;
    mmCtx.beginPath();mmCtx.arc(p.x,p.y,2.4,0,Math.PI*2);mmCtx.fill();
    mmCtx.shadowBlur=0;
  });
}
function minimapClick(e){
  const r=document.getElementById('minimap').getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const gx=mx/MM_W*MAP_W, gy=my/MM_H*MAP_H;
  cam.tx=W/2-gx*TS*cam.ts; cam.ty=H/2-gy*TS*cam.ts;
}

/* ══════════════════════ SOUND ══════════════════════ */
let audioCtx=null, soundOn=false;
function getAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTone(freq,dur,type='sine',vol=.08,delay=0){
  if(!soundOn)return;
  try{const ac=getAudio();const osc=ac.createOscillator();const g=ac.createGain();
    osc.connect(g);g.connect(ac.destination);
    osc.type=type;osc.frequency.value=freq;
    const t=ac.currentTime+delay;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.01);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    osc.start(t);osc.stop(t+dur+.05);}catch(e){}
}
function playStep(){playTone(180+Math.random()*40,.06,'triangle',.04);}
function playNotif(){playTone(523,.1,'sine',.1);playTone(659,.1,'sine',.1,.1);playTone(784,.15,'sine',.12,.2);}
function playBeam(){playTone(880,.05,'sine',.06);playTone(1100,.08,'sine',.05,.05);playTone(1320,.12,'sine',.04,.1);}
let stepTimer=0;
function tickSteps(now){if(now-stepTimer<280)return;stepTimer=now;AGENTS.forEach(a=>{if(a.moving)playStep();});}
function toggleSound(){
  soundOn=!soundOn;
  const b=document.getElementById('soundBtn');
  b.textContent=soundOn?'🔊':'🔇';
  b.classList.toggle('on',soundOn);
  if(soundOn){getAudio();playNotif();}
}

/* ══════════════════════ PRELOADER ══════════════════════ */
const plAgents=document.getElementById('pl-agents');
AGENTS.forEach(()=>{const d=document.createElement('div');d.className='pl-dot';plAgents.appendChild(d);});
function genSprites(){
  const bar=document.getElementById('pl-bar');
  const txt=document.getElementById('pl-txt');
  const dots=plAgents.querySelectorAll('.pl-dot');
  const msgs=['Запуск серверов…','Подключаем БД…','Прогрев AI…','Собираем команду…','npm run dev…','Tech Office готов!'];
  let i=0;
  function next(){
    if(i>=AGENTS.length){
      bar.style.width='100%'; txt.textContent='Online!';
      setTimeout(()=>{const pl=document.getElementById('preloader');pl.classList.add('fade');setTimeout(()=>pl.remove(),700);resetCam();requestAnimationFrame(loop);},400);
      return;
    }
    sheets[AGENTS[i].id]=makeSprite(AGENTS[i]);
    dots[i].classList.add('done');
    bar.style.width=((i+1)/AGENTS.length*100)+'%';
    txt.textContent=msgs[Math.floor(i/AGENTS.length*msgs.length)]||msgs[msgs.length-1];
    i++; setTimeout(next,80);
  }
  next();
}
setTimeout(genSprites,200);

/* ══════════════════════ MAIN LOOP ══════════════════════ */
let now_g=0;
function loop(now){
  now_g=now;
  updCam();

  ctx.fillStyle='#06080f';ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(cam.x,cam.y);
  ctx.scale(cam.s,cam.s);
  ctx.imageSmoothingEnabled=false;

  drawScene(now);
  drawRoomHover();
  const ymerge=[
    ...FURN_SORTED.map(f=>({y:f.y+f.h, kind:'f', item:f})),
    ...AGENTS.map(a=>({y:a.gy, kind:'a', item:a})),
  ].sort((p,q)=>p.y-q.y);

  tickIdle(now); tickSt(now); updAgents();
  tickSteps(now);

  ymerge.forEach(o=>{
    if(o.kind==='f') drawFurn(o.item,now);
    else drawAgent(o.item,now);
  });

  ctx.restore();

  updateBeams();
  drawBeams();
  drawMinimap();

  requestAnimationFrame(loop);
}
