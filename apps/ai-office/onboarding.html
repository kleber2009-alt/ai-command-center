<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c14;--card:#13162a;--card2:#181b30;--border:rgba(255,255,255,.08);
  --text:#e8e4f0;--muted:#7a82a0;--dim:rgba(255,255,255,.4);
  --accent:#c8f060;--a2:#60c8f0;--a3:#f06090;--font:'JetBrains Mono',monospace;--ui:'Inter',sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--ui);min-height:100vh;line-height:1.55}
body{padding:32px 24px 80px;background:radial-gradient(ellipse at top,#1a2a4a 0%,#0a0c14 60%);display:flex;align-items:flex-start;justify-content:center}

.wrap{width:100%;max-width:640px;margin:0 auto}

/* HEADER */
.header{text-align:center;margin-bottom:32px}
.header .tag{display:inline-block;font-family:var(--font);font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--accent);padding:5px 11px;border-radius:6px;background:rgba(200,240,96,.08);border:1px solid rgba(200,240,96,.2);margin-bottom:14px}
.header h1{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.15;margin-bottom:8px}
.header h1 .grad{background:linear-gradient(90deg,#c8f060,#60c8f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--muted);font-size:13px;max-width:480px;margin:0 auto}

/* PROGRESS */
.prog{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:14px}
.prog-info{flex:1;min-width:0}
.prog-step{font-family:var(--font);font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:6px}
.prog-bar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#c8f060,#60c8f0);border-radius:3px;transition:width .4s cubic-bezier(.2,.8,.4,1)}
.prog-pct{font-size:13px;font-weight:800;color:var(--accent);min-width:42px;text-align:right;font-family:var(--font)}

/* CARD */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:32px;margin-bottom:18px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.q-tit{font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.25;margin-bottom:8px;color:var(--text)}
.q-sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.6}

/* INPUTS */
.inp,.txt{width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:11px;padding:13px 16px;color:var(--text);font:500 14px/1.45 var(--ui);outline:none;transition:border-color .15s}
.inp:focus,.txt:focus{border-color:rgba(200,240,96,.4)}
.inp::placeholder,.txt::placeholder{color:var(--dim)}
.txt{resize:vertical;min-height:90px;font-family:var(--ui)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:560px){.row{grid-template-columns:1fr}}

.label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 6px}

/* RADIO/CHECKBOX CARDS */
.choices{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.choices.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media(max-width:560px){.choices.grid2{grid-template-columns:1fr}}
.choice{display:flex;align-items:center;gap:11px;padding:13px 14px;background:var(--card2);border:1.5px solid var(--border);border-radius:11px;cursor:pointer;transition:all .15s;font-size:13.5px;color:var(--text);user-select:none}
.choice:hover{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.03)}
.choice.sel{border-color:var(--accent);background:rgba(200,240,96,.06)}
.choice .mk{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;position:relative;transition:all .15s}
.choice.sel .mk{border-color:var(--accent);background:var(--accent)}
.choice.sel .mk::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:#080808}
.choice.cb .mk{border-radius:5px}
.choice.cb.sel .mk::after{width:11px;height:7px;background:none;border:2px solid #080808;border-top:none;border-right:none;border-radius:0;transform:translate(-50%,-65%) rotate(-45deg);left:50%;top:50%}
.choice .em{font-size:18px;flex-shrink:0}
.choice .info{flex:1;min-width:0}
.choice .info b{display:block;font-size:13.5px;font-weight:700;margin-bottom:2px}
.choice .info span{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}

/* NAV */
.nav{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border-radius:12px;padding:14px;font:800 12.5px/1 var(--ui);letter-spacing:.4px;cursor:pointer;transition:all .15s;border:1.5px solid;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-prev{background:var(--card);color:var(--muted);border-color:var(--border)}
.btn-prev:hover{color:var(--text);border-color:rgba(255,255,255,.18)}
.btn-prev:disabled{opacity:.4;cursor:not-allowed}
.btn-next{background:linear-gradient(90deg,#c8f060,#60c8f0);color:#080808;border-color:transparent;box-shadow:0 4px 14px rgba(200,240,96,.25);flex:2}
.btn-next:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(200,240,96,.4)}
.btn-next:disabled{opacity:.5;cursor:not-allowed;transform:none}

.hint{margin-top:8px;font-size:11px;color:var(--dim);font-style:italic}
.err{color:var(--a3);font-size:11.5px;margin-top:6px}

/* FOOTER */
.legal{text-align:center;margin-top:20px;font-size:11px;color:var(--muted)}
.legal a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;transition:all .15s;margin:0 6px}
.legal a:hover{color:var(--accent);border-color:var(--accent)}
.save-note{font-size:10px;color:var(--dim);text-align:center;margin-top:8px;font-family:var(--font);letter-spacing:.5px}
</style>

const TOTAL = STEPS.length;
let current = 0;
let data = {};

// Load saved data
try { data = JSON.parse(localStorage.getItem('aio_brief') || '{}'); } catch { data = {}; }

function save() {
  data.updatedAt = Date.now();
  localStorage.setItem('aio_brief', JSON.stringify(data));
}

function renderStep() {
  const step = STEPS[current];
  const fields = step.fields || [step.field];
  let html = `<div class="q-tit">${step.tit}</div><div class="q-sub">${step.sub}</div>`;

  fields.forEach(f => {
    if (!f) return;
    if (f.label) html += `<div class="label">${f.label}${f.required?' *':''}</div>`;

    const val = data[f.key];

    if (f.type === 'text' || f.type === 'email') {
      html += `<input class="inp" type="${f.type}" id="f_${f.key}" placeholder="${f.ph||''}" value="${escapeHTML(val||'')}">`;
    }
    else if (f.type === 'textarea') {
      html += `<textarea class="txt" id="f_${f.key}" placeholder="${f.ph||''}">${escapeHTML(val||'')}</textarea>`;
    }
    else if (f.type === 'radio' || f.type === 'multi') {
      const isMulti = f.type === 'multi';
      const cur = isMulti ? (Array.isArray(val)?val:[]) : val;
      const cls = (isMulti ? 'cb ' : '') + 'choices' + (f.options.length>4 ? ' grid2' : '');
      html += `<div class="${cls}" data-key="${f.key}" data-multi="${isMulti?1:0}">`;
      f.options.forEach(o => {
        const sel = isMulti ? cur.includes(o.v) : cur === o.v;
        html += `<div class="choice${isMulti?' cb':''}${sel?' sel':''}" data-val="${o.v}">
          <div class="mk"></div>
          ${o.em?`<div class="em">${o.em}</div>`:''}
          <div class="info">
            <b>${o.t}</b>
            ${o.d?`<span>${o.d}</span>`:''}
          </div>
        </div>`;
      });
      html += '</div>';
    }
  });

  document.getElementById('card').innerHTML = html;

  // Wire up choice clicks
  document.querySelectorAll('.choices').forEach(box => {
    const key = box.dataset.key;
    const isMulti = box.dataset.multi === '1';
    box.querySelectorAll('.choice').forEach(c => {
      c.onclick = () => {
        const v = c.dataset.val;
        if (isMulti) {
          let arr = Array.isArray(data[key]) ? data[key] : [];
          if (arr.includes(v)) arr = arr.filter(x => x !== v);
          else arr = [...arr, v];
          data[key] = arr;
          save();
          renderStep();
        } else {
          data[key] = v;
          save();
          // Auto-advance for single radio with single field
          if (fields.length === 1 && fields[0].type === 'radio') {
            setTimeout(() => next(), 200);
          } else {
            renderStep();
          }
        }
      };
    });
  });

  // Wire up text inputs — handle ALL input methods (typing, autofill, paste)
  fields.forEach(f => {
    if (f.type === 'text' || f.type === 'email' || f.type === 'textarea') {
      const el = document.getElementById('f_'+f.key);
      if (el) {
        const sync = () => { data[f.key] = el.value; save(); };
        // Cover all paths: typing, paste, autofill, programmatic change
        el.addEventListener('input',  sync);
        el.addEventListener('change', sync);
        el.addEventListener('blur',   sync);
        // Periodic poll for first 2 sec — catches stubborn autofill
        let polls = 0;
        const interval = setInterval(() => {
          if (el.value !== (data[f.key]||'')) sync();
          if (++polls > 20) clearInterval(interval);
        }, 100);
        if (current === 0 && f.key === 'name' && !val) setTimeout(() => el.focus(), 100);
      }
    }
  });

  // Progress
  const pct = Math.round(((current+1)/TOTAL)*100);
  document.getElementById('progStep').textContent = `Шаг ${current+1} / ${TOTAL}`;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progPct').textContent = pct + '%';

  // Buttons
  document.getElementById('btnPrev').disabled = current === 0;
  document.getElementById('btnNext').textContent = current === TOTAL - 1 ? 'Подобрать команду →' : 'Далее →';
}

function syncDOM() {
  // Принудительно подтягиваем текущие значения из всех инпутов в data
  // (защита от автофилла, который не триггерит input-событие)
  const step = STEPS[current];
  const fields = step.fields || [step.field];
  fields.forEach(f => {
    if (!f) return;
    if (f.type === 'text' || f.type === 'email' || f.type === 'textarea') {
      const el = document.getElementById('f_'+f.key);
      if (el && el.value) data[f.key] = el.value;
    }
  });
  save();
}

function validate() {
  syncDOM(); // Подхватить значения, которые могли вставиться автофиллом
  const step = STEPS[current];
  const fields = step.fields || [step.field];
  for (const f of fields) {
    if (!f || !f.required) continue;
    const v = data[f.key];
    const labelText = f.label || (f.type === 'email' ? 'Email' : f.type === 'text' ? 'Поле' : 'Ответ');
    if (f.type === 'multi') {
      if (!Array.isArray(v) || v.length === 0) return `Выбери хотя бы один вариант`;
    } else if (!v || (typeof v === 'string' && !v.trim())) {
      return `Заполни поле «${labelText}»`;
    }
    if (f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim())) {
      return 'Введи корректный email (например, name@example.com)';
    }
  }
  return null;
}

function next() {
  const err = validate();
  if (err) {
    showError(err);
    return;
  }
  if (current === TOTAL - 1) {
    // Final step → go to recommend
    data.completedAt = Date.now();
    save();
    // Also send to Supabase (saveLead pattern)
    try { sendToBackend(); } catch {}
    location.href = 'recommend.html';
    return;
  }
  current++;
  renderStep();
  window.scrollTo({top:0, behavior:'smooth'});
}

function prev() {
  if (current > 0) {
    syncDOM(); // сохранить введённое перед уходом
    current--;
    renderStep();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

function showError(msg) {
  // Remove old error if any
  const old = document.querySelector('.err');
  if (old) old.remove();
  // Create new error pinned to bottom of card with shake animation
  const err = document.createElement('div');
  err.className = 'err';
  err.style.cssText = 'background:rgba(240,96,144,.1);border:1px solid rgba(240,96,144,.35);border-radius:10px;padding:11px 14px;margin-top:14px;font-size:12.5px;color:#f06090;font-weight:600;animation:shake .35s';
  err.textContent = '⚠ ' + msg;
  document.getElementById('card').appendChild(err);
  // Scroll error into view
  setTimeout(() => err.scrollIntoView({behavior:'smooth',block:'center'}), 50);
  setTimeout(() => { if (err && err.parentNode) err.remove(); }, 5000);
  // Add shake keyframe if not present
  if (!document.getElementById('shake-kf')) {
    const s = document.createElement('style');
    s.id = 'shake-kf';
    s.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}';
    document.head.appendChild(s);
  }
}

function escapeHTML(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.metaKey) next();
  if (e.key === 'Escape') prev();
});

renderStep();
</script>
