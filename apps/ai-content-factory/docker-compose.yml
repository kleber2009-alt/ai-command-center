# Standalone compose for ai-content-factory.
#
# To attach the container to the existing `infra` project (so it shows up next
# to infra-transcribe-1, infra-ai-office-1 etc.), launch with:
#
#   docker compose -p infra -f apps/ai-content-factory/docker-compose.yml up -d
#
# That gives the container the canonical name `infra-ai-content-factory-1`.

services:
  ai-content-factory:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-content-factory:latest
    container_name: ai-content-factory
    restart: unless-stopped
    # Cabinet HTTP server. Caddy reverse-proxies a public host onto this port.
    ports:
      - "127.0.0.1:3018:3018"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Moscow}
      # env_file: in compose v2 wasn't propagating values into the container
      # on this host — explicit substitution from the same .env via compose
      # variable resolution works reliably.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MODEL_OPUS: ${MODEL_OPUS:-}
      MODEL_HAIKU: ${MODEL_HAIKU:-}
      # Image engines (alternative carousel renderers)
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
      OPENAI_IMAGE_SIZE: ${OPENAI_IMAGE_SIZE:-}
      # kie.ai (shared async-task API for nano-banana 2 + gpt-image-2)
      KIE_AI_API_KEY: ${KIE_AI_API_KEY:-}
      NANO_BANANA_API_KEY: ${NANO_BANANA_API_KEY:-}
      NANO_BANANA_ENDPOINT: ${NANO_BANANA_ENDPOINT:-}
      NANO_BANANA_MODEL: ${NANO_BANANA_MODEL:-}
      NANO_BANANA_ASPECT: ${NANO_BANANA_ASPECT:-}
      NANO_BANANA_RESOLUTION: ${NANO_BANANA_RESOLUTION:-}
      GPT_IMAGE_2_API_KEY: ${GPT_IMAGE_2_API_KEY:-}
      GPT_IMAGE_2_ENDPOINT: ${GPT_IMAGE_2_ENDPOINT:-}
      GPT_IMAGE_2_MODEL: ${GPT_IMAGE_2_MODEL:-}
      GPT_IMAGE_2_SIZE: ${GPT_IMAGE_2_SIZE:-}
      # Cabinet (HTTP API + UI)
      CABINET_PORT: 3018
      CABINET_USERNAME: ${CABINET_USERNAME:-admin}
      CABINET_PASSWORD: ${CABINET_PASSWORD:-}
    volumes:
      # Persisted artefacts — survive container rebuilds.
      # factory.db itself lives inside data/knowledge/ (see src/db/index.ts).
      - ./data/output:/app/data/output
      - ./data/logs:/app/data/logs
      - ./data/knowledge:/app/data/knowledge
      # Footage library is uploaded through the cabinet UI and must persist.
      - ./data/assets:/app/data/assets
      # Brandbook (HTML template + design description) — edited inline in cabinet
      - ./data/brandbook:/app/data/brandbook
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3018/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
