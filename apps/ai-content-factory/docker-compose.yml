# Standalone compose for ai-content-factory.
#
# To attach the container to the existing `infra` project (so it shows up next
# to infra-transcribe-1, infra-ai-office-1 etc.), launch with:
#
#   docker compose -p infra -f apps/ai-content-factory/docker-compose.yml up -d
#
# That gives the container the canonical name `infra-ai-content-factory-1`.

services:
  ai-content-factory:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-content-factory:latest
    container_name: ai-content-factory
    # Phase 5 (scheduler) not written yet — entry exits after heartbeat.
    # Keep alive so `docker exec` can run the CLI; switch to `unless-stopped`
    # once src/scheduler.ts lands.
    restart: "no"
    command: ["sh", "-c", "node dist/index.js; tail -f /dev/null"]
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Moscow}
      # env_file: in compose v2 wasn't propagating values into the container
      # on this host — explicit substitution from the same .env via compose
      # variable resolution works reliably.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MODEL_OPUS: ${MODEL_OPUS:-}
      MODEL_HAIKU: ${MODEL_HAIKU:-}
    volumes:
      # Persisted artefacts — survive container rebuilds.
      # factory.db itself lives inside data/knowledge/ (see src/db/index.ts).
      - ./data/output:/app/data/output
      - ./data/logs:/app/data/logs
      - ./data/knowledge:/app/data/knowledge
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 5s
      retries: 3
