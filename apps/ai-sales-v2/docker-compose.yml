name: aisales-v2

services:
  api:
    image: aisales-api:v0.2
    container_name: aisales-api-v2
    restart: unless-stopped
    user: aisales
    working_dir: /app
    command:
      - python
      - -m
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    env_file:
      - ./env/v2.env
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - /home/aisales/monorepo/apps/ai-sales/code:/app:ro
      - /home/aisales/aisales-app-v2/agent-prompts:/agent-prompts:ro
      - /home/aisales/aisales-app-v2/voice-input:/voice-input
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - default

networks:
  default:
    name: aisales_aisales-net
    external: true
