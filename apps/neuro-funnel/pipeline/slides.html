<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Нейроворонка — слайды урока</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Slide = right part of the 1920x1080 frame: 1248x1080 (65%). Left 672 px is the avatar, composited by build_lesson.py. */
:root{
  --bg:#0b0b0b; --card:#1a1c1a; --line:#2c302c;
  --fg:#f3f4f1; --muted:#a6aaa3; --dim:#767b74;
  --green:#3fa35e; --green-hi:#90ffb4; --green-lo:#173d29;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",Arial,sans-serif;
  --mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0}
body{background:#000;font-family:var(--body);color:var(--fg);-webkit-font-smoothing:antialiased}
.slide{position:relative;width:1248px;height:1080px;overflow:hidden;background:
  radial-gradient(900px 700px at 1100px 1000px,rgba(63,163,94,.16),transparent 70%),
  radial-gradient(900px 700px at -200px -200px,rgba(63,163,94,.10),transparent 70%),var(--bg);
  padding:96px 80px 0;display:flex;flex-direction:column;gap:30px}
.kicker{font-family:var(--mono);font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
h1{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:1.06;font-size:78px;max-width:1090px;letter-spacing:-.005em}
.sub{font-size:32px;color:var(--muted);max-width:1060px;line-height:1.35;font-weight:500}
.foot{position:absolute;left:80px;bottom:56px;display:flex;gap:24px;font-family:var(--mono);font-size:19px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.foot b{color:var(--green);font-weight:500}

/* title */
.l-title{justify-content:center;padding-top:0;padding-bottom:120px}
.l-title h1{font-size:120px;max-width:1090px}
.l-title h1 em{font-style:normal;color:var(--green-hi)}
/* big */
.big{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:190px;line-height:1;color:var(--green-hi);letter-spacing:-.01em;max-width:1090px}
.l-big h1{font-size:66px}
/* flow */
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 40px;margin-top:14px}
.st{position:relative;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:26px 26px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.st .n{font-family:var(--mono);font-size:22px;color:var(--dim)}
.st b{font-family:var(--display);font-size:40px;text-transform:uppercase;font-weight:700;line-height:1}
.st span{font-size:24px;color:var(--muted);line-height:1.3}
.st:not(:nth-child(3n))::after{content:"";position:absolute;right:-30px;top:50%;width:18px;height:18px;border-top:5px solid var(--green);border-right:5px solid var(--green);transform:translateY(-50%) rotate(45deg)}
.st.last{background:var(--green);border-color:var(--green)}
.st.last b,.st.last span,.st.last .n{color:#0b0b0b}
/* compare */
.cmp{display:grid;grid-template-columns:1fr 1.08fr;gap:28px;margin-top:6px}
.col{border-radius:28px;padding:32px 32px;display:flex;flex-direction:column;gap:20px}
.col h3{font-family:var(--display);font-size:40px;text-transform:uppercase;font-weight:700}
.col li{list-style:none;font-size:28px;line-height:1.25;display:flex;gap:16px;align-items:baseline}
.col ul{padding:0;display:flex;flex-direction:column;gap:18px}
.col.old{background:var(--card);color:var(--muted)}
.col.old li::before{content:"";flex:0 0 14px;height:14px;border-radius:50%;background:var(--dim)}
.col.new{background:var(--green-lo);border:2px solid var(--green)}
.col.new h3{color:var(--green-hi)}
.col.new li::before{content:"";flex:0 0 14px;height:14px;border-radius:50%;background:var(--green-hi)}
/* points */
.pts{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 28px;margin-top:8px}
.pt{background:var(--card);border-radius:26px;padding:30px 30px;display:grid;grid-template-columns:56px 1fr;gap:4px 18px;align-items:baseline}
.pt i{font-style:normal;font-family:var(--display);font-size:52px;color:var(--green-hi);grid-row:span 2;line-height:1}
.pt b{font-family:var(--display);font-size:40px;text-transform:uppercase;line-height:1.05}
.pt span{font-size:26px;color:var(--muted);line-height:1.3}
/* formula */
.fx{display:flex;flex-wrap:wrap;align-items:center;gap:14px;max-width:1090px;margin-top:20px}
.fx .term{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 24px;font-family:var(--display);font-size:46px;text-transform:uppercase;font-weight:700}
.fx .term.goal{background:var(--green);border-color:var(--green);color:#0b0b0b}
.fx .op{font-family:var(--display);font-size:54px;color:var(--green-hi)}
.ex{max-width:1090px;font-size:30px;line-height:1.4;color:var(--fg);background:rgba(255,255,255,.04);border:2px dashed var(--line);border-radius:24px;padding:28px 34px}
/* proof */
.stats{display:flex;flex-direction:column;gap:22px;margin-top:6px}
.sx{display:grid;grid-template-columns:440px 1fr;gap:26px;align-items:baseline;max-width:1090px;border-bottom:2px solid var(--line);padding-bottom:20px}
.sx b{font-family:var(--display);font-size:104px;line-height:.95;color:var(--green-hi);font-weight:700}
.sx span{font-size:30px;color:var(--fg);line-height:1.3}
.note{font-size:20px;color:var(--dim);max-width:900px}
/* tool */
.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 24px}
.fd{display:flex;align-items:center;gap:22px;background:var(--card);border-radius:22px;padding:24px 26px;font-size:30px;font-weight:700}
.fd i{flex:0 0 36px;height:36px;border-radius:10px;border:3px solid var(--green)}
/* task */
.tsk{display:flex;flex-direction:column;gap:18px;max-width:1090px}
.tk{display:flex;gap:24px;align-items:center;font-size:36px;font-weight:700}
.tk i{font-style:normal;flex:0 0 76px;height:76px;border-radius:50%;background:var(--green);color:#0b0b0b;font-family:var(--display);font-size:42px;display:grid;place-items:center}
.time{align-self:flex-start;font-family:var(--mono);font-size:26px;color:var(--green-hi);border:2px solid var(--green);border-radius:999px;padding:10px 26px}
/* full-frame cutaway (montage skill: перебивка на весь кадр, avatar voice continues) */
.slide.full{width:1920px;padding:96px 120px 0}
.slide.full h1{max-width:1600px}
/* screenshots */
.frame{flex:1;min-height:0;margin-bottom:120px;border-radius:26px;overflow:hidden;border:3px solid var(--line);background:#111;box-shadow:0 30px 80px rgba(0,0,0,.55);display:flex}
.frame img{width:100%;height:100%;object-fit:cover;object-position:top}
.need{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:40px;border:4px dashed #ffb35c;border-radius:24px;background:repeating-linear-gradient(135deg,rgba(255,179,92,.06) 0 22px,transparent 22px 44px);color:#ffd9a8;font-size:32px;line-height:1.3;font-weight:600}
.need b{font-family:var(--mono);font-size:24px;letter-spacing:.14em;color:#ffb35c}
.need.inline{flex:none;margin-top:24px;padding:22px 28px;font-size:24px}
.trip{flex:1;min-height:0;margin-bottom:120px;display:grid;gap:28px}
.trip.n1{grid-template-columns:1fr}.trip.n2{grid-template-columns:1fr 1fr}.trip.n3{grid-template-columns:1fr 1fr 1fr}
.trip figure{margin:0;min-height:0;display:flex;flex-direction:column;gap:14px}
.trip figure img,.trip figure .need{flex:1;min-height:0;width:100%;object-fit:cover;object-position:top;border-radius:24px;border:3px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.trip figure.fit img{object-fit:contain;background:#fff}
.trip figcaption{font-family:var(--display);font-size:36px;text-transform:uppercase;font-weight:600;color:var(--green-hi);line-height:1.1}
.slide.full .trip figure.fit img{object-fit:contain;background:#fff}
.trip figcaption{font-size:42px}
/* hook */
.l-hook{padding:0;justify-content:flex-end}
.hookbg{position:absolute;inset:0;display:flex}
.hookbg img{width:100%;height:100%;object-fit:cover;filter:brightness(.38) saturate(1.1);transform:scale(1.12)}
.hookfg{position:relative;padding:0 120px 250px;display:flex;flex-direction:column;gap:18px}
.l-hook .big{font-size:300px}
.l-hook h1{font-size:84px;max-width:1500px}
/* team */
.team{position:relative;flex:1;margin-bottom:110px}
.team .me{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:220px;height:220px;border-radius:50%;background:var(--green);color:#0b0b0b;display:grid;place-items:center;font-family:var(--display);font-size:64px;font-weight:700;text-transform:uppercase;box-shadow:0 0 0 18px rgba(63,163,94,.18)}
.team .role{position:absolute;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:16px 30px;font-size:30px;font-weight:700;white-space:nowrap}
.r0{left:4%;top:6%}.r1{left:40%;top:0}.r2{right:2%;top:10%}.r3{left:0;bottom:12%}.r4{left:34%;bottom:0}.r5{right:4%;bottom:14%}
/* steps + screenshot */
.ss{flex:1;min-height:0;margin-bottom:120px;display:grid;grid-template-columns:400px 1fr;gap:30px}
.ss ol{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:16px}
.ss li{counter-increment:s;background:var(--card);border-radius:20px;padding:22px 24px;font-size:28px;font-weight:700;line-height:1.2;display:flex;gap:16px;align-items:center}
.ss li::before{content:counter(s);flex:0 0 52px;height:52px;border-radius:50%;background:var(--green);color:#0b0b0b;display:grid;place-items:center;font-family:var(--display);font-size:30px}
.ss .frame{margin:0}
/* author */
.au{flex:1;display:grid;grid-template-columns:420px 1fr;gap:44px;margin-bottom:110px;min-height:0}
.aup{display:flex;border-radius:26px;overflow:hidden;background:radial-gradient(90% 70% at 55% 35%,#2a6d43,#11261a 55%,#0c0c0c)}
.aup img{width:100%;height:100%;object-fit:contain;object-position:bottom}
.aut{display:flex;flex-direction:column;gap:22px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.facts div{background:var(--card);border-radius:20px;padding:20px 22px;font-size:24px;color:var(--muted);line-height:1.3}
.facts b{display:block;font-family:var(--display);font-size:46px;color:var(--fg);line-height:1;margin-bottom:8px}
/* price */
.pr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding-bottom:100px}
.pr h1{font-size:120px;color:var(--green-hi)}
.pv{font-family:var(--display);font-size:200px;font-weight:700;line-height:1}
.pr ul{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 40px;font-size:32px;font-weight:600;text-align:left}
.pr li::before{content:"";display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--green-hi);margin-right:14px}
/* cta */
.l-cta{justify-content:center;align-items:center;text-align:center}
.ctaw{display:flex;flex-direction:column;align-items:center;gap:26px}
.l-cta h1{font-size:150px;max-width:1600px}
.l-cta .sub{font-size:48px}
.arrow{width:90px;height:90px;border-right:12px solid var(--green-hi);border-bottom:12px solid var(--green-hi);transform:rotate(45deg);margin-top:30px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = {
  title: s => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><p class="sub">${esc(s.sub)}</p>`,
  big: s => `<div class="kicker">${esc(s.kicker)}</div><div class="big">${esc(s.big)}</div><h1>${esc(s.title)}</h1><p class="sub">${esc(s.sub)}</p>`,
  flow: s => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="flow">${s.steps.map((x,i)=>`<div class="st${i===s.steps.length-1?' last':''}"><span class="n">0${i+1}</span><b>${esc(x.t)}</b><span>${esc(x.d)}</span></div>`).join('')}</div>`,
  compare: s => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="cmp"><div class="col old"><h3>${esc(s.left.h)}</h3><ul>${s.left.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="col new"><h3>${esc(s.right.h)}</h3><ul>${s.right.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`,
  points: s => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="pts">${s.points.map((x,i)=>`<div class="pt"><i>${i+1}</i><b>${esc(x.t)}</b><span>${esc(x.d)}</span></div>`).join('')}</div>`,
  formula: s => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="fx">${s.formula.map(x=>['÷','=','×'].includes(x)?`<span class="op">${x}</span>`:`<span class="term${x===s.formula[s.formula.length-1]?' goal':''}">${esc(x)}</span>`).join('')}</div><p class="ex">${esc(s.example)}</p>`,
  proof: s => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="stats">${s.stats.map(x=>`<div class="sx"><b>${esc(x.b)}</b><span>${esc(x.d)}</span></div>`).join('')}</div><p class="note">${esc(s.note)}</p>`,
  tool: s => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="fields">${s.fields.map(x=>`<div class="fd"><i></i>${esc(x)}</div>`).join('')}</div>`,
  task: s => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="tsk">${s.steps.map((x,i)=>`<div class="tk"><i>${i+1}</i>${esc(x)}</div>`).join('')}</div><span class="time">${esc(s.time)}</span>`,
  // --- VSL / screenshot layouts ---
  hook: s => `<div class="hookbg">${pic(s.img, s.need)}</div><div class="hookfg"><div class="big">${esc(s.big)}</div><h1>${esc(s.title)}</h1></div>`,
  shot: s => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><p class="sub">${esc(s.sub)}</p><div class="frame">${pic(s.img, s.need)}</div>`,
  shots: s => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="trip n${(s.imgs||[]).length}">${(s.imgs||[]).map(x=>`<figure${x.fit?' class="fit"':''}>${pic(x.src, x.need)}<figcaption>${esc(x.cap)}</figcaption></figure>`).join('')}</div>${s.note?`<p class="note">${esc(s.note)}</p>`:''}`,
  team: s => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="team"><div class="me">Ты</div>${s.roles.map((r,i)=>`<span class="role r${i}">${esc(r)}</span>`).join('')}</div>`,
  'steps-shot': s => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="ss"><ol>${s.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="frame">${pic(s.img, s.need)}</div></div>`,
  chain: s => L.flow(s),
  author: s => `<div class="au"><div class="aup">${pic(s.img, s.need)}</div><div class="aut"><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><p class="sub">${esc(s.sub)}</p><div class="facts">${s.facts.map(x=>`<div><b>${esc(x.b)}</b><span>${esc(x.d)}</span></div>`).join('')}</div></div></div>`,
  tools: s => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="fields">${s.items.map(x=>`<div class="fd"><i></i>${esc(x)}</div>`).join('')}</div>`,
  price: s => `<div class="pr"><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="pv">${esc(s.price)}</div><ul>${s.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${s.need?`<div class="need inline"><b>НУЖЕН МАТЕРИАЛ</b>${esc(s.need)}</div>`:''}</div>`,
  cta: s => `<div class="ctaw"><h1>${esc(s.title)}</h1><p class="sub">${esc(s.sub)}</p><div class="arrow"></div></div>`,
};
const pic = (src, need) => src
  ? `<img src="${esc(src)}" alt="">`
  : `<div class="need"><b>НУЖЕН МАТЕРИАЛ</b>${esc(need || 'скриншот')}</div>`;
window.renderLesson = (lesson) => {
  const total = lesson.slides.length;
  document.getElementById('root').innerHTML = lesson.slides.map((s, i) =>
    `<section class="slide l-${s.layout}${s.full?' full':''}" data-i="${i+1}">${(L[s.layout]||L.title)(s)}
      ${s.layout==='hook'||s.layout==='cta'?'':`<div class="foot"><b>Нейроворонка</b><span>${lesson.n?`Урок ${lesson.n} · `:''}${esc(lesson.title)}</span><span>${i+1} / ${total}</span></div>`}</section>`).join('');
  return Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })))
    .then(() => document.fonts.ready).then(() => total);
};
</script>
</body>
</html>
