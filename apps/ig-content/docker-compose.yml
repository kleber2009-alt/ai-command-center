# ig-content · standalone deployment (Hetzner + Caddy)
#
# Run from this directory:
#   cp .env.production.example .env   # then fill in real values
#   docker compose up -d --build
#
# Logs:  docker compose logs -f ig-content
# Stop:  docker compose down
#
# Compose auto-loads `.env` in this directory for ${VAR} substitution (used by
# the build args below) AND injects it into the container via env_file. The app
# listens on container port 3010; Caddy on the host reverse-proxies to it.
#
# Host port is overridable via IG_CONTENT_HOST_PORT (default 3010). On the
# Hetzner box ai-hub-web already claims 3010, so prod runs on host port 3017
# (set IG_CONTENT_HOST_PORT=3017 in .env). Caddy snippet must match.

services:
  ig-content:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    image: ig-content:latest
    container_name: ig-content
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${IG_CONTENT_HOST_PORT:-3010}:3010"
