# Local dev stack — изолированный от прода и transcribe.
# Запуск: docker compose -f docker-compose.dev.yml up -d
# Останов: docker compose -f docker-compose.dev.yml down
services:
  postgres:
    image: postgres:16-alpine
    container_name: persona-studio-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: persona
      POSTGRES_PASSWORD: persona
      POSTGRES_DB: persona_studio
    ports:
      - "5440:5432"
    volumes:
      - persona_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persona -d persona_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: persona-studio-redis-dev
    restart: unless-stopped
    ports:
      - "6390:6379"
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - persona_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: persona-studio-minio-dev
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9091"]
    ports:
      - "9090:9000"     # S3 API
      - "9091:9091"     # web console
    volumes:
      - persona_minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: persona-studio-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/persona-studio-media &&
      mc anonymous set download local/persona-studio-media &&
      echo '[minio-init] bucket ready'
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: persona-studio-mailpit-dev
    restart: unless-stopped
    ports:
      - "1075:1025"     # SMTP
      - "8075:8025"     # web UI

volumes:
  persona_pg_data:
  persona_redis_data:
  persona_minio_data:
