<title>Тарелка AICEX</title>
<meta name="description" content="Офис агентов AICEX в стиле летающей тарелки: каждый отдел — отдельный отсек, вместо агентов работают инопланетяне.">

<!-- «Тарелка» — четвёртый стиль живого офиса hq2.aicex.club (/ufo/): летающая тарелка снаружи и девять отсеков внутри,
     каждый — отдельная сцена во весь экран (меню слева, стрелки ← →). Вместо агентов — инопланетяне: экипаж собирается
     из того же реестра agents.js (комната — поле night, руководители — office.config.js), без сборки и своих данных.
     Журнал отсеков — только реальные задачи (tasks.js, tasks.auto.js, принятые в офисе); живые задачи — рабочий стол
     (/api/assistant/desk/tasks у владельца, live.json у гостя). Передачи работ между инопланетянами и телепорт между
     отсеками — визуализация, а не данные. Поставить задачу из строки внизу может владелец (тот же вход, что в офисе). -->
<style>
:root{--g:rgba(10,18,30,.6);--g2:rgba(255,255,255,.05);--ln:rgba(140,255,210,.14);--ln2:rgba(140,255,210,.3);--tx:#eef6f4;--mu:#9fb3bc;
  --ac:#7cffb2;--ac2:#b58cff;--ok:#7cffb2;--warn:#ffc65c;--bad:#ff7a8a;--bl:#7fe3ff;--bg:#03050b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--bl)}
#bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#0d1830,#03050b)}
#bg canvas{display:block}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.6) 100%)}
#fade{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .24s;z-index:2}
#loader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);font:600 15px Unbounded,Manrope,sans-serif;letter-spacing:.4px;transition:opacity .5s}
#loader.done{opacity:0;pointer-events:none}
#loader i{width:64px;height:22px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#dff,#7aa 45%,#344 70%);box-shadow:0 0 30px var(--ac);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.glass{background:var(--g);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--ln);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07)}
button{font-family:inherit}
#menu{position:fixed;left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;z-index:4;max-height:calc(100% - 210px);overflow:auto;scrollbar-width:none}
#menu::-webkit-scrollbar{display:none}
#menu button{position:relative;display:flex;align-items:center;gap:11px;width:206px;padding:9px 12px;border-radius:15px;color:var(--tx);font:600 14px Manrope,sans-serif;cursor:pointer;text-align:left;transition:transform .15s,background .2s;flex:none}
#menu button:hover{transform:translateX(3px);border-color:var(--ln2)}
#menu button .ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);flex:none}
#menu button svg{width:18px;height:18px;stroke:#dbfff0;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#menu button small{display:block;font-weight:500;font-size:11.5px;color:var(--mu)}
#menu button.on{background:linear-gradient(135deg,rgba(124,255,178,.95),rgba(80,220,200,.9));color:#03140c;border-color:transparent}
#menu button.on small{color:#0b3a26}#menu button.on .ic{background:rgba(0,0,0,.12)}#menu button.on svg{stroke:#03140c}
#menu button i{position:absolute;right:12px;top:50%;margin-top:-4px;width:8px;height:8px;border-radius:50%}
#menu button i.w{background:var(--warn);box-shadow:0 0 10px var(--warn);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}
#hud{position:fixed;left:16px;top:14px;display:flex;gap:8px;z-index:4;align-items:center}
.brand{font:600 14px Unbounded,Manrope,sans-serif;padding:10px 14px;border-radius:14px;letter-spacing:.5px}
.brand span{color:var(--ac)}
.hb{padding:9px 13px;border-radius:14px;color:var(--tx);font:600 13px Manrope,sans-serif;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap;text-decoration:none}
.hb small{font-weight:500;color:var(--mu)}.hb:hover{border-color:var(--ln2)}

#right{position:fixed;right:16px;top:14px;display:flex;gap:8px;z-index:5;align-items:center}
#toasts{position:fixed;right:16px;top:66px;display:flex;flex-direction:column;gap:8px;z-index:6;width:340px}
.toast{border-radius:16px;padding:12px 14px;cursor:pointer;animation:tin .35s ease-out;display:flex;gap:11px;align-items:flex-start}

.toast b{font-size:13.5px;display:block}.toast span{font-size:12px;color:var(--mu)}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
#room{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:3;text-align:center;pointer-events:none;max-width:44vw}
#room h1{margin:0;font:600 18px Unbounded,Manrope,sans-serif;text-shadow:0 2px 16px rgba(0,0,0,.9)}
#room div{font-size:12.5px;color:#d6efe8;text-shadow:0 1px 10px #000;margin-top:4px}
#nav{position:fixed;top:50%;right:16px;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:4}
#nav button{width:44px;height:44px;border-radius:14px;color:var(--tx);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}

#proc{border-radius:16px;padding:9px 12px;display:flex;align-items:center;gap:12px;min-height:46px;font-size:13px}

.job .sp{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:currentColor;animation:spin .8s linear infinite;flex:none}
.job em{font-style:normal;color:var(--mu)}
.job:after{content:"";position:absolute;left:0;bottom:0;height:2px;width:40%;background:currentColor;opacity:.8;animation:sl 1.6s ease-in-out infinite}
.job span{overflow:hidden;text-overflow:ellipsis}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes sl{0%{left:-40%}100%{left:100%}}
.sbtn{background:rgba(255,255,255,.07);border:0;color:var(--tx);border-radius:10px;padding:7px 10px;font:600 12px Manrope,sans-serif;cursor:pointer;white-space:nowrap}
.sbtn:hover{background:rgba(255,255,255,.12)}
#log{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);width:min(900px,calc(100% - 28px));max-height:46vh;overflow:auto;border-radius:18px;padding:10px 14px;z-index:6;display:none}
#log.on{display:block}
#log .note{font-size:12px;color:var(--mu);padding:4px 0 8px}
.ev{display:flex;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.07);font-size:13px}

#bar{border-radius:18px;padding:8px}

#bar .w{flex:1;display:flex;flex-direction:column;min-width:0}
#ctx{font:700 11px Manrope,sans-serif;color:var(--ac);letter-spacing:.5px;padding:2px 6px 5px;text-transform:uppercase;display:flex;gap:8px;align-items:center;min-width:0}
#ctx em{font-style:normal;color:var(--mu);text-transform:none;letter-spacing:0;font-weight:500;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mctx{display:none;text-transform:none;letter-spacing:0;background:rgba(255,255,255,.1);color:var(--tx);border-radius:99px;padding:2px 4px 2px 9px;font-weight:600;cursor:pointer;border:0;font-size:11px}
#mctx b{margin-left:4px;opacity:.7}

.btn{border:0;border-radius:12px;padding:11px 16px;font:700 13.5px Manrope,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.acc{background:linear-gradient(135deg,#7cffb2,#4fd8c8);color:#03140c}.btn.no{background:rgba(255,255,255,.1);color:var(--tx)}

#modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(2,4,9,.45)}
#modal.on{display:flex}
#modal.side{justify-content:flex-end;padding-right:16px;background:transparent;pointer-events:none}
#modal.side #win{pointer-events:auto;width:min(440px,calc(100% - 28px));max-height:calc(100% - 120px)}
.cpt{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.cpt a{display:block;text-decoration:none;color:var(--tx)}.cpt .item.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.cpt b{font-size:14px}.cpt small{display:block;color:var(--mu);font-size:12px;margin-top:3px;line-height:1.4}
.cpt i{display:inline-block;width:22px;height:22px;border-radius:7px;margin-right:8px;vertical-align:-6px}
#win{width:min(780px,calc(100% - 28px));max-height:calc(100% - 60px);border-radius:22px;display:flex;flex-direction:column;animation:win .28s ease-out;background:rgba(8,16,28,.88)}
@keyframes win{from{opacity:0;transform:translateY(16px) scale(.98)}}
#wh{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 10px}
#wh .d{width:10px;height:10px;border-radius:50%;margin-top:6px;box-shadow:0 0 10px currentColor;background:currentColor;flex:none}
#wh h2{margin:0;font:700 17px Manrope,sans-serif}#wh small{color:var(--mu);font-size:12.5px}
#wh .x{margin-left:auto;background:rgba(255,255,255,.08);border:0;color:var(--tx);width:34px;height:34px;border-radius:11px;font-size:18px;cursor:pointer;flex:none}
#wb{padding:2px 20px 18px;overflow:auto;font-size:14px;line-height:1.55}
.sec{font:700 11px Manrope,sans-serif;letter-spacing:.8px;color:var(--bl);text-transform:uppercase;margin:16px 0 7px}
.item{background:var(--g2);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:11px 13px;margin-bottom:8px}
.item p{margin:4px 0 0;font-size:13px;color:#d3e3e0}.item.click{cursor:pointer}.item.click:hover{border-color:var(--ac)}
.item .meta{font-size:12px;color:var(--mu);display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-right:4px;background:rgba(124,255,178,.13);color:#aef7cf}
.chip.w{background:rgba(255,198,92,.16);color:#ffdc9a}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.crew .item{display:flex;gap:10px;align-items:flex-start;margin:0}
.crew .item i{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.crew .item b{font-size:13.5px}.crew .item span{display:block;font-size:12px;color:var(--mu)}
.empty{color:var(--mu);font-size:13.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lbl{font:700 11px Manrope,sans-serif;color:#fff;background:rgba(6,14,24,.66);padding:3px 8px;border-radius:8px;white-space:nowrap;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.08);cursor:pointer}
.lbl.busy{box-shadow:0 0 0 1.5px var(--warn)}
.lbl.cap{border-color:rgba(255,214,110,.6)}
.say{font:600 12.5px Manrope,sans-serif;color:#05110c;background:rgba(220,255,238,.96);padding:7px 11px;border-radius:13px;max-width:240px;box-shadow:0 8px 22px rgba(0,0,0,.35);opacity:0;transition:opacity .3s;pointer-events:none}
.deck{font:700 12px Manrope,sans-serif;color:var(--tx);background:rgba(6,14,24,.7);border:1px solid var(--ln2);padding:6px 10px;border-radius:11px;white-space:nowrap;cursor:pointer;display:flex;gap:7px;align-items:center}
.deck:hover{border-color:var(--ac);color:var(--ac)}
.deck i{width:7px;height:7px;border-radius:50%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:1000px){
  #menu{top:auto;bottom:168px;transform:none;flex-direction:row;left:8px;right:8px;max-height:none;overflow-x:auto}
  #menu button{width:auto;padding:7px 9px}#menu button .t{display:none}#menu button i{right:4px;top:6px;margin:0}
  #modal.side{justify-content:center;align-items:flex-end;padding:0 0 14px}#modal.side #win{width:calc(100% - 20px);max-height:48%}
  #toasts{width:calc(100% - 32px);top:110px}#room{top:64px;max-width:calc(100% - 32px)}#room h1{font-size:15px}
  #right{top:14px}#right .hb small{display:none}#nav{display:none}#ctx em{display:none}
  .brand{display:none}
}
</style>

async function liveLoad() {
  let j = null, owner = false;
  try {
    const r = await fetch(DESK + '/tasks', { cache:'no-store' });
    if (r.ok) { j = await r.json(); owner = true; }
    else { const p = await fetch(DESK + '/live.json', { cache:'no-store' }); if (p.ok) j = await p.json(); }
  } catch (e) {}
  const prev = new Map(LIVE.list.map(t => [t.id, t.status]));
  LIVE.ok = Boolean(j); LIVE.owner = owner; OWNER = owner;
  LIVE.list = Array.isArray(j?.tasks) ? j.tasks : [];
  for (const t of LIVE.list) {
    const was = prev.get(t.id), a = CREW_BY[liveAgent(t)];
    if (prev.size && was !== t.status && OPEN.includes(t.status)) toast(`${a?.name || 'Диспетчер'} · ${t.statusText || t.status}`, short(liveTitle(t), 80), a?.color || 'var(--warn)', () => a && openAgent(a.id));
  }
  procBar(); setCtx();
  scene3d?.live(LIVE.list.filter(t => OPEN.includes(t.status)));
}
setInterval(liveLoad, 20e3);

function space(seed = 0) {
  const T = cv(4096, 1024), g = T.g;

    const x = RND() * 4096, y = RND() * 700, r = 200 + RND() * 520, c = ['120,80,255', '40,200,220', '255,90,200', '60,120,255'][i % 4];
    const ng = g.createRadialGradient(x, y, 0, x, y, r); ng.addColorStop(0, `rgba(${c},.22)`); ng.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = ng; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 2600; i++) { const s = RND(); g.fillStyle = `rgba(${200 + RND() * 55 | 0},${210 + RND() * 45 | 0},255,${.3 + s * .7})`; const z = s > .985 ? 3 : s > .9 ? 2 : 1; g.fillRect(RND() * 4096, RND() * 1024, z, z); }

  const px = 1400 + seed * 900;
  const pg = g.createRadialGradient(px, 2600, 1700, px, 2600, 1900);
  pg.addColorStop(0, '#0d3a66'); pg.addColorStop(.86, '#1d6fb0'); pg.addColorStop(.95, 'rgba(120,220,255,.9)'); pg.addColorStop(1, 'rgba(120,220,255,0)');
  g.fillStyle = pg; g.beginPath(); g.arc(px, 2600, 1900, 0, PI * 2); g.fill();
  g.globalAlpha = .35; for (let i = 0; i < 40; i++) { g.fillStyle = RND() < .5 ? '#2f8f5a' : '#e8f4ff'; g.beginPath(); g.ellipse(px - 900 + RND() * 1800, 830 + RND() * 220, 40 + RND() * 140, 8 + RND() * 22, 0, 0, PI * 2); g.fill(); }
  g.globalAlpha = 1;
  T.t.wrapS = THREE.RepeatWrapping; T.t.needsUpdate = true; return T.t;
}
function floorTex(accent) {

/* ---------- анимация ---------- */
const tmpV = new THREE.Vector3();
function pose(P, t, dt) {
  const { legs, arms, sp, hg, pel } = P, w = P.mode === 'walk', sit = P.mode === 'sit', stand = P.mode === 'stand' || P.mode === 'give';
  const sw = w ? Math.sin(P.ph) : 0;
  pel.position.y = P.tents.length ? (sit ? .56 : .8 + Math.sin(t * 1.4 + P.ph) * .04) : sit ? .52 : .72 + (w ? Math.abs(Math.cos(P.ph)) * .025 : Math.sin(t * 1.6 + P.ph) * .006);

  arms.forEach((Aa, i) => {

    if (typing) { Aa.shd.rotation.x = -.85 + Math.sin(t * 9 * fast + i * 2 + P.ph) * .06; Aa.el.rotation.x = -.75; Aa.shd.rotation.z = s * -.08; }
    else if (P.mode === 'give' && i === 0) { Aa.shd.rotation.x = -1.25; Aa.el.rotation.x = -.2; Aa.shd.rotation.z = 0; }
    else if (w && P.item.visible) { Aa.shd.rotation.x = -.7; Aa.el.rotation.x = -.6; Aa.shd.rotation.z = s * .05; }
    else if (stand) { Aa.shd.rotation.x = Math.sin(t * .8 + P.ph + i) * .08; Aa.el.rotation.x = -.25; Aa.shd.rotation.z = s * .12; }

function walkTo(P, dt) {

}

/* ======================= ТАРЕЛКА СНАРУЖИ ======================= */
let SHIP = null;

  const prof = [[0, 1.0], [1.6, .98], [3.4, .78], [5.4, .38], [6.6, .06], [6.75, 0], [6.6, -.08], [5.4, -.42], [3.6, -.78], [2.2, -.98], [0, -1.05]].map(([x, y]) => new THREE.Vector2(x, y));
  const hull = new THREE.Mesh(new THREE.LatheGeometry(prof, 128), hullM); hull.castShadow = true; ufo.add(hull);

  const dome = new THREE.Mesh(new THREE.SphereGeometry(2.5, 64, 32, 0, PI * 2, 0, PI / 2), new THREE.MeshPhysicalMaterial({ color:'#9ff7ff', transparent:true, opacity:.28, roughness:.05, metalness:0, clearcoat:1, emissive:'#1aa7a0', emissiveIntensity:.25, side:THREE.DoubleSide, depthWrite:false }));

  for (let i = 0; i < 32; i++) { const a = i / 32 * PI * 2, l = new THREE.Mesh(new THREE.SphereGeometry(.09, 12, 10), new THREE.MeshBasicMaterial({ color:'#ffffff', toneMapped:false })); l.position.set(Math.cos(a) * 6.45, -.2, Math.sin(a) * 6.45); ufo.add(l); lights.push(l); }

/* ======================= СБОРКА ======================= */
buildShip();
ROOMS.filter(r => r.k !== 'ship').forEach((r, i) => { shell(r.k, i); centerpiece(r.k); });
for (const r of ROOMS) {
  if (r.k === 'ship') continue;

  crew.forEach((c, i) => station(r.k, alien(c), seats[i]));
  const isHub = r.k === 'hub';
  const [hx, hz] = polar(8.25, 0);
  R.holo = holoPanel(R.g, hx + (isHub ? -2.2 : 0), 3.35, hz + (isHub ? 1.1 : .25), isHub ? 3.9 : 4.2, isHub ? 1.75 : 1.7, 0, H => drawJournal(H, r.k), 'journal');

    for (const [ph, col, kind] of [[-62, '#5ee7ff', 'flow'], [-36, '#7cffb2', 'chart'], [-12, '#ffc65c', 'doc'], [86, '#b58cff', 'code']]) {
      const cn = new THREE.Group(), [x, z] = polar(5.6, ph * D); cn.position.set(x, 0, z); cn.rotation.y = -ph * D; R.g.add(cn);
      B(1.1, .07, .45, M('#18202c', { metalness:.8, roughness:.25 }), 0, .82, 0, cn, .03); C(.1, .16, .78, darkM, 0, .39, 0, cn, 16); B(1.1, .012, .02, glow(col), 0, .86, .21, cn);

for (const P of ALIENS) { P.lb.style.display = 'none'; P.sayE.style.display = 'none'; }

/* ---------- камера и переход между отсеками ---------- */
const look = new THREE.Vector3(), camPos = new THREE.Vector3();
const ptr = { x:0, y:0 }, wp = new THREE.Vector3(), tv = new THREE.Vector3();
let CLOSE = null;
addEventListener('pointermove', e => { ptr.x = e.clientX / innerWidth * 2 - 1; ptr.y = e.clientY / innerHeight * 2 - 1; });
function camFor(k, t) {
  const R = ROOMDATA[k];
  if (k === 'ship') { const a = t * .06 + .6, d = MOBILE ? 27 : 19; camPos.set(R.cx + Math.sin(a) * d, 6.5 + ptr.y * -1.2, Math.cos(a) * d); look.set(R.cx, 1.5, 0); return; }
  // телефон: камера ниже и ближе, сцена выше в кадре; палец по экрану поворачивает взгляд вдоль дуги экипажа
  if (MOBILE && !(CLOSE && CLOSE.room === k)) { camPos.set(R.cx + ptr.x * 3.2, 5.0 - ptr.y * .4, 12.2); look.set(R.cx + ptr.x * 2.2, .15, -1.6); return; }
  if (CLOSE && CLOSE.room === k) {
    // крупный план одного инопланетянина: камера перед лицом, сам он левее центра — справа досье
    CLOSE.root.getWorldPosition(wp); const ry = CLOSE.root.rotation.y, f = tv.set(Math.sin(ry), 0, Math.cos(ry)), s = CLOSE.root.scale.x;
    const hy = (CLOSE.mode === 'sit' ? 1.3 : 1.62) * s;

    look.copy(wp); look.y = hy - (MOBILE ? .32 : .08); if (!MOBILE) { look.x += f.z * .42; look.z -= f.x * .42; }

let curRoom = null;
function show(k) {

  for (const [gk, gg] of Object.entries(GROUPS)) gg.traverse(o => { if (o.isCSS2DObject) o.element.style.display = gk === k ? '' : 'none'; });
  GROUPS[k].visible = true; curRoom = k; if (CLOSE?.scr) CLOSE.scr.visible = true; CLOSE = null; scene.fog = k === 'ship' ? null : FOG;

}

/* ---------- клики ---------- */
const ray = new THREE.Raycaster(), mv = new THREE.Vector2();
function hit(e) {

  const hs = ray.intersectObject(GROUPS[curRoom], true);
  for (const h of hs) { if (h.object.userData.P) return { P:h.object.userData.P }; if (h.object.userData.open) return { open:h.object.userData.open }; if (h.object.material?.wireframe === false && h.distance < 30 && h.object.isMesh && h.object.material.side !== THREE.BackSide) { /* стена или мебель закрывает */ } }

}

/* ---------- живые задачи в 3D ---------- */

function beamTask(id) {

}
function closeup(id) {

const clock = new THREE.Clock();

  for (const P of ALIENS) update(P, t, dt);
  const R = ROOMDATA[curRoom];
  for (const f of R.anim) f(t);
  if (curRoom !== 'ship') for (const f of DECOR_ANIM) f(t, dt);
  for (const H of HOLOS) H.m.position.y = H.y0 + Math.sin(t * .8 + H.ph) * .03;
  for (const r of ROOMS) { const b = ROOMDATA[r.k]?.beam; if (b && b.userData.t > 0) { b.userData.t -= dt; b.material.opacity = Math.max(0, Math.sin(b.userData.t / 1.1 * PI)) * .55; } }
  const ss = SCRS(); if (ss.length) for (let i = 0; i < 2; i++) drawScr(ss[scrI++ % ss.length], t);
  camFor(curRoom, t); cam.position.lerp(camPos, Math.min(1, dt * 3)); cam.lookAt(look);

show(room); hud(); procBar();
requestAnimationFrame(loop);
$('#loader').classList.add('done');
