<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Двойник — 12 дизайнов</title>
<meta name="description" content="Десять вариантов дизайна окна диалога с цифровым двойником: HUD, терминал, RPG, квесты, нейрограф, колода карт, монтажный таймлайн и другие.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
<style>
  :root{
    --bg:#0c0d10; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09); --ink:#f3f1ee; --ink-2:rgba(243,241,238,.66); --ink-3:rgba(243,241,238,.42);
    --sun:#ff8a3d; --sun-2:#ffb35c;
    --f-ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --f-wide:'Unbounded','Manrope',sans-serif;
    --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  a{color:var(--sun-2)}
  header{display:flex;align-items:center;gap:14px;padding:14px var(--gr) 14px var(--gl);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .back{display:flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:13.5px;padding:7px 10px;border-radius:10px}
  .back:hover{background:rgba(255,255,255,.08);color:var(--ink)}
  .back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
  header h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
  header p{margin:0;color:var(--ink-3);font-size:13px}
  .wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;padding:16px var(--gr) 28px var(--gl);max-width:1440px;margin:0 auto}
  .list{display:flex;flex-direction:column;gap:4px}
  .list button{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid transparent}
  .list button:hover{background:var(--card)}
  .list button.on{background:var(--card);border-color:rgba(255,138,61,.5)}
  .list .n{font:700 12px var(--f-mono);color:var(--sun-2);padding-top:2px;flex:none;width:20px}
  .list b{display:block;font-size:14px}
  .list small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.35}
  .main{display:flex;flex-direction:column;gap:14px;min-width:0}
  .stage{position:relative;height:600px;border-radius:20px;overflow:hidden;border:1px solid var(--line);container-type:inline-size;background:#000}
  .stage > .v{position:absolute;inset:0;overflow:hidden}
  .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:12px;font-weight:700;font-size:13.5px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
  .btn:hover{background:rgba(255,255,255,.13)}
  .btn.sun{background:var(--sun);color:#1d0f05;border-color:transparent}
  .btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ctl .pos{margin-left:auto;font:600 12.5px var(--f-mono);color:var(--ink-3)}
  .talk{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .talk-go{position:relative;display:flex;align-items:center;gap:9px;height:48px;padding:0 18px 0 14px;border-radius:99px;background:#f4f1ec;color:#0a0a0a;font-weight:800;font-size:14.5px}
  .talk-go svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .talk-go .ring{position:absolute;inset:-4px;border-radius:99px;border:2px solid #e8d5b8;opacity:0}
  .talk-go.on{background:#e8d5b8;box-shadow:0 0 0 calc(var(--lv,0) * 12px) rgba(232,213,184,.35);transition:box-shadow .08s}
  .talk-go.on .ring{opacity:1;animation:ring 1.6s ease-out infinite}
  .talk-go.hear .ring{animation-duration:.6s}
  @keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.25);opacity:0}}
  .talk-in{flex:1;min-width:200px;display:flex;gap:6px}
  .talk-in input{flex:1;min-width:0;height:48px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;outline:none}
  .talk-in input:focus{border-color:rgba(232,213,184,.6)}
  .talk-in .btn{border-radius:99px;width:48px;justify-content:center}
  .pip{width:64px;height:48px;border-radius:12px;overflow:hidden;border:1px solid rgba(232,213,184,.5);flex:none;position:relative}
  .pip video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .pip.look::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(232,213,184,.5) 50%,transparent 52%);background-size:100% 220%;animation:scanp 1s linear infinite}
  @keyframes scanp{from{background-position:0 120%}to{background-position:0 -120%}}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn.on{border-color:rgba(232,213,184,.6);color:#e8d5b8}
  .sw{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);cursor:pointer}
  .sw input{accent-color:#e8d5b8;width:16px;height:16px}
  .live-hint{min-height:20px;font-size:13px;color:var(--ink-3)}
  .live-hint b{color:var(--ink)}
  .mchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
  .mchip i{width:7px;height:7px;border-radius:50%;background:#ffb020}
  .mchip.live i{background:#3ddc97;box-shadow:0 0 8px #3ddc97}
  .login{display:flex;gap:6px} .login[hidden]{display:none}
  .nano-a,.nn-a,.halo-sub,.deck-bub,.rpg-t,.q-m,.gl-m,.hud-l span,.nc-m span,.tl-prev .sub,.term-log span{white-space:pre-line}
  .login input{width:170px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;outline:none}
  .v-nano[data-len=long] .nano-a{font-size:19px;max-height:104px}
  .nano-a{max-height:150px;overflow-y:auto;scrollbar-width:none}
  .v-halo[data-len=long] .halo-sub{font-size:18px}
  .halo-sub{max-height:40%;overflow-y:auto;scrollbar-width:none}
  .rpg-box .rpg-t{max-height:120px;overflow-y:auto;scrollbar-width:none}
  .deck-bub{max-height:120px;overflow-y:auto;scrollbar-width:none}
  .tl-prev .sub{max-height:60%;overflow-y:auto;scrollbar-width:none}
  .about{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .about div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .about b{display:block;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--sun-2);margin-bottom:6px}
  .about p{margin:0;font-size:13.5px;color:var(--ink-2)}
  .dots{letter-spacing:2px;color:var(--sun)} .dots i{font-style:normal;color:rgba(255,255,255,.18)}
  .title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .title h2{margin:0;font-size:24px;letter-spacing:-.02em}
  .title span{color:var(--ink-2)}
  @media (max-width: 960px){
    .wrap{grid-template-columns:1fr}
    .list{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:0 var(--gr) 4px var(--gl)}
    .list button{flex:0 0 200px}
    .about{grid-template-columns:1fr 1fr}
    .stage{height:640px}
  }
  @media (max-width: 560px){ .about{grid-template-columns:1fr} .title h2{font-size:20px} .talk-in{order:-1;flex-basis:100%} .login input{width:130px} .ctl .pos{display:none} }

  /* shared bits */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.85)}60%{transform:scale(1.03)}100%{opacity:1;transform:none}}
  .cur::after{content:'▍';animation:blink 1s steps(1) infinite}

  /* ===== Claude: the full chat ===== */
  .v-claude{background:#1f1e1d;color:#ece8e1;font-family:var(--f-ui);display:grid;grid-template-columns:280px minmax(0,1fr)}
  .cl-side{border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;min-height:0;background:#1a1918}
  .cl-h{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px;font-weight:800;font-size:13px;color:#b9b2a7}
  .cl-h button{color:#b9b2a7;font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.1)}
  .cl-tasks{flex:1;overflow-y:auto;padding:0 8px 10px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
  .cl-t{border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 10px;background:rgba(255,255,255,.025);cursor:pointer}
  .cl-t b{display:block;font-size:13px;line-height:1.3}
  .cl-t small{display:flex;gap:6px;align-items:center;color:#9d968b;font-size:11.5px;margin-top:3px}
  .cl-t small i{width:7px;height:7px;border-radius:50%;background:#9d968b;flex:none}
  .cl-t[data-s=work] small i,.cl-t[data-s=routing] small i,.cl-t[data-s=queued] small i{background:#d97757;animation:blink 1.2s steps(1) infinite}
  .cl-t[data-s=question] small i{background:#ffb020} .cl-t[data-s=review] small i{background:#5aa2ff} .cl-t[data-s=done] small i{background:#3ddc97} .cl-t[data-s=error] small i{background:#ff6b6b}
  .cl-x{margin-top:8px;font-size:12.5px;color:#cfc8bd;display:flex;flex-direction:column;gap:6px;cursor:default}
  .cl-x p{margin:0} .cl-x .q{color:#ffcf70}
  .cl-x .acts{display:flex;gap:5px;flex-wrap:wrap}
  .cl-x .acts button,.cl-x .acts a{font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.14);color:#ece8e1;text-decoration:none}
  .cl-x .acts .ok{background:#d97757;border-color:transparent;color:#fff}
  .cl-x input{width:100%;padding:7px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:#141312;color:#ece8e1;font:inherit;font-size:12.5px}
  .cl-main{display:flex;flex-direction:column;min-height:0}
  .cl-top{display:flex;align-items:center;gap:9px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.06);font-weight:700;font-size:14px}
  .cl-top .cl-dot{width:22px;height:22px;border-radius:7px;background:#d97757;flex:none;position:relative}
  .cl-top .cl-dot::after{content:'';position:absolute;inset:6px;border-radius:50%;border:2px solid #fff}
  .cl-top em{margin-left:auto;font:500 11px var(--f-mono);letter-spacing:.14em;color:#9d968b;text-transform:uppercase;font-style:normal}
  .cl-log{flex:1;overflow-y:auto;padding:22px max(20px, calc((100% - 760px) / 2));display:flex;flex-direction:column;gap:18px;scrollbar-width:thin}
  .cl-m.me{align-self:flex-end;max-width:80%;background:#2f2d2b;border-radius:16px;padding:10px 14px;font-size:15px;white-space:pre-wrap}
  .cl-m.tw{display:flex;gap:12px;align-items:flex-start}
  .cl-av{width:26px;height:26px;border-radius:8px;background:#d97757;flex:none;margin-top:2px}
  .cl-b{font:15.5px/1.65 'Georgia','Playfair Display',serif;color:#ece8e1;min-width:0;white-space:pre-wrap}
  .cl-b.md{white-space:normal}
  .cl-b.md p{margin:0 0 10px} .cl-b.md p:last-child{margin:0}
  .cl-b.md h1,.cl-b.md h2,.cl-b.md h3{font:700 16px var(--f-ui);margin:14px 0 6px}
  .cl-b.md ul,.cl-b.md ol{margin:0 0 10px;padding-left:22px} .cl-b.md li{margin:3px 0}
  .cl-b.md code{font:13px var(--f-mono);background:#2b2a28;padding:1px 5px;border-radius:5px}
  .cl-b.md pre{background:#141312;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px;overflow-x:auto;font:12.5px/1.5 var(--f-mono);white-space:pre}
  .cl-b.md pre code{background:none;padding:0}
  .cl-b.md a{color:#e9a48a}
  .cl-b.md blockquote{margin:0 0 10px;padding-left:12px;border-left:3px solid #d97757;color:#cfc8bd}
  .cl-card{margin-left:38px;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;font-size:13.5px;background:#262523}
  .cl-card b{display:block;margin-bottom:4px} .cl-card div{color:#cfc8bd;padding:2px 0}
  @container (max-width:760px){ .v-claude{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)} .cl-side{max-height:170px;border-right:0;border-bottom:1px solid rgba(255,255,255,.08)} .cl-log{padding:16px} .cl-m.me{max-width:92%} }
  .atts{display:flex;gap:6px;flex-wrap:wrap}
  .atts span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 9px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
  .atts span img{width:22px;height:22px;object-fit:cover;border-radius:5px}
  .atts span button{color:var(--ink-3);font-weight:800}

  /* ===== 0. Nano ring (reference: jarvis.ceo) ===== */
  .v-nano{background:#0a0a0a;color:#f4f1ec;font-family:var(--f-ui);display:flex;flex-direction:column}
  .v-nano canvas{position:absolute;left:0;right:0;top:0;height:62%;width:100%}
  .nano-top{position:relative;display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px;font-weight:700;z-index:1}
  .nano-top i{width:14px;height:14px;border:1.5px solid #f4f1ec;transform:rotate(45deg);border-radius:3px}
  .nano-top span{margin-left:auto;font:500 11px var(--f-mono);letter-spacing:.18em;color:rgba(244,241,236,.45);text-transform:uppercase}
  .nano-top span b{display:inline-block;width:6px;height:6px;border-radius:50%;background:#e8d5b8;margin-right:8px;vertical-align:1px;box-shadow:0 0 8px #e8d5b8}
  .nano-text{position:absolute;left:6%;right:6%;top:50%;text-align:center;z-index:1}
  .nano-q{font:italic 500 17px 'Playfair Display',Georgia,serif;color:rgba(244,241,236,.5);min-height:24px}
  .nano-a{font:500 34px/1.18 'Playfair Display',Georgia,serif;letter-spacing:-.015em;margin-top:8px;min-height:80px}
  .nano-a span{opacity:0;filter:blur(6px);transition:opacity .45s, filter .45s}
  .nano-a span.on{opacity:1;filter:none}
  .nano-l{font:500 11px var(--f-mono);letter-spacing:.24em;color:rgba(244,241,236,.42);margin-top:12px;text-transform:uppercase}
  .nano-cards{position:absolute;left:22px;right:22px;bottom:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;z-index:1}
  .nano-c{border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.025);opacity:0;transform:translateY(8px);transition:opacity .5s, transform .5s}
  .nano-c.on{opacity:1;transform:none}
  .nano-c b{display:block;font-size:14px} .nano-c small{display:block;color:rgba(244,241,236,.5);font-size:12.5px;line-height:1.35;margin:2px 0 8px}
  .nano-c em{font-style:normal;font-size:12.5px;font-weight:700}
  @container (max-width:760px){ .nano-a{font-size:24px;min-height:90px} .nano-text{top:40%} .nano-cards{grid-template-columns:1fr;gap:6px} .nano-c{padding:8px 12px} .nano-c small{margin:0} .nano-c em{display:none} .v-nano canvas{height:48%} }

  /* ===== 1. HUD ===== */
  .v-hud{background:radial-gradient(800px 500px at 50% 45%, #0b2633, #03070b 70%);color:#bff6ff;font-family:var(--f-mono);display:flex;flex-direction:column}
  .v-hud::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(77,232,255,.04) 0 1px, transparent 1px 3px);pointer-events:none}
  .hud-top{display:flex;gap:18px;padding:12px 18px;font-size:11px;letter-spacing:.12em;color:rgba(191,246,255,.6);border-bottom:1px solid rgba(77,232,255,.18);flex-wrap:wrap}
  .hud-top b{color:#4de8ff;letter-spacing:.2em}
  .hud-top .hud-st{margin-left:auto;color:#4de8ff}
  .hud-main{flex:1;display:grid;grid-template-columns:1fr 300px 1fr;gap:18px;padding:18px;min-height:0}
  .hud-log{overflow-y:auto;display:flex;flex-direction:column;gap:12px;font-size:13px;scrollbar-width:none}
  .hud-l em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.16em;color:rgba(77,232,255,.55);margin-bottom:2px}
  .hud-l.me{color:rgba(191,246,255,.7)} .hud-l.me em{color:#ffb35c}
  .hud-l.tw{border-left:2px solid #4de8ff;padding-left:10px;text-shadow:0 0 8px rgba(77,232,255,.45)}
  .hud-core{position:relative;display:flex;align-items:center;justify-content:center}
  .hud-core svg{width:100%;max-width:300px;overflow:visible}
  .hud-core circle{fill:none;stroke:#4de8ff;transform-origin:100px 100px}
  .hud-core .r1{stroke-width:1;stroke-dasharray:1 5;animation:spin 30s linear infinite}
  .hud-core .r2{stroke-width:2;stroke-dasharray:60 18 6 18;opacity:.8;animation:spin 14s linear infinite reverse}
  .hud-core .r3{stroke-width:6;stroke-dasharray:3 9;opacity:.5;animation:spin 9s linear infinite}
  .hud-core .r4{stroke-width:1;opacity:.35}
  .hud-core .core{fill:rgba(77,232,255,.12);stroke-width:1.5;filter:drop-shadow(0 0 12px #4de8ff)}
  .s-think .hud-core .r2,.s-think .hud-core .r3{animation-duration:2s}
  .s-speak .hud-core .core{fill:rgba(77,232,255,.35)}
  .hud-core-l{position:absolute;text-align:center}
  .hud-core-l b{display:block;font-size:13px;letter-spacing:.2em;color:#4de8ff}
  .hud-core-l small{font-size:9.5px;letter-spacing:.14em;color:rgba(191,246,255,.5)}
  .hud-side{display:flex;flex-direction:column;gap:12px;overflow:hidden}
  .hud-card{position:relative;padding:12px 14px;background:rgba(77,232,255,.05);animation:rise .4s}
  .hud-card::before,.hud-card::after{content:'';position:absolute;width:14px;height:14px;border:1.5px solid #4de8ff}
  .hud-card::before{left:0;top:0;border-right:0;border-bottom:0}.hud-card::after{right:0;bottom:0;border-left:0;border-top:0}
  .hud-card h5{margin:0 0 8px;font-size:10.5px;letter-spacing:.18em;color:#4de8ff;font-weight:700}
  .hud-card div{display:flex;gap:10px;font-size:12.5px;padding:4px 0;border-top:1px dashed rgba(77,232,255,.18)}
  .hud-card div i{font-style:normal;color:#ffb35c;flex:none}
  .hud-card div small{display:block;color:rgba(191,246,255,.5);font-size:11px}
  .hud-wave{height:54px;display:flex;align-items:center;justify-content:center;gap:4px;border-top:1px solid rgba(77,232,255,.18)}
  .hud-wave i{width:4px;height:36px;background:#4de8ff;border-radius:2px;transform:scaleY(.1);box-shadow:0 0 8px #4de8ff}
  @container (max-width:760px){
    .hud-main{grid-template-columns:1fr;grid-template-rows:170px 1fr auto}
    .hud-core svg{max-width:170px}
    .hud-side{max-height:150px}
  }

  /* ===== 2. Terminal ===== */
  .v-term{background:#020604;color:#3dff8a;font:13px/1.55 var(--f-mono);padding:18px 20px;display:flex;flex-direction:column;text-shadow:0 0 6px rgba(61,255,138,.55)}
  .v-term::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 1px, transparent 1px 3px);pointer-events:none;z-index:2}
  .v-term::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(0,0,0,.9);pointer-events:none;z-index:2}
  .term-head{color:rgba(61,255,138,.6);white-space:pre;overflow:hidden;font-size:12px}
  .term-log{flex:1;overflow-y:auto;scrollbar-width:none;white-space:pre-wrap;word-break:break-word}

  .term-box{white-space:pre;overflow-x:auto;scrollbar-width:none;color:#9dffc2;margin:6px 0 10px}
  .term-st{border-top:1px solid rgba(61,255,138,.3);padding-top:8px;display:flex;gap:16px;color:rgba(61,255,138,.7);font-size:12px;flex-wrap:wrap}

  /* ===== 3. RPG ===== */
  .v-rpg{background:linear-gradient(#1b1442 0%, #3b2a6b 45%, #d07a4a 72%, #2b1b2e 72.2%, #1a1020 100%);font-family:var(--f-mono);color:#fff;image-rendering:pixelated}
  .rpg-floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 48px),repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 24px)}
  .rpg-sky{position:absolute;inset:0;background:radial-gradient(2px 2px at 20% 20%, #fff, transparent),radial-gradient(2px 2px at 70% 12%, #fff, transparent),radial-gradient(2px 2px at 40% 30%, #fff, transparent),radial-gradient(2px 2px at 85% 35%, #fff, transparent),radial-gradient(2px 2px at 10% 40%, #fff, transparent);opacity:.7}
  .rpg-sprite{position:absolute;left:50%;top:22%;width:120px;height:120px;transform:translateX(-50%);animation:bob 2.4s ease-in-out infinite}
  .rpg-sprite canvas{width:100%;height:100%;image-rendering:pixelated}
  @keyframes bob{50%{transform:translate(-50%,-8px)}}
  .rpg-hud{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700}
  .rpg-bar{display:flex;align-items:center;gap:8px}
  .rpg-bar span{width:64px}
  .rpg-bar i{display:block;width:130px;height:10px;border:2px solid #fff;background:#000;position:relative}
  .rpg-bar i::after{content:'';position:absolute;inset:0;width:var(--w);background:var(--c);transition:width .8s steps(8)}
  .rpg-box{position:absolute;left:14px;right:14px;bottom:14px;min-height:130px;background:#10103a;border:4px solid #fff;box-shadow:0 0 0 4px #10103a, 0 0 0 6px #6a6af0;padding:16px 18px 18px 120px;font-size:15px;line-height:1.55}
  .rpg-face{position:absolute;left:14px;top:14px;width:88px;height:88px;border:3px solid #fff;background:#2a1f5a}
  .rpg-face canvas{width:100%;height:100%;image-rendering:pixelated}
  .rpg-name{position:absolute;left:110px;top:-18px;background:#e84a5f;border:3px solid #fff;padding:2px 10px;font-size:12px;font-weight:700}
  .rpg-next{position:absolute;right:14px;bottom:8px;animation:blink .8s steps(1) infinite}
  .rpg-menu{position:absolute;right:14px;top:14px;background:#10103a;border:4px solid #fff;box-shadow:0 0 0 3px #6a6af0;padding:10px 14px;font-size:13px;min-width:260px;animation:pop .25s steps(4)}
  .rpg-menu h5{margin:0 0 6px;font-size:11px;color:#ffd35c;letter-spacing:.1em}
  .rpg-menu div{padding:3px 0 3px 18px;position:relative}
  .rpg-menu div.sel::before{content:'▶';position:absolute;left:0;color:#ffd35c;animation:blink .8s steps(1) infinite}
  .rpg-menu small{display:block;color:#a8a8e8;font-size:11px}
  .rpg-quest{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:#ffd35c;color:#10103a;border:4px solid #fff;padding:8px 18px;font-weight:700;font-size:14px;letter-spacing:.08em;animation:pop .3s steps(4);white-space:nowrap}
  @container (max-width:760px){
    .rpg-box{padding:56px 14px 18px 14px;font-size:14px;min-height:160px}
    .rpg-face{width:44px;height:44px;left:12px;top:12px}
    .rpg-name{left:64px}
    .rpg-menu{left:14px;right:14px;top:auto;bottom:200px;min-width:0}
    .rpg-sprite{width:84px;height:84px;top:20%}
    .rpg-hud{display:none}
  }

  /* ===== 4. Quests ===== */
  .v-quest{background:linear-gradient(160deg, #121a2e, #0b0f1a);font-family:var(--f-ui);display:flex;flex-direction:column}
  .q-top{display:flex;align-items:center;gap:14px;padding:14px 18px;background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.07);flex-wrap:wrap}
  .q-ava{width:44px;height:44px;border-radius:14px;background:radial-gradient(circle at 35% 35%, #ffe0b0, #ff8a3d 55%, #b8420f);box-shadow:0 0 18px rgba(255,138,61,.5);position:relative}
  .q-ava b{position:absolute;right:-6px;bottom:-6px;background:#7c5cff;color:#fff;font-size:11px;font-weight:800;border-radius:8px;padding:1px 6px;border:2px solid #121a2e}
  .q-who b{display:block;font-size:15px} .q-who small{color:rgba(255,255,255,.5);font-size:12px}
  .q-xp{flex:1;min-width:180px}
  .q-xp small{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(255,255,255,.55);font-weight:700;margin-bottom:4px}
  .q-xp i{display:block;height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .q-xp i::after{content:'';display:block;height:100%;width:var(--xp,40%);background:linear-gradient(90deg,#7c5cff,#28d7ff);border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .q-chip{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;padding:6px 10px;border-radius:10px;background:rgba(255,138,61,.14);color:#ffb35c}
  .q-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;padding:16px 18px;min-height:0}
  .q-chat{display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none}
  .q-m{max-width:90%;padding:9px 12px;border-radius:14px;font-size:14px;animation:rise .3s}
  .q-m.me{align-self:flex-end;background:#7c5cff;color:#fff;border-bottom-right-radius:4px}
  .q-m.tw{background:rgba(255,255,255,.07);border-bottom-left-radius:4px}
  .q-board{display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none}
  .q-board h5{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)}
  .q-card{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);animation:pop .4s}
  .q-card.best{border-color:rgba(255,200,80,.55);background:linear-gradient(90deg, rgba(255,200,80,.1), rgba(255,255,255,.04))}
  .q-card .ic{width:38px;height:38px;border-radius:11px;background:rgba(124,92,255,.2);display:flex;align-items:center;justify-content:center;color:#b8a6ff;font-weight:800;flex:none}
  .q-card .tx{flex:1;min-width:0} .q-card b{display:block;font-size:14px} .q-card small{color:rgba(255,255,255,.5);font-size:12px}
  .q-card .rw{font:800 12px var(--f-mono);color:#ffd35c;text-align:right;flex:none}
  .q-card .rw em{display:block;font-style:normal;color:rgba(255,255,255,.35);font-weight:500}
  .q-prog{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
  .q-prog i{display:block;height:100%;width:0;background:#3ddc97;transition:width 3s linear}
  .q-toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#ffd35c,#ff8a3d);color:#2a1300;padding:10px 16px;border-radius:14px;font-weight:800;box-shadow:0 10px 30px rgba(255,138,61,.4);animation:pop .4s;white-space:nowrap;z-index:3}
  .q-toast small{display:block;font-weight:600;font-size:11.5px}
  @container (max-width:760px){ .q-body{grid-template-columns:1fr;grid-template-rows:1fr 1.2fr} .q-toast{white-space:normal;width:86%} }

  /* ===== 5. Halo ===== */
  .v-halo{background:#000;font-family:var(--f-ui);display:flex;flex-direction:column;align-items:center}
  .v-halo canvas{position:absolute;inset:0;width:100%;height:100%}
  .halo-q{position:relative;margin-top:22px;color:rgba(255,255,255,.45);font-size:14px;min-height:22px;text-align:center;padding:0 20px}
  .halo-sub{position:absolute;left:8%;right:8%;bottom:96px;text-align:center;font-size:26px;font-weight:700;line-height:1.3;letter-spacing:-.01em;color:#fff}
  .halo-sub span{color:rgba(255,255,255,.18)}
  .halo-sub span.on{color:#fff;text-shadow:0 0 18px rgba(255,170,90,.6);transition:color .2s}
  .halo-pills{position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 16px}
  .halo-pills span{padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:700;background:rgba(255,138,61,.12);border:1px solid rgba(255,138,61,.35);color:#ffc591;animation:pop .4s}
  .halo-st{position:absolute;top:50%;left:50%;transform:translate(-50%, 120px);font:600 11px var(--f-mono);letter-spacing:.2em;color:rgba(255,200,150,.6)}
  @container (max-width:760px){ .halo-sub{font-size:20px;bottom:120px} .halo-st{top:auto;bottom:250px;transform:translateX(-50%)} }

  /* ===== 6. Neural, nano style ===== */
  .v-neuro{background:#0a0a0a;color:#f4f1ec;font-family:var(--f-ui)}
  .v-neuro canvas{position:absolute;inset:0;width:100%;height:100%}
  .v-neuro .nano-top{position:absolute;left:0;right:0;top:0}
  .nn-n{position:absolute;transform:translate(-50%,-50%);padding:6px 12px;border-radius:99px;font:500 10.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;background:#0d0d0d;border:1px solid rgba(255,255,255,.1);color:rgba(244,241,236,.45);white-space:nowrap;transition:all .4s;z-index:1}
  .nn-n.on{border-color:#e8d5b8;color:#f4f1ec;box-shadow:0 0 22px rgba(232,213,184,.22)}
  .nn-text{position:absolute;left:6%;right:6%;top:61%;bottom:16px;text-align:center;z-index:1;display:flex;flex-direction:column;align-items:center}
  .nn-q{font:italic 500 15px 'Playfair Display',Georgia,serif;color:rgba(244,241,236,.5);min-height:20px}
  .nn-a{font:500 24px/1.22 'Playfair Display',Georgia,serif;letter-spacing:-.01em;margin-top:6px;max-height:96px;overflow-y:auto;scrollbar-width:none}
  .v-neuro[data-len=long] .nn-a{font-size:17px}
  .nn-l{font:500 10.5px var(--f-mono);letter-spacing:.22em;color:rgba(244,241,236,.42);margin-top:10px}
  .nn-ch{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .nn-ch span{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.12);color:rgba(244,241,236,.75);animation:pop .3s}
  @container (max-width:760px){ .nn-n{font-size:9px;padding:4px 7px;letter-spacing:.1em} .nn-a{font-size:19px} .nn-text{top:58%} }

  /* ===== 7. Card deck ===== */
  .v-deck{background:radial-gradient(900px 500px at 50% 110%, #1d3b2c, #0a1410 70%);font-family:var(--f-ui);display:flex;flex-direction:column;align-items:center}
  .deck-say{position:relative;margin:18px 18px 0;max-width:640px;width:calc(100% - 36px);display:flex;gap:12px;align-items:flex-start}
  .deck-ava{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%, #ffe0b0, #ff8a3d 55%, #b8420f);box-shadow:0 0 0 3px #d9b45a}
  .deck-bub{background:#f5ecd6;color:#2a2010;padding:10px 14px;border-radius:4px 16px 16px 16px;font-size:14.5px;font-weight:600;min-height:44px}
  .deck-me{position:relative;font-size:12.5px;color:rgba(255,255,255,.5);margin-top:8px;min-height:18px}
  .deck-fan{position:relative;flex:1;width:100%;min-height:0}
  .deck-c{position:absolute;left:50%;bottom:70px;width:170px;height:240px;margin-left:-85px;border-radius:14px;background:linear-gradient(160deg,#2b2b38,#16161e);border:3px solid var(--rar);box-shadow:0 14px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08);padding:12px;color:#fff;transform-origin:50% 140%;transition:transform .6s cubic-bezier(.2,.8,.2,1), opacity .6s;display:flex;flex-direction:column}
  .deck-c .r{font:700 10px var(--f-mono);letter-spacing:.12em;color:var(--rar);text-transform:uppercase}
  .deck-c .art{height:72px;margin:8px 0;border-radius:8px;background:radial-gradient(circle at 50% 60%, var(--rar), transparent 70%), #0e0e14;opacity:.9}
  .deck-c b{font-size:15px;line-height:1.2}
  .deck-c small{color:rgba(255,255,255,.55);font-size:11.5px;line-height:1.3;margin-top:4px}
  .deck-c .st{margin-top:auto;font:600 10.5px var(--f-mono);color:rgba(255,255,255,.7);display:flex;flex-direction:column;gap:2px}
  .deck-c .st i{font-style:normal;color:var(--rar);letter-spacing:1px}
  .deck-c.gone{opacity:0}
  .deck-slot{position:absolute;right:22px;top:12px;width:120px;padding:10px;border:2px dashed rgba(217,180,90,.5);border-radius:12px;text-align:center;font-size:11.5px;color:rgba(255,255,255,.6);font-weight:700}
  .deck-slot.got{border-style:solid;border-color:#d9b45a;background:rgba(217,180,90,.12);color:#f5e2a8}
  .deck-act{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:14px}
  .deck-act span{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;border:2px solid}
  .deck-act .x{color:#ff7b7b;border-color:#ff7b7b} .deck-act .y{color:#6dffb0;border-color:#6dffb0}
  @container (max-width:760px){ .deck-c{width:132px;height:200px;margin-left:-66px;padding:9px} .deck-c .art{height:46px} .deck-slot{top:auto;bottom:16px;right:12px;width:96px;font-size:10.5px} }

  /* ===== 8. Night City ===== */
  .v-night{background:linear-gradient(#0b0418, #1a0630 60%, #070210);font-family:var(--f-ui);color:#f2e9ff}
  .v-night::before{content:'';position:absolute;inset:-50% 0 0;background:repeating-linear-gradient(105deg, transparent 0 22px, rgba(140,200,255,.08) 22px 23px);animation:rain .5s linear infinite;pointer-events:none}
  @keyframes rain{to{transform:translateY(46px)}}
  .v-night::after{content:'';position:absolute;left:-20%;right:-20%;bottom:0;height:34%;background:linear-gradient(transparent, rgba(255,43,214,.12)),repeating-linear-gradient(90deg, rgba(255,43,214,.35) 0 1px, transparent 1px 60px),repeating-linear-gradient(0deg, rgba(255,43,214,.35) 0 1px, transparent 1px 30px);transform:perspective(300px) rotateX(60deg);transform-origin:bottom;pointer-events:none;opacity:.5}
  .nc-in{position:relative;z-index:1;display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;padding:18px;height:100%}
  .nc-left{display:flex;flex-direction:column;align-items:center;gap:12px}
  .nc-hex{width:170px;height:190px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(135deg,#ff2bd6,#28f0ff);padding:3px}
  .nc-hex div{width:100%;height:100%;clip-path:inherit;background:radial-gradient(circle at 50% 45%, #ff9a4d 0 22%, #ff2bd6 40%, #12051f 70%);animation:flick 4s infinite}
  @keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.4}98%{opacity:1}99%{opacity:.6}}
  .nc-name{font:700 22px var(--f-wide);letter-spacing:.06em;position:relative;color:#fff;text-shadow:2px 0 #ff2bd6,-2px 0 #28f0ff}
  .nc-name::after{content:'_';animation:blink 1s steps(1) infinite;color:#28f0ff}
  .nc-st{font:600 11px var(--f-mono);letter-spacing:.18em;color:#28f0ff;text-transform:uppercase}
  .nc-stats{width:100%;font:500 11px var(--f-mono);color:rgba(242,233,255,.6);display:flex;flex-direction:column;gap:4px}
  .nc-stats div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,43,214,.25);padding-bottom:3px}
  .nc-stats b{color:#ff7be6}
  .nc-log{display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:none;padding-bottom:10px}
  .nc-m{max-width:88%;padding:11px 16px;font-size:14.5px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));animation:glitchIn .35s}
  @keyframes glitchIn{0%{opacity:0;transform:translateX(-12px) skewX(-8deg)}40%{opacity:1;transform:translateX(4px) skewX(4deg)}100%{transform:none}}
  .nc-m.me{align-self:flex-end;background:rgba(255,43,214,.18);border-left:3px solid #ff2bd6}
  .nc-m.tw{background:rgba(40,240,255,.1);border-left:3px solid #28f0ff;text-shadow:0 0 10px rgba(40,240,255,.35)}
  .nc-m small{display:block;font:600 10px var(--f-mono);letter-spacing:.16em;opacity:.65;margin-bottom:2px}
  .nc-card{align-self:stretch;max-width:none;background:rgba(10,4,20,.75);border:1px solid #28f0ff;box-shadow:0 0 22px rgba(40,240,255,.25);padding:12px 16px}
  .nc-card h5{margin:0 0 6px;font:700 11px var(--f-mono);letter-spacing:.18em;color:#28f0ff}
  .nc-card div{display:flex;gap:10px;font-size:13.5px;padding:3px 0} .nc-card div i{font-style:normal;color:#ff7be6;font-family:var(--f-mono)}
  @container (max-width:760px){ .nc-in{grid-template-columns:1fr;grid-template-rows:auto 1fr} .nc-left{flex-direction:row;justify-content:flex-start;gap:14px} .nc-hex{width:70px;height:78px} .nc-name{font-size:17px} .nc-stats{display:none} }

  /* ===== 9. Spatial glass ===== */
  .v-glass{background:#e9e6f2;font-family:var(--f-ui);color:#1c1b22;perspective:1200px}
  .gl-bg{position:absolute;inset:-10%;background:radial-gradient(400px 300px at 20% 20%, #ffb38a, transparent 70%),radial-gradient(500px 360px at 85% 30%, #a9c6ff, transparent 70%),radial-gradient(420px 320px at 50% 95%, #d6b8ff, transparent 70%);filter:blur(10px)}
  .gl-scene{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .3s ease-out}
  .gl-win{position:absolute;background:rgba(255,255,255,.42);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);border:1px solid rgba(255,255,255,.7);border-radius:26px;box-shadow:0 30px 60px rgba(60,40,120,.18), inset 0 1px 0 rgba(255,255,255,.8)}
  .gl-chat{left:4%;top:8%;width:52%;bottom:8%;transform:translateZ(0);display:flex;flex-direction:column;padding:16px}
  .gl-chat h5{margin:0 0 10px;font-size:13px;color:rgba(28,27,34,.55);display:flex;align-items:center;gap:8px}
  .gl-chat h5 i{width:9px;height:9px;border-radius:50%;background:#2ec27e}
  .gl-log{flex:1;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:10px}
  .gl-m{max-width:88%;padding:10px 14px;border-radius:18px;font-size:14.5px;animation:rise .35s}
  .gl-m.me{align-self:flex-end;background:rgba(28,27,34,.88);color:#fff}
  .gl-m.tw{background:rgba(255,255,255,.75)}
  .gl-orb{position:absolute;right:16%;top:6%;width:150px;height:150px;border-radius:50%;transform:translateZ(80px);background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(255,255,255,0) 30%),radial-gradient(circle at 60% 70%, #ff8a3d, #ff5f8f 45%, #7a6bff 80%);box-shadow:0 30px 60px rgba(122,107,255,.35), inset -10px -14px 30px rgba(60,20,120,.35);transition:transform .2s}
  .gl-st{position:absolute;right:16%;top:calc(6% + 160px);width:150px;text-align:center;font-size:12px;font-weight:700;color:rgba(28,27,34,.55);transform:translateZ(80px)}
  .gl-cards{position:absolute;right:4%;top:42%;width:36%;bottom:8%;transform-style:preserve-3d}
  .gl-card{position:absolute;inset:0;padding:16px;transform:translateZ(var(--z));animation:rise .5s}
  .gl-card h6{margin:0 0 8px;font-size:15px}
  .gl-card div{display:flex;gap:10px;font-size:13px;padding:5px 0;border-top:1px solid rgba(28,27,34,.08)}
  .gl-card div b{flex:none;width:20px;height:20px;border-radius:7px;background:rgba(28,27,34,.08);display:flex;align-items:center;justify-content:center;font-size:11px}
  .gl-card div small{display:block;color:rgba(28,27,34,.55);font-size:12px}
  @container (max-width:760px){ .gl-chat{left:4%;right:4%;width:auto;top:30%;bottom:34%} .gl-orb{width:96px;height:96px;right:auto;left:8%;top:5%} .gl-st{left:8%;right:auto;width:96px;top:calc(5% + 102px)} .gl-cards{left:4%;right:4%;width:auto;top:auto;height:31%;bottom:2%} }

  /* ===== 10. Timeline ===== */
  .v-tl{background:#141519;font-family:var(--f-ui);color:#e8e8ec;display:flex;flex-direction:column}
  .tl-top{flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;padding:12px;min-height:0}

  @container (max-width:760px){ .tl-top{grid-template-columns:1fr;grid-template-rows:1.2fr 1fr} .tl-row > span,.tl-ruler{width:64px} .tl-ruler{margin-left:64px} .tl-row > span{font-size:9px;padding-left:6px} }

<body>
<header>
  <a class="back" href="./"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Двойник</a>
  <div><h1>Двойник — 12 дизайнов</h1><p>Каждый дизайн рабочий: «Говорить» — разговор голосом без кнопок, ответ сразу, перебить — тап по сцене. Без входа — демо.</p></div>
</header>
<div class="wrap">
  <nav class="list" id="list"></nav>
  <div class="main">
    <div class="title"><h2 id="vName"></h2><span id="vPitch"></span></div>
    <div class="stage" id="stage"></div>
    <div class="talk">
      <button class="talk-go" id="talkBtn" title="Включить разговор голосом"><span class="ring"></span><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><b id="talkLbl">Говорить</b></button>
      <form class="talk-in" id="compose"><input id="input" autocomplete="off" placeholder="Или напишите двойнику…"><button class="btn" type="submit" title="Отправить"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
      <div class="pip" id="pip" hidden><video id="video" playsinline muted></video></div>
      <button class="btn" id="camBtn" title="Камера"><svg viewBox="0 0 24 24"><path d="M15 10l5-3v10l-5-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg><span>Камера</span></button>
      <button class="btn" id="lookBtn" disabled title="Двойник посмотрит на кадр"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Посмотри</button>
      <button class="btn" id="attBtn" title="Прикрепить картинки и файлы"><svg viewBox="0 0 24 24"><path d="M21 12.5l-8.5 8.5a5 5 0 0 1-7-7L14 5.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>Прикрепить</button>
      <input type="file" id="attFile" multiple hidden>
      <label class="sw"><input type="checkbox" id="sound" checked>Голос</label>
    </div>
    <div class="atts" id="atts"></div>
    <div class="live-hint" id="hint"></div>
    <div class="ctl">
      <span class="mchip" id="chip"><i></i><span>демо</span></span>
      <form class="login" id="loginForm" hidden><input type="password" id="pass" placeholder="Пароль владельца" autocomplete="current-password"><button class="btn" type="submit">Войти</button></form>
      <button class="btn" id="prev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Дизайн</button>
      <button class="btn" id="next">Дизайн<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      <button class="btn" id="interview" hidden title="Двойник задаст вопросы и запомнит ответы"><svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-1.5zM8 7h6M8 11h6"/></svg>Интервью <span id="profCnt"></span></button>
      <button class="btn" id="kbBtn" hidden title="Загрузить свои материалы: файлы .md/.txt/.csv/.html/.json и выгрузку claude.ai (conversations.json, projects.json)"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>Материалы <span id="kbCnt"></span></button>
      <input type="file" id="kbFile" multiple accept=".md,.txt,.csv,.html,.htm,.json" hidden>
      <button class="btn" id="replay"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>Демо</button>
      <span class="pos" id="pos"></span>
    </div>
    <div class="about" id="about"></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const el = (tag, cls, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; e.innerHTML = html; return e; };
let token = 0, PACE = 1;   // PACE 0 — instant (restoring the conversation after a design switch)
const alive = t => t === token;
async function type(node, text, speed = 18) {
  const my = token;
  if (!PACE) { node.textContent = text; scrollUp(node); return; }
  node.classList.add('cur');
  for (let i = 0; i <= text.length; i += 2) { if (!alive(my)) return; node.textContent = text.slice(0, i); scrollUp(node); await sleep(speed); }
  node.textContent = text; node.classList.remove('cur');
}
const CTX = { uses:[] };
const scrollUp = n => { const p = n.closest('[data-scroll]'); if (p) p.scrollTop = p.scrollHeight; };

/* ---------- one conversation for all ten windows (an example, not real data) ---------- */
const CARDS = {
  ideas:{ title:'Идеи на сегодня', items:[
    { t:'Ремейк залёта', s:'та же тема и кодовое слово, новый хук', best:true },
    { t:'Карусель-ремикс', s:'новая обложка, хук и CTA, 8 слайдов' },
    { t:'«3 ошибки»', s:'говорящая голова, «антипример → пример»' }] },
  vision:{ title:'Кадр: что поправить', items:[
    { t:'Свет', s:'повернись к окну на 15°' },
    { t:'Ракурс', s:'камера на уровне глаз' },
    { t:'Фон', s:'убери кружку с края кадра' }] },
  task:{ title:'Задача агенту', items:[
    { t:'Сценарий 2.0', s:'ремейк залёта' },
    { t:'Агент монтажа', s:'стиль «Студии Кадрика»' },
    { t:'Проверка', s:'принесёт к твоему столу' }] },
};
const SCRIPT = [
  { me:'Что снимаем сегодня?', alt:['Что по почте?', 'Покажи план недели'],
    twin:'Три варианта. Сильнее всего — ремейк залёта: тема уже сработала, меняем только хук.', card:'ideas', uses:['Сценарии', 'Профиль', 'Память'] },
  { me:'Посмотри, как я в кадре.', alt:['Проверь звук', 'Какой образ?'],
    twin:'Вижу тебя. Повернись чуть к окну — на лице тень. И подними камеру до уровня глаз.', card:'vision', uses:['Камера', 'Монтаж'] },
  { me:'Ок. Отдай сценарий в монтаж.', alt:['Сначала покажи текст', 'Отложи на завтра'],
    twin:'Передал агенту монтажа. Принесёт рилс на проверку к твоему столу.', card:'task', uses:['Агенты', 'Офис', 'Сценарии'] },
];
const ST = { idle:'готов', listen:'слушаю', think:'думаю', speak:'говорю', look:'смотрю' };
const cardRows = (k, fn) => CARDS[k].items.map(fn).join('');

/* ---------- pixel sprite for the RPG window ---------- */
function pixelOrb(c, t = 0) {
  const g = c.getContext('2d'), n = c.width; g.clearRect(0, 0, n, n);
  const cx = n / 2, cy = n / 2, R = n * 0.27;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const dx = x - cx + 0.5, dy = y - cy + 0.5, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
    if (d < R) { const lit = (-dx - dy) / R; g.fillStyle = lit > 0.55 ? '#ffe7b8' : lit > 0 ? '#ffa04d' : lit > -0.6 ? '#e8662a' : '#9b3410'; g.fillRect(x, y, 1, 1); }
    else if (d < R + 4 + 2 * Math.sin(a * 8 + t * 4) && Math.round((a + t) * 8 / Math.PI) % 2 === 0) { g.fillStyle = '#ffcf5c'; g.fillRect(x, y, 1, 1); }
  }
}

/* ---------- the ten windows ---------- */
const V = [
{ id:'claude', name:'Claude', pitch:'Полный чат как claude.ai + задачи Claude Code',
  idea:'Всё, что вы делаете в Claude и Claude Code, — в одном окне двойника: нормальный чат с форматированием, картинками и файлами, а слева — задачи, которые выполняет Claude Code на сервере со всеми скиллами команды.',
  mech:'Пишете или говорите — двойник отвечает сам или ставит задачу Claude Code. Задачи обновляются вживую: шаги исполнителя, вопрос, результат; ответить, принять, отправить правку можно прямо в списке или словами в чате.',
  good:'Рабочее место на каждый день: знает весь бизнес, видит скиллы и материалы, помнит переписку, а работу отдаёт исполнителю.', cost:2,
  build(r) {
    r.innerHTML = `<div class="cl-side"><div class="cl-h">Задачи Claude Code<button type="button" class="cl-ref">обновить</button></div><div class="cl-tasks"></div></div>
      <div class="cl-main"><div class="cl-top"><span class="cl-dot"></span>Двойник · Claude<em class="st">готов</em></div><div class="cl-log" data-scroll></div></div>`;
    const log = r.querySelector('.cl-log'), list = r.querySelector('.cl-tasks'), st = r.querySelector('.st');
    const open = new Set();
    function render() {
      if (!live) { list.innerHTML = '<div class="cl-t"><b>Задачи видны после входа</b><small>введите пароль внизу</small></div>'; return; }
      if (!DESK.tasks.length) { list.innerHTML = '<div class="cl-t"><b>Задач пока нет</b><small>скажите «поставь задачу Claude Code: …»</small></div>'; return; }
      list.innerHTML = DESK.tasks.slice(0, 30).map(t => `<div class="cl-t" data-id="${t.id}" data-s="${t.status}"><b>${esc(t.route?.title || t.text.slice(0, 70))}</b><small><i></i>${esc(t.statusText)} · ${esc(t.agent?.name || 'диспетчер')}</small>${open.has(t.id) ? `<div class="cl-x">
        ${t.steps.slice(-4).map(x => `<p>${esc(x.text)}</p>`).join('')}
        ${t.question ? `<p class="q">Вопрос: ${esc(t.question.text)}</p><input placeholder="Ваш ответ — Enter" data-act="answer">` : ''}
        ${t.result?.summary ? `<p>${esc(t.result.summary)}</p>` : ''}
        <div class="acts">${t.result?.mainUrl ? `<a href="${esc(t.result.mainUrl)}" target="_blank" rel="noopener">Открыть результат</a>` : ''}${t.status === 'review' ? '<button class="ok" data-act="approve">Принять</button>' : ''}${['review', 'done'].includes(t.status) ? '<button data-act="revise">Правка…</button>' : ''}${t.status === 'error' ? '<button data-act="retry">Повторить</button>' : ''}${['routing', 'question', 'queued', 'work', 'review'].includes(t.status) ? '<button data-act="cancel">Отменить</button>' : ''}</div></div>` : ''}</div>`).join('');
    }
    list.addEventListener('click', async e => {
      const card = e.target.closest('.cl-t[data-id]'); if (!card) return;
      const id = card.dataset.id, act = e.target.closest('[data-act]')?.dataset.act;
      if (!act) { if (!e.target.closest('.cl-x')) { open.has(id) ? open.delete(id) : open.add(id); render(); } return; }
      if (act === 'answer') return;
      let text = '';
      if (act === 'revise') { text = prompt('Что поправить?') || ''; if (!text.trim()) return; }
      await deskAct(id, act, text);
    });
    list.addEventListener('keydown', async e => { const inp = e.target.closest('input[data-act=answer]'); if (inp && e.key === 'Enter' && inp.value.trim()) await deskAct(inp.closest('.cl-t').dataset.id, 'answer', inp.value.trim()); });
    r.querySelector('.cl-ref').onclick = () => refreshDesk();
    DESK.onchange = render; render();
    return {
      me(t) { log.append(el('div', 'cl-m me', esc(t))); log.scrollTop = 1e6; },
      open() { const d = el('div', 'cl-m tw', '<div class="cl-av"></div><div class="cl-b"></div>'); log.append(d); log.scrollTop = 1e6; return d.lastChild; },
      close(t) { const n = log.querySelector('.cl-m.tw:last-child .cl-b'); if (n) { n.classList.add('md'); n.innerHTML = mdx(t); } },
      card(k) { if (k === 'live') return; log.append(el('div', 'cl-card', `<b>${esc(CARDS[k].title)}</b>` + cardRows(k, it => `<div>${esc(it.t)} — ${esc(it.s)}</div>`))); log.scrollTop = 1e6; },
      state(s) { st.textContent = ST[s]; },
      stop() { DESK.onchange = null; },
    };
  } },

{ id:'nano', name:'Нано-кольцо', pitch:'Минимализм в духе jarvis.ceo: облако частиц и антиква',
  idea:'Почти чёрный экран, в центре кольцо из тысячи тёплых «наночастиц», под ним крупная антиква — фраза, которую двойник говорит прямо сейчас, и моноширинная подпись состояния. Ничего лишнего.',
  mech:'Частицы и есть интерфейс: кольцо дышит голосом, на «думаю» схлопывается в сферу-рой, на «смотрю» вытягивается в линзу-глаз, на «слушаю» сжимается к центру. Карточки — три тонкие плашки внизу со ссылкой «→».',
  good:'Самый «чистый» и дорогой вид, ощущение ИИ из будущего без перегруза. Хорошо ложится на телефон и в Mini App.', cost:2,
  build(r) {
    r.innerHTML = `<canvas></canvas><div class="nano-top"><i></i>Двойник<span><b></b><em class="st" style="font-style:normal">готов</em></span></div>
      <div class="nano-text"><div class="nano-q"></div><div class="nano-a"></div><div class="nano-l">ДВОЙНИК · ГОТОВ</div></div><div class="nano-cards"></div>`;
    const c = r.querySelector('canvas'), g = c.getContext('2d'), q = r.querySelector('.nano-q'), a = r.querySelector('.nano-a'), lab = r.querySelector('.nano-l'), st = r.querySelector('.st'), cards = r.querySelector('.nano-cards');
    const N = 1100, P = Array.from({ length:N }, () => ({ u:Math.random() * 6.283, v:Math.random() * 6.283, j:Math.random(), s:Math.random() ** 3, k:Math.random() }));
    const W = { torus:1, sphere:0, lens:0, tight:0 }, T = { ...W };
    let shape = 'idle';
    const want = { idle:'torus', speak:'torus', listen:'tight', think:'sphere', look:'lens' };
    return {
      me(t) { q.textContent = '«' + t + '»'; a.innerHTML = ''; cards.innerHTML = ''; },
      open() { a.textContent = ''; return a; },
      async say(t) {
        const my = token; a.innerHTML = t.split(' ').map(w => `<span>${esc(w)}</span>`).join(' ');
        for (const s of a.children) { if (!alive(my)) return; s.classList.add('on'); await sleep(150); }
      },
      card(k) { cards.innerHTML = CARDS[k].items.map(it => `<div class="nano-c"><b>${esc(it.t)}</b><small>${esc(it.s)}</small><em>${k === 'task' ? 'Статус' : 'Открыть'} →</em></div>`).join('');
        [...cards.children].forEach((e, i) => setTimeout(() => e.classList.add('on'), 120 * i)); },
      state(s) { shape = s; for (const key in T) T[key] = key === want[s] ? 1 : 0; const txt = ST[s]; st.textContent = txt; lab.textContent = 'ДВОЙНИК · ' + txt.toUpperCase(); },
      frame(t, l) {
        const dpr = devicePixelRatio || 1, w = c.width = c.clientWidth * dpr, h = c.height = c.clientHeight * dpr, cx = w / 2, cy = h * 0.52, S = Math.min(w, h) * 0.27;
        for (const key in W) W[key] += (T[key] - W[key]) * 0.06;
        g.clearRect(0, 0, w, h);
        const glow = g.createRadialGradient(cx, cy, 0, cx, cy, S * 1.4); glow.addColorStop(0, 'rgba(120,80,40,.28)'); glow.addColorStop(1, 'rgba(120,80,40,0)');
        g.fillStyle = glow; g.fillRect(0, 0, w, h);
        const ry = t * 0.25, rx = 1.05 + Math.sin(t * 0.2) * 0.12, cyR = Math.cos(ry), syR = Math.sin(ry), cxR = Math.cos(rx), sxR = Math.sin(rx);
        const breathe = 1 + l * 0.12 * Math.sin(t * 9);
        for (const p of P) {
          const u = p.u + t * (0.05 + p.k * 0.04), rr = 0.36 + p.j * 0.12;
          // torus
          let x1 = (1 + rr * Math.cos(p.v)) * Math.cos(u) * breathe, y1 = rr * Math.sin(p.v), z1 = (1 + rr * Math.cos(p.v)) * Math.sin(u) * breathe;
          // swarm sphere
          const lat = Math.acos(2 * p.k - 1), sw = 0.85 + 0.1 * Math.sin(t * 3 + p.u * 4);
          const x2 = Math.sin(lat) * Math.cos(u * 2) * sw, y2 = Math.cos(lat) * sw, z2 = Math.sin(lat) * Math.sin(u * 2) * sw;
          // tight ring (listening)
          const x4 = 0.55 * Math.cos(u) * (1 + 0.05 * Math.sin(t * 12 + p.v)), y4 = (p.j - 0.5) * 0.12, z4 = 0.55 * Math.sin(u);
          let x = x1 * W.torus + x2 * W.sphere + x4 * W.tight, y = y1 * W.torus + y2 * W.sphere + y4 * W.tight, z = z1 * W.torus + z2 * W.sphere + z4 * W.tight;
          // rotate (Y then X)
          let X = x * cyR - z * syR, Z = x * syR + z * cyR, Y = y * cxR - Z * sxR; Z = y * sxR + Z * cxR;
          // lens (eye), drawn flat in screen space
          if (W.lens > 0.001) {
            const iris = p.k < 0.3, e = iris ? 0.32 + p.j * 0.08 : 1.25 + (p.j - 0.5) * 0.18;
            const lx = Math.cos(u) * e, ly = Math.sin(u) * (iris ? e : e * 0.42 * (0.6 + 0.4 * Math.abs(Math.cos(u)))), lz = p.j - 0.5;
            X = X * (1 - W.lens) + lx * W.lens; Y = Y * (1 - W.lens) + ly * W.lens; Z = Z * (1 - W.lens) + lz * W.lens;
          }
          const d = (Z + 2.2) / 3.2, a2 = 0.18 + d * 0.8, rad = (0.6 + p.s * 2.6) * d * dpr;
          g.fillStyle = `rgba(${232 - (1 - d) * 60 | 0},${213 - (1 - d) * 70 | 0},${184 - (1 - d) * 80 | 0},${a2})`;
          g.beginPath(); g.arc(cx + X * S, cy + Y * S, rad, 0, 6.283); g.fill();
        }
      },
    };

{ id:'neuro', name:'Нейрограф', pitch:'Откуда двойник знает ответ — в стиле «Нано-кольца»',
  idea:'Тот же минимализм, что у «Нано-кольца»: чёрный фон, тёплые частицы, антиква. Вокруг ядра-роя — узлы знаний: профиль, сценарии, карусели, монтаж, офис, память, камера, агенты.',
  mech:'Перед ответом по нитям от нужных узлов к ядру текут частицы — видно, из чего собран ответ; внизу подпись «из: …». Ядро — то же кольцо: дышит голосом, сжимается в рой, когда думает.',
  good:'Доверие к двойнику и наглядное «как устроен мой ИИ» для аудитории — без потери чистоты нано-стиля.', cost:3,
  build(r) {
    const NODES = ['Профиль', 'Сценарии', 'Карусели', 'Монтаж', 'Офис', 'Память', 'Камера', 'Агенты'];
    r.innerHTML = `<canvas></canvas><div class="nano-top"><i></i>Двойник<span><b></b><em class="st" style="font-style:normal">готов</em></span></div>
      ${NODES.map(n => `<span class="nn-n" data-n="${n}">${n}</span>`).join('')}
      <div class="nn-text"><div class="nn-q"></div><div class="nn-a" data-scroll></div><div class="nn-l">ИЗ · —</div><div class="nn-ch"></div></div>`;
    const c = r.querySelector('canvas'), g = c.getContext('2d'), q = r.querySelector('.nn-q'), a = r.querySelector('.nn-a'), lab = r.querySelector('.nn-l'), ch = r.querySelector('.nn-ch'), st = r.querySelector('.st');
    const nodes = [...r.querySelectorAll('.nn-n')];
    let G = { cx:0, cy:0, S:0, pts:[] }, on = new Set();
    function layout() {
      const w = r.clientWidth, h = r.clientHeight, top = 56, gh = h * 0.6 - top, cx = w / 2, cy = top + gh / 2;
      const rx = Math.min(w * 0.38, 360), ry = gh * 0.4;
      G = { cx, cy, S:Math.min(w, gh) * 0.13, pts:nodes.map((n, i) => { const ang = i / nodes.length * 6.283 - 1.18, x = cx + Math.cos(ang) * rx, y = cy + Math.sin(ang) * ry; n.style.left = x + 'px'; n.style.top = y + 'px'; return { x, y, n:n.dataset.n }; }) };
    }
    layout(); const ro = new ResizeObserver(layout); ro.observe(r);
    const P = Array.from({ length:420 }, () => ({ u:Math.random() * 6.283, v:Math.random() * 6.283, j:Math.random(), s:Math.random() ** 3, k:Math.random() }));
    const FLOW = Array.from({ length:8 }, () => Array.from({ length:7 }, () => ({ o:Math.random(), sp:0.25 + Math.random() * 0.35, s:Math.random() })));
    let think = 0, thinkT = 0;
    const light = uses => { on = new Set(uses); nodes.forEach(n => n.classList.toggle('on', on.has(n.dataset.n))); lab.textContent = 'ИЗ · ' + (uses.length ? uses.join(' · ').toUpperCase() : '—'); };
    return {
      me(t) { q.textContent = '«' + t + '»'; a.textContent = ''; ch.innerHTML = ''; light([]); },
      open() { a.textContent = ''; return a; },
      card(k) { ch.innerHTML = CARDS[k].items.map(it => `<span>${esc(it.t)}</span>`).join(''); },
      light,
      state(s) { st.textContent = ST[s]; thinkT = s === 'think' || s === 'look' ? 1 : 0; if (s === 'think' || s === 'look') light(CTX.uses); },
      stop() { ro.disconnect(); },
      frame(t, l) {
        const dpr = devicePixelRatio || 1, w = c.width = r.clientWidth * dpr, h = c.height = r.clientHeight * dpr;
        g.clearRect(0, 0, w, h); think += (thinkT - think) * 0.06;
        const cx = G.cx * dpr, cy = G.cy * dpr, S = G.S * dpr;
        const glow = g.createRadialGradient(cx, cy, 0, cx, cy, S * 2.4); glow.addColorStop(0, 'rgba(120,80,40,.3)'); glow.addColorStop(1, 'rgba(120,80,40,0)');
        g.fillStyle = glow; g.fillRect(0, 0, w, h);
        // threads and the particles flowing along the active ones
        G.pts.forEach((p, i) => {
          const px = p.x * dpr, py = p.y * dpr, act = on.has(p.n);
          g.strokeStyle = act ? 'rgba(232,213,184,.32)' : 'rgba(232,213,184,.07)'; g.lineWidth = dpr;
          g.beginPath(); g.moveTo(px, py); g.lineTo(cx, cy); g.stroke();
          if (!act) return;
          for (const f of FLOW[i]) {
            const k = (f.o + t * f.sp) % 1, x = px + (cx - px) * k, y = py + (cy - py) * k;
            g.fillStyle = `rgba(240,222,190,${0.35 + 0.6 * Math.sin(k * 3.14)})`;
            g.beginPath(); g.arc(x, y, (0.8 + f.s * 2) * dpr, 0, 6.283); g.fill();
          }
        });
        // the core: a small nano ring that turns into a swarm while thinking
        const ry = t * 0.3, cyR = Math.cos(ry), syR = Math.sin(ry), rx = 1.05, cxR = Math.cos(rx), sxR = Math.sin(rx), br = 1 + l * 0.14 * Math.sin(t * 9);
        for (const p of P) {
          const u = p.u + t * (0.06 + p.k * 0.05), rr = 0.36 + p.j * 0.12;
          const x1 = (1 + rr * Math.cos(p.v)) * Math.cos(u) * br, y1 = rr * Math.sin(p.v), z1 = (1 + rr * Math.cos(p.v)) * Math.sin(u) * br;
          const lat = Math.acos(2 * p.k - 1), sw = 0.85 + 0.1 * Math.sin(t * 3 + p.u * 4);
          const x2 = Math.sin(lat) * Math.cos(u * 2) * sw, y2 = Math.cos(lat) * sw, z2 = Math.sin(lat) * Math.sin(u * 2) * sw;
          const x = x1 + (x2 - x1) * think, y = y1 + (y2 - y1) * think, z = z1 + (z2 - z1) * think;
          let X = x * cyR - z * syR, Z = x * syR + z * cyR, Y = y * cxR - Z * sxR; Z = y * sxR + Z * cxR;
          const d = (Z + 2.2) / 3.2;
          g.fillStyle = `rgba(${232 - (1 - d) * 60 | 0},${213 - (1 - d) * 70 | 0},${184 - (1 - d) * 80 | 0},${0.2 + d * 0.8})`;
          g.beginPath(); g.arc(cx + X * S, cy + Y * S, (0.5 + p.s * 2.2) * d * dpr, 0, 6.283); g.fill();
        }
      },
    };
  } },

/* ---------- markdown for the chat ---------- */
function mdx(src) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const out = [], lines = String(src).replace(/\r/g, '').split('\n');
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue; }
    if (/^#{1,3}\s/.test(l)) { out.push(`<h3>${inline(l.replace(/^#+\s*/, ''))}</h3>`); i++; continue; }
    if (/^\s*[-*•]\s+/.test(l)) { const it = []; while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) it.push(`<li>${inline(lines[i++].replace(/^\s*[-*•]\s+/, ''))}</li>`); out.push(`<ul>${it.join('')}</ul>`); continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { const it = []; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) it.push(`<li>${inline(lines[i++].replace(/^\s*\d+[.)]\s+/, ''))}</li>`); out.push(`<ol>${it.join('')}</ol>`); continue; }
    if (/^>\s?/.test(l)) { const it = []; while (i < lines.length && /^>\s?/.test(lines[i])) it.push(inline(lines[i++].replace(/^>\s?/, ''))); out.push(`<blockquote>${it.join('<br>')}</blockquote>`); continue; }
    if (!l.trim()) { i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^(```|#{1,3}\s|\s*[-*•]\s+|\s*\d+[.)]\s+|>)/.test(lines[i])) para.push(inline(lines[i++]));
    out.push(`<p>${para.join('<br>')}</p>`);
  }
  return out.join('');
}

/* ---------- voice out: sentence by sentence, the first one while the rest is still being written ---------- */
let actx = null, curSrc = null;
const ctx = () => (actx = actx || new (window.AudioContext || window.webkitAudioContext)());
const tts = { gen:0, q:[], running:null };
function stopVoice() { tts.gen++; tts.q = []; try { speechSynthesis.cancel(); } catch {} try { curSrc?.stop(); } catch {} curSrc = null; audioLv = null; }
// phones play sound only after a tap: unlock Web Audio and speech synthesis on the first one
let unlocked = false;
function unlockAudio() {
  const c = ctx(); try { c.resume(); } catch {}
  if (unlocked) return; unlocked = true;
  try { const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0); } catch {}
  try { if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch {}
}
function speakPart(text) {
  // the chat design speaks only in a voice conversation; the others whenever the sound is on
  if (!$('sound').checked || !text.trim() || (V[cur].id === 'claude' && !convo.on)) return;
  const gen = tts.gen;
  const job = server?.voice
    ? fetch(API + '/tts', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ text }) }).then(r => r.ok ? r.blob() : text).catch(() => text)
    : Promise.resolve(text);   // no cloned voice (or it failed): the browser's voice
  tts.q.push(job);
  if (!tts.running) tts.running = (async () => {
    while (tts.q.length && gen === tts.gen) {
      const item = await tts.q.shift();
      if (gen !== tts.gen || !item) continue;
      if (typeof item === 'string') await browserSay(item); else await playBlob(item);
    }
    tts.running = null;
  })();
}
function browserSay(text) {
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return res();
    const u = new SpeechSynthesisUtterance(text.replace(/[«»"*#]/g, '')); u.lang = 'ru-RU'; u.rate = 1.07;
    const v = speechSynthesis.getVoices().find(x => /^ru/i.test(x.lang)); if (v) u.voice = v;
    const iv = setInterval(() => { audioLv = 0.3 + Math.random() * 0.5; }, 90);
    const done = () => { clearInterval(iv); audioLv = null; res(); };
    u.onend = done; u.onerror = done; speechSynthesis.speak(u);
    setTimeout(done, 1500 + text.length * 90);
  });
}
// Web Audio, not <audio>: iOS lets an unlocked context play at any time, an <audio> element only from a tap
async function playBlob(blob) {
  const c = ctx(); if (c.state !== 'running') { try { await c.resume(); } catch {} }
  let data; try { data = await c.decodeAudioData(await blob.arrayBuffer()); } catch { return; }
  const src = c.createBufferSource(), an = c.createAnalyser(); an.fftSize = 256; src.buffer = data; src.connect(an); an.connect(c.destination);
  curSrc = src; const buf = new Uint8Array(an.frequencyBinCount);
  const tick = () => { if (curSrc !== src) return; an.getByteFrequencyData(buf); audioLv = Math.min(1, buf.reduce((x, y) => x + y, 0) / buf.length / 70); requestAnimationFrame(tick); };
  await new Promise(r => { src.onended = r; src.start(0); tick(); });
  if (curSrc === src) { curSrc = null; audioLv = null; }
}
const voiceDone = async () => { while (tts.running) await tts.running; };
function interrupt() { stopVoice(); setState(convo.on ? 'listen' : 'idle'); hint('Перебили — слушаю.'); listenAgain(); }

let cam = null;

  if (cam) { cam.getTracks().forEach(t => t.stop()); cam = null; $('pip').hidden = true; $('lookBtn').disabled = true; $('camBtn').classList.remove('on'); return; }
  try { cam = await navigator.mediaDevices.getUserMedia({ video:{ width:{ ideal:1280 }, facingMode:'user' }, audio:false }); }
  catch { return hint('Нет доступа к камере — разрешите её в браузере.'); }
  const v = $('video'); v.srcObject = cam; await v.play(); $('pip').hidden = false; $('lookBtn').disabled = false; $('camBtn').classList.add('on');
  hint('Камера включена: скажите «посмотри на меня» или нажмите «Посмотри». Кадры не сохраняются.');
}
function frame() {
  const v = $('video'); if (!cam || !v.videoWidth) return null;
  const k = Math.min(1, 768 / v.videoWidth), c = document.createElement('canvas'); c.width = v.videoWidth * k | 0; c.height = v.videoHeight * k | 0;

$('camBtn').onclick = camToggle;

/* ---------- one live turn: streamed text, voice from the first sentence ---------- */
async function ask(text, { look = false } = {}) {
  text = text.trim(); if (!text || busy) return;
  if (!live) { hint(server?.configured?.login ? 'Вживую двойник отвечает владельцу офиса — <b>войдите паролем</b> внизу. Пока можно смотреть «Демо».' : 'Сервер ассистента недоступен — работает только демо.'); return; }
  busy = true; token++; stopVoice(); pauseListening();
  const image = (look || /посмотр|видишь|как я|в кадре|кадр/i.test(text)) ? frame() : null;
  const att = { images:PEND.images.splice(0), uploads:PEND.uploads.splice(0) }; renderAtts();
  await api.me(att.images.length || att.uploads.length ? `${text}\n(вложения: ${[att.images.length ? 'картинок ' + att.images.length : '', ...att.uploads.map(u => u.name)].filter(Boolean).join(', ')})` : text);
  CTX.uses = guess(text, '', Boolean(image)); setState(image ? 'look' : 'think');
  if (image) { $('pip').classList.add('look'); hint('Двойник смотрит на кадр…'); } else hint('');
  let reply = '', node = null, buf = '', task = false;
  const t0 = performance.now();
  const flush = (all) => {   // cut finished sentences for the voice
    for (;;) { const m = buf.match(/^([\s\S]*?[.!?…])(\s+)/); if (!m || (m[1].length < 14 && !all)) break; speakPart(m[1]); buf = buf.slice(m[0].length); }
    if (all && buf.trim()) { speakPart(buf); buf = ''; }
  };
  try {
    const r = await fetch(API + '/chat', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ text, voice:$('sound').checked && convo.on, twin:true, ...(image ? { image } : {}), ...(att.images.length ? { images:att.images } : {}), ...(att.uploads.length ? { uploads:att.uploads } : {}) }) });
    if (!r.ok || !/event-stream/.test(r.headers.get('content-type') || '')) { const d = await r.json().catch(() => ({})); throw new Error(d.error || 'Двойник не ответил.'); }
    const rd = r.body.getReader(), dec = new TextDecoder(); let sse = '';
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      sse += dec.decode(value, { stream:true });
      let i; while ((i = sse.indexOf('\n\n')) >= 0) {
        const line = sse.slice(0, i).replace(/^data: /, ''); sse = sse.slice(i + 2);
        let ev; try { ev = JSON.parse(line); } catch { continue; }
        if (ev.t === 'delta') {
          if (!node) { $('pip').classList.remove('look'); setState('speak'); node = api.open(); hint(`Ответ пошёл через ${((performance.now() - t0) / 1000).toFixed(1)} с · перебить — тап по сцене или Esc`); }
          reply += ev.text; buf += ev.text; node.textContent = reply; scrollUp(node);
          markLen(reply); flush(false);
        }
        if (ev.t === 'task') { task = true; refreshDesk(); }
        if (ev.t === 'memory') { memFlash(ev.title); }
        if (ev.t === 'kb') { hint(`${ev.name === 'read_document' ? 'Читаю' : 'Ищу в базе'}: <b>${esc(ev.query)}</b>`); if (!CTX.uses.includes('Офис')) { CTX.uses = [...CTX.uses, 'Офис']; api.light?.(CTX.uses); } }
        if (ev.t === 'error') throw new Error(ev.message);
      }
    }
    flush(true);
  } catch (e) {
    reply = e.message || 'Ошибка.'; if (!node) { setState('speak'); node = api.open(); } node.textContent = reply;
  }
  $('pip').classList.remove('look');
  api.close?.(reply);
  const card = listOf(reply);
  if (card) { CARDS.live = card; api.card('live'); }
  if (task) { CARDS.task = TASK_LIVE; api.card('task'); }
  CTX.uses = guess(text, reply, Boolean(image), task); api.light?.(CTX.uses);
  HIST.push({ me:text, twin:reply, uses:CTX.uses, live:card, task });
  await voiceDone();
  busy = false;
  setState(convo.on ? 'listen' : 'idle');
  listenAgain(); afterTurn();
}

/* ---------- conversation mode: speak freely, the end of a phrase sends it ----------
   Desktop Chrome/Edge: the browser's speech recognition (instant). Phones and the rest: the page listens
   by voice activity — speech starts a recording, a pause sends it to /stt (ElevenLabs Scribe). Phones
   can't restart browser recognition without a tap, so they always use the second way. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
const USE_SR = Boolean(SR) && !MOBILE;
const convo = { on:false, rec:null, stream:null, vad:null };
function pauseListening() { try { convo.rec?.abort(); } catch {} convo.recOn = false; }
function listenAgain() { if (!convo.on || busy) return; if (USE_SR) startRec(); else if (mode !== 'speak') setState('listen'); }
function startRec() {
  if (convo.recOn) return;
  const rec = convo.rec = new SR(); rec.lang = 'ru-RU'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  rec.onresult = e => {
    let fin = '', inter = '';
    for (const r of e.results) (r.isFinal ? (fin += r[0].transcript) : (inter += r[0].transcript));
    $('input').value = fin || inter; $('talkBtn').classList.add('hear');
    if (fin.trim()) { $('input').value = ''; $('talkBtn').classList.remove('hear'); ask(fin); }
  };
  rec.onend = () => { convo.recOn = false; $('talkBtn').classList.remove('hear'); if (convo.on && !busy) setTimeout(listenAgain, 120); };
  rec.onerror = e => { convo.recOn = false; if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { convoOff(); hint('Нет доступа к микрофону — разрешите его в браузере.'); } };
  try { rec.start(); convo.recOn = true; } catch {}
}
const micLv = x => $('talkBtn').style.setProperty('--lv', Math.max(0, Math.min(1, x)).toFixed(2));
async function startVad() {
  try { convo.stream = convo.stream?.active ? convo.stream : await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } }); }
  catch { convoOff(); return hint(MOBILE ? 'Нет доступа к микрофону. На iPhone: «аА» в адресной строке → Настройки веб-сайта → Микрофон → Разрешить, затем снова «Говорить».' : 'Нет доступа к микрофону — разрешите его в браузере.'); }
  const c = ctx(); try { await c.resume(); } catch {}
  const an = c.createAnalyser(); an.fftSize = 1024; c.createMediaStreamSource(convo.stream).connect(an);
  const buf = new Float32Array(an.fftSize);
  const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(m => window.MediaRecorder?.isTypeSupported?.(m)) || '';
  let rec = null, chunks = [], loud = 0, quiet = 0, floor = 0.004, startedAt = 0, barge = 0;
  convo.vad = setInterval(async () => {
    an.getFloatTimeDomainData(buf); let sum = 0; for (const v of buf) sum += v * v; const rms = Math.sqrt(sum / buf.length);
    const on = Math.max(0.012, floor * 3);
    if (!rec && mode !== 'speak' && rms < on) floor = floor * 0.95 + rms * 0.05;   // the room's own noise
    micLv(rms / on / 2);
    if (mode === 'speak') {   // barge-in: a loud, steady voice over the twin's own (the mic cancels the echo)
      barge = rms > Math.max(0.06, on * 4) ? barge + 1 : 0;
      if (barge > 8) { barge = 0; interrupt(); }
      return;
    }
    if (busy) { loud = 0; return; }
    if (rms > on) { loud++; quiet = 0; } else { quiet++; if (!rec) loud = 0; }
    if (!rec && loud >= 2) {
      chunks = []; rec = new MediaRecorder(convo.stream, mime ? { mimeType:mime } : undefined);
      rec.ondataavailable = e => e.data.size && chunks.push(e.data); rec.start(); startedAt = Date.now();
      setState('listen'); $('talkBtn').classList.add('hear'); hint('Слышу вас…');
    }
    if (rec && (quiet >= 16 || Date.now() - startedAt > 30000)) {
      const r = rec, long = Date.now() - startedAt; rec = null; loud = 0; $('talkBtn').classList.remove('hear');
      await new Promise(x => { r.onstop = x; r.stop(); });
      if (long < 700) { hint(''); return; }   // a cough or a click
      const blob = new Blob(chunks, { type:r.mimeType || mime || 'audio/webm' });
      busy = true; setState('think'); hint('Распознаю…');
      let text = '', err = '';
      try { const resp = await fetch(API + '/stt', { method:'POST', headers:{ 'content-type':blob.type }, body:blob }); const d = await resp.json().catch(() => ({})); text = (d.text || '').trim(); if (!resp.ok) err = d.error || 'Не удалось распознать речь.'; }
      catch { err = 'Сервер ассистента недоступен.'; }
      busy = false;
      if (text) ask(text); else { setState('listen'); hint(err || 'Не расслышал — скажите ещё раз.'); }
    }
  }, 50);
}
/* phones: streaming recognition (ElevenLabs realtime Scribe) — words appear while you speak, the server's
   VAD closes the phrase; the batch recording above stays as the fallback */
const RT = { ws:null, proc:null, src:null, stream:null, pending:'', ok:false };
function b64(int16) { let s = ''; const u8 = new Uint8Array(int16.buffer); for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
async function startRealtime() {
  let token;
  try { const r = await fetch(API + '/stt-token', { method:'POST' }); const d = await r.json(); token = d.token; if (!token) throw 0; } catch { return false; }
  try { RT.stream = convo.stream || await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } }); convo.stream = RT.stream; }
  catch { convoOff(); hint(MOBILE ? 'Нет доступа к микрофону. На iPhone: «аА» в адресной строке → Настройки веб-сайта → Микрофон → Разрешить, затем снова «Говорить».' : 'Нет доступа к микрофону — разрешите его в браузере.'); return true; }
  const c = ctx(); try { await c.resume(); } catch {}
  const q = new URLSearchParams({ model_id:'scribe_v2_realtime', token, audio_format:'pcm_16000', commit_strategy:'vad', language_code:'ru', vad_silence_threshold_secs:'0.7', min_speech_duration_ms:'200' });
  const ws = RT.ws = new WebSocket('wss://api.elevenlabs.io/v1/speech-to-text/realtime?' + q);
  const started = await new Promise(res => {
    const to = setTimeout(() => res(false), 5000);
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; } if (m.message_type === 'session_started') { clearTimeout(to); res(true); } else if (m.error) { clearTimeout(to); res(false); } };
    ws.onerror = () => { clearTimeout(to); res(false); };
  });
  if (!started) { try { ws.close(); } catch {} RT.ws = null; return false; }
  RT.ok = true;
  // mic → 16 kHz PCM16, ~100 ms chunks
  const src = RT.src = c.createMediaStreamSource(RT.stream), proc = RT.proc = c.createScriptProcessor(4096, 1, 1), an = c.createAnalyser(); an.fftSize = 512;
  src.connect(an); src.connect(proc); const mute = c.createGain(); mute.gain.value = 0; proc.connect(mute); mute.connect(c.destination);
  const ratio = c.sampleRate / 16000, lvBuf = new Float32Array(an.fftSize);
