<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Окно двойника — 10 концептов</title>
<meta name="description" content="Десять вариантов дизайна окна диалога с цифровым двойником: HUD, терминал, RPG, квесты, нейрограф, колода карт, монтажный таймлайн и другие.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@500;700&display=swap">
<style>
  :root{
    --bg:#0c0d10; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09); --ink:#f3f1ee; --ink-2:rgba(243,241,238,.66); --ink-3:rgba(243,241,238,.42);
    --sun:#ff8a3d; --sun-2:#ffb35c;
    --f-ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --f-wide:'Unbounded','Manrope',sans-serif;
    --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  a{color:var(--sun-2)}
  header{display:flex;align-items:center;gap:14px;padding:14px var(--gr) 14px var(--gl);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .back{display:flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:13.5px;padding:7px 10px;border-radius:10px}
  .back:hover{background:rgba(255,255,255,.08);color:var(--ink)}
  .back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
  header h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
  header p{margin:0;color:var(--ink-3);font-size:13px}
  .wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;padding:16px var(--gr) 28px var(--gl);max-width:1440px;margin:0 auto}
  .list{display:flex;flex-direction:column;gap:4px}
  .list button{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid transparent}
  .list button:hover{background:var(--card)}
  .list button.on{background:var(--card);border-color:rgba(255,138,61,.5)}
  .list .n{font:700 12px var(--f-mono);color:var(--sun-2);padding-top:2px;flex:none;width:20px}
  .list b{display:block;font-size:14px}
  .list small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.35}
  .main{display:flex;flex-direction:column;gap:14px;min-width:0}
  .stage{position:relative;height:600px;border-radius:20px;overflow:hidden;border:1px solid var(--line);container-type:inline-size;background:#000}
  .stage > .v{position:absolute;inset:0;overflow:hidden}
  .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:12px;font-weight:700;font-size:13.5px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
  .btn:hover{background:rgba(255,255,255,.13)}
  .btn.sun{background:var(--sun);color:#1d0f05;border-color:transparent}
  .btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ctl .pos{margin-left:auto;font:600 12.5px var(--f-mono);color:var(--ink-3)}
  .about{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .about div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .about b{display:block;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--sun-2);margin-bottom:6px}
  .about p{margin:0;font-size:13.5px;color:var(--ink-2)}
  .dots{letter-spacing:2px;color:var(--sun)} .dots i{font-style:normal;color:rgba(255,255,255,.18)}
  .title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .title h2{margin:0;font-size:24px;letter-spacing:-.02em}
  .title span{color:var(--ink-2)}
  @media (max-width: 960px){
    .wrap{grid-template-columns:1fr}
    .list{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:0 var(--gr) 4px var(--gl)}
    .list button{flex:0 0 200px}
    .about{grid-template-columns:1fr 1fr}
    .stage{height:640px}
  }
  @media (max-width: 560px){ .about{grid-template-columns:1fr} .title h2{font-size:20px} }

  /* shared bits */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.85)}60%{transform:scale(1.03)}100%{opacity:1;transform:none}}
  .cur::after{content:'▍';animation:blink 1s steps(1) infinite}

  /* ===== 1. HUD ===== */
  .v-hud{background:radial-gradient(800px 500px at 50% 45%, #0b2633, #03070b 70%);color:#bff6ff;font-family:var(--f-mono);display:flex;flex-direction:column}
  .v-hud::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(77,232,255,.04) 0 1px, transparent 1px 3px);pointer-events:none}
  .hud-top{display:flex;gap:18px;padding:12px 18px;font-size:11px;letter-spacing:.12em;color:rgba(191,246,255,.6);border-bottom:1px solid rgba(77,232,255,.18);flex-wrap:wrap}
  .hud-top b{color:#4de8ff;letter-spacing:.2em}
  .hud-top .hud-st{margin-left:auto;color:#4de8ff}
  .hud-main{flex:1;display:grid;grid-template-columns:1fr 300px 1fr;gap:18px;padding:18px;min-height:0}
  .hud-log{overflow-y:auto;display:flex;flex-direction:column;gap:12px;font-size:13px;scrollbar-width:none}
  .hud-l em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.16em;color:rgba(77,232,255,.55);margin-bottom:2px}
  .hud-l.me{color:rgba(191,246,255,.7)} .hud-l.me em{color:#ffb35c}
  .hud-l.tw{border-left:2px solid #4de8ff;padding-left:10px;text-shadow:0 0 8px rgba(77,232,255,.45)}
  .hud-core{position:relative;display:flex;align-items:center;justify-content:center}
  .hud-core svg{width:100%;max-width:300px;overflow:visible}
  .hud-core circle{fill:none;stroke:#4de8ff;transform-origin:100px 100px}
  .hud-core .r1{stroke-width:1;stroke-dasharray:1 5;animation:spin 30s linear infinite}
  .hud-core .r2{stroke-width:2;stroke-dasharray:60 18 6 18;opacity:.8;animation:spin 14s linear infinite reverse}
  .hud-core .r3{stroke-width:6;stroke-dasharray:3 9;opacity:.5;animation:spin 9s linear infinite}
  .hud-core .r4{stroke-width:1;opacity:.35}
  .hud-core .core{fill:rgba(77,232,255,.12);stroke-width:1.5;filter:drop-shadow(0 0 12px #4de8ff)}
  .s-think .hud-core .r2,.s-think .hud-core .r3{animation-duration:2s}
  .s-speak .hud-core .core{fill:rgba(77,232,255,.35)}
  .hud-core-l{position:absolute;text-align:center}
  .hud-core-l b{display:block;font-size:13px;letter-spacing:.2em;color:#4de8ff}
  .hud-core-l small{font-size:9.5px;letter-spacing:.14em;color:rgba(191,246,255,.5)}
  .hud-side{display:flex;flex-direction:column;gap:12px;overflow:hidden}
  .hud-card{position:relative;padding:12px 14px;background:rgba(77,232,255,.05);animation:rise .4s}
  .hud-card::before,.hud-card::after{content:'';position:absolute;width:14px;height:14px;border:1.5px solid #4de8ff}
  .hud-card::before{left:0;top:0;border-right:0;border-bottom:0}.hud-card::after{right:0;bottom:0;border-left:0;border-top:0}
  .hud-card h5{margin:0 0 8px;font-size:10.5px;letter-spacing:.18em;color:#4de8ff;font-weight:700}
  .hud-card div{display:flex;gap:10px;font-size:12.5px;padding:4px 0;border-top:1px dashed rgba(77,232,255,.18)}
  .hud-card div i{font-style:normal;color:#ffb35c;flex:none}
  .hud-card div small{display:block;color:rgba(191,246,255,.5);font-size:11px}
  .hud-wave{height:54px;display:flex;align-items:center;justify-content:center;gap:4px;border-top:1px solid rgba(77,232,255,.18)}
  .hud-wave i{width:4px;height:36px;background:#4de8ff;border-radius:2px;transform:scaleY(.1);box-shadow:0 0 8px #4de8ff}
  @container (max-width:760px){
    .hud-main{grid-template-columns:1fr;grid-template-rows:170px 1fr auto}
    .hud-core svg{max-width:170px}
    .hud-side{max-height:150px}
  }

  /* ===== 2. Terminal ===== */
  .v-term{background:#020604;color:#3dff8a;font:13px/1.55 var(--f-mono);padding:18px 20px;display:flex;flex-direction:column;text-shadow:0 0 6px rgba(61,255,138,.55)}
  .v-term::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 1px, transparent 1px 3px);pointer-events:none;z-index:2}
  .v-term::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(0,0,0,.9);pointer-events:none;z-index:2}
  .term-head{color:rgba(61,255,138,.6);white-space:pre;overflow:hidden;font-size:12px}
  .term-log{flex:1;overflow-y:auto;scrollbar-width:none;white-space:pre-wrap;word-break:break-word}
  .term-log .p{color:#ffd35c;text-shadow:0 0 6px rgba(255,211,92,.5)}
  .term-log .dim{color:rgba(61,255,138,.55)}
  .term-box{white-space:pre;overflow-x:auto;scrollbar-width:none;color:#9dffc2;margin:6px 0 10px}
  .term-st{border-top:1px solid rgba(61,255,138,.3);padding-top:8px;display:flex;gap:16px;color:rgba(61,255,138,.7);font-size:12px;flex-wrap:wrap}

  /* ===== 3. RPG ===== */
  .v-rpg{background:linear-gradient(#1b1442 0%, #3b2a6b 45%, #d07a4a 72%, #2b1b2e 72.2%, #1a1020 100%);font-family:var(--f-mono);color:#fff;image-rendering:pixelated}
  .rpg-floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 48px),repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 24px)}
  .rpg-sky{position:absolute;inset:0;background:radial-gradient(2px 2px at 20% 20%, #fff, transparent),radial-gradient(2px 2px at 70% 12%, #fff, transparent),radial-gradient(2px 2px at 40% 30%, #fff, transparent),radial-gradient(2px 2px at 85% 35%, #fff, transparent),radial-gradient(2px 2px at 10% 40%, #fff, transparent);opacity:.7}
  .rpg-sprite{position:absolute;left:50%;top:22%;width:120px;height:120px;transform:translateX(-50%);animation:bob 2.4s ease-in-out infinite}
  .rpg-sprite canvas{width:100%;height:100%;image-rendering:pixelated}
  @keyframes bob{50%{transform:translate(-50%,-8px)}}
  .rpg-hud{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700}
  .rpg-bar{display:flex;align-items:center;gap:8px}
  .rpg-bar span{width:64px}
  .rpg-bar i{display:block;width:130px;height:10px;border:2px solid #fff;background:#000;position:relative}
  .rpg-bar i::after{content:'';position:absolute;inset:0;width:var(--w);background:var(--c);transition:width .8s steps(8)}
  .rpg-box{position:absolute;left:14px;right:14px;bottom:14px;min-height:130px;background:#10103a;border:4px solid #fff;box-shadow:0 0 0 4px #10103a, 0 0 0 6px #6a6af0;padding:16px 18px 18px 120px;font-size:15px;line-height:1.55}
  .rpg-face{position:absolute;left:14px;top:14px;width:88px;height:88px;border:3px solid #fff;background:#2a1f5a}
  .rpg-face canvas{width:100%;height:100%;image-rendering:pixelated}
  .rpg-name{position:absolute;left:110px;top:-18px;background:#e84a5f;border:3px solid #fff;padding:2px 10px;font-size:12px;font-weight:700}
  .rpg-next{position:absolute;right:14px;bottom:8px;animation:blink .8s steps(1) infinite}
  .rpg-menu{position:absolute;right:14px;top:14px;background:#10103a;border:4px solid #fff;box-shadow:0 0 0 3px #6a6af0;padding:10px 14px;font-size:13px;min-width:260px;animation:pop .25s steps(4)}
  .rpg-menu h5{margin:0 0 6px;font-size:11px;color:#ffd35c;letter-spacing:.1em}
  .rpg-menu div{padding:3px 0 3px 18px;position:relative}
  .rpg-menu div.sel::before{content:'▶';position:absolute;left:0;color:#ffd35c;animation:blink .8s steps(1) infinite}
  .rpg-menu small{display:block;color:#a8a8e8;font-size:11px}
  .rpg-quest{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:#ffd35c;color:#10103a;border:4px solid #fff;padding:8px 18px;font-weight:700;font-size:14px;letter-spacing:.08em;animation:pop .3s steps(4);white-space:nowrap}
  @container (max-width:760px){
    .rpg-box{padding:56px 14px 18px 14px;font-size:14px;min-height:160px}
    .rpg-face{width:44px;height:44px;left:12px;top:12px}
    .rpg-name{left:64px}
    .rpg-menu{left:14px;right:14px;top:auto;bottom:200px;min-width:0}
    .rpg-sprite{width:84px;height:84px;top:20%}
    .rpg-hud{display:none}
  }

  /* ===== 4. Quests ===== */
  .v-quest{background:linear-gradient(160deg, #121a2e, #0b0f1a);font-family:var(--f-ui);display:flex;flex-direction:column}
  .q-top{display:flex;align-items:center;gap:14px;padding:14px 18px;background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.07);flex-wrap:wrap}
  .q-ava{width:44px;height:44px;border-radius:14px;background:radial-gradient(circle at 35% 35%, #ffe0b0, #ff8a3d 55%, #b8420f);box-shadow:0 0 18px rgba(255,138,61,.5);position:relative}
  .q-ava b{position:absolute;right:-6px;bottom:-6px;background:#7c5cff;color:#fff;font-size:11px;font-weight:800;border-radius:8px;padding:1px 6px;border:2px solid #121a2e}
  .q-who b{display:block;font-size:15px} .q-who small{color:rgba(255,255,255,.5);font-size:12px}
  .q-xp{flex:1;min-width:180px}
  .q-xp small{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(255,255,255,.55);font-weight:700;margin-bottom:4px}
  .q-xp i{display:block;height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .q-xp i::after{content:'';display:block;height:100%;width:var(--xp,40%);background:linear-gradient(90deg,#7c5cff,#28d7ff);border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .q-chip{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;padding:6px 10px;border-radius:10px;background:rgba(255,138,61,.14);color:#ffb35c}
  .q-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;padding:16px 18px;min-height:0}
  .q-chat{display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none}
  .q-m{max-width:90%;padding:9px 12px;border-radius:14px;font-size:14px;animation:rise .3s}
  .q-m.me{align-self:flex-end;background:#7c5cff;color:#fff;border-bottom-right-radius:4px}
  .q-m.tw{background:rgba(255,255,255,.07);border-bottom-left-radius:4px}
  .q-board{display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none}
  .q-board h5{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)}
  .q-card{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);animation:pop .4s}
  .q-card.best{border-color:rgba(255,200,80,.55);background:linear-gradient(90deg, rgba(255,200,80,.1), rgba(255,255,255,.04))}
  .q-card .ic{width:38px;height:38px;border-radius:11px;background:rgba(124,92,255,.2);display:flex;align-items:center;justify-content:center;color:#b8a6ff;font-weight:800;flex:none}
  .q-card .tx{flex:1;min-width:0} .q-card b{display:block;font-size:14px} .q-card small{color:rgba(255,255,255,.5);font-size:12px}
  .q-card .rw{font:800 12px var(--f-mono);color:#ffd35c;text-align:right;flex:none}
  .q-card .rw em{display:block;font-style:normal;color:rgba(255,255,255,.35);font-weight:500}
  .q-prog{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
  .q-prog i{display:block;height:100%;width:0;background:#3ddc97;transition:width 3s linear}
  .q-toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#ffd35c,#ff8a3d);color:#2a1300;padding:10px 16px;border-radius:14px;font-weight:800;box-shadow:0 10px 30px rgba(255,138,61,.4);animation:pop .4s;white-space:nowrap;z-index:3}
  .q-toast small{display:block;font-weight:600;font-size:11.5px}
  @container (max-width:760px){ .q-body{grid-template-columns:1fr;grid-template-rows:1fr 1.2fr} .q-toast{white-space:normal;width:86%} }

  /* ===== 5. Halo ===== */
  .v-halo{background:#000;font-family:var(--f-ui);display:flex;flex-direction:column;align-items:center}
  .v-halo canvas{position:absolute;inset:0;width:100%;height:100%}
  .halo-q{position:relative;margin-top:22px;color:rgba(255,255,255,.45);font-size:14px;min-height:22px;text-align:center;padding:0 20px}
  .halo-sub{position:absolute;left:8%;right:8%;bottom:96px;text-align:center;font-size:26px;font-weight:700;line-height:1.3;letter-spacing:-.01em;color:rgba(255,255,255,.18)}
  .halo-sub span.on{color:#fff;text-shadow:0 0 18px rgba(255,170,90,.6);transition:color .2s}
  .halo-pills{position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 16px}
  .halo-pills span{padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:700;background:rgba(255,138,61,.12);border:1px solid rgba(255,138,61,.35);color:#ffc591;animation:pop .4s}
  .halo-st{position:absolute;top:50%;left:50%;transform:translate(-50%, 120px);font:600 11px var(--f-mono);letter-spacing:.2em;color:rgba(255,200,150,.6)}
  @container (max-width:760px){ .halo-sub{font-size:20px;bottom:120px} .halo-st{transform:translate(-50%, 90px)} }

  /* ===== 6. Neural ===== */
  .v-neuro{background:radial-gradient(700px 400px at 50% 42%, #14102a, #07060d 75%);font-family:var(--f-ui);display:flex;flex-direction:column}
  .neuro-q{padding:14px 18px 0;font-size:13px;color:rgba(255,255,255,.5)} .neuro-q b{color:#c9b8ff;font:600 11px var(--f-mono);letter-spacing:.14em;margin-right:8px}
  .neuro-g{flex:1;min-height:0;position:relative}
  .neuro-g svg{position:absolute;inset:0;width:100%;height:100%}
  .neuro-g line{stroke:rgba(201,184,255,.12);stroke-width:1.2}
  .neuro-g line.on{stroke:#a98bff;stroke-width:2.2;stroke-dasharray:6 6;animation:flow .6s linear infinite;filter:drop-shadow(0 0 6px #a98bff)}
  @keyframes flow{to{stroke-dashoffset:-12}}
  .neuro-n{position:absolute;transform:translate(-50%,-50%);padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);white-space:nowrap;transition:all .35s}
  .neuro-n.on{background:rgba(169,139,255,.22);border-color:#a98bff;color:#fff;box-shadow:0 0 22px rgba(169,139,255,.55)}
  .neuro-c{position:absolute;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #fff2e0, #ff8a3d 50%, #6b2bd6 100%);box-shadow:0 0 50px rgba(169,139,255,.6);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .s-think .neuro-c{animation:pulse .7s ease-in-out infinite alternate}
  @keyframes pulse{to{transform:translate(-50%,-50%) scale(1.08)}}
  .neuro-a{margin:0 18px 16px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(169,139,255,.3);min-height:96px}
  .neuro-a .k{font:600 10.5px var(--f-mono);letter-spacing:.14em;color:#a98bff;margin-bottom:4px}
  .neuro-a p{margin:0;font-size:15px}
  .neuro-a .ch{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const el = (tag, cls, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; e.innerHTML = html; return e; };
let token = 0;
const alive = t => t === token;
async function type(node, text, speed = 18) {
  const my = token; node.classList.add('cur');
  for (let i = 0; i <= text.length; i += 2) { if (!alive(my)) return; node.textContent = text.slice(0, i); scrollUp(node); await sleep(speed); }
  node.textContent = text; node.classList.remove('cur');
}
const scrollUp = n => { const p = n.closest('[data-scroll]'); if (p) p.scrollTop = p.scrollHeight; };

/* ---------- one conversation for all ten windows (an example, not real data) ---------- */
const CARDS = {
  ideas:{ title:'Идеи на сегодня', items:[
    { t:'Ремейк залёта', s:'та же тема и кодовое слово, новый хук', best:true },
    { t:'Карусель-ремикс', s:'новая обложка, хук и CTA, 8 слайдов' },
    { t:'«3 ошибки»', s:'говорящая голова, «антипример → пример»' }] },
  vision:{ title:'Кадр: что поправить', items:[
    { t:'Свет', s:'повернись к окну на 15°' },
    { t:'Ракурс', s:'камера на уровне глаз' },
    { t:'Фон', s:'убери кружку с края кадра' }] },
  task:{ title:'Задача агенту', items:[
    { t:'Сценарий 2.0', s:'ремейк залёта' },
    { t:'Агент монтажа', s:'стиль «Студии Кадрика»' },
    { t:'Проверка', s:'принесёт к твоему столу' }] },
};
const SCRIPT = [
  { me:'Что снимаем сегодня?', alt:['Что по почте?', 'Покажи план недели'],
    twin:'Три варианта. Сильнее всего — ремейк залёта: тема уже сработала, меняем только хук.', card:'ideas', uses:['Сценарии', 'Профиль', 'Память'] },
  { me:'Посмотри, как я в кадре.', alt:['Проверь звук', 'Какой образ?'],
    twin:'Вижу тебя. Повернись чуть к окну — на лице тень. И подними камеру до уровня глаз.', card:'vision', uses:['Камера', 'Монтаж'] },
  { me:'Ок. Отдай сценарий в монтаж.', alt:['Сначала покажи текст', 'Отложи на завтра'],
    twin:'Передал агенту монтажа. Принесёт рилс на проверку к твоему столу.', card:'task', uses:['Агенты', 'Офис', 'Сценарии'] },
];
const ST = { idle:'готов', listen:'слушаю', think:'думаю', speak:'говорю', look:'смотрю' };
const cardRows = (k, fn) => CARDS[k].items.map(fn).join('');

/* ---------- pixel sprite for the RPG window ---------- */
function pixelOrb(c, t = 0) {
  const g = c.getContext('2d'), n = c.width; g.clearRect(0, 0, n, n);
  const cx = n / 2, cy = n / 2, R = n * 0.27;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const dx = x - cx + 0.5, dy = y - cy + 0.5, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
    if (d < R) { const lit = (-dx - dy) / R; g.fillStyle = lit > 0.55 ? '#ffe7b8' : lit > 0 ? '#ffa04d' : lit > -0.6 ? '#e8662a' : '#9b3410'; g.fillRect(x, y, 1, 1); }
    else if (d < R + 4 + 2 * Math.sin(a * 8 + t * 4) && Math.round((a + t) * 8 / Math.PI) % 2 === 0) { g.fillStyle = '#ffcf5c'; g.fillRect(x, y, 1, 1); }
  }
}

/* ---------- the ten windows ---------- */
const V = [
{ id:'hud', name:'HUD «Джарвис»', pitch:'Голографический интерфейс из фантастики',
  idea:'Окно как шлем-дисплей: в центре вращающееся ядро, слева бегущая расшифровка, справа всплывают панели данных, внизу — волна голоса.',
  mech:'Кольца ядра крутятся быстрее, когда двойник думает; телеметрия сверху — задержка, камера, сколько знаний подключено.',
  good:'Самый «технологичный» вид, отлично смотрится на вебинаре и в рилсах про ИИ.', cost:2,
  build(r) {
    r.innerHTML = `<div class="hud-top"><b>ДВОЙНИК</b><span>СВЯЗЬ ● СТАБИЛЬНА</span><span>ЗАДЕРЖКА 0.8 С</span><span>КАМЕРА ●</span><span>ЗНАНИЯ 4/8</span><span class="hud-st">ГОТОВ</span></div>
      <div class="hud-main"><div class="hud-log" data-scroll></div>
      <div class="hud-core"><svg viewBox="0 0 200 200"><circle class="r4" cx="100" cy="100" r="98"/><circle class="r1" cx="100" cy="100" r="90"/><circle class="r2" cx="100" cy="100" r="74"/><circle class="r3" cx="100" cy="100" r="58"/><circle class="core" cx="100" cy="100" r="34"/></svg><div class="hud-core-l"><b class="hud-st2">ГОТОВ</b><small>ГОЛОС · ЗРЕНИЕ · ЗНАНИЯ</small></div></div>
      <div class="hud-side"></div></div><div class="hud-wave">${'<i></i>'.repeat(48)}</div>`;
    const log = r.querySelector('.hud-log'), side = r.querySelector('.hud-side'), bars = [...r.querySelectorAll('.hud-wave i')];
    return {
      me(t) { log.append(el('div', 'hud-l me', `<em>&gt; ИЛЬЯ</em>${esc(t)}`)); log.scrollTop = 1e6; },
      async twin(t) { const d = el('div', 'hud-l tw', '<em>◆ ДВОЙНИК</em><span></span>'); log.append(d); await type(d.lastChild, t); },

  good:'Ощущение настоящего собеседника, а не чата. Лучший фон для съёмки «я говорю со своим ИИ».', cost:2,
  build(r) {
    r.innerHTML = `<canvas></canvas><div class="halo-q"></div><div class="halo-st">ГОТОВ</div><div class="halo-sub"></div><div class="halo-pills"></div>`;
    const c = r.querySelector('canvas'), g = c.getContext('2d'), q = r.querySelector('.halo-q'), sub = r.querySelector('.halo-sub'), pills = r.querySelector('.halo-pills'), st = r.querySelector('.halo-st');
    const P = Array.from({ length:520 }, (_, i) => { const y = 1 - (i / 519) * 2, rr = Math.sqrt(1 - y * y), th = i * 2.39996; return [Math.cos(th) * rr, y, Math.sin(th) * rr]; });
    return {
      me(t) { q.textContent = '— ' + t; },
      async twin(t) {
        const my = token; sub.innerHTML = t.split(' ').map(w => `<span>${esc(w)}</span>`).join(' '); pills.innerHTML = '';
        for (const s of sub.children) { if (!alive(my)) return; s.classList.add('on'); await sleep(170); }
      },
      card(k) { CARDS[k].items.forEach(it => pills.append(el('span', '', esc(it.t)))); },
      state(s) { st.textContent = ST[s].toUpperCase(); },
      frame(t, l) {
        const w = c.width = c.clientWidth * devicePixelRatio, h = c.height = c.clientHeight * devicePixelRatio, cx = w / 2, cy = h * 0.42, R = Math.min(w, h) * (0.2 + l * 0.05);
        g.clearRect(0, 0, w, h);
        const ay = t * 0.4, ax = Math.sin(t * 0.3) * 0.4;
        for (const [x0, y0, z0] of P) {
          let x = x0 * Math.cos(ay) - z0 * Math.sin(ay), z = x0 * Math.sin(ay) + z0 * Math.cos(ay), y = y0 * Math.cos(ax) - z * Math.sin(ax); z = y0 * Math.sin(ax) + z * Math.cos(ax);
          const wob = 1 + l * 0.18 * Math.sin(t * 6 + y0 * 9 + x0 * 5), s = (z + 2) / 3;
          g.fillStyle = `rgba(255,${150 + 80 * s | 0},${80 + 60 * s | 0},${0.15 + s * 0.75})`;
          g.beginPath(); g.arc(cx + x * R * wob, cy + y * R * wob, (0.6 + s * 1.6) * devicePixelRatio, 0, 6.283); g.fill();
        }
      },
    };
  } },

{ id:'timeline', name:'Монтажный таймлайн', pitch:'Разговор как проект в монтажке',
  idea:'Окно устроено как видеоредактор: превью с двойником и субтитрами, инспектор справа, внизу дорожки «Илья», «Двойник», «Сцена», «Агенты».',
  mech:'Каждая реплика — клип с волной на своей дорожке, карточки — клипы сцены, задачи — клипы агентов. Разговор сразу готов как заготовка для рилса: субтитры и тайм-коды уже есть.',
  good:'Говорит на языке создателя контента; разговор можно сразу экспортировать в монтаж «Студии Кадрика».', cost:3,
  build(r) {
    r.innerHTML = `<div class="tl-top"><div class="tl-prev"><span class="tc">00:00:00</span><span class="rec">● REC</span><div class="o"></div><div class="sub"></div></div>
      <div class="tl-insp"><h5>Инспектор</h5><b>Ожидаю реплику</b></div></div>
      <div class="tl-tracks"><div class="tl-ruler"></div>${['ИЛЬЯ', 'ДВОЙНИК', 'СЦЕНА', 'АГЕНТЫ'].map((n, i) => `<div class="tl-row"><span>${n}</span><div class="tl-lane" data-l="${i}"></div></div>`).join('')}<div class="tl-head"></div></div>`;
    const lanes = [...r.querySelectorAll('.tl-lane')], sub = r.querySelector('.sub'), insp = r.querySelector('.tl-insp'), head = r.querySelector('.tl-head'), tc = r.querySelector('.tc'), o = r.querySelector('.o');
    let x = 6, t0 = performance.now();
    const clip = (lane, cls, label, w) => { const c = el('div', 'tl-clip ' + cls, esc(label)); c.style.left = x + 'px'; c.style.width = w + 'px'; lanes[lane].append(c); return w; };
    const off = () => lanes[0].getBoundingClientRect().left - r.querySelector('.tl-tracks').getBoundingClientRect().left;
    return {
      me(t) { x += clip(0, 'me', t, Math.max(70, t.length * 4)) + 6; sub.innerHTML = esc(t); insp.innerHTML = `<h5>Клип · Илья</h5><b>${esc(t)}</b>`; },
      async twin(t) { const w = Math.max(90, t.length * 3.2); clip(1, 'tw', t, w); sub.textContent = ''; await type(sub, t); x += w + 6; },
      card(k) { const w = clip(k === 'task' ? 3 : 2, k === 'task' ? 'ag' : 'cd', CARDS[k].title, 120); x += 4;
        insp.innerHTML = `<h5>${k === 'task' ? 'Клип · Агенты' : 'Клип · Сцена'}</h5><b>${CARDS[k].title}</b>` + cardRows(k, (it, i) => `<div><i>${String(i + 1).padStart(2, '0')}</i><span>${esc(it.t)}<small>${esc(it.s)}</small></span></div>`); },
      state() {},
      frame(t, l) {
        const lim = lanes[0].clientWidth - 4, px = Math.min(x, lim); head.style.left = off() + px + 'px';
        const s = (performance.now() - t0) / 1000; tc.textContent = `00:${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
        o.style.transform = `scale(${1 + l * 0.15})`;
        if (x > lim) lanes.forEach(L => L.style.transform = `translateX(${lim - x}px)`);
      },
    };
  } },
];

/* ---------- player ---------- */
let cur = 0, api = null, mode = 'idle';
function setState(s) { mode = s; const v = $('stage').firstElementChild; if (v) v.className = `v v-${V[cur].id} s-${s}`; api?.state?.(s); }
async function play() {
  const my = ++token;
  api?.stop?.();
  const v = V[cur], root = el('div', `v v-${v.id} s-idle`);
  $('stage').replaceChildren(root);
  api = v.build(root);
  await sleep(700);
  for (const s of SCRIPT) {
    if (!alive(my)) return;
    setState('listen'); await sleep(700); if (!alive(my)) return;
    await api.me(s.me); await sleep(600); if (!alive(my)) return;
    setState(s.card === 'vision' ? 'look' : 'think'); await sleep(900); if (!alive(my)) return;
    setState('speak'); await api.twin(s.twin); if (!alive(my)) return;
    await sleep(250); api.card(s.card);
    setState('idle'); await sleep(1700);
  }
}
let lv = 0;
(function loop(ms) {
  const t = ms / 1000, tgt = mode === 'speak' ? 0.55 + 0.4 * Math.abs(Math.sin(t * 13) * Math.sin(t * 5.3)) : mode === 'listen' ? 0.25 + 0.2 * Math.abs(Math.sin(t * 9)) : mode === 'think' || mode === 'look' ? 0.2 : 0.05;
  lv += (tgt - lv) * 0.2;
  try { api?.frame?.(t, lv); } catch {}
  requestAnimationFrame(loop);
})(0);

function select(i) {
  cur = (i + V.length) % V.length;
  const v = V[cur];
  for (const b of $('list').children) b.classList.toggle('on', Number(b.dataset.i) === cur);
  $('list').children[cur].scrollIntoView({ block:'nearest', inline:'nearest' });
  $('vName').textContent = `${cur + 1}. ${v.name}`; $('vPitch').textContent = v.pitch;
  $('pos').textContent = `${cur + 1} / ${V.length}`;
  const dots = n => `<span class="dots">${'●'.repeat(n)}<i>${'●'.repeat(3 - n)}</i></span>`;
  $('about').innerHTML = `<div><b>Идея</b><p>${esc(v.idea)}</p></div><div><b>Механика</b><p>${esc(v.mech)}</p></div><div><b>Чем хорош</b><p>${esc(v.good)}</p></div><div><b>Сложность</b><p>${dots(v.cost)} ${['', 'день-два: только вёрстка', 'неделя: вёрстка и анимации', 'две недели: нужна логика и данные'][v.cost]}</p></div>`;
  history.replaceState(null, '', '?v=' + (cur + 1));
  play();
}
$('list').innerHTML = V.map((v, i) => `<button data-i="${i}"><span class="n">${String(i + 1).padStart(2, '0')}</span><span><b>${esc(v.name)}</b><small>${esc(v.pitch)}</small></span></button>`).join('');
$('list').addEventListener('click', e => { const b = e.target.closest('button'); if (b) select(Number(b.dataset.i)); });
$('prev').onclick = () => select(cur - 1); $('next').onclick = () => select(cur + 1); $('replay').onclick = () => select(cur);
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') select(cur + 1); if (e.key === 'ArrowLeft') select(cur - 1); });
select(Math.max(0, Math.min(V.length - 1, (Number(new URLSearchParams(location.search).get('v')) || 1) - 1)));
window.__concepts = { V, select };
})();
</script>
</body>
