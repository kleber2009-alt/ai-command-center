<style>
  :root{
    --card:rgba(18,14,12,.78); --fg:#fff; --sub:#c9b9a6; --accent:#ffb45c; --border:rgba(255,200,140,.25);
    --font:'Inter',system-ui,sans-serif; --title:'Inter',system-ui,sans-serif; --page:#0a0f1f;
    --gap:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--page);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
  #stage,#labels{position:fixed;inset:0}
  #labels{pointer-events:none}
  .glass{background:var(--card);border:1px solid var(--border);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
  svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .brand{position:fixed;left:var(--gap);top:var(--gap);display:flex;align-items:center;gap:18px;padding:10px 16px;z-index:5}
  .brand b{font-family:var(--title);font-size:17px;letter-spacing:.06em;display:block}
  .brand small{color:var(--sub);font-size:11.5px}
  .stats{display:flex;gap:14px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
  .stats span{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .stats strong{color:var(--fg);font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

  .tools{position:fixed;right:var(--gap);top:var(--gap);display:flex;gap:8px;z-index:5}
  .tools button{width:38px;height:38px;display:grid;place-items:center;color:var(--fg);cursor:pointer}
  .tools button[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}

  .lab{transform:translateX(50%)}
  .room{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;border-radius:10px;
        background:var(--card);border:1px solid var(--border);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
        color:var(--fg);white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .room .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--border);color:var(--accent)}
  .room small{font-family:'Inter',sans-serif}
  .room b{font-family:var(--title);font-size:12.5px;display:block;line-height:1.2}
  .room small{font-size:10.5px;color:var(--sub);display:block;line-height:1.25}
  .room .n{margin-left:4px;min-width:22px;height:22px;padding:0 6px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;
           background:rgba(127,127,127,.18);font-variant-numeric:tabular-nums}
  body.nolabels .room{display:none}
  .name{font-size:10.5px;padding:2px 6px;border-radius:6px;background:var(--card);border:1px solid var(--border);color:var(--fg);white-space:nowrap;transform:translateY(-4px)}
  body:not(.names) .name{display:none}
  .bubble{font-size:11px;line-height:1.25;max-width:180px;padding:5px 8px;border-radius:9px;background:#fff;color:#111;white-space:normal;text-align:center;
          box-shadow:0 4px 14px rgba(0,0,0,.3);transform:translateY(-10px);animation:pop .25s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(-2px) scale(.9)}to{opacity:1;transform:translateY(-10px) scale(1)}}

  .feed{position:fixed;left:var(--gap);bottom:calc(var(--gap) + 74px);width:300px;padding:12px 14px;z-index:4}
  .feed h3,.tasks h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600}
  .feed ol{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:12px;line-height:1.35}
  .feed li:nth-child(n+5){display:none}
  .feed li{display:flex;gap:8px;animation:pop2 .3s ease-out}
  .feed time{color:var(--sub);font-variant-numeric:tabular-nums;flex:none;font-size:11px;padding-top:1px}
  @keyframes pop2{from{opacity:0;transform:translateX(-6px)}}

  .tasks{position:fixed;right:var(--gap);top:calc(var(--gap) + 52px);width:330px;max-height:calc(100vh - 170px);overflow:auto;padding:12px 14px;z-index:4}
  .tasks p{margin:0 0 10px;font-size:11.5px;color:var(--sub)}
  .tasks ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .tasks a{display:block;padding:8px 9px;border-radius:9px;color:var(--fg);text-decoration:none;font-size:12px;line-height:1.35;border:1px solid transparent}
  .tasks a:hover,.tasks a:focus-visible{border-color:var(--border);background:rgba(127,127,127,.1);outline:none}
  .tasks a small{display:block;color:var(--sub);font-size:10.5px;margin-top:3px}
  body.notasks .tasks{display:none}

  .variants{position:fixed;left:50%;bottom:var(--gap);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:5;max-width:calc(100vw - 2*var(--gap))}
  .chips{display:flex;gap:6px;padding:6px;overflow-x:auto;max-width:100%;scrollbar-width:none}
  .chips button{flex:none;padding:8px 12px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--sub);font:600 12.5px var(--font);cursor:pointer;white-space:nowrap}
  .chips button[aria-current=true]{color:var(--fg);border-color:var(--accent);background:rgba(127,127,127,.14)}
  .chips button:focus-visible{outline:2px solid var(--accent)}
  .vdesc{font-size:12px;color:var(--sub);padding:6px 12px;text-align:center}

  .tip{position:fixed;z-index:10;width:290px;padding:14px;font-size:12.5px;line-height:1.4}
  .tip h4{margin:0 0 2px;font-family:var(--title);font-size:15px}
  .tip .role{color:var(--sub);margin-bottom:10px}
  .tip dl{margin:0;display:grid;gap:8px}
  .tip dt{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
  .tip dd{margin:2px 0 0}
  .tip a{color:var(--accent)}

  @media (max-width:820px){
    :root{--gap:10px}
    .brand{right:calc(var(--gap) + 136px);gap:10px;flex-wrap:wrap;padding:8px 12px}
    .stats{gap:10px;font-size:11.5px}
    .feed{width:auto;right:var(--gap);bottom:calc(var(--gap) + 86px);padding:10px 12px}
    .feed li:nth-child(n+3){display:none}
    .tasks{left:var(--gap);right:var(--gap);width:auto;top:auto;bottom:calc(var(--gap) + 86px);max-height:50vh}
    body:not(.notasks) .feed{display:none}
    .vdesc{display:none}
    .room small,.room b{display:none}
    .bubble{font-size:10px;max-width:120px}
    .room{padding:4px 6px 4px 4px;gap:6px}
    .room .ic{width:22px;height:22px}
    .variants{left:var(--gap);right:var(--gap);transform:none}
  }
</style>

const GEO = {};
function rbox(w, h, d, r = .04) {

const SCREEN_CACHE = new Map();
const scrolling = [];
function screenTex(kind, color) {
  const key = kind + color + T.id;
  if (SCREEN_CACHE.has(key)) return SCREEN_CACHE.get(key);
  const light = T.light || T.id === 'blueprint';
  const ink = light ? 'rgba(20,30,50,.35)' : 'rgba(255,255,255,.28)';
  const tex = canvasTex(256, 160, (x, w, h) => {
    x.fillStyle = T.screenBg; x.fillRect(0, 0, w, h);
    x.fillStyle = color; x.fillRect(0, 0, w, 10);
    const R = () => Math.random();
    if (kind === 'code') {
      for (let y = 18; y < h * 2; y += 9) { x.fillStyle = R() < .35 ? color : ink; rr(x, 10 + Math.floor(R() * 4) * 12, y, 30 + R() * 140, 4, 2); }
    } else if (kind === 'chat') {
      for (let y = 18; y < h * 2; y += 22) { const me = R() < .5; x.fillStyle = me ? color : ink; rr(x, me ? w - 130 : 12, y, 90 + R() * 28, 14, 7); }
    } else if (kind === 'chart' || kind === 'ads') {
      for (let i = 0; i < 10; i++) { const bh = 20 + R() * 90; x.fillStyle = i % 3 ? ink : color; rr(x, 14 + i * 23, h - 14 - bh, 15, bh, 3); }
      x.strokeStyle = color; x.lineWidth = 3; x.beginPath();
      for (let i = 0; i <= 10; i++) x.lineTo(14 + i * 23, 120 - i * 7 - R() * 18);
      x.stroke();
      if (kind === 'ads') { x.fillStyle = color; x.font = 'bold 22px sans-serif'; x.fillText('ROMI 312%', 14, 40); }
    } else if (kind === 'doc') {
      x.fillStyle = color; rr(x, 20, 22, 120, 10, 3);
      for (let y = 44; y < h - 10; y += 11) { x.fillStyle = ink; rr(x, 20, y, 120 + R() * 100, 5, 2); }
    } else if (kind === 'slides') {
      x.fillStyle = ink; rr(x, 14, 20, 228, 128, 8);
      x.fillStyle = color; rr(x, 30, 40, 110, 14, 4); rr(x, 150, 40, 76, 92, 8);
      x.fillStyle = light ? 'rgba(20,30,50,.5)' : 'rgba(255,255,255,.5)'; rr(x, 30, 64, 100, 6, 3); rr(x, 30, 76, 80, 6, 3);
    } else if (kind === 'media') {
      for (let i = 0; i < 6; i++) { x.fillStyle = i % 2 ? color : ink; rr(x, 14 + (i % 3) * 78, 20 + Math.floor(i / 3) * 66, 70, 58, 6); }
    } else if (kind === 'flow') {
      const P = [[40, 50], [128, 40], [210, 60], [70, 120], [170, 118]];
      x.strokeStyle = ink; x.lineWidth = 3;
      [[0,1],[1,2],[0,3],[3,4],[1,4],[2,4]].forEach(([a, b]) => { x.beginPath(); x.moveTo(...P[a]); x.lineTo(...P[b]); x.stroke(); });
      P.forEach((p, i) => { x.fillStyle = i % 2 ? ink : color; x.beginPath(); x.arc(p[0], p[1], 14, 0, 7); x.fill(); });
    } else if (kind === 'calendar') {
      for (let i = 0; i < 28; i++) { x.fillStyle = R() < .3 ? color : ink; rr(x, 14 + (i % 7) * 33, 22 + Math.floor(i / 7) * 33, 28, 28, 4); }
    } else if (kind === 'timeline') {
      x.fillStyle = ink; rr(x, 50, 18, 156, 70, 6);
      for (let t = 0; t < 4; t++) for (let c = 0; c < 4; c++) { x.fillStyle = (t + c) % 3 ? ink : color; rr(x, 10 + c * 62 + R() * 8, 96 + t * 15, 40 + R() * 16, 11, 3); }
      x.fillStyle = '#fff'; x.fillRect(120, 92, 2, 64);
    } else if (kind === 'video') {
      x.fillStyle = ink; rr(x, 40, 18, 176, 130, 10);
      x.fillStyle = color; x.beginPath(); x.arc(128, 70, 26, 0, 7); x.fill(); rr(x, 84, 100, 88, 48, 24);
    }
  });
  if (kind === 'code' || kind === 'chat') { tex.wrapT = THREE.RepeatWrapping; tex.repeat.y = .5; scrolling.push(tex); }
  SCREEN_CACHE.set(key, tex);
  return tex;
}

function buildShell(root) {

  const s2 = new THREE.Mesh(new THREE.PlaneGeometry(10, .6), new THREE.MeshBasicMaterial({
    map:textTex('CREATE · AUTOMATE · SCALE', T.sign, '700 64px Inter, sans-serif', 1024, 64), transparent:true, toneMapped:false }));
  s2.material.color.setScalar(T.bloom ? 1.4 : 1);

function doorPoint(room, [side, c]) {
  const [x0, z0, x1, z1] = room.r;
  if (side === 's') return { at:[c, z1], inP:[c, z1 - .9], out:[c, z1 + 1] };
  if (side === 'n') return { at:[c, z0], inP:[c, z0 + .9], out:[c, z0 - 1] };
  if (side === 'w') return { at:[x0, c], inP:[x0 + .9, c], out:[x0 - 1, c] };
  return { at:[x1, c], inP:[x1 - .9, c], out:[x1 + 1, c] };
}

function buildWalls(root) {
  const segs = new Map();
  for (const room of ROOMS) {
    if (room.open) continue;
    const [x0, z0, x1, z1] = room.r;
    const edges = { n:[[x0, z0], [x1, z0]], s:[[x0, z1], [x1, z1]], w:[[x0, z0], [x0, z1]], e:[[x1, z0], [x1, z1]] };
    for (const [side, [a, b]] of Object.entries(edges)) {
      if ((side === 'n' && z0 === -14) || (side === 'w' && x0 === -22) || (side === 'e' && x1 === 22)) continue;
      const key = [a, b].flat().join();
      const gaps = room.doors.filter(d => d[0] === side).map(d => d[1]);
      const prev = segs.get(key);
      segs.set(key, { a, b, gaps:[...(prev?.gaps || []), ...gaps], low:side === 's' && z1 === 14 });
    }
  }
  const glass = M(T.glass[0], { opacity:T.glass[1], rough:.08, metal:.1 });
  const frame = M(T.frame, { rough:.4, metal:T.metal ? .9 : .1 });
  const trim = T.trim[1] > 0 ? M(T.trim[0], { basic:true, glow:T.trim[1], toneMapped:false }) : frame;
  for (const { a, b, gaps, low } of segs.values()) {
    const horiz = a[1] === b[1];
    const from = horiz ? a[0] : a[1], to = horiz ? b[0] : b[1];
    const cuts = [[from, from]];
    gaps.sort((p, q) => p - q).forEach(g => cuts.push([g - .85, g + .85]));
    cuts.push([to, to]);
    const H = low ? 1 : 2.3;
    for (let i = 0; i < cuts.length - 1; i++) {
      const s = cuts[i][1], e = cuts[i + 1][0], L = e - s;
      if (L <= .05) continue;
      const mid = (s + e) / 2;
      const pos = horiz ? [mid, a[1]] : [a[0], mid];
      const dims = (h, t) => horiz ? [L, h, t] : [t, h, L];
      const g = box(root, ...dims(H, .05), glass, pos[0], H / 2, pos[1], { round:false, shadow:false, noedge:true });
      g.renderOrder = 2;
      box(root, ...dims(.07, .09), frame, pos[0], H, pos[1], { round:false, shadow:false });
      box(root, ...dims(.06, .1), trim, pos[0], .04, pos[1], { round:false, shadow:false });
      for (let p = s; p <= e + .01; p += Math.max(L / Math.ceil(L / 2.6), .1)) {
        const pp = horiz ? [p, a[1]] : [a[0], p];
        box(root, .07, H, .07, frame, pp[0], H / 2, pp[1], { round:false, shadow:false });
      }
    }
  }
  // полы комнат
  for (const room of ROOMS) {
    const [x0, z0, x1, z1] = room.r;
    const col = room.open ? T.hubFloor : T.roomFloor;
    const f = box(root, x1 - x0 - .1, .02, z1 - z0 - .1, M(col, { rough:T.metal ? .35 : .8, metal:T.metal ? .2 : 0 }),
      (x0 + x1) / 2, .025, (z0 + z1) / 2, { round:false, shadow:false, noedge:!room.open });
    f.castShadow = false;
  }
}

  }
  return out;
}

function addEdges(root) {

/* ───────────── Навигация по коридорам ───────────── */
function buildGraph() {
  const nodes = [], key = p => p[0].toFixed(2) + ',' + p[1].toFixed(2), idx = new Map();
  const add = p => { const k = key(p); if (!idx.has(k)) { idx.set(k, nodes.length); nodes.push({ p, e:[] }); } return idx.get(k); };
  CORRIDORS.forEach(([a, b]) => { add(a); add(b); });
  ROOMS.forEach(r => r.doors.forEach(d => add(doorPoint(r, d).out)));
  for (const [a, b] of CORRIDORS) {
    const dx = b[0] - a[0], dz = b[1] - a[1], L2 = dx * dx + dz * dz;
    const on = nodes.map((n, i) => {
      const t = ((n.p[0] - a[0]) * dx + (n.p[1] - a[1]) * dz) / L2;
      const px = a[0] + t * dx, pz = a[1] + t * dz;
      return (t >= -1e-6 && t <= 1 + 1e-6 && Math.hypot(px - n.p[0], pz - n.p[1]) < .01) ? [t, i] : null;
    }).filter(Boolean).sort((p, q) => p[0] - q[0]);
    for (let i = 0; i < on.length - 1; i++) {
      const A = on[i][1], B = on[i + 1][1];
      const w = Math.hypot(nodes[A].p[0] - nodes[B].p[0], nodes[A].p[1] - nodes[B].p[1]);
      nodes[A].e.push([B, w]); nodes[B].e.push([A, w]);
    }
  }
  const shortest = (from, to) => {
    const s = idx.get(key(from)), t = idx.get(key(to));
    const dist = nodes.map(() => Infinity), prev = nodes.map(() => -1), done = new Set();
    dist[s] = 0;
    while (done.size < nodes.length) {
      let u = -1;
      for (let i = 0; i < nodes.length; i++) if (!done.has(i) && (u < 0 || dist[i] < dist[u])) u = i;
      if (u < 0 || dist[u] === Infinity) break;
      done.add(u);
      if (u === t) break;
      for (const [v, w] of nodes[u].e) if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; }
    }
    const path = [];
    for (let u = t; u >= 0; u = prev[u]) path.unshift(nodes[u].p);
    return { len:dist[t], path };
  };
  return { shortest };
}
let GRAPH;
function route(from, fromRoom, to, toRoom) {
  if (fromRoom === toRoom) return [[to.x, to.z]];
  let best = null;
  for (const da of RM[fromRoom].doors.map(d => doorPoint(RM[fromRoom], d)))
    for (const db of RM[toRoom].doors.map(d => doorPoint(RM[toRoom], d))) {
      const g = GRAPH.shortest(da.out, db.out);
      const len = Math.hypot(from.x - da.inP[0], from.z - da.inP[1]) + g.len + Math.hypot(to.x - db.inP[0], to.z - db.inP[1]);
      if (!best || len < best.len) best = { len, pts:[da.inP, ...g.path, db.inP, [to.x, to.z]] };
    }
  return best.pts;
}

/* ───────────── Люди ───────────── */
const STATUS = { work:'#3ddc97', think:'#ffc247', pause:'#8a8f99' };
class Agent {
  constructor(def, root) {
    this.def = def; this.id = def.id;
    this.seat = SEATS[def.id];
    this.room = def.room; this.state = 'sit'; this.status = 'work';
    this.timer = rand(3, 14); this.busy = false; this.doing = TM[def.id].role;
    this.t = Math.random() * 10; this.onArrive = null; this.path = [];
    this.build(root);
    this.place(this.seat.x, this.seat.z, this.seat.face, true);
  }
  build(root) {
    const d = this.def, flat = T.flatAgents;
    const g = this.g = new THREE.Group();
    const shirt = M(flat ? '#f2f7ff' : d.color, { rough:.7 });
    const accent = M(d.color, { rough:.6 });
    const pants = M(flat ? '#cfe0f2' : (T.light ? '#3a4150' : '#24262e'), { rough:.8 });
    const skin = M(flat ? '#ffffff' : (d.skin || pick(['#f0c7a8', '#e3b497', '#c98f6d', '#f5d3bc'])), { rough:.7 });
    const legGeo = rbox(.17, .66, .2, .06);
    this.legs = [-.11, .11].map(x => {
      const p = new THREE.Group(); p.position.set(x, .7, 0);
      const m = new THREE.Mesh(legGeo, pants); m.position.y = -.33; m.castShadow = true; p.add(m); g.add(p); return p;
    });
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(.24, .42, 4, 12), shirt);
    body.position.y = 1.08; body.castShadow = true; body.userData.agent = this; g.add(body);
    if (flat) { const band = new THREE.Mesh(new THREE.CylinderGeometry(.25, .25, .1, 16), accent); band.position.y = 1.2; g.add(band); }
    const armGeo = rbox(.1, .5, .12, .05);
    this.arms = [-.33, .33].map(x => {
      const p = new THREE.Group(); p.position.set(x, 1.32, 0);
      const m = new THREE.Mesh(armGeo, shirt); m.position.y = -.24; m.castShadow = true; p.add(m); g.add(p); return p;
    });
    const head = new THREE.Mesh(new THREE.SphereGeometry(.2, 18, 14), skin);
    head.position.y = 1.6; head.castShadow = true; head.userData.agent = this; g.add(head);
    if (d.head) {
      const hair = new THREE.Mesh(new THREE.SphereGeometry(.215, 18, 12, 0, Math.PI * 2, 0, Math.PI / 2), M(flat ? '#cfe0f2' : d.hair, { rough:.9 }));
      hair.position.y = 1.62; hair.rotation.x = -.25; g.add(hair);
      if (d.long) { const h2 = box(g, .4, .45, .12, M(flat ? '#cfe0f2' : d.hair, { rough:.9 }), 0, 1.45, -.14, { r:.05 }); h2.userData.noedge = true; }
    } else {
      // у агентов вместо волос — светящийся «визор» цвета зоны ответственности
      const v = new THREE.Mesh(new THREE.BoxGeometry(.3, .06, .05), M(d.color, { basic:true, glow:T.bloom ? 1.6 : 1, toneMapped:false }));
      v.position.set(0, 1.63, .18); g.add(v);
    }
    this.dot = new THREE.Mesh(new THREE.SphereGeometry(.075, 10, 8), new THREE.MeshBasicMaterial({ color:STATUS.work, toneMapped:false }));
    this.dot.position.y = 2.02; g.add(this.dot);
    this.item = box(g, .3, .22, .22, M(d.color, { basic:true, glow:T.bloom ? 1.5 : 1, toneMapped:false }), 0, 1, .38, { shadow:false });
    this.item.visible = false;
    this.ring = new THREE.Mesh(new THREE.RingGeometry(.45, .58, 32), new THREE.MeshBasicMaterial({ color:T.ui.accent, transparent:true, opacity:.9, toneMapped:false, side:THREE.DoubleSide }));
    this.ring.rotation.x = -Math.PI / 2; this.ring.position.y = .05; this.ring.visible = false; g.add(this.ring);
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = d.name;
    const lab = new CSS2DObject(nm); lab.position.y = 2.3; g.add(lab);
    g.traverse(m => { if (m.isMesh) m.userData.noedge = true; });
    root.add(g);
  }
  get pos() { return { x:this.g.position.x, z:this.g.position.z }; }
  place(x, z, face, sit) {
    this.g.position.set(x, 0, z); this.g.rotation.y = face; this.sitting = !!sit;
  }
  setStatus(s) { this.status = s; this.dot.material.color.set(STATUS[s]); }
  walkTo(spot) {
    return new Promise(res => {
      this.path = route(this.pos, this.room, spot, spot.room).map(p => new THREE.Vector2(p[0], p[1]));
      this.state = 'walk'; this.sitting = false; this.target = spot;
      this.onArrive = () => { this.room = spot.room; this.state = 'idle'; this.g.rotation.y = spot.face ?? this.g.rotation.y; this.sitting = !!spot.sit; res(); };
    });
  }
  goHome() { return this.walkTo({ ...this.seat, sit:true }).then(() => { this.state = 'sit'; this.busy = false; this.item.visible = false; }); }
  faceTo(x, z) { this.g.rotation.y = Math.atan2(x - this.g.position.x, z - this.g.position.z); }
  bubble(text, s = 3) {
    const el = document.createElement('div'); el.className = 'bubble'; el.textContent = text;
    const ob = new CSS2DObject(el); ob.position.y = 2.45; this.g.add(ob);
    sim.after(s, () => { this.g.remove(ob); el.remove(); });
  }
  update(dt) {
    this.t += dt;
    const L = this.legs, A = this.arms;
    if (this.state === 'walk') {
      const target = this.path[0];
      const p = this.g.position, dx = target.x - p.x, dz = target.y - p.z, d = Math.hypot(dx, dz);
      const step = 2.4 * dt;
      if (d <= step) { p.x = target.x; p.z = target.y; this.path.shift(); if (!this.path.length) { const f = this.onArrive; this.onArrive = null; f && f(); } }
      else {
        p.x += dx / d * step; p.z += dz / d * step;
        const want = Math.atan2(dx, dz);
        let diff = want - this.g.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        this.g.rotation.y += diff * Math.min(1, dt * 12);
      }
      const s = Math.sin(this.t * 9);
      L[0].rotation.x = s * .6; L[1].rotation.x = -s * .6;
      const carry = this.item.visible;
      A[0].rotation.x = carry ? -1.1 : -s * .5; A[1].rotation.x = carry ? -1.1 : s * .5;
      this.g.position.y = Math.abs(Math.cos(this.t * 9)) * .05;
    } else if (this.sitting) {
      this.g.position.y = -.23;
      L[0].rotation.x = L[1].rotation.x = -Math.PI / 2;
      const typing = this.status === 'work' && this.state === 'sit';
      A[0].rotation.x = -1 + (typing ? Math.sin(this.t * 14) * .08 : 0);
      A[1].rotation.x = -1 + (typing ? Math.cos(this.t * 13) * .08 : 0);
      if (this.status === 'think') A[1].rotation.x = -2.3;
    } else {
      this.g.position.y = 0;
      L[0].rotation.x = L[1].rotation.x = 0;
      const carry = this.item.visible;
      A[0].rotation.x = carry ? -1.1 : Math.sin(this.t * 1.5) * .05;
      A[1].rotation.x = carry ? -1.1 : -Math.sin(this.t * 1.5) * .05;
    }
    this.dot.position.y = 2.02 + Math.sin(this.t * 3) * .03;
    if (this.ring.visible) this.ring.material.opacity = .55 + Math.sin(this.t * 5) * .35;
  }
}

/* ───────────── Симуляция: передачи, перерывы, планёрки, рабочий стол ───────────── */
function makeSim() {
  return {
    timers:[], agents:[], byId:{}, inbox:[], doneList:[], working:[], replayIdx:0, nextMeet:22, nextReplay:5, nextApprove:30,
    after(s, f) { this.timers.push({ t:s, f }); },
    wait(s) { return new Promise(r => this.after(s, r)); },
  };
}
const feedEl = document.getElementById('feed');
function log(html) {
  const li = document.createElement('li');
  li.innerHTML = `<time>${nowHM()}</time><span>${html}</span>`;
  feedEl.prepend(li);
  while (feedEl.children.length > 7) feedEl.lastChild.remove();
}
const nameOf = id => esc(TM[id]?.name || id);

function idle(a) { return a && a.state === 'sit' && !a.busy; }
function resolveTarget(a, to) {
  if (to === 'you') return { kind:'inbox' };
  const id = to === 'head' ? TM[a.id].boss : to;
  return id && sim.byId[id] ? { kind:'agent', agent:sim.byId[id] } : null;
}
function visitorSpot(b) {
  const s = b.seat;
  return { x:s.x + .85, z:s.z - .15, room:b.seat.room, face:-Math.PI / 2 };
}
async function handoff(a) {
  const opts = TM[a.id].out.map(x => ({ o:x, t:resolveTarget(a, x.to) })).filter(x => x.t);
  if (!opts.length) return;
  const { o:out, t } = pick(opts);
  a.busy = true; a.setStatus('work'); a.state = 'go'; a.item.visible = true;
  a.doing = `Несёт «${out.item}»`;
  if (t.kind === 'agent') {
    const b = t.agent;
    await a.walkTo(visitorSpot(b));
    a.faceTo(b.g.position.x, b.g.position.z);
    a.item.visible = false; a.bubble(out.say);
    if (idle(b)) { b.setStatus('think'); b.doing = `Принял: ${out.item}`; sim.after(4, () => idle(b) && b.setStatus('work')); }
    log(`<b>${nameOf(a.id)}</b> → ${nameOf(b.id)}: ${esc(out.say)}`);
  } else {
    await a.walkTo(SPOTS.inbox);
    a.item.visible = false; a.bubble('На решение: ' + out.item);
    sim.inbox.push({ title:out.item, from:a.id, sim:true });
    log(`<b>${nameOf(a.id)}</b> положил на решение: «${esc(out.item)}»`);
    drawBoard();
  }
  await sim.wait(2.2);
  a.doing = TM[a.id].role;
  await a.goHome();
}
async function takeBreak(a) {
  const free = SPOTS.rest.filter(s => !s.taken);
  if (!free.length) return;
  const s = pick(free); s.taken = true;
  a.busy = true; a.setStatus('pause'); a.state = 'go';
  a.doing = s.room === 'kitchen' ? 'Пьёт кофе на кухне' : 'Отдыхает в лаунже';
  await a.walkTo(s);
  await sim.wait(rand(7, 14));
  s.taken = false;
  a.setStatus('work'); a.doing = TM[a.id].role;
  await a.goHome();
}
async function meeting() {
  const heads = ['ilia', 'firuza', 'bogdan', 'nurken'].map(id => sim.byId[id]).filter(idle);
  const extra = sim.agents.filter(a => idle(a) && !TM[a.id].head && a.id !== 'orchestrator');
  const people = [...heads, ...extra.sort(() => Math.random() - .5).slice(0, 2)];
  if (people.length < 2) return;
  log(`Планёрка в переговорной: ${people.map(p => nameOf(p.id)).join(', ')}`);
  const seats = [...SPOTS.meet].sort(() => Math.random() - .5);
  await Promise.all(people.map(async (p, i) => {
    p.busy = true; p.state = 'go'; p.setStatus('think'); p.doing = 'На планёрке';
    await p.walkTo(seats[i]);
    if (i === 0) p.bubble('Что выпускаем на этой неделе?', 4);
    await sim.wait(14);
    p.setStatus('work'); p.doing = TM[p.id].role;
    await p.goHome();
  }));
}
/* Повтор реальной задачи из истории: диспетчер несёт её агенту, тот делает и сдаёт на проверку,
   Илья принимает — та же цепочка, что у рабочего стола hq2 (диспетчер → исполнитель → проверка). */
async function replay() {
  const orch = sim.byId.orchestrator;
  if (!idle(orch) || !REAL.length) return;
  const task = REAL[sim.replayIdx++ % Math.min(REAL.length, 24)];
  const ids = (task.agents || []).filter(id => sim.byId[id] && !TM[id].head);
  const a = sim.byId[ids.find(id => idle(sim.byId[id])) || 'runner'];
  if (!idle(a)) return;
  a.busy = true;
  const title = clip(task.title, 64);
  orch.busy = true; orch.state = 'go'; orch.item.visible = true; orch.doing = `Несёт задачу: ${title}`;
  log(`Рабочий стол → <b>${nameOf(a.id)}</b>: «${esc(title)}»`);
  await orch.walkTo(visitorSpot(a));
  orch.faceTo(a.g.position.x, a.g.position.z);
  orch.item.visible = false; orch.bubble('Новая задача');
  const job = { title, agent:a.id, task };
  sim.working.push(job); drawBoard();
  a.ring.visible = true; a.setStatus('work'); a.doing = `Делает: ${title}`;
  orch.goHome().then(() => { orch.doing = TM.orchestrator.role; });
  await sim.wait(rand(11, 16));
  a.state = 'go'; a.item.visible = true;
  await a.walkTo(SPOTS.inbox);
  a.item.visible = false; a.ring.visible = false; a.bubble('Готово на проверку');
  sim.working = sim.working.filter(j => j !== job);
  sim.inbox.push({ title, from:a.id, task });
  log(`<b>${nameOf(a.id)}</b> сдал на проверку: «${esc(title)}»`);
  drawBoard();
  await sim.wait(1.5);
  a.doing = TM[a.id].role;
  await a.goHome();
}
async function approve() {
  const ilia = sim.byId.ilia;
  if (!idle(ilia) || !sim.inbox.length) return;
  ilia.busy = true; ilia.state = 'go'; ilia.doing = 'Идёт принимать работы';
  await ilia.walkTo(SPOTS.inbox);
  const items = sim.inbox.splice(0, 3);
  ilia.bubble(items.length > 1 ? `Принято: ${items.length}` : 'Принято');
  sim.doneList.unshift(...items); sim.doneList.length = Math.min(sim.doneList.length, 6);
  log(`<b>Илья</b> принял: ${items.map(i => '«' + esc(clip(i.title, 40)) + '»').join(', ')}`);
  drawBoard();
  await sim.wait(2);
  ilia.doing = TM.ilia.role;
  await ilia.goHome();
}

function drawBoard() {
  const tex = sim.boardTex; if (!tex) return;
  const c = tex.userData.canvas, x = c.getContext('2d'), w = c.width, h = c.height;
  const light = T.light;
  x.fillStyle = light ? '#ffffff' : '#0c0d12'; x.fillRect(0, 0, w, h);
  x.fillStyle = light ? '#1c1c1c' : '#ffffff'; x.font = '700 30px Inter, sans-serif'; x.textBaseline = 'top';
  x.fillText('Рабочий стол · задачи агентам', 28, 22);
  const cols = [['В работе', sim.working, '#3ddc97'], ['На проверке', sim.inbox, '#ffc247'], ['Принято', sim.doneList, T.ui.accent === '#ffffff' ? '#9fd0ff' : T.ui.accent]];
  cols.forEach(([name, list, col], i) => {

    list.slice(0, 4).forEach((it, k) => {

      x.fillStyle = light ? '#1c1c1c' : '#eaeaea'; x.font = '600 19px Inter, sans-serif';
      const words = it.title.split(' '); let line = '', ln = 0;
      for (const wd of words) {
        if (x.measureText(line + wd).width > 280) { if (ln < 1) x.fillText(line, X + 16, Y + 10 + ln * 24); else { line += '…'; break; } line = ''; ln++; }
        line += wd + ' ';
      }
      if (ln < 2) x.fillText(clip(line, 40), X + 16, Y + 10 + ln * 24);
      x.fillStyle = light ? '#777' : '#8b90a0'; x.font = '500 15px Inter, sans-serif';
      x.fillText(TM[it.agent || it.from]?.name || '', X + 16, Y + 52);
    });

  tex.needsUpdate = true;

}

function think(a, dt) {
  a.timer -= dt;
  if (a.timer > 0 || !idle(a)) return;
  a.timer = rand(6, 16);
  if (a.id === 'orchestrator' || a.id === 'ilia') return;
  const walkers = sim.agents.filter(x => x.state === 'walk').length;
  const r = Math.random();
  if (r < .3 && walkers < 9) handoff(a);
  else if (r < .4 && walkers < 9) takeBreak(a);
  else a.setStatus(TM[a.id].waits ? (Math.random() < .6 ? 'think' : 'work') : (Math.random() < .25 ? 'think' : 'work'));
}

/* ───────────── Сборка варианта ───────────── */
const roomCounts = {};
function build(themeIdx) {
  T = THEMES[themeIdx];
  if (scene) scene.traverse(o => {
    if (o.isCSS2DObject) o.element.remove();
    if (o.geometry) o.geometry.dispose();
    if (o.material) [].concat(o.material).forEach(m => { m.map?.dispose(); m.dispose(); });
  });
  Object.keys(GEO).forEach(k => delete GEO[k]);
  MATS = new Map(); SCREEN_CACHE.clear(); scrolling.length = 0;
  for (const k of Object.keys(SEATS)) delete SEATS[k];
  SPOTS.rest = []; SPOTS.meet = [];
  feedEl.innerHTML = '';

  const r = document.documentElement.style, u = T.ui;
  r.setProperty('--card', u.card); r.setProperty('--fg', u.fg); r.setProperty('--sub', u.sub);
  r.setProperty('--accent', u.accent); r.setProperty('--border', u.border); r.setProperty('--page', u.page);
  r.setProperty('--font', u.font || "'Inter',system-ui,sans-serif");
  r.setProperty('--title', u.title || u.font || "'Inter',system-ui,sans-serif");

  scene = new THREE.Scene();
  sim = makeSim();
  buildSky();
  const root = new THREE.Group(); scene.add(root);
  const hemi = new THREE.HemisphereLight(T.hemi[0], T.hemi[1], T.hemi[2]); scene.add(hemi);
  const sun = new THREE.DirectionalLight(T.sun[0], T.sun[1]);
  sun.position.set(-18, 40, 22); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left:-30, right:30, top:24, bottom:-24, near:5, far:110 });
  sun.shadow.bias = -.0004; sun.shadow.normalBias = .03;
  scene.add(sun);

  buildShell(root);
  buildWalls(root);
  buildFurniture(root);
  if (T.edges) addEdges(root);
  GRAPH = buildGraph();

  for (const room of ROOMS) {
    const el = document.createElement('div'); el.className = 'lab';
    el.innerHTML = `<div class="room"><span class="ic">${svg(room.icon)}</span><span><b>${esc(room.name)}</b><small>${esc(room.sub)}</small></span><span class="n" id="n-${room.id}">0</span></div>`;
    const ob = new CSS2DObject(el);
    const [x0, z0, x1] = room.r;
    ob.position.set(room.id === 'hub' ? -9.4 : x0 + .4, room.open ? .4 : 2.6, room.id === 'hub' ? -3.6 : z0 + .3);
    root.add(ob);
  }

  for (const def of TEAM) { const a = new Agent(def, root); sim.agents.push(a); sim.byId[def.id] = a; }

  renderer.toneMappingExposure = T.exposure;
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), ...(T.bloom || [0, 0, 1]));
  bloomPass.enabled = !!T.bloom;
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
  composer.setSize(innerWidth, innerHeight);

  drawBoard();
  log(`Вариант «${esc(T.name)}»: ${TEAM.length} сотрудников в ${ROOMS.length} зонах`);
  document.querySelectorAll('#chips button').forEach((b, i) => b.setAttribute('aria-current', i === themeIdx));
  document.getElementById('vdesc').textContent = `Вариант ${themeIdx + 1} из ${THEMES.length} · ${T.desc}`;
  try { localStorage.setItem('hq-concept', T.id); } catch {}
}

/* ───────────── Интерфейс ───────────── */
const chips = document.getElementById('chips');
THEMES.forEach((t, i) => {
  const b = document.createElement('button'); b.textContent = `${i + 1}. ${t.name}`;
  b.onclick = () => { build(i); const u = new URL(location.href); u.searchParams.set('v', i + 1); history.replaceState(null, '', u); };
  chips.appendChild(b);
});
const taskList = document.getElementById('task-list');
REAL.slice(0, 16).forEach(t => {
  const li = document.createElement('li'), a = document.createElement('a');
  const url = t.proof?.[0]?.url || '#';
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  const who = (t.agents || []).map(id => TM[id]?.name).filter(Boolean).slice(0, 3).join(', ');
  a.innerHTML = `${esc(t.title)}<small>${ddmm(t.date)} · ${esc(t.kind || '')}${who ? ' · ' + esc(who) : ''}</small>`;
  const hl = on => (t.agents || []).forEach(id => { const ag = sim.byId[id]; if (ag && !sim.working.some(j => j.agent === id)) ag.ring.visible = on; });
  a.onmouseenter = a.onfocus = () => hl(true);
  a.onmouseleave = a.onblur = () => hl(false);
  li.appendChild(a); taskList.appendChild(li);
});
const toggle = (btn, cls, invert) => {
  const b = document.getElementById(btn);
  b.onclick = () => { const on = document.body.classList.toggle(cls); b.setAttribute('aria-pressed', invert ? !on : on); };
};
toggle('b-names', 'names');
toggle('b-tasks', 'notasks', true);
document.getElementById('b-reset').onclick = resetView;

// карточка агента по клику
const tip = document.getElementById('tip');
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(sim.agents.map(a => a.g), true).find(h => h.object.userData.agent);
  if (!hit) { tip.hidden = true; return; }
  const a = hit.object.userData.agent, d = TM[a.id];
  const last = REAL.find(t => (t.agents || []).includes(a.id) || (t.people || []).includes(a.id));
  const st = { work:'в работе', think:'думает', pause:'на паузе' }[a.status];
  tip.innerHTML = `<h4>${esc(d.name)}</h4><div class="role">${esc(d.role)}</div><dl>
    <div><dt>Где</dt><dd>${esc(RM[a.room].name)} · ${st}</dd></div>
    <div><dt>Сейчас</dt><dd>${esc(a.doing)}</dd></div>
    ${last ? `<div><dt>Последняя реальная задача</dt><dd>${esc(last.title)} <small>(${ddmm(last.date)})</small>${last.proof?.[0] ? ` · <a href="${esc(last.proof[0].url)}" target="_blank" rel="noopener">открыть</a>` : ''}</dd></div>` : ''}
  </dl>`;
  tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + 'px';
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 10) + 'px';
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* ───────────── Цикл ───────────── */
const clock = new THREE.Clock();
let statT = 0;
function step(dt) {
  sim.timers = sim.timers.filter(t => (t.t -= dt) > 0 || (t.f(), false));
  for (const a of sim.agents) { a.update(dt); think(a, dt); }
  if ((sim.nextMeet -= dt) <= 0) { sim.nextMeet = rand(60, 80); meeting(); }
  if ((sim.nextReplay -= dt) <= 0) { sim.nextReplay = rand(16, 24); replay(); }
  if ((sim.nextApprove -= dt) <= 0) { sim.nextApprove = rand(18, 30); approve(); }
  for (const t of scrolling) t.offset.y = (t.offset.y + dt * .05) % 1;
  if (sim.leds && Math.random() < dt * 8) { const l = pick(sim.leds); l.visible = !l.visible; }
  if ((statT -= dt) <= 0) {
    statT = .5;
    const c = { work:0, think:0, pause:0 };
    for (const k of Object.keys(roomCounts)) roomCounts[k] = 0;
    for (const a of sim.agents) { c[a.status]++; roomCounts[a.room] = (roomCounts[a.room] || 0) + 1; }
    for (const k of Object.keys(c)) document.getElementById('s-' + k).textContent = c[k];
    for (const room of ROOMS) { const el = document.getElementById('n-' + room.id); if (el) el.textContent = roomCounts[room.id] || 0; }
  }
}
function loop() {
  const dt = Math.min(clock.getDelta(), .05);
  step(dt);
  controls.update();
  if (scene.fog) scene.fog.density = T.fog[1] * 79 / camera.position.distanceTo(controls.target);
  composer.render();
  labelRenderer.render(scene, camera);
  requestAnimationFrame(loop);
}

const qv = +new URLSearchParams(location.search).get('v');
let start = qv >= 1 && qv <= THEMES.length ? qv - 1 : 0;
if (!qv) try { const s = THEMES.findIndex(t => t.id === localStorage.getItem('hq-concept')); if (s >= 0) start = s; } catch {}
resetView();
build(start);
loop();
window.__hq = { step:s => { for (let i = 0; i < s * 20; i++) step(.05); }, build };
</script>
</body>
