<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личный кабинет · офис AICEX</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0d12;--card:#12151c;--line:rgba(255,255,255,.08);--ink:#e9ecf2;--mute:#9aa3b5;--acc:#7fd3ff;--ok:#3ddc97;--bad:#ff6b6b;--warn:#ffb020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--acc)}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
header.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.02em}.logo span{color:var(--acc)}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#181c25;color:var(--ink);padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:rgba(127,211,255,.4)}
.btn.go{background:var(--acc);color:#071018;border-color:var(--acc);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:28px 0 12px}h3{font-size:16px;margin:0}
.mute{color:var(--mute)}.small{font-size:13px}
.auth{max-width:420px;margin:40px auto}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{flex:1}
.tabs button.on{background:var(--acc);color:#071018;border-color:var(--acc)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input{width:100%;background:#0d1016;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
input:focus{outline:none;border-color:var(--acc)}
.note{margin-top:12px;font-size:13px;min-height:18px}.note.err{color:var(--bad)}.note.ok{color:var(--ok)}
.me{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;background:linear-gradient(135deg,#2b5cff,#7fd3ff);color:#fff}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(127,211,255,.12);color:var(--acc);margin-left:8px;vertical-align:middle}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{font-size:12px;padding:2px 8px;border-radius:999px;background:#1a1f2a;color:var(--mute)}
.int{display:flex;flex-direction:column;gap:6px}
.int .hd{display:flex;align-items:flex-start;gap:10px}.int .hd h3{flex:1}
.st{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.ok{background:rgba(61,220,151,.12);color:var(--ok)}.st.bad{background:rgba(255,107,107,.12);color:var(--bad)}
.st.off{background:#1a1f2a;color:var(--mute)}.st.office{background:rgba(255,176,32,.12);color:var(--warn)}
.int .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.grp{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:22px 0 10px}
.list{list-style:none;padding:0;margin:0;display:grid;gap:8px}.list li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
/* стили и аватары */
.stabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.stabs button{border:1px solid var(--line);background:#181c25;color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.stabs button.on{background:var(--acc);color:#071018;border-color:var(--acc);font-weight:600}
.stabs button small{opacity:.7;margin-left:4px}
.defs{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}.defs span{font-size:12px;padding:4px 10px;border-radius:999px;background:#1a1f2a;color:var(--mute)}.defs b{color:var(--ink);font-weight:600}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.scard.def{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.scard .pv{position:relative;background:#0d1016;overflow:hidden}
.scard .pv img{width:100%;height:100%;object-fit:contain;display:block}.scard.avc .pv img{object-fit:cover}
.scard .pv .tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--ok);color:#06140d}
.mk{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:14px;box-sizing:border-box}
.mk .t{font-weight:800;font-size:19px;line-height:1.05;letter-spacing:-.01em}.mk.serif .t{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-style:italic}
.mk .l{height:6px;border-radius:3px;opacity:.55}.mk .l.s{width:60%}.mk .b{align-self:flex-start;font-size:10px;font-weight:700;padding:4px 9px;border-radius:999px}
.mk.skill{background:repeating-linear-gradient(135deg,#141823 0 10px,#11141c 10px 20px);color:var(--mute);justify-content:center;align-items:center;text-align:center;font:600 12px ui-monospace,monospace}
.scard .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.scard .bd b{font-size:14px}.scard .bd small{color:var(--mute);font-size:12px;line-height:1.35;flex:1}
.scard .bd .btn{justify-content:center;padding:7px 10px;font-size:13px}
.scard.avc .pv{aspect-ratio:3/4}.scard.avc.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.scard.avc .ck{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-weight:700;border:1px solid rgba(255,255,255,.3)}
.scard.avc.sel .ck{background:var(--acc);color:#071018;border-color:var(--acc)}
.avbar{position:sticky;bottom:12px;margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#141822;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.avbar .sp{flex:1}
.sklist{list-style:none;margin:0;padding:0;display:grid;gap:6px}.sklist li{padding:9px 12px;border:1px solid var(--line);border-radius:10px}.sklist code{color:var(--acc);font-size:13px}.sklist small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
@media (max-width:520px){h1{font-size:22px}.card{padding:16px}.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="logo">AICEX <span>офис</span> · личный кабинет</div><div class="sp"></div><a class="btn ghost" href="../">← В офис</a><span id="topActs"></span></header>
  <main id="app"><p class="mute">Загружаю…</p></main>
</div>
<script>
const API = '/api/assistant';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ROLE = { owner:'Администратор', head:'Руководитель', user:'Пользователь' };
let ME = null, TAB = 'login';
async function call(method, path, body) {
  const r = await fetch(API + path, { method, credentials:'include', headers:body ? { 'content-type':'application/json' } : {}, body:body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch {}
  return { ok:r.ok, j };
}
async function load() {
  const { j } = await call('GET', '/account');
  ME = j;
  ME.role === 'guest' || !ME.role ? authView() : cabinet();
}

/* ---------- вход и регистрация ---------- */
function authView() {
  $('topActs').innerHTML = '';
  $('app').innerHTML = `<div class="auth card">
    <h1>${TAB === 'register' ? 'Регистрация' : 'Вход в кабинет'}</h1>
    <p class="mute small">${TAB === 'register' ? 'Свой кабинет офиса: подключаете свои сервисы — Apify, ElevenLabs, HeyGen и другие, и ваши задачи работают на ваших ключах. Доступ к агентам выдаёт администратор.' : 'Руководители и пользователи — по почте и паролю. Администратор — паролем офиса.'}</p>
    <div class="tabs"><button class="btn ${TAB === 'login' ? 'on' : ''}" data-tab="login">Вход</button><button class="btn ${TAB === 'register' ? 'on' : ''}" data-tab="register">Регистрация</button><button class="btn ${TAB === 'owner' ? 'on' : ''}" data-tab="owner">Администратор</button></div>
    <form id="af">
      ${TAB === 'register' ? '<label>Имя</label><input name="name" autocomplete="name" required>' : ''}
      ${TAB !== 'owner' ? '<label>Почта</label><input name="email" type="email" autocomplete="email" required>' : ''}
      <label>Пароль${TAB === 'register' ? ' (от 8 символов)' : ''}</label><input name="password" type="password" autocomplete="${TAB === 'register' ? 'new-password' : 'current-password'}" required minlength="${TAB === 'register' ? 8 : 1}">
      <div style="margin-top:16px"><button class="btn go" type="submit">${TAB === 'register' ? 'Создать кабинет' : 'Войти'}</button></div>
      <div class="note" id="an"></div>
    </form></div>`;
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { TAB = b.dataset.tab; authView(); });
  $('af').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    $('an').className = 'note'; $('an').textContent = 'Секунду…';
    const path = TAB === 'register' ? '/register' : TAB === 'owner' ? '/login' : '/user-login';
    const r = await call('POST', path, f);
    if (!r.ok) { $('an').className = 'note err'; $('an').textContent = r.j.error || 'Не получилось.'; return; }
    load();
  };
}

/* ---------- кабинет ---------- */
function statusOf(it) {
  if (it.connected && it.check?.ok) return `<span class="st ok">Подключено${it.check.account ? ' · ' + esc(it.check.account) : ''}</span>`;
  if (it.connected && it.check && !it.check.ok) return '<span class="st bad">Ключ не работает</span>';
  if (it.connected) return '<span class="st ok">Сохранено</span>';
  if (it.office) return '<span class="st office">Ключ офиса</span>';
  return '<span class="st off">Не подключено</span>';
}
function intCard(it) {
  return `<div class="card int" id="i-${it.id}">
    <div class="hd"><h3>${esc(it.name)}</h3>${statusOf(it)}</div>
    <div class="mute small">${esc(it.about)}</div>
    <div class="chips">${it.uses.map(u => `<span>${esc(u)}</span>`).join('')}</div>
    <form data-int="${it.id}">
      ${it.fields.map(f => `<label>${esc(f.label)}</label><input name="${f.env}" ${f.secret ? 'type="password" autocomplete="off"' : ''} placeholder="${esc(f.value || f.hint || '')}">`).join('')}
      <div class="acts"><button class="btn go" type="submit">${it.connected ? 'Обновить' : 'Подключить'}</button>
        ${it.connected ? `<button class="btn" type="button" data-test="${it.id}">Проверить</button><button class="btn danger" type="button" data-rm="${it.id}">Отключить</button>` : ''}
        <a class="btn ghost" href="guides/${esc(it.id)}.pdf" target="_blank" rel="noopener">Инструкция PDF</a>
        <a class="btn ghost" href="${esc(it.site)}" target="_blank" rel="noopener">Где взять ключ ↗</a></div>
      <div class="note ${it.check && !it.check.ok ? 'err' : ''}" id="n-${it.id}">${it.check && !it.check.ok ? 'Ответ сервиса: ' + esc(it.check.error) : it.office && !it.connected ? 'Сейчас работает ключ офиса. Подключите свой — и ваши задачи пойдут на нём.' : ''}</div>
    </form></div>`;
}
function cabinet() {
  const m = ME, initials = (m.name || '?').split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase();
  $('topActs').innerHTML = '<button class="btn" id="out">Выйти</button>';
  $('out').onclick = async () => { await call('POST', '/logout'); TAB = 'login'; load(); };
  const groups = [...new Set(m.integrations.map(i => i.group))];
  const connected = m.integrations.filter(i => i.connected).length;
  $('app').innerHTML = `
    <div class="card me"><div class="av">${esc(initials)}</div><div style="flex:1;min-width:200px">
      <h1>${esc(m.name)}<span class="badge">${ROLE[m.role] || m.role}</span></h1>
      <div class="mute small">${m.email ? esc(m.email) + ' · ' : ''}${m.dept ? 'отдел ' + esc(m.dept) + ' · ' : ''}интеграций подключено: ${connected} из ${m.integrations.length}</div></div></div>

    <h2>Мои агенты</h2>
    <div class="card">${m.role === 'owner' ? `<p class="mute small" style="margin:0">Вы администратор: вам доступны все ${m.agents.length} агентов офиса, люди и доступы — в «Админке» офиса.</p>`
      : m.agents.length ? `<div class="chips">${m.agents.map(a => `<span title="${esc(a.role)}">${esc(a.name)}</span>`).join('')}</div><p class="mute small">Ставьте им задачи в офисе — они работают на ваших ключах из интеграций ниже.</p>`
      : '<p class="mute small" style="margin:0">Агентов вам пока не выдали — администратор добавит их в админ-панели. Подключите интеграции заранее: как только агенты появятся, они сразу будут работать на ваших ключах.</p>'}</div>

    <h2>Стили и аватары по умолчанию</h2>
    <p class="mute small" style="margin-top:-6px">Выберите стиль для каждого вида креативов и нажмите «Поставить по умолчанию»: офис будет делать ваши рилсы, карусели, презентации и сайты только в нём и не станет спрашивать стиль. Сменить можно в любой момент — новые задачи пойдут в новом стиле. Аватаров можно отметить несколько: офис берёт их по кругу в случайном порядке.</p>
    <div id="sty"><p class="mute">Загружаю стили…</p></div>

    ${m.role === 'head' && !m.email ? `<h2>Вход без ссылки</h2><div class="card"><p class="mute small" style="margin-top:0">Задайте почту и пароль — заходите в кабинет и офис сами, без новой ссылки-приглашения.</p>
      <form id="pf"><label>Почта</label><input name="email" type="email" required><label>Пароль (от 8 символов)</label><input name="password" type="password" minlength="8" required>
      <div style="margin-top:12px"><button class="btn go" type="submit">Сохранить</button></div><div class="note" id="pn"></div></form></div>` : ''}

    <h2>Интеграции</h2>
    <p class="mute small" style="margin-top:-6px">Ключи хранятся на сервере офиса в зашифрованном виде и никому не показываются — даже вам: видны только последние 4 символа. Задачи, которые вы ставите, идут на ваших ключах${m.role === 'owner' ? '; без вашего ключа — на ключе офиса из секретов' : ''}. Пошагово, где взять каждый ключ, — <a href="guides/vse-integracii.pdf" target="_blank" rel="noopener">все инструкции одним PDF</a> или кнопка «Инструкция PDF» в карточке.</p>
    ${groups.map(g => `<div class="grp">${esc(g)}</div><div class="grid2">${m.integrations.filter(i => i.group === g).map(intCard).join('')}</div>`).join('')}

    ${m.team ? `<h2>Люди офиса</h2><div class="card"><ul class="list">${m.team.length ? m.team.map(u => `<li><span>${esc(u.name)}<span class="badge">${ROLE[u.role] || u.role}</span>${u.disabled ? ' <span class="mute small">отключён</span>' : ''}<br><span class="mute small">${esc(u.email || 'вход по ссылке')}</span></span><span class="mute small">агентов: ${u.agents}</span></li>`).join('') : '<li class="mute">Пока никого — пригласите руководителей в «Админке» или дайте ссылку на регистрацию.</li>'}</ul>
      <p class="mute small">Регистрация для новых людей: <a href="${location.origin}${location.pathname}">${location.host}${location.pathname}</a> → «Регистрация». Выдать агентов — «Админка» → «Люди».</p></div>` : ''}`;

  document.querySelectorAll('form[data-int]').forEach(f => f.onsubmit = async e => {
    e.preventDefault();
    const id = f.dataset.int, fields = {};
    for (const [k, v] of new FormData(f)) if (String(v).trim()) fields[k] = v;
    const n = $('n-' + id); n.className = 'note'; n.textContent = 'Сохраняю и проверяю…';
    const r = await call('POST', '/integrations', { action:'save', id, fields });
    if (!r.ok) { n.className = 'note err'; n.textContent = r.j.error || 'Не получилось.'; return; }
    ME.integrations = r.j.integrations; cabinet();
    const n2 = $('n-' + id); if (r.j.check?.ok) { n2.className = 'note ok'; n2.textContent = 'Подключено и проверено' + (r.j.check.account ? ': ' + r.j.check.account : '') + '.'; }
  });
  document.querySelectorAll('[data-test]').forEach(b => b.onclick = async () => {
    const id = b.dataset.test, n = $('n-' + id); n.className = 'note'; n.textContent = 'Проверяю…';
    const r = await call('POST', '/integrations', { action:'test', id });
    ME.integrations = r.j.integrations || ME.integrations; cabinet();
    const n2 = $('n-' + id); n2.className = 'note ' + (r.j.check?.ok ? 'ok' : 'err'); n2.textContent = r.j.check?.ok ? 'Ключ рабочий' + (r.j.check.account ? ': ' + r.j.check.account : '') + '.' : 'Ответ сервиса: ' + (r.j.check?.error || r.j.error || 'ошибка');
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    if (!confirm('Отключить интеграцию? Ключ будет удалён с сервера.')) return;
    const r = await call('POST', '/integrations', { action:'remove', id:b.dataset.rm });
    if (r.ok) { ME.integrations = r.j.integrations; cabinet(); }
  });
  renderStyles();
  if ($('pf')) $('pf').onsubmit = async e => {
    e.preventDefault();
    const r = await call('POST', '/account', { action:'password', ...Object.fromEntries(new FormData(e.target)) });
    $('pn').className = 'note ' + (r.ok ? 'ok' : 'err'); $('pn').textContent = r.ok ? 'Готово — входите по почте и паролю.' : r.j.error || 'Не получилось.';
    if (r.ok) setTimeout(load, 800);
  };
}
/* ---------- стили и аватары по умолчанию (/api/assistant/prefs, assistant/styles.mjs) ---------- */
const ST = { tab:'video', data:null, av:null, sel:null, q:'', busy:false };
// previews of the Studio Kadrik styles are three frames side by side — wide cards show them whole
const RATIO = { video:'3/2', carousel:'16/9', slides:'16/10', landing:'16/10' };
async function stylesLoad() {
  const r = await call('GET', '/prefs');
  ST.data = r.ok ? r.j : { error:r.j.error || 'Не получилось загрузить стили.' };
  renderStyles();
}
async function avatarsLoad(fresh) {
  ST.av = { loading:true }; renderStyles();
  const r = await call('GET', '/prefs/avatars' + (fresh ? '?fresh=1' : ''));
  ST.av = r.ok ? r.j : { error:r.j.error || 'Не получилось загрузить аватары.' };
  if (!ST.sel) ST.sel = new Set((ST.data?.prefs?.avatars || []).map(a => a.id));
  renderStyles();
}
function mockHTML(s) {
  if (s.img) return `<img src="../${esc(s.img)}" alt="" loading="lazy">`;
  if (!s.mock) return `<div class="mk skill">${esc(s.skill || s.label)}<br>скилл офиса</div>`;
  const m = s.mock;
  return `<div class="mk ${m.font === 'serif' ? 'serif' : ''}" style="background:${m.bg};color:${m.ink}"><span class="t">${esc(s.label)}</span><span class="l" style="background:${m.ink}"></span><span class="l s" style="background:${m.ink}"></span><span class="b" style="background:${m.acc};color:${m.bg}">Кнопка</span></div>`;
}
function renderStyles() {
  const box = $('sty'); if (!box) return;
  const D = ST.data;
  if (!D) { box.innerHTML = '<p class="mute">Загружаю стили…</p>'; if (!ST.loading) { ST.loading = true; stylesLoad(); } return; }
  if (D.error) { box.innerHTML = `<p class="note err">${esc(D.error)}</p>`; return; }
  const P = D.prefs, cats = D.catalog, cur = cats.find(c => c.id === ST.tab);
  const nameOf = (cat, id) => cats.find(c => c.id === cat)?.styles.find(s => s.id === id)?.label || '';
  const tabs = [...cats.map(c => [c.id, c.name, c.styles.length]), ['avatars', 'Аватары', (P.avatars || []).length ? `выбрано ${P.avatars.length}` : ''], ['skills', 'Все скиллы', D.skills.length]];
  let body = '';
  if (cur) {
    body = `<div class="sgrid">${cur.styles.map(s => { const def = P.styles[cur.id] === s.id; return `<div class="scard${def ? ' def' : ''}">
      <div class="pv" style="aspect-ratio:${RATIO[cur.id] || '4/5'}">${mockHTML(s)}${def ? '<span class="tag">По умолчанию</span>' : ''}</div>
      <div class="bd"><b>${esc(s.label)}</b><small>${esc(String(s.about || '').split(';')[0])}</small>
        ${def ? `<button class="btn" data-sdef="" data-cat="${cur.id}">Снять «по умолчанию»</button>` : `<button class="btn go" data-sdef="${esc(s.id)}" data-cat="${cur.id}">Поставить по умолчанию</button>`}</div></div>`; }).join('')}</div>`;
  } else if (ST.tab === 'avatars') {
    const A = ST.av;
    if (!A) { ST.av = { loading:true }; setTimeout(() => avatarsLoad()); body = '<p class="mute">Загружаю аватары из HeyGen…</p>'; }
    else if (A.loading) body = '<p class="mute">Загружаю аватары из HeyGen…</p>';
    else if (A.error) body = `<p class="note err">${esc(A.error)}</p>`;
    else {
      const sel = ST.sel || new Set();
      body = `<div class="sgrid">${A.looks.map(l => `<div class="scard avc${sel.has(l.id) ? ' sel' : ''}" data-av="${esc(l.id)}" role="button" tabindex="0">
        <div class="pv">${l.preview ? `<img src="${esc(l.preview)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<div class="mk skill">без превью</div>'}<span class="ck">${sel.has(l.id) ? '✓' : ''}</span></div>
        <div class="bd"><b>${esc(l.name || 'Без названия')}</b><small>${esc(l.groupName || '')}${l.orient ? ' · ' + (l.orient === 'portrait' ? 'вертикальный' : l.orient === 'landscape' ? 'горизонтальный' : esc(l.orient)) : ''}</small></div></div>`).join('') || '<p class="mute">В вашем HeyGen пока нет своих аватаров.</p>'}</div>
        <div class="avbar"><span>Отмечено: <b>${sel.size}</b>${sel.size > 1 ? ' — офис берёт их по кругу в случайном порядке' : sel.size === 1 ? ' — офис всегда берёт этого аватара' : ' — без выбора офис берёт аватара из настроек скилла'}</span><span class="sp"></span>
          <button class="btn" data-avr>Обновить список</button>${sel.size ? '<button class="btn" data-avc>Снять все</button>' : ''}<button class="btn go" data-avs>Сохранить выбор</button><span class="note" id="avn" style="margin:0"></span></div>`;
    }
  } else {
    const q = ST.q.toLowerCase(), list = D.skills.filter(x => !q || (x.name + ' ' + x.about).toLowerCase().includes(q));
    body = `<input id="skq" placeholder="Поиск по скиллам" value="${esc(ST.q)}" style="margin-bottom:10px"><ul class="sklist">${list.map(x => `<li><code>${esc(x.name)}</code><small>${esc(x.about)}</small></li>`).join('') || '<li class="mute">Ничего не нашлось.</li>'}</ul>
      <p class="mute small">Все скиллы исполнителя офиса — агенты выбирают из них сами. Список обновляется, когда исполнитель перезапускается.</p>`;
  }
  box.innerHTML = `<div class="defs">${cats.map(c => `<span>${esc(c.name)}: <b>${esc(nameOf(c.id, P.styles[c.id]) || 'спрашивать')}</b></span>`).join('')}<span>Аватары: <b>${(P.avatars || []).length ? P.avatars.map(a => esc(a.name || a.id)).join(', ') : 'из настроек скилла'}</b></span></div>
    <div class="stabs">${tabs.map(([id, n, c]) => `<button data-stab="${id}" class="${ST.tab === id ? 'on' : ''}">${esc(n)}${c !== '' ? `<small>${esc(c)}</small>` : ''}</button>`).join('')}</div>${body}`;
  if ($('skq')) { const i = $('skq'); i.oninput = () => { ST.q = i.value; const p = i.selectionStart; renderStyles(); $('skq').focus(); $('skq').setSelectionRange(p, p); }; }
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-stab],[data-sdef],[data-av],[data-avs],[data-avr],[data-avc]');
  if (!t || !$('sty')?.contains(t)) return;
  if (t.dataset.stab) { ST.tab = t.dataset.stab; return renderStyles(); }
  if (t.dataset.sdef !== undefined) {
    if (ST.busy) return; ST.busy = true; t.disabled = true;
    const r = await call('POST', '/prefs', { action:'style', cat:t.dataset.cat, id:t.dataset.sdef });
    ST.busy = false;
    if (r.ok) ST.data.prefs = r.j.prefs; else alert(r.j.error || 'Не получилось.');
    return renderStyles();
  }
  if (t.dataset.av) { const id = t.dataset.av; ST.sel ||= new Set(); ST.sel.has(id) ? ST.sel.delete(id) : ST.sel.add(id); return renderStyles(); }
  if (t.dataset.avc !== undefined) { ST.sel = new Set(); return renderStyles(); }
  if (t.dataset.avr !== undefined) return avatarsLoad(true);
  if (t.dataset.avs !== undefined) {
    const r = await call('POST', '/prefs', { action:'avatars', ids:[...(ST.sel || [])] });
    if (r.ok) { ST.data.prefs = r.j.prefs; renderStyles(); const n = $('avn'); if (n) { n.className = 'note ok'; n.textContent = 'Сохранено.'; } }
    else { const n = $('avn'); if (n) { n.className = 'note err'; n.textContent = r.j.error || 'Не получилось.'; } }
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset?.av) { e.preventDefault(); e.target.click(); } });
if (location.hash === '#register') TAB = 'register';
load();
</script>
</body>
</html>
