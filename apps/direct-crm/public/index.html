<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM Директа</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--line:#e3e6eb;--ink:#15181d;--mute:#69717d;--soft:#f0f2f5;
  --acc:#2563eb;--acc-ink:#fff;--hot:#dc2626;--hot-bg:#fdecec;--human:#d97706;--human-bg:#fdf3e1;
  --ok:#16a34a;--ok-bg:#e7f6ec;--low:#8a929d;--low-bg:#eef0f2;--me:#e8efff;--bot:#f0f2f5;
  --r:12px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--panel:#171a20;--line:#272b33;--ink:#e8eaee;--mute:#9aa2ae;--soft:#1e2229;
  --acc:#4f86ff;--hot:#f05252;--hot-bg:#3a1a1c;--human:#f0a43a;--human-bg:#3a2a12;
  --ok:#34c26a;--ok-bg:#15301f;--low:#8a929d;--low-bg:#22262d;--me:#1d2a45;--bot:#20242b;--shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
[hidden]{display:none!important}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:16px}
#login form{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
#login h1{margin:0 0 4px;font-size:20px}
#login p{margin:0 0 18px;color:var(--mute)}
#login label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
#login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#login .err{color:var(--hot);min-height:20px;margin-top:8px;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.warn{color:var(--hot)}
.btn:disabled{opacity:.5;cursor:default}
#login .btn{width:100%;justify-content:center;margin-top:14px;padding:10px}

/* shell */
#app{display:grid;grid-template-columns:220px 1fr;height:100%}
nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:2px}
nav .brand{font-weight:700;padding:4px 10px 14px;display:flex;align-items:center;gap:8px}
nav .brand small{display:block;font-weight:400;color:var(--mute);font-size:12px}
nav button.tab{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:9px;text-align:left;color:var(--mute)}
nav button.tab:hover{background:var(--soft);color:var(--ink)}
nav button.tab.on{background:var(--soft);color:var(--ink);font-weight:600}
nav button.tab .n{margin-left:auto;font-size:12px;background:var(--hot);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
nav button.tab .n.g{background:var(--line);color:var(--ink)}
nav .foot{margin-top:auto;font-size:12px;color:var(--mute);padding:10px;display:flex;flex-direction:column;gap:8px}
nav .foot .who{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--ink)}
nav .foot button{border:0;background:none;color:var(--mute);padding:0}
main{min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.top h2{margin:0;font-size:17px;margin-right:auto}
.top .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:99px;padding:2px 9px;background:var(--soft);color:var(--mute);white-space:nowrap}
.chip.hot{background:var(--hot-bg);color:var(--hot)}
.chip.human{background:var(--human-bg);color:var(--human)}
.chip.normal{background:var(--soft);color:var(--mute)}
.chip.low{background:var(--low-bg);color:var(--low)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.st{background:transparent;border:1px solid var(--line);color:var(--ink)}
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,400px) 1fr}
.body.wide{display:block;overflow:auto}

/* list */
.list{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
.filters{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--panel);z-index:1}
.filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);min-width:0}
.filters input{flex:1 1 140px}
.card{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px;position:relative}
.card:hover{background:var(--soft)}
.card.on{background:var(--me)}
.card .l1{display:flex;align-items:center;gap:8px}
.card .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .time{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.card .sum{color:var(--mute);margin:4px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
.card .l3{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.card .wait{color:var(--hot);font-weight:600;font-size:12px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.card.p-hot::before{background:var(--hot)}
.card.p-human::before{background:var(--human)}
.empty{color:var(--mute);padding:40px 20px;text-align:center}

/* chat */
.chat{display:flex;flex-direction:column;min-height:0;min-width:0}
.chat .head{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chat .head .t{margin-right:auto;min-width:0}
.chat .head .t b{font-size:16px}
.chat .head .t div{color:var(--mute);font-size:12px}
.chat .head select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel)}
.back{display:none}
.scroll{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ai{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.ai h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.ai .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ai .k{font-size:12px;color:var(--mute)}
.ai .v{margin-top:2px}
.score{display:inline-flex;gap:2px;vertical-align:-2px}
.score i{width:10px;height:10px;border-radius:3px;background:var(--line)}
.score.s1 i:nth-child(-n+1),.score.s2 i:nth-child(-n+2){background:var(--hot)}
.score.s3 i:nth-child(-n+3){background:var(--human)}
.score.s4 i:nth-child(-n+4),.score.s5 i:nth-child(-n+5){background:var(--ok)}
.issues{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.issues li{font-size:13px}
.issues li b{color:var(--hot);font-weight:600}
.msgs{display:flex;flex-direction:column;gap:6px}
.day{align-self:center;font-size:12px;color:var(--mute);margin:8px 0 2px}
.m{max-width:min(620px,85%);padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.m.c{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.b{align-self:flex-end;background:var(--bot);border-bottom-right-radius:4px}
.m.o{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.m .meta{display:block;font-size:11px;color:var(--mute);margin-top:4px}
.m a{color:var(--acc)}
.m img{display:block;max-width:240px;max-height:240px;border-radius:8px;margin-top:6px}
.reply{border-top:1px solid var(--line);background:var(--panel);padding:10px 14px}
.reply .row{display:flex;gap:8px;align-items:flex-end}
.reply textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;max-height:180px;background:var(--bg)}
.reply .hint{font-size:12px;color:var(--mute);margin-top:6px}
.ev{font-size:12px;color:var(--mute)}

/* stats */
.stats{padding:18px;display:flex;flex-direction:column;gap:16px;max-width:1200px}
.stats .period{display:flex;gap:6px}
.stats .period .btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .k{color:var(--mute);font-size:12px}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--mute);font-size:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.box h3{margin:0 0 12px;font-size:15px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--acc);border-radius:99px}
.bar .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:10px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}

@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  nav{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:0}
  nav .brand,nav .foot{display:none}
  nav button.tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;position:relative;flex:1;align-items:center;text-align:center}
  nav button.tab .n{position:absolute;top:0;right:calc(50% - 22px);margin:0}
  .top{padding:10px 16px;gap:8px}
  .top h2{font-size:16px}
  .top .chips .chip:nth-child(3),#syncBtn span{display:none}
  .chat .head{padding:10px 16px}
  .chat .head .t{flex:1 1 calc(100% - 60px)}
  .top .user{display:inline-flex}
  .body{grid-template-columns:1fr}
  .body.open .list{display:none}
  .body:not(.open) .chat{display:none}
  .back{display:inline-flex}
  .two{grid-template-columns:1fr}
  .bar{grid-template-columns:100px 1fr 54px}
  .scroll{padding:12px 16px}
  .stats{padding:16px}
}
.top .user{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
  <symbol id="i-chats" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>

  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>

<div id="login" hidden>
  <form id="lf">
    <h1>CRM Директа</h1>
    <p>Переписки ИИ-менеджера и очередь отдела продаж</p>
    <label for="ll">Логин</label><input id="ll" autocomplete="username" placeholder="bogdan" required>
    <label for="lp">Пароль</label><input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn pri" type="submit">Войти</button>
    <div class="err" id="le"></div>
  </form>
</div>

<div id="app" hidden>
  <nav>
    <div class="brand"><svg class="ico"><use href="#i-chats"/></svg><div>CRM Директа<small>Отдел продаж</small></div></div>
    <button class="tab" data-view="queue"><svg class="ico"><use href="#i-inbox"/></svg><span>Очередь</span><b class="n" id="nQueue" hidden></b></button>
    <button class="tab" data-view="all"><svg class="ico"><use href="#i-chats"/></svg><span>Все</span></button>
    <button class="tab" data-view="mine"><svg class="ico"><use href="#i-user"/></svg><span>Мои</span><b class="n g" id="nMine" hidden></b></button>
    <button class="tab" data-view="funnel"><svg class="ico"><use href="#i-funnel"/></svg><span>Воронка</span></button>
    <button class="tab" data-view="quality"><svg class="ico"><use href="#i-gauge"/></svg><span>Качество ИИ</span></button>
    <div class="foot">
      <div class="who"><span id="who"></span><button id="out" title="Выйти"><svg class="ico"><use href="#i-logout"/></svg></button></div>
      <div id="syncd"></div>
    </div>
  </nav>
  <main>
    <div class="top">
      <h2 id="title">Очередь</h2>
      <div class="chips" id="topchips"></div>
      <button class="btn" id="syncBtn" title="Забрать новые сообщения из ChatPlace"><svg class="ico"><use href="#i-refresh"/></svg><span>Обновить</span></button>
      <button class="btn user" id="out2" title="Выйти"><svg class="ico"><use href="#i-logout"/></svg></button>
    </div>
    <div class="body" id="body"></div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ico = n => `<svg class="ico"><use href="#i-${n}"/></svg>`;
const PRI = { hot:'Готов купить', human:'Нужен человек', normal:'Обычный', low:'Неважный' };
const STAGE = { new:'Новый', warm:'Тёплый', hot:'Горячий', customer:'Купил', lost:'Потерян' };
const TITLES = { queue:'Очередь', all:'Все переписки', mine:'Мои переписки', funnel:'Воронка и итог', quality:'Качество ИИ-менеджера' };
const S = { me:null, view:'queue', chats:[], open:null, detail:null, filters:{ q:'', stage:'', priority:'', days:'7' }, days:7, counts:{} };

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, { method:opts.method || 'GET', headers:opts.body ? { 'content-type':'application/json' } : {}, body:opts.body ? JSON.stringify(opts.body) : undefined, credentials:'same-origin' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/login') { showLogin(); throw new Error(j.error || 'Нужен вход'); }
  if (!r.ok) throw new Error(j.error || 'Ошибка ' + r.status);
  return j;
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 3500); }

const ago = sec => { if (!sec) return ''; const m = Math.round(sec / 60); if (m < 1) return 'только что'; if (m < 60) return m + ' мин'; const h = Math.round(m / 60); if (h < 24) return h + ' ч'; return Math.round(h / 24) + ' дн'; };
const when = ts => { if (!ts) return ''; const d = new Date(ts * 1000), t = new Date(); return d.toDateString() === t.toDateString() ? d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' }) : d.toLocaleDateString('ru-RU', { day:'numeric', month:'short' }); };
const dayOf = ts => new Date(ts * 1000).toLocaleDateString('ru-RU', { day:'numeric', month:'long', weekday:'short' });
const scoreHTML = s => s ? `<span class="score s${s}" title="Оценка ИИ: ${s} из 5"><i></i><i></i><i></i><i></i><i></i></span>` : '';
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);

function showLogin() { $('#app').hidden = true; $('#login').hidden = false; $('#ll').focus(); }
$('#lf').onsubmit = async e => {
  e.preventDefault(); $('#le').textContent = '';
  try { await api('/login', { method:'POST', body:{ login:$('#ll').value, password:$('#lp').value } }); $('#lp').value = ''; boot(); }
  catch (err) { $('#le').textContent = err.message; }
};
const logout = async () => { await api('/logout', { method:'POST' }).catch(() => {}); showLogin(); };
$('#out').onclick = logout; $('#out2').onclick = logout;
document.querySelectorAll('nav .tab').forEach(b => b.onclick = () => go(b.dataset.view));
$('#syncBtn').onclick = async () => {
  const b = $('#syncBtn'); b.disabled = true;
  try { const r = await api('/sync', { method:'POST' }); toast(r.off ? 'ChatPlace не подключён' : `Новых сообщений: ${r.messages || 0}`); await refresh(); }
  catch (e) { toast(e.message); } finally { b.disabled = false; }
};

async function boot() {
  try { const r = await api('/me'); S.me = r.user; S.counts = r.counts; }
  catch { return showLogin(); }
  $('#login').hidden = true; $('#app').hidden = false;
  $('#who').textContent = S.me.name;
  const h = location.hash.slice(1).split('/');
  go(TITLES[h[0]] ? h[0] : 'queue', h[1]);
}

function go(view, chatId) {
  S.view = view; S.open = chatId || null; S.detail = null;
  document.querySelectorAll('nav .tab').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  $('#title').textContent = TITLES[view];
  setHash();
  if (view === 'funnel' || view === 'quality') return loadStats();
  $('#body').className = 'body' + (S.open ? ' open' : '');
  $('#body').innerHTML = `<div class="list" id="list"></div><div class="chat" id="chat"><div class="empty">Выберите переписку слева</div></div>`;
  loadList().then(() => S.open && openChat(S.open));
}
const setHash = () => history.replaceState(null, '', '#' + S.view + (S.open ? '/' + S.open : ''));

function renderCounts() {
  const c = S.counts || {};
  const q = $('#nQueue'); q.hidden = !c.queue; q.textContent = c.queue || '';
  const chips = [];
  if (c.hot) chips.push(`<span class="chip hot">${ico('flame')} готовы купить ${c.hot}</span>`);
  if (c.human) chips.push(`<span class="chip human">${ico('hand')} нужен человек ${c.human}</span>`);
  if (c.taken) chips.push(`<span class="chip">${ico('user')} у менеджеров ${c.taken}</span>`);
  $('#topchips').innerHTML = chips.join('');
  const mine = S.chats.length && S.view === 'mine' ? S.chats.length : 0;
  $('#nMine').hidden = !mine; $('#nMine').textContent = mine || '';
}

async function loadList() {
  const p = new URLSearchParams({ view:S.view });
  if (S.view !== 'queue') for (const [k, v] of Object.entries(S.filters)) if (v) p.set(k, v);
  const r = await api('/chats?' + p);
  S.chats = r.chats; S.counts = r.counts;
  renderCounts(); renderList();
}

function filtersHTML() {
  if (S.view === 'queue') return `<div class="filters"><span class="ev">Сначала готовые купить, потом те, кому нужен человек; внутри — кто ждёт дольше. Сюда же попадают все, кто ждёт ответа больше 10 минут.</span></div>`;
  const f = S.filters;
  return `<div class="filters">
    <input id="fq" placeholder="Поиск: имя, текст" value="${esc(f.q)}">
    <select id="fst"><option value="">Все этапы</option>${Object.entries(STAGE).map(([k, v]) => `<option value="${k}"${f.stage === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
    <select id="fpr"><option value="">Любой приоритет</option>${Object.entries(PRI).map(([k, v]) => `<option value="${k}"${f.priority === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
    <select id="fd">${[['1', 'Сутки'], ['7', '7 дней'], ['30', '30 дней'], ['', 'Всё время']].map(([k, v]) => `<option value="${k}"${f.days === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
  </div>`;
}

function cardHTML(c) {
  const wait = c.waiting > 120 ? `<span class="wait">ждёт ${ago(c.waiting)}</span>` : '';
  return `<button class="card p-${c.priority}${c.id === S.open ? ' on' : ''}" data-id="${esc(c.id)}">
    <div class="l1"><span class="name">${esc(c.name)}</span>${c.handledBy ? `<span class="chip">${ico('user')}${esc(c.handledBy)}</span>` : ''}<span class="time">${when(c.lastAt)}</span></div>
    <div class="sum">${esc(c.summary || c.intent || (c.analyzed ? '' : 'Ещё не разобрано ИИ'))}</div>
    <div class="l3"><span class="chip ${c.priority}">${PRI[c.priority] || c.priority}</span><span class="chip st">${STAGE[c.stage] || c.stage}</span>
      ${c.source ? `<span class="chip">${esc(c.source)}</span>` : ''}${scoreHTML(c.aiScore)}${wait}</div>
  </button>`;
}

function renderList() {
  const el = $('#list'); if (!el) return;
  const keep = el.scrollTop;
  el.innerHTML = filtersHTML() + (S.chats.length ? S.chats.map(cardHTML).join('') : `<div class="empty">${S.view === 'queue' ? 'Очередь пуста — ИИ справляется со всеми' : 'Ничего не найдено'}</div>`);
  el.scrollTop = keep;
  el.querySelectorAll('.card').forEach(b => b.onclick = () => openChat(b.dataset.id));
  if (S.view !== 'queue') {
    let t;
    $('#fq').oninput = e => { clearTimeout(t); t = setTimeout(() => { S.filters.q = e.target.value; loadList(); }, 350); };
    $('#fst').onchange = e => { S.filters.stage = e.target.value; loadList(); };
    $('#fpr').onchange = e => { S.filters.priority = e.target.value; loadList(); };
    $('#fd').onchange = e => { S.filters.days = e.target.value; loadList(); };
  }
}

async function openChat(id, quiet) {
  S.open = id; setHash();
  $('#body').classList.add('open');
  document.querySelectorAll('.card').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  try { S.detail = await api('/chats/' + id); } catch (e) { if (!quiet) toast(e.message); return; }
  renderChat(quiet);
}

function aiHTML(c) {
  if (!c.analyzed && !c.summary) return `<div class="ai"><h4>${ico('spark')} Разбор ИИ</h4><div class="ev">Разбор появится через пару минут после последнего сообщения.</div></div>`;
  const iss = c.aiIssues || [];
  return `<div class="ai"><h4>${ico('spark')} Разбор ИИ${c.analyzed ? '' : ' · есть новые сообщения'}</h4>
    <div class="grid">
      <div><div class="k">Что происходит</div><div class="v">${esc(c.summary)}</div></div>
      <div><div class="k">Что сделать</div><div class="v"><b>${esc(c.nextStep)}</b></div></div>
      <div><div class="k">Почему ${esc((PRI[c.priority] || '').toLowerCase())}</div><div class="v">${esc(c.priorityReason)}</div></div>
      <div><div class="k">Как справился ИИ-менеджер</div><div class="v">${c.aiScore ? scoreHTML(c.aiScore) + ' ' + c.aiScore + ' из 5 · ' : ''}${esc(c.aiVerdict)}</div>
        ${iss.length ? `<ul class="issues">${iss.map(i => `<li><b>${esc(ISSUE[i.type] || i.type)}:</b> ${esc(i.text)}</li>`).join('')}</ul>` : ''}</div>
    </div></div>`;
}
const ISSUE = { wrong_answer:'Неверный ответ', ignored_question:'Не ответил на вопрос', lost_lead:'Упустил тёплого', pushy:'Давит / спамит', broken_flow:'Сломалась цепочка', tone:'Тон не тот', no_handoff:'Не позвал человека', other:'Другое' };
const EV = { take:'забрал у ИИ', release:'вернул ИИ', reply:'ответил', stage:'сменил этап', priority:'сменил приоритет', review:'отметил «разобрано»', unreview:'вернул в очередь', refresh:'обновил разбор' };

function renderChat(quiet) {
  const { chat:c, messages, events } = S.detail;
  const box = $('#chat');
  const draft = $('#rt')?.value || '';
  const wasBottom = !quiet || (() => { const s = box.querySelector('.scroll'); return !s || s.scrollHeight - s.scrollTop - s.clientHeight < 80; })();
  let lastDay = '';
  const ms = messages.map(m => {
    const d = dayOf(m.at), sep = d !== lastDay ? `<div class="day">${d}</div>` : ''; lastDay = d;
    const cls = ['client', 'user', 'contact'].includes(m.side) ? 'c' : m.by || m.side === 'operator' ? 'o' : 'b';
    const who = cls === 'c' ? '' : m.by ? m.by : m.side === 'bot' ? 'ИИ / бот' : m.side;
    const media = (m.media || []).map(f => f.type === 'image' && f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer"><img src="${esc(f.url)}" alt="" loading="lazy"></a>` : f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">[${esc(f.type === 'storyReply' ? 'ответ на сторис' : f.type || 'вложение')}]</a>` : '').join(' ');
    return `${sep}<div class="m ${cls}">${linkify(m.text)}${media}<span class="meta">${who ? esc(who) + ' · ' : ''}${new Date(m.at * 1000).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' })}</span></div>`;
  }).join('');
  box.innerHTML = `<div class="head">
      <button class="btn back" id="back">${ico('back')}</button>
      <div class="t"><b>${esc(c.name)}</b><div>${c.username ? '@' + esc(c.username) + ' · ' : ''}${c.ai ? 'ведёт ИИ' : 'ведёт ' + esc(c.handledBy || 'менеджер') + ', ИИ на паузе'} · ${c.messages} сообщ.</div></div>
      <select id="sst" title="Этап воронки">${Object.entries(STAGE).map(([k, v]) => `<option value="${k}"${c.stage === k ? ' selected' : ''}>${v}${c.stage === k && c.stageManual ? ' (вручную)' : ''}</option>`).join('')}</select>
      <select id="spr" title="Приоритет">${Object.entries(PRI).map(([k, v]) => `<option value="${k}"${c.priority === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
      ${c.ai ? `<button class="btn" id="take">${ico('hand')}Забрать у ИИ</button>` : `<button class="btn" id="rel">${ico('bot')}Вернуть ИИ</button>`}
      <button class="btn${c.reviewed ? '' : ' pri'}" id="rev">${ico('check')}${c.reviewed ? 'Вернуть в очередь' : 'Разобрано'}</button>
      <button class="btn" id="re" title="Забрать сообщения и разобрать заново">${ico('refresh')}</button>
    </div>
    <div class="scroll">${aiHTML(c)}<div class="msgs">${ms || '<div class="empty">Сообщений нет</div>'}</div>
      ${events.length ? `<div class="ev">${events.slice(0, 6).map(e => `${new Date(e.at * 1000).toLocaleString('ru-RU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })} — ${esc(e.user)} ${EV[e.kind] || e.kind}${e.data?.to ? ': ' + esc(STAGE[e.data.to] || PRI[e.data.to] || e.data.to) : ''}`).join('<br>')}</div>` : ''}
    </div>
    <div class="reply"><div class="row"><textarea id="rt" rows="1" placeholder="Ответ клиенту…">${esc(draft)}</textarea><button class="btn pri" id="send">${ico('send')}<span>Отправить</span></button></div>
      <div class="hint">${c.ai ? 'Ответ отсюда заберёт переписку у ИИ: автоответы в ней встанут на паузу, пока не нажмёте «Вернуть ИИ».' : 'ИИ в этой переписке на паузе.'} Ctrl+Enter — отправить.</div></div>`;
  const s = box.querySelector('.scroll'); if (wasBottom) s.scrollTop = s.scrollHeight;
  const ta = $('#rt');
  const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(180, ta.scrollHeight) + 'px'; }; grow();
  ta.oninput = grow;
  ta.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } };
  $('#send').onclick = send;
  $('#back').onclick = () => { S.open = null; setHash(); $('#body').classList.remove('open'); };
  const doAct = async (a, body, ok) => {
    try { const r = await api(`/chats/${c.id}/${a}`, { method:'POST', body:body || {} }); if (ok) toast(ok); await openChat(c.id, true); patchCard(r.chat); }
    catch (e) { toast(e.message); }
  };
  $('#take') && ($('#take').onclick = () => doAct('take', null, 'Переписка у вас, ИИ на паузе'));
  $('#rel') && ($('#rel').onclick = () => doAct('release', null, 'ИИ снова ведёт переписку'));
  $('#rev').onclick = () => doAct('review', { undo:c.reviewed }, c.reviewed ? 'Вернули в очередь' : 'Убрано из очереди до нового сообщения');
  $('#re').onclick = () => { toast('Обновляем и разбираем…'); doAct('refresh'); };
  $('#sst').onchange = e => doAct('stage', { stage:e.target.value }, 'Этап сохранён');
  $('#spr').onchange = e => doAct('priority', { priority:e.target.value }, 'Приоритет сохранён');
}

async function send() {
  const ta = $('#rt'), text = ta.value.trim(), id = S.open;
  if (!text) return;
  $('#send').disabled = true;
  try { const r = await api(`/chats/${id}/reply`, { method:'POST', body:{ text } }); ta.value = ''; await openChat(id, true); patchCard(r.chat); }
  catch (e) { toast(e.message); } finally { const b = $('#send'); if (b) b.disabled = false; }
}
function patchCard(c) {
  if (!c) return;
  const i = S.chats.findIndex(x => x.id === c.id);
  if (i >= 0) { S.chats[i] = c; renderList(); }
}

/* ---------- funnel and quality ---------- */
async function loadStats() {
  $('#body').className = 'body wide';
  $('#body').innerHTML = `<div class="stats"><div class="empty">Считаем…</div></div>`;
  let s;
  try { s = await api('/stats?days=' + S.days); } catch (e) { $('#body').innerHTML = `<div class="stats"><div class="empty">${esc(e.message)}</div></div>`; return; }
  const period = `<div class="period">${[[1, 'Сутки'], [7, '7 дней'], [30, '30 дней'], [90, '90 дней']].map(([d, l]) => `<button class="btn${S.days === d ? ' on' : ''}" data-d="${d}">${l}</button>`).join('')}</div>`;
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  const bars = (rows, max) => `<div class="bars">${rows.map(([l, n, sub]) => `<div class="bar"><span>${esc(l)}</span><div class="track"><div class="fill" style="width:${max && n ? Math.max(2, n / max * 100) : 0}%"></div></div><span class="num">${n}${sub ? ' · ' + sub : ''}</span></div>`).join('')}</div>`;
  let h = period;
  if (S.view === 'funnel') {
    const f = s.funnel, total = s.chats, warmUp = f.warm + f.hot + f.customer, hotUp = f.hot + f.customer;
    h += `<div class="kpis">
      <div class="kpi"><div class="k">Переписок с клиентами</div><div class="v">${total}</div><div class="s">входящих сообщений ${s.messagesIn}</div></div>
      <div class="kpi"><div class="k">Дошли до интереса</div><div class="v">${pct(warmUp, total)}</div><div class="s">${warmUp} тёплых и дальше</div></div>
      <div class="kpi"><div class="k">Обсуждали покупку</div><div class="v">${pct(hotUp, total)}</div><div class="s">${hotUp} горячих и купивших</div></div>
      <div class="kpi"><div class="k">Купили</div><div class="v">${f.customer}</div><div class="s">потеряно ${f.lost}</div></div>
      <div class="kpi"><div class="k">Ответ менеджера</div><div class="v">${s.manual.medianSec != null ? ago(s.manual.medianSec) : '—'}</div><div class="s">медиана, ответов ${s.manual.replies}</div></div>
    </div>
    <div class="two">
      <div class="box"><h3>Этапы воронки</h3>${bars(Object.entries(STAGE).map(([k, l]) => [l, f[k], pct(f[k], total)]), Math.max(...Object.values(f)))}</div>
      <div class="box"><h3>Приоритет запросов</h3>${bars(Object.entries(PRI).map(([k, l]) => [l, s.priority[k] || 0]), Math.max(1, ...Object.values(s.priority)))}</div>
    </div>
    <div class="box"><h3>Откуда пришли: кодовые слова и материалы</h3><div class="tw"><table><thead><tr><th>Источник</th><th class="n">Переписок</th><th class="n">Тёплые+</th><th class="n">Горячие+</th><th class="n">Купили</th><th class="n">Потеряны</th><th class="n">Конверсия в покупку</th></tr></thead>
      <tbody>${s.sources.map(r => `<tr><td><a href="#" data-src="${esc(r.source)}">${esc(r.source)}</a></td><td class="n">${r.n}</td><td class="n">${r.warm}</td><td class="n">${r.hot}</td><td class="n">${r.customer}</td><td class="n">${r.lost}</td><td class="n">${pct(r.customer, r.n)}</td></tr>`).join('') || '<tr><td colspan="7" class="ev">Пока нет данных</td></tr>'}</tbody></table></div></div>`;
  } else {
    const a = s.ai, maxIss = Math.max(1, ...Object.values(a.issues));
    h += `<div class="kpis">
      <div class="kpi"><div class="k">Средняя оценка ИИ</div><div class="v">${a.avg ?? '—'}</div><div class="s">из 5 · оценено ${a.graded} переписок</div></div>
      <div class="kpi"><div class="k">Плохо и провал (1–2)</div><div class="v">${a.dist[0] + a.dist[1]}</div><div class="s">${pct(a.dist[0] + a.dist[1], a.graded)} переписок</div></div>
      <div class="kpi"><div class="k">Отлично (5)</div><div class="v">${a.dist[4]}</div><div class="s">${pct(a.dist[4], a.graded)} переписок</div></div>
      <div class="kpi"><div class="k">Нужен был человек</div><div class="v">${s.priority.human || 0}</div><div class="s">готовых купить ${s.priority.hot || 0}</div></div>
    </div>
    <div class="two">
      <div class="box"><h3>Оценки</h3>${bars([5, 4, 3, 2, 1].map(n => [n + ' — ' + ['провал', 'плохо', 'терпимо', 'хорошо', 'отлично'][n - 1], a.dist[n - 1]]), Math.max(1, ...a.dist))}</div>
      <div class="box"><h3>Ошибки ИИ-менеджера</h3>${bars(Object.entries(a.issues).sort((x, y) => y[1] - x[1]).map(([k, n]) => [a.issueNames[k] || k, n]), maxIss)}</div>
    </div>
    <div class="box"><h3>По дням</h3><div class="tw"><table><thead><tr><th>День</th><th class="n">Переписок</th><th class="n">Оценка ИИ</th><th class="n">Готовы купить</th><th class="n">Нужен человек</th></tr></thead>
      <tbody>${s.byDay.slice().reverse().map(r => `<tr><td>${new Date(r.day).toLocaleDateString('ru-RU', { day:'numeric', month:'short', weekday:'short' })}</td><td class="n">${r.chats}</td><td class="n">${r.score ?? '—'}</td><td class="n">${r.hot}</td><td class="n">${r.human}</td></tr>`).join('') || '<tr><td colspan="5" class="ev">Пока нет данных</td></tr>'}</tbody></table></div></div>
    <div class="box"><h3>Где ИИ справился плохо</h3>${a.worst.length ? `<div>${a.worst.map(c => `<button class="card p-human" data-id="${esc(c.id)}"><div class="l1"><span class="name">${esc(c.name)}</span>${scoreHTML(c.aiScore)}<span class="time">${when(c.lastAt)}</span></div><div class="sum">${esc(c.aiVerdict)}</div>
      <div class="l3">${(c.aiIssues || []).map(i => `<span class="chip hot">${esc(ISSUE[i.type] || i.type)}</span>`).join('')}</div></button>`).join('')}</div>` : '<div class="ev">Таких переписок нет</div>'}</div>`;
  }
  $('#body').innerHTML = `<div class="stats">${h}</div>`;
  document.querySelectorAll('.period .btn').forEach(b => b.onclick = () => { S.days = Number(b.dataset.d); loadStats(); });
  document.querySelectorAll('.stats .card').forEach(b => b.onclick = () => { S.filters = { q:'', stage:'', priority:'', days:'' }; go('all', b.dataset.id); });
  document.querySelectorAll('[data-src]').forEach(a => a.onclick = e => { e.preventDefault(); S.filters = { q:'', stage:'', priority:'', days:String(S.days), source:a.dataset.src === 'не определён' ? '' : a.dataset.src }; go('all'); });
}

async function refresh() {
  if (S.view === 'funnel' || S.view === 'quality') return;
  await loadList().catch(() => {});
  if (S.open && !document.activeElement?.matches?.('textarea, select')) await openChat(S.open, true);
}
setInterval(() => { if (!document.hidden && S.me && !$('#app').hidden) refresh(); }, 30000);
boot();
</script>
</body>
</html>
