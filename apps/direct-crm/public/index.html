<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM AICEX</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--line:#e3e6eb;--ink:#15181d;--mute:#69717d;--soft:#f0f2f5;
  --acc:#2563eb;--acc-ink:#fff;--hot:#dc2626;--hot-bg:#fdecec;--human:#d97706;--human-bg:#fdf3e1;
  --ok:#16a34a;--ok-bg:#e7f6ec;--low:#8a929d;--low-bg:#eef0f2;--me:#e8efff;--bot:#f0f2f5;
  --r:12px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--grid:#e9e8e4;
  --q1:#cde2fb;--q2:#9ec5f4;--q3:#6da7ec;--q4:#3987e5;--q5:#256abf;--q6:#184f95;--q0:#f3f4f6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--panel:#171a20;--line:#272b33;--ink:#e8eaee;--mute:#9aa2ae;--soft:#1e2229;
  --acc:#4f86ff;--hot:#f05252;--hot-bg:#3a1a1c;--human:#f0a43a;--human-bg:#3a2a12;
  --ok:#34c26a;--ok-bg:#15301f;--low:#8a929d;--low-bg:#22262d;--me:#1d2a45;--bot:#20242b;--shadow:none;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--grid:#2c3038;
  --q1:#104281;--q2:#184f95;--q3:#1c5cab;--q4:#2a78d6;--q5:#5598e7;--q6:#9ec5f4;--q0:#1e2229;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
[hidden]{display:none!important}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:16px}
#login form{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
#login h1{margin:0 0 4px;font-size:20px}
#login p{margin:0 0 18px;color:var(--mute)}
#login label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
#login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#login .err{color:var(--hot);min-height:20px;margin-top:8px;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.warn{color:var(--hot)}
.btn:disabled{opacity:.5;cursor:default}
#login .btn{width:100%;justify-content:center;margin-top:14px;padding:10px}

/* shell */
#app{display:grid;grid-template-columns:220px 1fr;height:100%}
nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:2px}
nav .brand{font-weight:700;padding:4px 10px 14px;display:flex;align-items:center;gap:8px}
nav .brand small{display:block;font-weight:400;color:var(--mute);font-size:12px}
nav .nh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:12px 10px 4px}
nav button.tab{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:9px;text-align:left;color:var(--mute)}
nav button.tab:hover{background:var(--soft);color:var(--ink)}
nav button.tab.on{background:var(--soft);color:var(--ink);font-weight:600}
nav button.tab .n{margin-left:auto;font-size:12px;background:var(--hot);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
nav button.tab .n.g{background:var(--line);color:var(--ink)}
nav .foot{margin-top:auto;font-size:12px;color:var(--mute);padding:10px;display:flex;flex-direction:column;gap:8px}
nav .foot .who{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--ink)}
nav .foot button{border:0;background:none;color:var(--mute);padding:0}
main{min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.top h2{margin:0;font-size:17px;margin-right:auto}
.top .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:99px;padding:2px 9px;background:var(--soft);color:var(--mute);white-space:nowrap}
.chip.hot{background:var(--hot-bg);color:var(--hot)}
.chip.human{background:var(--human-bg);color:var(--human)}
.chip.normal{background:var(--soft);color:var(--mute)}
.chip.low{background:var(--low-bg);color:var(--low)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.st{background:transparent;border:1px solid var(--line);color:var(--ink)}
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,400px) 1fr}
.body.wide{display:block;overflow:auto}

/* list */
.list{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
.filters{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--panel);z-index:1}
.filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);min-width:0}
.filters input{flex:1 1 140px}
.folders{display:flex;gap:6px;padding:10px 10px 0;overflow-x:auto;position:sticky;top:0;background:var(--panel);z-index:2;scrollbar-width:none}
.folders button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--mute)}
.folders button b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.folders button.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.folders button.on b{color:var(--panel)}
.card{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px;position:relative}
.card:hover{background:var(--soft)}
.card.on{background:var(--me)}
.card .l1{display:flex;align-items:center;gap:8px}
.card .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .time{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.card .sum{color:var(--mute);margin:4px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
.card .l3{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.card .wait{color:var(--hot);font-weight:600;font-size:12px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.card.p-hot::before{background:var(--hot)}
.card.p-human::before{background:var(--human)}
.empty{color:var(--mute);padding:40px 20px;text-align:center}

/* chat */
.chat{display:flex;flex-direction:column;min-height:0;min-width:0}
.chat .head{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chat .head .t{margin-right:auto;min-width:0}
.chat .head .t b{font-size:16px}
.chat .head .t div{color:var(--mute);font-size:12px}
.chat .head select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel)}
.back{display:none}
.scroll{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ai{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.ai h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.ai .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ai .k{font-size:12px;color:var(--mute)}
.ai .v{margin-top:2px}
.score{display:inline-flex;gap:2px;vertical-align:-2px}
.score i{width:10px;height:10px;border-radius:3px;background:var(--line)}
.score.s1 i:nth-child(-n+1),.score.s2 i:nth-child(-n+2){background:var(--hot)}
.score.s3 i:nth-child(-n+3){background:var(--human)}
.score.s4 i:nth-child(-n+4),.score.s5 i:nth-child(-n+5){background:var(--ok)}
.issues{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.issues li{font-size:13px}
.issues li b{color:var(--hot);font-weight:600}
.mk{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;margin-top:4px;background:var(--human-bg);color:var(--human)}
.mk.codeword{background:var(--me);color:var(--acc)}
.mk.step{background:var(--soft);color:var(--mute)}
.lead{display:flex;align-items:center;gap:8px}
.lead .track{flex:1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden;max-width:160px}
.lead .fill{height:100%;background:linear-gradient(90deg,var(--human),var(--hot));border-radius:99px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.live.warn i{background:var(--human)}
.live.bad i{background:var(--hot)}
.fn{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--panel)}
.fn h4{margin:0 0 4px;font-size:14px}
.fn .sub{color:var(--mute);font-size:12px;margin-bottom:10px}
.fn .st{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.fn .st .t{color:var(--ink);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fn .st .c{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.fn .btns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.fn .bt{font-size:12px;border-radius:8px;padding:3px 8px;background:var(--me);color:var(--acc)}
.fn .bt.url{background:var(--ok-bg);color:var(--ok)}
.up{color:var(--ok);font-size:11px;margin-left:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.kq{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.kq .q{font-weight:600}
.kq textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);resize:vertical}
.kq .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.md{font-size:14px;line-height:1.55}
.md h2,.md h3{font-size:15px;margin:14px 0 6px}
.md ul{margin:4px 0;padding-left:20px}
/* dashboard */
.dash{padding:18px;display:flex;flex-direction:column;gap:16px;max-width:1280px}
.dash .head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dash .head .ev{margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.dash .period{display:flex;gap:6px;flex-wrap:wrap}
.dash .period .btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .k{color:var(--mute);font-size:12px}
.tile .v{font-size:30px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{color:var(--mute);font-size:12px;margin-top:2px}
.tile .d{font-weight:600}.tile .d.up{color:var(--ok)}.tile .d.down{color:var(--hot)}
.tile.hero{grid-column:span 2}
.tile.hero .v{font-size:40px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:11px;fill:var(--mute)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .lab{font-size:12px;font-weight:600;fill:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;border-radius:8px;padding:7px 10px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5;line-height:1.5;box-shadow:var(--shadow)}
.tip b{font-variant-numeric:tabular-nums}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.heat{display:grid;grid-template-columns:28px repeat(24,1fr);gap:2px;font-size:10px;color:var(--mute)}
.heat .c{aspect-ratio:1;border-radius:3px;background:var(--q0);cursor:default}
.heat .h{text-align:center}
.heat .w{display:flex;align-items:center}
.scale{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mute);margin-top:8px}
.scale i{width:18px;height:10px;border-radius:2px}
.hbar{display:grid;grid-template-columns:minmax(120px,1.2fr) 3fr 64px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{height:14px;position:relative}
.hbar .f{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums}
.segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.seg{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.seg:hover{border-color:var(--acc)}
.seg .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.seg .nm{font-weight:600}
.seg .nt{font-size:12px;color:var(--mute)}
.seg .sh{height:4px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:4px}
.seg .sh i{display:block;height:100%;background:var(--s1);border-radius:99px}
.toplist td.who{max-width:240px}
.toplist td.who b{display:block}
.toplist td.who small{color:var(--mute)}
.toplist tr{cursor:pointer}
.toplist tr:hover td{background:var(--soft)}
.pill{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;background:var(--soft);color:var(--mute);margin:1px 2px 1px 0}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:12px}.tile .v{font-size:24px}.tile.hero .v{font-size:32px}.tile.hero{grid-column:span 2}.dash{padding:16px}.hbar{grid-template-columns:110px 1fr 52px}}
.msgs{display:flex;flex-direction:column;gap:6px}
.day{align-self:center;font-size:12px;color:var(--mute);margin:8px 0 2px}
.m{max-width:min(620px,85%);padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.m.c{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.b{align-self:flex-end;background:var(--bot);border-bottom-right-radius:4px}
.m.o{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.m .meta{display:block;font-size:11px;color:var(--mute);margin-top:4px}
.m a{color:var(--acc)}
.m img{display:block;max-width:240px;max-height:240px;border-radius:8px;margin-top:6px}
.reply{border-top:1px solid var(--line);background:var(--panel);padding:10px 14px}
.reply .row{display:flex;gap:8px;align-items:flex-end}
.reply textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;max-height:180px;background:var(--bg)}
.reply .hint{font-size:12px;color:var(--mute);margin-top:6px}
.ev{font-size:12px;color:var(--mute)}

/* stats */
.stats{padding:18px;display:flex;flex-direction:column;gap:16px;max-width:1200px}
.stats .period{display:flex;gap:6px}
.stats .period .btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .k{color:var(--mute);font-size:12px}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--mute);font-size:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.box h3{margin:0 0 12px;font-size:15px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--acc);border-radius:99px}
.bar .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:10px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}

@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  nav{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:0}
  nav .brand,nav .foot,nav .nh{display:none}
  nav{overflow-x:auto;justify-content:flex-start}
  nav button.tab{flex:0 0 auto;min-width:64px}
  nav button.tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;position:relative;flex:1;align-items:center;text-align:center}
  nav button.tab .n{position:absolute;top:0;right:calc(50% - 22px);margin:0}
  .top{padding:10px 16px;gap:8px}
  .top h2{font-size:16px}
  .top .chips .chip:nth-child(3),#syncBtn span{display:none}
  .chat .head{padding:10px 16px}
  .chat .head .t{flex:1 1 calc(100% - 60px)}
  .top .user{display:inline-flex}
  .body{grid-template-columns:1fr}
  .body.open .list{display:none}
  .body:not(.open) .chat{display:none}
  .back{display:inline-flex}
  .two{grid-template-columns:1fr}
  .bar{grid-template-columns:100px 1fr 54px}
  .scroll{padding:12px 16px}
  .stats{padding:16px}
}
.top .user{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
  <symbol id="i-chats" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="i-funnel" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>

<div id="login" hidden>
  <form id="lf">
    <h1>CRM AICEX</h1>
    <p>Аналитика аудитории и работа с перепиской в Директе</p>
    <label for="ll">Логин</label><input id="ll" autocomplete="username" placeholder="bogdan" required>
    <label for="lp">Пароль</label><input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn pri" type="submit">Войти</button>
    <div class="err" id="le"></div>
  </form>
</div>

<div id="app" hidden>
  <nav>
    <div class="brand"><svg class="ico"><use href="#i-chats"/></svg><div>CRM AICEX<small>Аналитика и Директ</small></div></div>
    <div class="nh">Аналитика</div>
    <button class="tab" data-view="dash"><svg class="ico"><use href="#i-chart"/></svg><span>Дашборд</span></button>
    <button class="tab" data-view="funnel"><svg class="ico"><use href="#i-funnel"/></svg><span>Воронка</span></button>
    <button class="tab" data-view="quality"><svg class="ico"><use href="#i-gauge"/></svg><span>Качество ИИ</span></button>
    <button class="tab" data-view="chains"><svg class="ico"><use href="#i-link"/></svg><span>Цепочки</span></button>
    <div class="nh">Директ</div>
    <button class="tab" data-view="queue"><svg class="ico"><use href="#i-inbox"/></svg><span>Очередь</span><b class="n" id="nQueue" hidden></b></button>
    <button class="tab" data-view="all"><svg class="ico"><use href="#i-chats"/></svg><span>Все</span></button>
    <button class="tab" data-view="mine"><svg class="ico"><use href="#i-user"/></svg><span>Мои</span><b class="n g" id="nMine" hidden></b></button>
    <button class="tab" data-view="learn"><svg class="ico"><use href="#i-book"/></svg><span>Обучение ИИ</span><b class="n g" id="nLearn" hidden></b></button>
    <div class="foot">
      <div class="who"><span id="who"></span><button id="out" title="Выйти"><svg class="ico"><use href="#i-logout"/></svg></button></div>
      <div id="syncd"></div>
    </div>
  </nav>
  <main>
    <div class="top">
      <h2 id="title">Очередь</h2>
      <span class="live" id="live" title="Как давно CRM забрала новые сообщения из ChatPlace"><i></i><span>…</span></span>
      <div class="chips" id="topchips"></div>
      <button class="btn" id="syncBtn" title="Забрать новые сообщения из ChatPlace"><svg class="ico"><use href="#i-refresh"/></svg><span>Обновить</span></button>
      <button class="btn user" id="out2" title="Выйти"><svg class="ico"><use href="#i-logout"/></svg></button>
    </div>
    <div class="body" id="body"></div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ico = n => `<svg class="ico"><use href="#i-${n}"/></svg>`;
const PRI = { hot:'Готов купить', human:'Нужен человек', normal:'Обычный', low:'Неважный' };
const STAGE = { new:'Новый', warm:'Тёплый', hot:'Горячий', customer:'Купил', lost:'Потерян' };
const TITLES = { dash:'Дашборд', chains:'Цепочки и кнопки', learn:'Обучение ИИ-менеджера', queue:'Очередь', all:'Все переписки', mine:'Мои переписки', funnel:'Воронка и итог', quality:'Качество ИИ-менеджера' };
const S = { me:null, view:'queue', chats:[], open:null, detail:null, filters:{ q:'', stage:'', priority:'', days:'7', segment:'talk' }, folders:[], days:7, counts:{} };

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, { method:opts.method || 'GET', headers:opts.body ? { 'content-type':'application/json' } : {}, body:opts.body ? JSON.stringify(opts.body) : undefined, credentials:'same-origin' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/login') { showLogin(); throw new Error(j.error || 'Нужен вход'); }
  if (!r.ok) throw new Error(j.error || 'Ошибка ' + r.status);
  return j;
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 3500); }

const ago = sec => { if (!sec) return ''; const m = Math.round(sec / 60); if (m < 1) return 'только что'; if (m < 60) return m + ' мин'; const h = Math.round(m / 60); if (h < 24) return h + ' ч'; return Math.round(h / 24) + ' дн'; };
const when = ts => { if (!ts) return ''; const d = new Date(ts * 1000), t = new Date(); return d.toDateString() === t.toDateString() ? d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' }) : d.toLocaleDateString('ru-RU', { day:'numeric', month:'short' }); };
const dayOf = ts => new Date(ts * 1000).toLocaleDateString('ru-RU', { day:'numeric', month:'long', weekday:'short' });
const scoreHTML = s => s ? `<span class="score s${s}" title="Оценка ИИ: ${s} из 5"><i></i><i></i><i></i><i></i><i></i></span>` : '';
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);

function showLogin() { $('#app').hidden = true; $('#login').hidden = false; $('#ll').focus(); }
$('#lf').onsubmit = async e => {
  e.preventDefault(); $('#le').textContent = '';
  try { await api('/login', { method:'POST', body:{ login:$('#ll').value, password:$('#lp').value } }); $('#lp').value = ''; boot(); }
  catch (err) { $('#le').textContent = err.message; }
};
const logout = async () => { await api('/logout', { method:'POST' }).catch(() => {}); showLogin(); };
$('#out').onclick = logout; $('#out2').onclick = logout;
document.querySelectorAll('nav .tab').forEach(b => b.onclick = () => go(b.dataset.view));
$('#syncBtn').onclick = async () => {
  const b = $('#syncBtn'); b.disabled = true;
  try { const r = await api('/sync', { method:'POST' }); toast(r.off ? 'ChatPlace не подключён' : `Новых сообщений: ${r.messages || 0}`); await refresh(); }
  catch (e) { toast(e.message); } finally { b.disabled = false; }
};

async function boot() {
  try { const r = await api('/me'); S.me = r.user; S.counts = r.counts; }
  catch { return showLogin(); }
  $('#login').hidden = true; $('#app').hidden = false;
  $('#who').textContent = S.me.name + (S.me.role === 'owner' ? ' · админ' : S.me.role === 'head' ? ' · РОП' : '');
  live();
  const h = location.hash.slice(1).split('/');
  go(TITLES[h[0]] ? h[0] : S.me.role === 'owner' ? 'dash' : 'queue', h[1]);
}

function go(view, chatId) {
  S.view = view; S.open = chatId || null; S.detail = null;
  document.querySelectorAll('nav .tab').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  $('#title').textContent = TITLES[view];
  setHash();
  if (view === 'funnel' || view === 'quality') return loadStats();
  if (view === 'chains') return loadChains();
  if (view === 'dash') return loadDash();
  if (view === 'learn') return loadLearn();
  $('#body').className = 'body' + (S.open ? ' open' : '');
  $('#body').innerHTML = `<div class="list" id="list"></div><div class="chat" id="chat"><div class="empty">Выберите переписку слева</div></div>`;
  loadList().then(() => S.open && openChat(S.open));
}
const setHash = () => history.replaceState(null, '', '#' + S.view + (S.open ? '/' + S.open : ''));

function renderCounts() {
  const c = S.counts || {};
  const q = $('#nQueue'); q.hidden = !c.queue; q.textContent = c.queue || '';
  const chips = [];
  if (c.hot) chips.push(`<span class="chip hot">${ico('flame')} готовы купить ${c.hot}</span>`);
  if (c.human) chips.push(`<span class="chip human">${ico('hand')} нужен человек ${c.human}</span>`);
  if (c.taken) chips.push(`<span class="chip">${ico('user')} у менеджеров ${c.taken}</span>`);
  $('#topchips').innerHTML = chips.join('');
  const mine = S.chats.length && S.view === 'mine' ? S.chats.length : 0;
  $('#nMine').hidden = !mine; $('#nMine').textContent = mine || '';
}

async function loadList() {
  const p = new URLSearchParams({ view:S.view });
  if (S.view !== 'queue') for (const [k, v] of Object.entries(S.filters)) if (v) p.set(k, v);
  const r = await api('/chats?' + p);
  S.chats = r.chats; S.counts = r.counts; S.folders = r.folders || [];
  renderCounts(); renderList();
}

function filtersHTML() {
  const segChip = S.view === 'queue' ? '' : `<div class="folders" role="tablist" aria-label="Папки">${(S.folders || []).map(f => `<button data-folder="${esc(f.key)}" title="${esc(f.note || '')}" class="${(S.filters.segment || '') === f.key ? 'on' : ''}">${esc(f.name)} <b>${fmt(f.n)}</b></button>`).join('')}</div>`;
  if (S.view === 'queue') return `<div class="filters"><span class="ev">Сначала готовые купить, потом те, кому нужен человек; внутри — кто ждёт дольше. Сюда же попадают все, кто ждёт ответа больше 10 минут.</span></div>`;
  const f = S.filters;
  return segChip + `<div class="filters">
    <input id="fq" placeholder="Поиск: имя, текст" value="${esc(f.q)}">
    <select id="fst"><option value="">Все этапы</option>${Object.entries(STAGE).map(([k, v]) => `<option value="${k}"${f.stage === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
    <select id="fpr"><option value="">Любой приоритет</option>${Object.entries(PRI).map(([k, v]) => `<option value="${k}"${f.priority === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
    <select id="fd">${[['1', 'Сутки'], ['7', '7 дней'], ['30', '30 дней'], ['', 'Всё время']].map(([k, v]) => `<option value="${k}"${f.days === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
  </div>`;
}

function cardHTML(c) {
  const wait = c.waiting > 120 ? `<span class="wait">ждёт ${ago(c.waiting)}</span>` : '';
  return `<button class="card p-${c.priority}${c.id === S.open ? ' on' : ''}" data-id="${esc(c.id)}">
    <div class="l1"><span class="name">${esc(c.name)}</span>${c.handledBy ? `<span class="chip">${ico('user')}${esc(c.handledBy)}</span>` : ''}<span class="time">${when(c.lastAt)}</span></div>
    <div class="sum">${esc(c.summary || c.intent || (c.analyzed ? '' : 'Ещё не разобрано ИИ'))}</div>
    <div class="l3"><span class="chip ${c.priority}">${PRI[c.priority] || c.priority}</span><span class="chip st">${STAGE[c.stage] || c.stage}</span>
      ${c.source ? `<span class="chip">${esc(c.source)}</span>` : ''}${c.leadScore != null ? `<span class="chip" title="Квалификация лида">${c.leadScore}</span>` : ''}${scoreHTML(c.aiScore)}${wait}</div>
  </button>`;
}

function renderList() {
  const el = $('#list'); if (!el) return;
  const keep = el.scrollTop;
  el.innerHTML = filtersHTML() + (S.chats.length ? S.chats.map(cardHTML).join('') : `<div class="empty">${S.view === 'queue' ? 'Очередь пуста — ИИ справляется со всеми' : 'Ничего не найдено'}</div>`);
  el.scrollTop = keep;
  el.querySelectorAll('.card').forEach(b => b.onclick = () => openChat(b.dataset.id));
  if (S.view !== 'queue') {
    let t;
    $('#fq').oninput = e => { clearTimeout(t); t = setTimeout(() => { S.filters.q = e.target.value; loadList(); }, 350); };
    $('#fst').onchange = e => { S.filters.stage = e.target.value; loadList(); };
    $('#fpr').onchange = e => { S.filters.priority = e.target.value; loadList(); };
    $('#fd').onchange = e => { S.filters.days = e.target.value; loadList(); };
    document.querySelectorAll('[data-folder]').forEach(b => b.onclick = () => { S.filters.segment = b.dataset.folder; loadList(); });
  }
}

async function openChat(id, quiet) {
  S.open = id; setHash();
  $('#body').classList.add('open');
  document.querySelectorAll('.card').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  try { S.detail = await api('/chats/' + id); } catch (e) { if (!quiet) toast(e.message); return; }
  renderChat(quiet);
}

function aiHTML(c) {
  if (!c.analyzed && !c.summary) return `<div class="ai"><h4>${ico('spark')} Разбор ИИ</h4><div class="ev">Разбор появится через пару минут после последнего сообщения.</div></div>`;
  const iss = c.aiIssues || [];
  return `<div class="ai"><h4>${ico('spark')} Разбор ИИ${c.analyzed ? '' : ' · есть новые сообщения'}</h4>
    <div class="grid">
      <div><div class="k">Что происходит</div><div class="v">${esc(c.summary)}</div></div>
      <div><div class="k">Что сделать</div><div class="v"><b>${esc(c.nextStep)}</b></div></div>
      <div><div class="k">Почему ${esc((PRI[c.priority] || '').toLowerCase())}</div><div class="v">${esc(c.priorityReason)}</div></div>
      <div><div class="k">Квалификация лида</div><div class="v">${c.leadScore != null ? `<div class="lead"><div class="track"><div class="fill" style="width:${c.leadScore}%"></div></div><b>${c.leadScore}</b></div>` : '—'}
        ${c.interest ? `<div>Интерес: ${esc(c.interest)}</div>` : ''}${c.objection ? `<div>Возражение: ${esc(c.objection)}</div>` : ''}${c.contact ? `<div>Контакт: <b>${esc(c.contact)}</b></div>` : ''}</div></div>
      <div><div class="k">Как справился ИИ-менеджер</div><div class="v">${c.aiScore ? scoreHTML(c.aiScore) + ' ' + c.aiScore + ' из 5 · ' : ''}${esc(c.aiVerdict)}</div>
        ${iss.length ? `<ul class="issues">${iss.map(i => `<li><b>${esc(ISSUE[i.type] || i.type)}:</b> ${esc(i.text)}</li>`).join('')}</ul>` : ''}</div>
    </div></div>`;
}
const ISSUE = { wrong_answer:'Неверный ответ', ignored_question:'Не ответил на вопрос', lost_lead:'Упустил тёплого', pushy:'Давит / спамит', broken_flow:'Сломалась цепочка', tone:'Тон не тот', no_handoff:'Не позвал человека', other:'Другое' };
const EV = { take:'забрал у ИИ', release:'вернул ИИ', reply:'ответил', stage:'сменил этап', priority:'сменил приоритет', review:'отметил «разобрано»', unreview:'вернул в очередь', refresh:'обновил разбор' };

function renderChat(quiet) {
  const { chat:c, messages, events } = S.detail;
  const box = $('#chat');
  const draft = $('#rt')?.value || '';
  const wasBottom = !quiet || (() => { const s = box.querySelector('.scroll'); return !s || s.scrollHeight - s.scrollTop - s.clientHeight < 80; })();
  let lastDay = '';
  const ms = messages.map(m => {
    const d = dayOf(m.at), sep = d !== lastDay ? `<div class="day">${d}</div>` : ''; lastDay = d;
    const cls = ['client', 'user', 'contact'].includes(m.side) ? 'c' : m.by || m.side === 'operator' ? 'o' : 'b';
    const who = cls === 'c' ? '' : m.by ? m.by : m.side === 'bot' ? 'ИИ / бот' : m.side;
    const media = (m.media || []).map(f => f.type === 'image' && f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer"><img src="${esc(f.url)}" alt="" loading="lazy"></a>` : f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">[${esc(f.type === 'storyReply' ? 'ответ на сторис' : f.type || 'вложение')}]</a>` : '').join(' ');
    const mk = m.mark ? `<span class="mk ${m.mark.kind}" title="${esc(m.mark.name)}">${m.mark.kind === 'button' ? 'кнопка' : m.mark.kind === 'codeword' ? 'кодовое слово' : 'шаг цепочки'} · ${esc(m.mark.name)}</span>` : '';
    return `${sep}<div class="m ${cls}">${linkify(m.text)}${media}${mk ? '<br>' + mk : ''}<span class="meta">${who ? esc(who) + ' · ' : ''}${new Date(m.at * 1000).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' })}</span></div>`;
  }).join('');
  box.innerHTML = `<div class="head">
      <button class="btn back" id="back">${ico('back')}</button>
      <div class="t"><b>${esc(c.name)}</b><div>${c.username ? '@' + esc(c.username) + ' · ' : ''}${c.ai ? 'ведёт ИИ' : 'ведёт ' + esc(c.handledBy || 'менеджер') + ', ИИ на паузе'} · ${c.messages} сообщ.</div></div>
      <select id="sst" title="Этап воронки">${Object.entries(STAGE).map(([k, v]) => `<option value="${k}"${c.stage === k ? ' selected' : ''}>${v}${c.stage === k && c.stageManual ? ' (вручную)' : ''}</option>`).join('')}</select>
      <select id="spr" title="Приоритет">${Object.entries(PRI).map(([k, v]) => `<option value="${k}"${c.priority === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
      ${c.ai ? `<button class="btn" id="take">${ico('hand')}Забрать у ИИ</button>` : `<button class="btn" id="rel">${ico('bot')}Вернуть ИИ</button>`}
      <button class="btn${c.reviewed ? '' : ' pri'}" id="rev">${ico('check')}${c.reviewed ? 'Вернуть в очередь' : 'Разобрано'}</button>
      <button class="btn" id="re" title="Забрать сообщения и разобрать заново">${ico('refresh')}</button>
    </div>
    <div class="scroll">${aiHTML(c)}<div class="msgs">${ms || '<div class="empty">Сообщений нет</div>'}</div>
      ${events.length ? `<div class="ev">${events.slice(0, 6).map(e => `${new Date(e.at * 1000).toLocaleString('ru-RU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })} — ${esc(e.user)} ${EV[e.kind] || e.kind}${e.data?.to ? ': ' + esc(STAGE[e.data.to] || PRI[e.data.to] || e.data.to) : ''}`).join('<br>')}</div>` : ''}
    </div>
    <div class="reply"><div class="row"><textarea id="rt" rows="1" placeholder="Ответ клиенту…">${esc(draft)}</textarea><button class="btn pri" id="send">${ico('send')}<span>Отправить</span></button></div>
      <div class="hint">${c.ai ? 'Ответ отсюда заберёт переписку у ИИ: автоответы в ней встанут на паузу, пока не нажмёте «Вернуть ИИ».' : 'ИИ в этой переписке на паузе.'} Ctrl+Enter — отправить.</div></div>`;
  const s = box.querySelector('.scroll'); if (wasBottom) s.scrollTop = s.scrollHeight;
  const ta = $('#rt');
  const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(180, ta.scrollHeight) + 'px'; }; grow();
  ta.oninput = grow;
  ta.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } };
  $('#send').onclick = send;
  $('#back').onclick = () => { S.open = null; setHash(); $('#body').classList.remove('open'); };
  const doAct = async (a, body, ok) => {
    try { const r = await api(`/chats/${c.id}/${a}`, { method:'POST', body:body || {} }); if (ok) toast(ok); await openChat(c.id, true); patchCard(r.chat); }
    catch (e) { toast(e.message); }
  };
  $('#take') && ($('#take').onclick = () => doAct('take', null, 'Переписка у вас, ИИ на паузе'));
  $('#rel') && ($('#rel').onclick = () => doAct('release', null, 'ИИ снова ведёт переписку'));

async function send() {

const fmt = n => Number(n || 0).toLocaleString('ru-RU');
const dayLabel = d => new Date(d + 'T12:00:00Z').toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
function delta(now, before) {
  if (!before) return now ? '<span class="d up">новое</span>' : '';
  const p = Math.round((now - before) / before * 100);
  return `<span class="d ${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '+' : ''}${p}%</span> к прошлым ${S.days} дн.`;
}
// a line chart with a crosshair and a tooltip; one y-axis, thin lines, end labels
function lineChart(el, rows, series) {
  // the viewBox follows the box width, so the text stays at its real size on a wide screen and on a phone
  const W = Math.max(320, Math.round(el.clientWidth || 760)), H = W < 500 ? 220 : 280, L = 36, R = 92, T = 12, B = 26, w = W - L - R, h = H - T - B;
  const max = Math.max(1, ...rows.flatMap(r => series.map(s => r[s.key])));
  const nice = (() => { const m = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / m / (max / m > 5 ? 2 : 1)) * m * (max / m > 5 ? 2 : 1); })();
  const x = i => L + (rows.length < 2 ? w / 2 : i / (rows.length - 1) * w), y = v => T + h - v / nice * h;
  const ticks = [0, .25, .5, .75, 1].map(t => Math.round(nice * t));
  const every = Math.max(1, Math.ceil(rows.length / Math.max(3, Math.floor(w / 90))));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Касания по дням">`;
  for (const t of ticks) svg += `<line class="gl" x1="${L}" x2="${L + w}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`;
  rows.forEach((r, i) => { if (i % every === 0 || i === rows.length - 1) svg += `<text class="ax" x="${x(i)}" y="${H - 6}" text-anchor="middle">${dayLabel(r.day)}</text>`; });
  // end labels: nudged apart so they never collide
  const ends = series.map(s => ({ s, y:y(rows.at(-1)?.[s.key] || 0) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  const over = (ends.at(-1)?.y || 0) - (T + h);   // pushed below the plot: move the whole stack up
  if (over > 0) for (const e of ends) e.y -= over;
  for (const s of series) svg += `<path d="${rows.map((r, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(r[s.key]).toFixed(1)}`).join('')}" fill="none" stroke="var(${s.color})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  for (const e of ends) svg += `<text class="lab" x="${L + w + 8}" y="${e.y + 4}">${esc(e.s.name)}</text>`;
  svg += `<line id="xh" class="gl" x1="0" x2="0" y1="${T}" y2="${T + h}" style="display:none;stroke:var(--mute)"/>`;
  for (const s of series) svg += `<circle data-dot="${s.key}" r="4" fill="var(${s.color})" stroke="var(--panel)" stroke-width="2" style="display:none"/>`;
  svg += `<rect x="${L}" y="${T}" width="${w}" height="${h}" fill="transparent" data-hit/></svg><div class="tip" hidden></div>`;
  el.innerHTML = `<div class="legend">${series.map(s => `<span><i style="background:var(${s.color})"></i>${esc(s.name)}</span>`).join('')}</div><div class="chart">${svg}</div>`;
  const box = el.querySelector('.chart'), sv = box.querySelector('svg'), tip = box.querySelector('.tip'), xh = sv.querySelector('#xh');
  const show = i => {
    const r = rows[i]; if (!r) return;
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.style.display = '';
    for (const s of series) { const d = sv.querySelector(`[data-dot="${s.key}"]`); d.setAttribute('cx', x(i)); d.setAttribute('cy', y(r[s.key])); d.style.display = ''; }
    tip.hidden = false;
    tip.innerHTML = `<div>${dayLabel(r.day)}</div>${series.map(s => `<div><i style="background:var(${s.color})"></i>${esc(s.name)}: <b>${fmt(r[s.key])}</b></div>`).join('')}`;
    const k = box.clientWidth / W; tip.style.left = `${x(i) * k}px`; tip.style.top = `${T * k + 8}px`;
  };
  const hide = () => { tip.hidden = true; xh.style.display = 'none'; sv.querySelectorAll('[data-dot]').forEach(d => d.style.display = 'none'); };
  const pick = ev => { const b = sv.getBoundingClientRect(), px = (ev.clientX - b.left) / b.width * W; show(Math.round((px - L) / w * (rows.length - 1))); };
  const hit = sv.querySelector('[data-hit]');
  hit.addEventListener('pointermove', pick); hit.addEventListener('pointerdown', pick); hit.addEventListener('pointerleave', hide);
}
function heatmap(el, cells) {
  const grid = Array.from({ length:7 }, () => Array(24).fill(0));
  for (const c of cells) grid[c.wd][c.h] = c.n;
  const max = Math.max(1, ...grid.flat()), order = [1, 2, 3, 4, 5, 6, 0], WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  const step = n => n ? `var(--q${Math.min(6, 1 + Math.floor(n / max * 5.999))})` : 'var(--q0)';
  let h = '<div class="heat"><span></span>' + Array.from({ length:24 }, (_, i) => `<span class="h">${i % 3 ? '' : i}</span>`).join('');
  for (const d of order) h += `<span class="w">${WD[d]}</span>` + grid[d].map((n, hr) => `<span class="c" style="background:${step(n)}" data-t="${WD[d]}, ${hr}:00–${hr + 1}:00 · ${fmt(n)} ${word(n, 'сообщение', 'сообщения', 'сообщений')}"></span>`).join('');
  h += '</div><div class="scale">меньше' + [0, 1, 2, 3, 4, 5, 6].map(i => `<i style="background:var(--q${i})"></i>`).join('') + 'больше · МСК</div><div class="tip" hidden></div>';
  el.innerHTML = h; el.style.position = 'relative';
  const tip = el.querySelector('.tip');
  el.querySelectorAll('.c').forEach(c => {
    c.onpointerenter = () => { tip.hidden = false; tip.textContent = c.dataset.t; const b = c.getBoundingClientRect(), p = el.getBoundingClientRect(); tip.style.left = `${b.left - p.left + b.width / 2}px`; tip.style.top = `${b.top - p.top}px`; };
    c.onpointerleave = () => { tip.hidden = true; };
  });
}

    ${d.interests.length ? `<div class="box"><h3>Что интересует людей</h3>${(() => { const mx = Math.max(...d.interests.map(i => i.n)); return d.interests.map(i => `<div class="hbar" data-t="${esc(i.interest)} · ${fmt(i.n)} чел., средний балл ${i.score ?? '—'}"><span class="t">${esc(i.interest)}</span><span class="tr"><span class="f" style="width:${i.n / mx * 100}%"></span></span><span class="n">${fmt(i.n)}</span></div>`).join(''); })()}</div>` : ''}
    <div class="box"><h3>Кто больше всех касается</h3><p class="ev">Люди с наибольшим числом сообщений за период. Нажмите на строку — откроется переписка.</p>
      <div class="tw"><table class="toplist"><thead><tr><th>#</th><th>Человек</th><th class="n">Касаний</th><th>Цепочки</th><th>Этап</th><th class="n">Балл</th><th>Последнее</th></tr></thead>
      <tbody>${d.top.map((c, i) => `<tr data-id="${esc(c.id)}"><td>${i + 1}</td><td class="who"><b>${esc(c.name)}</b><small>${c.username ? '@' + esc(c.username) : ''}${c.interest ? ' · ' + esc(c.interest) : ''}</small></td>
        <td class="n"><b>${fmt(c.touches)}</b></td><td>${c.chains.slice(0, 3).map(n => `<span class="pill">${esc(n)}</span>`).join('') || '<span class="ev">—</span>'}</td>
        <td><span class="chip st">${STAGE[c.stage] || c.stage}</span></td><td class="n">${c.leadScore ?? '—'}</td><td>${when(c.lastTouch)}</td></tr>`).join('') || '<tr><td colspan="7" class="ev">За период никто не писал</td></tr>'}</tbody></table></div></div>
  </div>`;
  lineChart($('#dLine'), d.byDay, [{ key:'people', name:'Люди', color:'--s1' }, { key:'ai', name:'ИИ и бот', color:'--s2' }, { key:'managers', name:'Менеджеры', color:'--s3' }]);
  heatmap($('#dHeat'), d.heat);
  // hover tooltips on bars
  document.querySelectorAll('.dash .box').forEach(bx => {
    if (!bx.querySelector('.hbar')) return;
    bx.style.position = 'relative'; const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; bx.append(tip);
    bx.querySelectorAll('.hbar').forEach(b => { b.onpointerenter = () => { tip.hidden = false; tip.textContent = b.dataset.t; const r = b.querySelector('.f').getBoundingClientRect(), p = bx.getBoundingClientRect(); tip.style.left = `${Math.min(r.right - p.left, p.width - 120)}px`; tip.style.top = `${r.top - p.top}px`; }; b.onpointerleave = () => { tip.hidden = true; }; });
  });
  document.querySelectorAll('.dash .period .btn').forEach(b => b.onclick = () => { S.days = Number(b.dataset.d); loadDash(); });
  document.querySelectorAll('.seg').forEach(b => b.onclick = () => { S.filters = { q:'', stage:'', priority:'', days:'', segment:b.dataset.seg }; S.segName = b.dataset.name; go('all'); });
  document.querySelectorAll('.toplist tr[data-id]').forEach(r => r.onclick = () => { S.filters = { q:'', stage:'', priority:'', days:'' }; go('all', r.dataset.id); });
}

/* ---------- automations: every step and button with how many people reached and pressed it ---------- */
async function loadChains() {
  $('#body').className = 'body wide';
  $('#body').innerHTML = `<div class="stats"><div class="empty">Загружаем цепочки…</div></div>`;
  let r; try { r = await api('/funnels?days=' + S.days); } catch (e) { $('#body').innerHTML = `<div class="stats"><div class="empty">${esc(e.message)}</div></div>`; return; }
  const period = `<div class="period">${[[1, 'Сутки'], [7, '7 дней'], [30, '30 дней']].map(([d, l]) => `<button class="btn${S.days === d ? ' on' : ''}" data-d="${d}">${l}</button>`).join('')}</div>`;
  const up = d => d ? `<span class="up">+${d}</span>` : '';
  const list = r.funnels;
  $('#body').innerHTML = `<div class="stats">${period}
    <p class="ev">Цифры — из ChatPlace: сколько людей дошло до каждого сообщения цепочки и нажало каждую кнопку, за всё время; зелёным — прирост за выбранный период (считается с первого дня, когда CRM начала собирать цепочки). Обновляются раз в час.</p>
    ${list.length ? `<div class="grid2">${list.map(f => `<div class="fn"><h4>${esc(f.name)}</h4>
      <div class="sub">${esc(f.bot)} · ${esc(f.status)} · слова: ${esc(f.words.join(', ') || '—')}</div>
      <div class="sub">Вошли: <b>${f.entered}</b>${up(f.enteredDelta)} · переходов по ссылкам: <b>${f.links}</b></div>
      ${f.steps.map(st => `<div class="st"><span class="t">${esc(st.text || '(кнопки)')}</span><span class="c">${st.clients}${up(st.delta)}</span>
        ${st.buttons.length ? `<div class="btns">${st.buttons.map(b => `<span class="bt${b.url ? ' url' : ''}" title="${esc(b.url || '')}">${esc(b.text)} · ${b.tracked && b.clicks != null ? `${b.clicks} (${b.ctr ?? 0}%)` : 'не считается'}${up(b.delta)}</span>`).join('')}</div>` : ''}</div>`).join('')}
    </div>`).join('')}</div>` : '<div class="empty">Цепочки ещё не загружены — CRM забирает их по одной, бережно к лимитам ChatPlace.</div>'}</div>`;
  document.querySelectorAll('.period .btn').forEach(b => b.onclick = () => { S.days = Number(b.dataset.d); loadChains(); });
}

/* ---------- teaching the AI manager: answers for the questions it could not answer, review of its mistakes ---------- */
async function loadLearn() {
  $('#body').className = 'body wide';
  $('#body').innerHTML = `<div class="stats"><div class="empty">Загружаем…</div></div>`;
  let r; try { r = await api('/learn'); } catch (e) { $('#body').innerHTML = `<div class="stats"><div class="empty">${esc(e.message)}</div></div>`; return; }
  const n = $('#nLearn'); n.hidden = !r.open; n.textContent = r.open || '';
  const rv = r.review;
  const open = r.questions.filter(q => !q.gone && !q.answeredAt && !q.skipped), done = r.questions.filter(q => q.answeredAt), skipped = r.questions.filter(q => q.skipped && !q.answeredAt);
  const qHTML = q => `<div class="kq" data-q="${esc(q.id)}"><div class="q">${esc(q.question)}</div><div class="ev">${esc(q.bot)} · ${when(q.seen)}</div>
    <textarea placeholder="Ответ для базы знаний ИИ-менеджера…">${esc(q.draft)}</textarea>
    <div class="row"><button class="btn" data-k="draft">${ico('spark')}Черновик от ИИ</button><button class="btn pri" data-k="answer">${ico('check')}В базу знаний</button><button class="btn" data-k="skip">Пропустить</button><span class="ev" data-note></span></div></div>`;
  $('#body').innerHTML = `<div class="stats">
    <div class="box"><h3>Разбор ошибок ИИ-менеджера</h3>
      <div class="row" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${[[7, 'За 7 дней'], [30, 'За 30 дней']].map(([d, l]) => `<button class="btn" data-review="${d}">${ico('refresh')}${l}</button>`).join('')}
        <span class="ev">${rv ? `последний: ${new Date(rv.at * 1000).toLocaleString('ru-RU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}, ${rv.days || 7} дн.` : 'ещё не делался'}</span></div>
      <div class="md" id="review">${rv ? mdLite(rv.text) : '<p class="ev">Claude соберёт по слабым перепискам: что чаще всего идёт не так, какие правила поменять, каких ответов не хватает в базе знаний.</p>'}</div></div>
    <div class="box"><h3>Вопросы, на которые ИИ не ответил · ${open.length}</h3>
      <p class="ev">Из базы знаний ChatPlace. «Черновик от ИИ» пишет ответ по тому, как такие разговоры шли в переписках; ответ попадёт в базу знаний ИИ-менеджера только по кнопке «В базу знаний».</p>
      ${open.map(qHTML).join('') || '<div class="ev">Все вопросы разобраны.</div>'}</div>
    ${done.length ? `<div class="box"><h3>Добавлено в базу знаний · ${done.length}</h3>${done.map(q => `<div class="kq"><div class="q">${esc(q.question)}</div><div>${esc(q.answer)}</div><div class="ev">${esc(q.answeredBy || '')} · ${when(q.answeredAt)}</div></div>`).join('')}</div>` : ''}
    ${skipped.length ? `<div class="box"><h3>Пропущено · ${skipped.length}</h3>${skipped.map(q => `<div class="kq" data-q="${esc(q.id)}"><div>${esc(q.question)}</div><div class="row"><button class="btn" data-k="unskip">Вернуть</button></div></div>`).join('')}</div>` : ''}
  </div>`;
  document.querySelectorAll('[data-review]').forEach(b => b.onclick = async () => {
    b.disabled = true; $('#review').innerHTML = '<p class="ev">Claude разбирает переписки, это займёт до минуты…</p>';
    try { await api('/learn/review', { method:'POST', body:{ days:Number(b.dataset.review) } }); loadLearn(); } catch (e) { toast(e.message); b.disabled = false; }
  });
  document.querySelectorAll('.kq[data-q] [data-k]').forEach(b => b.onclick = async () => {
    const box = b.closest('.kq'), id = box.dataset.q, k = b.dataset.k, ta = box.querySelector('textarea'), note = box.querySelector('[data-note]');
    b.disabled = true; if (note) note.textContent = k === 'draft' ? 'пишем…' : '';
    try {
      if (k === 'draft') { const d = await api(`/learn/${id}/draft`, { method:'POST' }); if (d.skip) { note.textContent = 'ИИ советует пропустить: ' + d.reason; } else { ta.value = d.answer; note.textContent = ''; } }
      if (k === 'answer') { await api(`/learn/${id}/answer`, { method:'POST', body:{ answer:ta.value } }); toast('Ответ добавлен в базу знаний ИИ-менеджера'); return loadLearn(); }
      if (k === 'skip' || k === 'unskip') { await api(`/learn/${id}/${k}`, { method:'POST' }); return loadLearn(); }
    } catch (e) { toast(e.message); if (note) note.textContent = ''; }
    b.disabled = false;
  });
}
// a small markdown: headings, lists, bold — for the review
function mdLite(t) {
  let out = '', list = false;
  for (const raw of esc(t).split('\n')) {
    const l = raw.trim();
    const li = /^([-*]|\d+\.) /.test(l);
    if (list && !li) { out += '</ul>'; list = false; }
    if (!l) continue;
    if (/^#{1,4} /.test(l)) out += `<h3>${l.replace(/^#{1,4} /, '')}</h3>`;
    else if (li) { if (!list) { out += '<ul>'; list = true; } out += `<li>${l.replace(/^([-*]|\d+\.) /, '')}</li>`; }
    else out += `<p>${l}</p>`;
  }
  if (list) out += '</ul>';
  return out.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

async function refresh() {
  if (['funnel', 'quality', 'chains', 'learn', 'dash'].includes(S.view)) return;
  await loadList().catch(() => {});
  if (S.open && !document.activeElement?.matches?.('textarea, select')) await openChat(S.open, true);
}
setInterval(() => { if (!document.hidden && S.me && !$('#app').hidden) refresh(); }, 15000);
// how fresh the data is: the last finished pass of the sync, or a pause because of ChatPlace's limit
async function live() {
  const el = $('#live'); if (!el) return;
  try {
    const h = await fetch('/api/health', { cache:'no-store' }).then(r => r.json()), sy = h.status?.sync || {};
    const age = h.lastSync ? Math.max(0, Math.round(Date.now() / 1000 - h.lastSync)) : null;
    const paused = sy.pausedUntil && sy.pausedUntil > Date.now() / 1000;
    el.className = 'live' + (paused || age == null || age > 600 ? ' bad' : age > 90 ? ' warn' : '');
    el.lastElementChild.textContent = paused ? `ChatPlace ограничил запросы — пауза до ${new Date(sy.pausedUntil * 1000).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' })}`
      : age == null ? 'ещё не обновлялось' : `обновлено ${age < 60 ? age + ' с' : ago(age)} назад${sy.pending ? ` · догружаем ${sy.pending}` : ''}`;
  } catch {}
}
setInterval(() => { if (!document.hidden) live(); }, 10000);
boot();
</script>
