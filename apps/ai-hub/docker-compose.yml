# AI Creative Hub · production compose.
# Lives on prod under: /root/ai-command-center/apps/ai-hub/docker-compose.yml
#
# External networks:
#   - aisales_default (where aisales-postgres, aisales-redis, aisales-minio live)
#
# Run:
#   docker compose --env-file .env.production up -d --build
#
# Migrate / seed (one-off):
#   docker compose run --rm ai-hub-worker npx tsx scripts/migrate.ts
#   docker compose run --rm ai-hub-worker npx tsx scripts/seed.ts

name: ai-hub

services:
  ai-hub-web:
    build:
      context: .
      target: web
    image: ai-hub-web:latest
    container_name: ai-hub-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:3010:3010"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      SMTP_URL: ${SMTP_URL}
      SMTP_FROM: ${SMTP_FROM}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      REDIS_URL: ${REDIS_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      FAL_KEY: ${FAL_KEY}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
      KIE_API_KEY: ${KIE_API_KEY}
      FAL_WEBHOOK_SECRET: ${FAL_WEBHOOK_SECRET}
      REPLICATE_WEBHOOK_SECRET: ${REPLICATE_WEBHOOK_SECRET}
      KIE_WEBHOOK_SECRET: ${KIE_WEBHOOK_SECRET}
      PROVIDER_WEBHOOK_BASE_URL: ${PROVIDER_WEBHOOK_BASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [ aisales-net ]

  ai-hub-worker:
    build:
      context: .
      target: worker
    image: ai-hub-worker:latest
    container_name: ai-hub-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      FAL_KEY: ${FAL_KEY}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
      KIE_API_KEY: ${KIE_API_KEY}
      PROVIDER_WEBHOOK_BASE_URL: ${PROVIDER_WEBHOOK_BASE_URL}
      WATCHDOG_STUCK_MIN: ${WATCHDOG_STUCK_MIN:-15}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [ aisales-net ]

networks:
  aisales-net:
    name: aisales_aisales-net                # external network shared with aisales-postgres / -redis / -minio
    external: true
