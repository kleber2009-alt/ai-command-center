<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ig-agent · Вход</title>
<link rel="stylesheet" href="/assets/ig-admin.css">
<style>
.brand-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
.brand-mark{font-family:var(--font-mono);font-size:11px;color:#080808;background:var(--green);padding:3px 7px;border-radius:3px;letter-spacing:.08em;font-weight:700}
.brand-name{font-family:Georgia,serif;font-size:18px}
.brand-name .ag{color:var(--green);font-style:italic}
</style>
</head>
<body>

<main class="auth-shell">
  <div class="auth-card">
    <div class="brand-row">
      <span class="brand-mark">IG</span>
      <span class="brand-name">agent · <span class="ag">админка</span></span>
    </div>
    <h2>Вход через <span class="accent">Telegram</span></h2>
    <p class="sub">
      Нажми кнопку — бот отправит одноразовую ссылку владельцу (OWNER_TELEGRAM_ID).
      Ссылка живёт 10 минут, сессия после клика — 7 дней.
    </p>

    <form id="loginForm">
      <button type="submit" class="btn btn--primary btn--block" style="height:42px;font-size:13px">📩 Отправить ссылку в Telegram</button>
    </form>

    <div id="loginStatus" class="status-strip"></div>

    <div class="foot">
      Webhook URL для SendPulse:
      <code id="webhookHint">{ADMIN_PUBLIC_URL}/webhook/sendpulse?token=&lt;SENDPULSE_WEBHOOK_TOKEN&gt;</code>
    </div>
  </div>
</main>

<script src="/assets/ig-admin.js"></script>
<script>
(function () {
  var form = document.getElementById('loginForm');
  var status = document.getElementById('loginStatus');
  var hint = document.getElementById('webhookHint');
  if (hint) hint.textContent = location.origin + '/webhook/sendpulse?token=<SENDPULSE_WEBHOOK_TOKEN>';
  if (!form) return;
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    status.textContent = '… отправляю';
    status.style.color = '';
    try {
      await window.IG.api('/api/request-link', { method: 'POST', body: '{}' });
      status.innerHTML = '<span class="c-green">✓ Ссылка отправлена в Telegram</span>';
    } catch (err) {
      status.innerHTML = '<span class="c-red">✗ ' + (err.message || 'ошибка') + '</span>';
    }
  });
})();
</script>
</body>
</html>
