<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Студия Кадрика</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000; --fg: #fff; --card: #121212; --card-2: #0B0B0B; --secondary: #1C1C1C; --border: #2A2A2A;
  --muted: #A3A3A3; --dim: #737373; --primary: #D17A3C; --primary-hover: #E08F55;
  --primary-soft: rgba(209,122,60,.1); --primary-border: rgba(209,122,60,.38);
  --serif: "Playfair Display", Georgia, serif; --sans: Inter, system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; background: radial-gradient(ellipse 120% 40% at 50% 0%, rgba(209,122,60,.13), transparent 70%), var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
.app { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.logo { font-family: var(--serif); font-size: 20px; letter-spacing: -.02em; }
.pills { display: flex; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); font-size: 11.5px; color: #B8B8B8; white-space: nowrap; }
.pill b { color: var(--fg); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.pill--cu { border-color: var(--primary-border); background: var(--primary-soft); }
.pill--cu b { color: var(--primary); }
.eyebrow { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); margin-top: 22px; }
.eyebrow::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--primary); }
.eyebrow.c { justify-content: center; }
h1 { margin: 10px 0 0; font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.12; letter-spacing: -.03em; }
h1 em, h2 em, .serif em { font-style: italic; color: var(--primary); }
h1.c { text-align: center; }
h2 { font-family: var(--serif); font-weight: 400; font-size: 20px; letter-spacing: -.02em; margin: 0; }
.num { font-weight: 400; letter-spacing: -.04em; color: var(--primary); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .small { font-size: 12px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; }
.card--cu { border-color: var(--primary-border); background: linear-gradient(160deg, rgba(209,122,60,.12), var(--card) 60%); }
.card--dark { background: var(--card-2); }
.track { height: 6px; border-radius: 99px; background: var(--secondary); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 99px; background: var(--primary); transition: width .8s cubic-bezier(.2,.7,.2,1); }
.track i.w { background: #C8C8C8; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border-radius: 12px; border: 1px solid var(--border); background: transparent; font-size: 15px; font-weight: 500; transition: transform .1s, background .2s; }
.btn:active { transform: scale(.98); }
.btn--cu { background: var(--primary); border-color: var(--primary); color: #000; }
.btn--sm { width: auto; height: 40px; padding: 0 16px; font-size: 13.5px; border-radius: 10px; }
.btn:disabled { opacity: .45; }
.sec { margin-top: 18px; display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.07); }
.sec b { font-size: 15px; font-weight: 600; }
.list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.chk { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #3A3A3A; flex: none; display: grid; place-items: center; }
.chk.on { background: var(--primary-soft); border-color: var(--primary-border); }
.done { color: var(--dim); text-decoration: line-through; }
.grow { flex: 1; min-width: 0; }
/* Студия */
.stage { position: relative; height: 240px; margin-top: 14px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.stage .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 54px; border-top: 1px solid var(--border); background: var(--card-2); }
.stage .tv { position: absolute; left: 14px; top: 14px; width: 70px; height: 50px; border-radius: 8px; border: 1px solid var(--border); background: #000; display: grid; place-items: center; }
.stage .say { position: absolute; left: 96px; right: 14px; top: 14px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--primary-border); background: var(--primary-soft); font-size: 12.5px; line-height: 1.4; color: #E5E5E5; }
.kadrik { position: relative; margin-bottom: 18px; animation: bob 3.2s ease-in-out infinite; }
.kadrik.sad { filter: grayscale(.8); animation-duration: 6s; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin-top: 10px; }
.stat { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.stat .h { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); }
.stat .h b { color: var(--fg); font-weight: 500; }
/* Путь */
.path { position: relative; margin-top: 8px; }
.node { position: relative; display: flex; align-items: center; gap: 14px; padding: 10px 0; }
.node .dot { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 1px solid var(--border); background: var(--card-2); position: relative; z-index: 1; }
.node.open .dot { background: var(--primary); border-color: var(--primary); }
.node.now .dot { background: var(--card); border: 2px solid var(--primary); box-shadow: 0 0 0 8px var(--primary-soft), 0 0 30px rgba(209,122,60,.35); }
.node.boss .dot { border-radius: 16px; border-color: var(--primary-border); }
.node .t { font-family: var(--serif); font-size: 18px; letter-spacing: -.02em; }
.node.lock .t { color: var(--dim); }
.node:nth-child(odd) { padding-left: 0; } .node:nth-child(even) { padding-left: 64px; }
.path::before { content: ""; position: absolute; left: 58px; top: 30px; bottom: 30px; border-left: 1px dashed var(--border); }
/* Серия */
.big { text-align: center; font-size: 96px; line-height: 1; margin-top: 10px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; padding: 14px 10px; margin-top: 18px; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 10.5px; color: var(--dim); }
.week span { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border); font-size: 13px; color: var(--fg); }
.week span.on { background: var(--primary); border-color: var(--primary); color: #000; }
.week span.today { border: 1px dashed var(--primary); color: var(--primary); }
.days { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-top: 10px; }
.day { height: 92px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; background: var(--card); border: 1px solid var(--border); }
.day small { font-size: 9.5px; letter-spacing: .06em; color: var(--dim); }
.day b { font-size: 22px; font-weight: 400; letter-spacing: -.04em; }
.day em { font-style: normal; font-size: 10.5px; color: var(--muted); }
.day.got { opacity: .45; } .day.now { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(209,122,60,.12); } .day.now b { color: var(--primary); }
.day.d7 { grid-column: span 2; border-color: var(--primary-border); background: linear-gradient(160deg, rgba(209,122,60,.14), var(--card) 60%); }
/* Лига */
.lb { display: flex; align-items: center; gap: 12px; padding: 9px 12px; }
.lb .r { width: 24px; text-align: center; font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--dim); }
.lb .r.top { color: var(--primary); }
.ava { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; background: var(--secondary); border: 1px solid var(--border); flex: none; }
.lb.me { border-color: rgba(209,122,60,.5); }
/* Таббар */
/* Монтаж */
.seg { display: flex; gap: 6px; overflow-x: auto; margin-top: 14px; padding-bottom: 2px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12.5px; }
.seg button.on { border-color: var(--primary-border); background: var(--primary-soft); color: var(--primary); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 12px; }
.tile { text-align: left; padding: 0; overflow: hidden; border-radius: 14px; border: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; }
.tile .th { position: relative; aspect-ratio: 9 / 12; background: linear-gradient(170deg, #3A2414, #0F0905); }
.tile .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .th .k { position: absolute; top: 8px; left: 8px; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.8); background: rgba(0,0,0,.5); padding: 3px 7px; border-radius: 6px; }
.tile .th .ph { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--serif); font-style: italic; font-size: 26px; color: var(--primary); }
.tile b { display: block; padding: 10px 12px 2px; font-size: 13.5px; font-weight: 600; }
.tile span.s { display: block; padding: 0 12px 12px; font-size: 11.5px; color: var(--dim); line-height: 1.4; }
.sheet .hero { width: 100%; max-width: 280px; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: #0B0B0B; margin-top: 18px; }
.sheet .hero video, .sheet .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.kv { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.kv div { display: flex; gap: 12px; font-size: 13px; } .kv span:first-child { width: 90px; flex: none; color: var(--dim); }
.job { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
.job .pv { width: 42px; height: 56px; border-radius: 8px; background: var(--secondary); border: 1px solid var(--border); flex: none; object-fit: cover; }
.st { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.st.done { color: var(--primary); border-color: var(--primary-border); background: var(--primary-soft); }
.st.running, .st.review { color: #fff; border-color: #555; }
.tile.sel { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.fl { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; font-size: 12px; color: var(--dim); }
.fl input, .fl textarea { font: inherit; font-size: 15px; color: var(--fg); background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; resize: vertical; }
.fl input:focus, .fl textarea:focus { outline: none; border-color: var(--primary-border); }
.sw { width: 44px; height: 26px; border-radius: 99px; border: 1px solid var(--border); background: var(--secondary); position: relative; flex: none; padding: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #737373; transition: transform .2s; }
.sw.on { background: var(--primary-soft); border-color: var(--primary-border); } .sw.on::after { transform: translateX(18px); background: var(--primary); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 8px calc(10px + env(safe-area-inset-bottom)); background: rgba(0,0,0,.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.06); }
.tabs button { background: none; border: 0; padding: 8px 0; font-size: 11.5px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tabs button svg { width: 20px; height: 20px; }
.tabs button.on { color: var(--primary); }
.back { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 6px 0; display: inline-flex; align-items: center; gap: 6px; }
.go { width: 100%; text-align: left; color: inherit; }
.go .arr { color: var(--dim); font-size: 18px; }
.ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--primary-soft); border: 1px solid var(--primary-border); color: var(--primary); flex: none; }
.ico svg { width: 19px; height: 19px; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.trio .card { padding: 12px 10px; text-align: center; }
.trio b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.reflink { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-2); color: var(--fg); padding: 0 12px; font-size: 13px; }
/* Награда */
.modal { position: fixed; inset: 0; z-index: 20; background: radial-gradient(ellipse 110% 45% at 50% 30%, rgba(209,122,60,.22), transparent 65%), #000; display: none; flex-direction: column; align-items: center; padding: 40px 18px calc(24px + env(safe-area-inset-bottom)); overflow-y: auto; }
.modal.show { display: flex; animation: up .5s cubic-bezier(.2,.7,.2,1) both; }
@keyframes up { from { opacity: 0; transform: translateY(15px); } }
.gains { width: 100%; max-width: 440px; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin-top: 18px; }
.gains div { text-align: center; padding: 14px 6px; }
.gains b { display: block; font-size: 30px; font-weight: 400; letter-spacing: -.04em; color: var(--primary); }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; padding: 10px 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--primary-border); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .3s; max-width: 90vw; }
.toast.show { opacity: 1; }
.err { text-align: center; padding: 60px 20px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app"><div class="err dim">Загружаю студию…</div></main>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="studio" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="13" height="11" rx="3"/><path d="M16 11l5-3v9l-5-3z"/></svg>Студия</button>
  <button data-tab="montage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 4l-2 5M14 4l-2 5"/></svg>Монтаж</button>
  <button data-tab="partners"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9.5" r="2.6"/><path d="M3 20a6 6 0 0 1 12 0M14.5 15.2A5 5 0 0 1 21 20"/></svg>Партнёры</button>
  <button data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Профиль</button>
</nav>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000'); } catch (e) {} }
const INIT = tg ? tg.initData : '';
let S = null, TAB = new URLSearchParams(location.search).get('tab') || (location.hash.match(/tab=(\w+)/) || [])[1] || 'studio';
let M = null, KIND = 'reels';  // данные вкладки «Монтаж»: каталог, владелец, очередь @Productionskill_bot
const KINDS = [['reels', 'Рилсы'], ['styles', 'Стили'], ['youtube', 'YouTube'], ['clips', 'Клипы'], ['content', 'Тексты']];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n).toLocaleString('ru-RU');
const haptic = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };

async function call(act, extra = {}) {
  const r = await fetch('/api/' + act, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ init: INIT, ...extra }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Ошибка сервера');
  S = j.state; return j.got;
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2600); }

const KADRIK = (w, sad) => `<svg class="kadrik${sad ? ' sad' : ''}" width="${w}" height="${Math.round(w * 1.1)}" viewBox="0 0 190 210" role="img" aria-label="Кадрик">
  <ellipse cx="95" cy="200" rx="60" ry="7" fill="#1C1C1C"/>
  <rect x="30" y="54" width="130" height="128" rx="40" fill="#161616" stroke="#D17A3C" stroke-width="2.5"/>
  <g transform="rotate(-10 40 46)"><rect x="30" y="30" width="130" height="26" rx="7" fill="#D17A3C"/>
  <rect x="48" y="30" width="12" height="26" fill="#000" transform="skewX(-20)"/><rect x="86" y="30" width="12" height="26" fill="#000" transform="skewX(-20)"/><rect x="124" y="30" width="12" height="26" fill="#000" transform="skewX(-20)"/></g>
  <circle cx="95" cy="112" r="36" fill="#000" stroke="#D17A3C" stroke-width="2"/><circle cx="95" cy="112" r="24" fill="#E5E5E5"/>
  <circle cx="99" cy="${sad ? 116 : 110}" r="13" fill="#000"/><circle cx="103" cy="${sad ? 111 : 105}" r="4" fill="#fff"/>
  <path d="${sad ? 'M80 164 q15 -9 30 0' : 'M80 158 q15 10 30 0'}" stroke="#D17A3C" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
const CHECK = '<svg width="11" height="11" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7" stroke="#D17A3C" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
const LOCKI = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const TICK = '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';

function header() {
  return `<div class="top"><div class="logo">Prod Skills</div><div class="pills">
    <span class="pill pill--cu">серия <b>${S.streak}</b></span><span class="pill">монеты <b>${fmt(S.coins)}</b></span></div></div>`;
}
function bar(n, v, white) { return `<div class="card stat"><div class="h"><span>${n}</span><b>${v}%</b></div><div class="track"><i class="${white ? 'w' : ''}" style="width:${v}%"></i></div></div>`; }

function studio() {
  const hungry = !S.reel_today;
  const say = hungry ? (S.owner ? 'Выбери стиль во вкладке «Монтаж» — готовый рилс накормит меня' : 'Кинь мне видео в чат — смонтирую рилс и вырасту') : 'Сыт и доволен! Завтра жду новое видео — не сломай серию';
  const title = hungry ? 'Кадрик <em>проголодался</em>' : 'Кадрик <em>доволен</em>';
  return header() + `
  <div class="eyebrow">Твой монтажёр · уровень ${S.level}</div>
  <h1>${title}</h1>
  <div class="card stage"><div class="floor"></div>
    <div class="tv"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#D17A3C"/></svg></div>
    <div class="say">${say}</div>${KADRIK(136, S.energy < 25)}</div>
  <div class="stats">${bar('Энергия', S.energy)}${bar('Настрой', S.mood, 1)}${bar('Студия', S.studio, 1)}</div>
  <div class="card card--dark" style="margin-top:8px;padding:14px">
    <div style="display:flex;justify-content:space-between;font-size:12.5px"><span class="muted">До уровня ${S.level + 1}</span><span>${S.lvl_cur} / ${S.lvl_need} XP</span></div>
    <div class="track" style="margin-top:10px"><i style="width:${Math.round(S.lvl_cur / S.lvl_need * 100)}%"></i></div>
    ${S.next ? `<div class="small dim" style="margin-top:10px">${S.owner ? `Следующий стиль на карте — «${esc(S.next.t)}», нужно рилсов` : `Следующее звание — «${esc(S.next.t)}», нужно видео`}: ${S.next.need}</div>` : ''}
  </div>
  <div class="sec"><b>Квесты дня</b><span class="small dim">обновятся в полночь</span></div>
  <div class="list">${S.quests.map(q => `<div class="card row"><div class="chk ${q.done ? 'on' : ''}">${q.done ? CHECK : ''}</div>

async function jcall(cmd) {
  const r = await fetch('/api/job', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ init: INIT, cmd }) });
  const j = await r.json().catch(() => ({}));

  J = j.state; HIST = j.history || []; if (M && j.bal) M.bal = j.bal; if (j.msg) toast(j.msg); return j;
}
const plural = n => n % 10 === 1 && n % 100 !== 11 ? 'монтаж' : n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14) ? 'монтажа' : 'монтажей';
const pl = (n, a, b, c) => n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14) ? b : c;
const reelsN = n => `${n} ${pl(n, 'рилс', 'рилса', 'рилсов')}`, ytN = n => `${n} ${pl(n, 'YouTube-ролик', 'YouTube-ролика', 'YouTube-роликов')}`;
function moneyBlock(b) {  // профиль: баланс и на что его хватит
  if (!b || !b.packs) return '';
  if (b.free) return `<div class="card row" style="margin-top:8px"><div class="grow"><div class="small muted">Баланс</div><div style="font-size:15px;font-weight:600;margin-top:2px">Монтаж без оплаты</div>
    <div class="small dim" style="margin-top:2px">доступ выдан владельцем студии — монтажи не списываются</div></div></div>`;
  const c = b.credits, yt = Math.floor(c / b.yt);
  const enough = c ? `${reelsN(c)}${yt ? ' или ' + ytN(yt) : ''}` : b.trial ? 'пробный рилс — бесплатно' : 'пока ни на один монтаж';
  return `<div class="card card--cu" style="margin-top:8px;padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="small muted">Баланс</span>${b.trial && c ? '<span class="small" style="color:var(--primary)">+ пробный рилс бесплатно</span>' : ''}</div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-top:4px"><span class="num" style="font-size:40px;line-height:1">${c}</span><span style="font-size:15px">${plural(c)}</span></div>
    <div class="small" style="margin-top:8px">Хватит на: <b style="color:var(--primary)">${enough}</b></div>
    ${c ? `<div class="small dim" style="margin-top:4px">в каждом монтаже ${b.edits} правки бесплатно, дальше — 1 монтаж за правку</div>` : ''}
    <button class="btn btn--cu" style="margin-top:14px" id="topUp">${c ? 'Пополнить баланс' : 'Пополнить и монтировать'} →</button></div>`;
}
function tariffsBlock(b) {  // профиль: тарифы и пополнение звёздами

async function buy(pack, cur) {
  if (!tg || !tg.openInvoice) return toast('Оплата — в Telegram: /buy в чате с ботом');
  try {
    const g = await call('invoice', cur ? { pack, cur } : { pack });
    tg.openInvoice(g.link, st => {
      if (st === 'paid') { haptic('success'); toast('Оплата прошла — монтажи на балансе'); setTimeout(() => call('me').then(() => M ? loadMontage() : render()).catch(() => {}), 1500); }
      else if (st === 'failed') toast('Оплата не прошла');
    });
  } catch (e) { toast(e.message); }
}
async function loadMontage() {
  try {
    const r = await fetch('/api/montage', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ init: INIT }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Ошибка');
    M = j;
    if (M.owner) await jcall({ type: 'state' });
    if (J && J.skill && !SEL) SEL = J.skill;
    if (TAB === 'montage') render();
  } catch (e) { toast(e.message); }
}

    <div class="small muted" style="max-width:440px;margin-top:14px;line-height:1.6">${esc(s.desc)}</div>
    <div class="kv"><div><span>Получишь</span><span>${esc(s.get)}</span></div><div><span>Нужно</span><span>${esc(s.need)}</span></div></div>
    <div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:18px">
      ${M.owner ? (busy ? '<div class="card row small muted">Сейчас идёт задача — выбрать стиль можно после неё</div>' : `<button class="btn btn--cu" id="mPick">Выбрать «${esc(s.name)}» →</button>`) : (S.asked ? '<div class="card row small muted">Заявка на монтаж у владельца — ответ придёт в чат</div>' : `<button class="btn btn--cu" id="mAsk">${M.bal && M.bal.sell ? 'Смонтировать бесплатно →' : 'Хочу монтаж — оставить заявку'}</button>`)}
      <button class="btn" id="mclose">Назад к стилям</button></div>`;
  m.classList.add('sheet', 'show'); m.scrollTop = 0;
  $('#mclose').onclick = () => m.classList.remove('show', 'sheet');
  const ask = $('#mAsk'); if (ask) ask.onclick = () => { ask.disabled = true; call('ask').then(g => { haptic('success'); toast(g.msg); m.classList.remove('show', 'sheet'); if (M.bal && M.bal.sell) { M = null; SEL = s.id; } render(); }).catch(e => { ask.disabled = false; toast(e.message); }); };
  const pick = $('#mPick'); if (pick) pick.onclick = async () => {
    if (J && J.status && !['collect', 'none'].includes(J.status)) { try { await jcall({ type: 'new' }); } catch (e) { toast(e.message); return; } }
    SEL = s.id; m.classList.remove('show', 'sheet'); haptic('success'); render(); window.scrollTo(0, 0);
  };
}

function readForm() {
  for (const k of ['link', 'script', 'folder', 'query', 'code', 'wish']) { const el = $('#f_' + k); if (el) FORM[k] = el.value; }
}
async function upload(files) {
  for (const f of files) {
    const u = { id: Math.random().toString(36).slice(2, 12), name: f.name, pct: 0, st: 'up' }; UPS.push(u); render();
    const CS = 8 * 1024 * 1024, n = Math.max(1, Math.ceil(f.size / CS));
    try {
      for (let i = 0; i < n; i++) {
        const r = await fetch(`/api/up?id=${u.id}&i=${i}&cs=${CS}&name=${encodeURIComponent(f.name)}`, { method: 'POST', headers: { 'X-Tg-Init': INIT }, body: f.slice(i * CS, (i + 1) * CS) });
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'обрыв связи');
        u.pct = Math.round((i + 1) / n * 100); render();
      }
      await jcall({ type: 'upload', id: u.id, size: f.size, name: f.name }); u.st = 'done'; haptic('success');
    } catch (e) { u.st = 'err'; u.err = e.message; haptic('error'); }
    render();
  }
}
function wireMontage() {
  const tr = $('#jTry'); if (tr) tr.onclick = () => { tr.disabled = true; call('ask').then(g => { haptic('success'); toast(g.msg); M = null; render(); }).catch(e => { tr.disabled = false; toast(e.message); }); };
  document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { readForm(); KIND = b.dataset.kind; PICKED = ''; render(); });
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { readForm(); PICKED = PICKED === b.dataset.pick ? '' : b.dataset.pick; haptic('success'); render(); });
  const po = $('#pickToggle'); if (po) po.onclick = () => { readForm(); PICK_OPEN = !PICK_OPEN; if (!PICK_OPEN) PICKED = ''; render(); };
  document.querySelectorAll('[data-skill]').forEach(b => b.onclick = () => { readForm(); openSkill(b.dataset.skill); });
  document.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => jcall({ type: 'drop', name: b.dataset.drop }).then(render).catch(e => toast(e.message)));
  document.querySelectorAll('[data-focus]').forEach(b => b.onclick = () => jcall({ type: 'focus', job: b.dataset.focus }).then(() => {
    SEL = J.skill || SEL;
    if (J.status === 'done') { setDoneOpen(true); render(); const d = $('#doneToggle'); if (d) d.scrollIntoView({ block: 'start' }); }  // готовая — раскрыта внизу
    else { render(); window.scrollTo(0, 0); }
  }).catch(e => toast(e.message)));
  document.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => { readForm(); FORM[b.dataset.sw] = FORM[b.dataset.sw] ? 0 : 1; render(); });
  document.querySelectorAll('[data-len]').forEach(b => b.onclick = () => { readForm(); FORM.len = b.dataset.len; render(); });
  const upl = $('#upl'); if (upl) upl.onchange = () => { readForm(); upload([...upl.files]); };
  const go = $('#jStart'); if (go) go.onclick = async () => {
    readForm(); const s = sk(SEL); if (!s) return;
    if (s.files > 1 && ((J && J.files) || []).filter(f => f.role === 'Видео').length < s.files) { haptic('error'); toast(`Для «${s.name}» нужно ${s.files} записи: ${s.need}`); return; }
    const d = { skill: s.id, kind: s.kind, wish: FORM.wish.trim(), preview: !!FORM.preview };
    if (s.inp === 'link') d.link = FORM.link.trim();
    if (s.inp === 'text') d.script = FORM.script.trim();
    if (s.inp === 'folder') { d.folder = FORM.folder.trim(); d.query = FORM.query.trim(); }
    if (s.inp === 'video') Object.assign(d, { code: FORM.code.trim().toUpperCase(), len: FORM.len, subs: !!FORM.subs, clean: !!FORM.clean, music: !!FORM.music });
    go.disabled = true;
    try { await jcall({ type: 'start', data: d }); haptic('success'); UPS = []; render(); window.scrollTo(0, 0); } catch (e) { go.disabled = false; haptic('error'); toast(e.message); }
  };
  const cc = $('#jCancel'); if (cc) cc.onclick = () => jcall({ type: 'cancel' }).then(render).catch(e => toast(e.message));
  const ap = $('#jApprove'); if (ap) ap.onclick = () => { ap.disabled = true; jcall({ type: 'approve' }).then(() => { haptic('success'); toast('Делаю финал — пришлю в чат'); render(); }).catch(e => { ap.disabled = false; toast(e.message); }); };
  const ed = $('#jEdit'); if (ed) ed.onclick = () => { const t = ($('#f_edit').value || '').trim(); if (t.length < 3) { toast('Напиши, что поправить'); return; }
    ed.disabled = true; jcall({ type: 'edit', text: t }).then(() => { haptic('success'); toast('Принял правку — пересобираю'); render(); }).catch(e => { ed.disabled = false; toast(e.message); }); };
  [['#jResume', 'resume', 'Продолжаю с места остановки'], ['#jRestart', 'restart', 'Начинаю этот ролик заново']].forEach(([id, type, ok]) => {
    const b = $(id); if (b) b.onclick = () => { b.disabled = true; jcall({ type, job: J.job }).then(() => { haptic('success'); toast(ok); render(); }).catch(e => { b.disabled = false; toast(e.message); }); };
  });
  ['#jNew', '#jNewTop'].forEach(id => { const nw = $(id); if (nw) nw.onclick = () => jcall({ type: 'new' }).then(() => { UPS = []; render(); window.scrollTo(0, 0); }).catch(e => toast(e.message)); });
  const dt = $('#doneToggle'); if (dt) dt.onclick = () => {
    setDoneOpen(!DONE_OPEN); render();
  };
}

function render() {
  if (!['studio', 'montage', 'profile', 'partners', 'path', 'streak', 'league'].includes(TAB)) TAB = 'studio';
  const v = { studio, montage: montageTab, profile: profileTab, partners: partnersTab, path: pathTab, streak: streakTab, league: leagueTab }[TAB]();
  $('#app').innerHTML = v;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === (SUB[TAB] || TAB)));
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { TAB = b.dataset.go; render(); const t = b.dataset.to && $('#' + b.dataset.to); t ? t.scrollIntoView({ block: 'start' }) : window.scrollTo(0, 0); });
  const up = $('#topUp'); if (up) up.onclick = () => $('#tariffs').scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => buy(b.dataset.buy, b.dataset.cur));
  if (TAB === 'partners') wirePartners();
  if (TAB === 'montage') wireMontage();
  const feed = $('#feed'); if (feed) feed.onclick = () => { if (S.owner) { TAB = 'montage'; render(); window.scrollTo(0, 0); } else if (tg) tg.close(); else toast('Отправь видео боту в чат'); };
  const daily = $('#daily'); if (daily) daily.onclick = () => claim('daily');
  document.querySelectorAll('[data-chest]').forEach(b => b.onclick = () => claim('chest', { node: +b.dataset.chest }));
  const hide = $('#lbHide'); if (hide) hide.onclick = () => call('hide').then(() => { toast(S.hidden ? 'Имя скрыто — в лиге ты «Игрок»' : 'Имя снова видно'); render(); }).catch(e => toast(e.message));
  document.querySelectorAll('[data-lb]').forEach(b => b.onclick = () => { LB_MODE = b.dataset.lb; render(); });
  wireReviews();
}

async function claim(act, extra) {
  try {
    const got = await call(act, extra); haptic('success'); render();
    if (act === 'daily') reward('Награда дня', `День ${got.day} <em>из 7</em>`, [[got.coins ? '+' + got.coins : '—', 'монет'], ['+' + got.xp, 'опыта'], [got.freeze ? '+1' : S.freezes, 'заморозки']]);
    else reward('Сундук на пути', 'Сундук <em>открыт</em>', [['+' + got.coins, 'монет'], [S.reels, 'рилсов'], [S.streak, 'дней подряд']]);
  } catch (e) { haptic('error'); toast(e.message); }
}

function reward(eyebrow, title, gains) {
  const m = $('#modal');
  m.innerHTML = `<div class="eyebrow c">${eyebrow}</div><h1 class="c" id="mt">${title}</h1>
    <svg width="200" height="160" viewBox="0 0 230 190" aria-hidden="true" style="margin-top:20px">
      <g stroke="#D17A3C" stroke-width="2" stroke-linecap="round" opacity=".7"><path d="M115 6v24"/><path d="M62 26l12 18"/><path d="M168 26l-12 18"/><path d="M30 66l20 7"/><path d="M200 66l-20 7"/></g>
      <path d="M48 90 L115 60 L182 90 L115 108 Z" fill="rgba(209,122,60,.35)"/><rect x="48" y="96" width="134" height="80" rx="12" fill="#121212" stroke="#D17A3C" stroke-width="2"/>
      <rect x="104" y="106" width="22" height="28" rx="5" fill="#D17A3C"/><path d="M44 94 Q115 40 186 94" stroke="#D17A3C" stroke-width="2" fill="#161616"/></svg>
    <div class="gains">${gains.map(g => `<div class="card"><b>${g[0]}</b><span class="small muted">${g[1]}</span></div>`).join('')}</div>
    <div class="card card--dark" style="width:100%;max-width:440px;margin-top:10px;padding:14px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px"><span class="muted">До уровня ${S.level + 1}</span><span>${S.lvl_cur} / ${S.lvl_need} XP</span></div>
      <div class="track" style="margin-top:10px"><i style="width:${Math.round(S.lvl_cur / S.lvl_need * 100)}%"></i></div></div>
    <button class="btn btn--cu" style="max-width:440px;margin-top:auto" id="mclose">В студию →</button>`;
  m.classList.add('show');
  $('#mclose').onclick = () => m.classList.remove('show');
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { TAB = b.dataset.tab; render(); window.scrollTo(0, 0); try { tg.HapticFeedback.selectionChanged(); } catch (e) {} });

(async () => {
  if (!INIT) { $('#app').innerHTML = '<div class="err"><h1 class="c">Студия <em>Кадрика</em></h1><p class="muted">Открой её из Telegram — кнопка «Студия» в @studio_kadrik_bot.</p></div>'; return; }
  try {
    await call('me');
    $('#tabs').hidden = false; render();
    let lastPoll = 0;  // монтаж: опрос состояния — чаще, пока идёт работа
    setInterval(() => {
      if (TAB !== 'montage' || !M || !M.owner || document.hidden || $('#modal').classList.contains('show') || UPS.some(u => u.st === 'up')) return;
      const busy = J && ['queued', 'running'].includes(J.status), now = Date.now();
      if (now - lastPoll < (busy ? 4000 : 20000) || document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      lastPoll = now; const was = J && J.status;
      jcall({ type: 'state' }).then(() => { if (!J || J.status !== was || busy) render(); }).catch(() => {});
    }, 2000);
    if (new URLSearchParams(location.search).get('r') === '1' && S.reels) {
      reward('Рилс принят', 'Кадрик сыт <br>и <em>прокачался</em>', [['+50', 'опыта'], ['+30', 'монет'], [S.streak, 'дней подряд']]);
    } else if (new URLSearchParams(location.search).get('review') === '1') {  // из чата: «Карточка для сторис»
      const rv = $('#reviews'); if (rv) rv.scrollIntoView({ block: 'start' });
    } else if (S.intro && !S.owner) intro(0);
  } catch (e) { $('#app').innerHTML = `<div class="err"><h1 class="c">Не <em>открылось</em></h1><p class="muted">${esc(e.message)}</p></div>`; }
})();

var INTRO = [  // подсказка первого входа гостя: три экрана
  ['Шаг 1 из 3', 'Кидай <em>видео</em>', 'Отправь боту в чат свой рилс от 5 секунд — за пару минут получишь разбор: оценку хука, темпа и субтитров и 3 правки с таймкодами. До 3 видео в день.',
   '<path d="M40 60h110a14 14 0 0 1 14 14v62a14 14 0 0 1-14 14H40a14 14 0 0 1-14-14V74a14 14 0 0 1 14-14z" fill="#121212" stroke="#D17A3C" stroke-width="2"/><path d="M164 92l40-20v76l-40-20z" fill="rgba(209,122,60,.35)" stroke="#D17A3C" stroke-width="2"/><path d="M84 86l32 19-32 19z" fill="#D17A3C"/>'],
  ['Шаг 2 из 3', 'Получай <em>очки</em>', 'За каждое видео +50 опыта и +30 монет. Заходи каждый день: серия дней, награда дня и сундуки на «Пути». Вечером Кадрик напомнит, если серия под угрозой.',
   '<circle cx="115" cy="105" r="52" fill="#121212" stroke="#D17A3C" stroke-width="2"/><circle cx="115" cy="105" r="36" fill="rgba(209,122,60,.35)"/><text x="115" y="116" text-anchor="middle" font-size="30" fill="#D17A3C" font-family="serif" font-style="italic">+50</text>'],
  ['Шаг 3 из 3', 'Обгоняй в <em>лиге</em>', 'Лига недели обнуляется в понедельник — победитель получает монеты и бесплатный монтаж. Имя можно скрыть. Хочешь настоящий монтаж своего рилса — оставь заявку во вкладке «Монтаж».',
   '<rect x="40" y="110" width="44" height="50" rx="6" fill="#121212" stroke="#D17A3C" stroke-width="2"/><rect x="93" y="70" width="44" height="90" rx="6" fill="rgba(209,122,60,.35)" stroke="#D17A3C" stroke-width="2"/><rect x="146" y="95" width="44" height="65" rx="6" fill="#121212" stroke="#D17A3C" stroke-width="2"/><text x="115" y="60" text-anchor="middle" font-size="22" fill="#D17A3C">1</text>'],
];

function intro(i) {
  const m = $('#modal'), [eb, title, text, art] = INTRO[i], last = i === INTRO.length - 1;
  const done = () => { m.classList.remove('show'); call('intro').catch(() => {}); };
  m.innerHTML = `<div class="eyebrow c">${eb}</div><h1 class="c" id="mt">${title}</h1>
    <svg width="200" height="170" viewBox="0 0 230 190" aria-hidden="true" style="margin-top:20px">${art}</svg>
    <p class="muted" style="max-width:360px;text-align:center;line-height:1.6;margin-top:14px">${text}</p>
    <div style="display:flex;gap:8px;margin-top:16px" aria-hidden="true">${INTRO.map((_, k) => `<i style="width:${k === i ? 22 : 8}px;height:8px;border-radius:4px;background:${k === i ? 'var(--primary)' : 'rgba(255,255,255,.18)'}"></i>`).join('')}</div>
    <div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:20px">
      <button class="btn btn--cu" id="inNext">${last ? 'Кинуть первое видео →' : 'Дальше →'}</button>
      ${last ? '<button class="btn" id="inStay">Сначала осмотрюсь</button>' : '<button class="btn" id="inSkip">Пропустить</button>'}</div>`;
  m.classList.add('show'); m.scrollTop = 0;
  $('#inNext').onclick = () => { haptic('success'); if (!last) return intro(i + 1); done(); if (tg) tg.close(); };
  const out = $('#inSkip') || $('#inStay'); out.onclick = done;
}
</script>
</body>
</html>
