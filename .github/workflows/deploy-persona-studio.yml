name: deploy-persona-studio

# Deploy Persona Studio (Next.js 15) to Hetzner.
#
# Prod layout (matches reality, not theory):
#   user        : aisales  (in docker group, NOPASSWD sudo)
#   monorepo    : /home/aisales/ai-command-center        (git clone)
#   compose dir : /home/aisales/persona-studio/source    (flat copy of apps/persona-studio)
#   .env        : /home/aisales/persona-studio/source/.env  (manually managed, NOT overwritten)
#   compose     : services web (container persona-studio-web :3020) + worker
#   Caddy       : persona-app.46-62-215-11.nip.io → :3020 (already wired)
#
# Required GitHub secrets:
#   HETZNER_SSH_KEY             ed25519 private key authorised for aisales@hetzner
#
# Optional repo variables (defaults shown):
#   HETZNER_HOST                46.62.215.11
#   HETZNER_USER                aisales
#   HETZNER_SSH_PORT            22
#   HETZNER_REPO_PATH           /home/aisales/ai-command-center
#   PERSONA_SOURCE_PATH         /home/aisales/persona-studio/source
#   PERSONA_HEALTH_URL          http://localhost:3020/

on:
  push:
    branches: [main]
    paths:
      - 'apps/persona-studio/**'
      - '.github/workflows/deploy-persona-studio.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to deploy (default: main)'
        required: false
        default: 'main'
      skip_build:
        description: 'Skip docker compose build (just up -d on existing image)'
        type: boolean
        default: false

concurrency:
  group: deploy-persona-studio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.event.inputs.ref || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ vars.HETZNER_HOST     || '46.62.215.11' }}
          username: ${{ vars.HETZNER_USER     || 'aisales' }}
          port:     ${{ vars.HETZNER_SSH_PORT || 22 }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          envs: TARGET_REF,MONOREPO_PATH,SOURCE_PATH,SKIP_BUILD,HEALTH_URL
          script: |
            set -euo pipefail

            # ── 1. pull latest monorepo code ─────────────────────────
            if [ ! -d "$MONOREPO_PATH/.git" ]; then
              echo "── cloning monorepo into $MONOREPO_PATH ──"
              git clone https://github.com/kleber2009-alt/ai-command-center.git "$MONOREPO_PATH"
            fi
            cd "$MONOREPO_PATH"
            git fetch --prune origin
            # If someone touched tracked files on the server, stash them under a
            # labelled entry so checkout/pull doesn't abort. Recovery: `git stash list`.
            # We deliberately do NOT pass --include-untracked: the server has
            # root-owned *.bak directories that aisales cannot delete, which
            # causes stash to silently fail and leave the tracked diff in place.
            if [[ -n "$(git diff --name-only)" || -n "$(git diff --cached --name-only)" ]]; then
              STASH_LABEL="auto-deploy-stash $(date -u +%Y%m%dT%H%M%SZ) by GH Actions"
              echo "── ⚠ local tracked changes detected, stashing: $STASH_LABEL ──"
              git stash push -m "$STASH_LABEL"
            fi
            git checkout "$TARGET_REF"
            git pull --ff-only origin "$TARGET_REF"
            echo "── HEAD: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s) ──"

            # ── 2. sync persona-studio code to compose source ───────
            # .env is host-managed and NOT in the monorepo — preserve it.
            mkdir -p "$SOURCE_PATH"
            rsync -a --delete \
              --exclude='.env' \
              --exclude='.env.local' \
              --exclude='node_modules' \
              --exclude='.next' \
              --exclude='tsconfig.tsbuildinfo' \
              --exclude='Dockerfile.bak*' \
              "$MONOREPO_PATH/apps/persona-studio/" "$SOURCE_PATH/"
            echo "── code synced → $SOURCE_PATH ──"

            cd "$SOURCE_PATH"

            # ── 3. build images ──────────────────────────────────────
            if [[ "$SKIP_BUILD" != "true" ]]; then
              echo "── docker compose build ──"
              docker compose build
            else
              echo "── skip_build=true: skipping image rebuild ──"
            fi

            # ── 4. restart containers ────────────────────────────────
            # docker compose up -d sometimes returns non-zero under appleboy
            # ssh-action even when all containers start (likely stop-grace
            # warning). Tolerate the exit code; health check at step 6 is the
            # real verdict.
            echo "── docker compose up -d --force-recreate ──"
            docker compose up -d --force-recreate || echo "── ⚠ up -d returned non-zero, continuing to verify ──"

            # ── 5. prisma migrations ─────────────────────────────────
            # persona-studio uses `prisma db push` (declarative schema), not
            # versioned migrations — there's no prisma/migrations/ directory,
            # so the migrate step is a no-op. Schema changes are applied
            # manually via `npm run db:push` from a workstation.
            test -d "$SOURCE_PATH/prisma/migrations" \
              && (docker compose exec -T web npx -y prisma@5.22.0 migrate deploy || echo "── ⚠ prisma migrate failed; continuing ──") \
              || echo "── no prisma/migrations dir (declarative schema), skipping ──"

            # ── 6. health-check (up to 60 s) ─────────────────────────
            echo "── waiting for persona-studio-web → $HEALTH_URL ──"
            for i in $(seq 1 20); do
              if curl -fsS "$HEALTH_URL" > /dev/null 2>&1; then
                echo "✓ healthy after ${i}×3s"
                exit 0
              fi
              sleep 3
            done
            echo "✗ persona-studio did not respond within 60s"
            docker logs --tail=80 persona-studio-web || true
            exit 1
        env:
          TARGET_REF:    ${{ steps.ref.outputs.value }}
          MONOREPO_PATH: ${{ vars.HETZNER_REPO_PATH    || '/home/aisales/ai-command-center' }}
          SOURCE_PATH:   ${{ vars.PERSONA_SOURCE_PATH  || '/home/aisales/persona-studio/source' }}
          SKIP_BUILD:    ${{ github.event.inputs.skip_build || 'false' }}
          HEALTH_URL:    ${{ vars.PERSONA_HEALTH_URL   || 'http://localhost:3020/' }}

  smoke-test:
    runs-on: ubuntu-latest
    needs: [deploy]
    timeout-minutes: 3

    steps:
      - name: HTTP smoke test
        run: |
          set -euo pipefail
          for url in \
            "http://persona.46-62-215-11.nip.io/" \
            "http://dashboard.46-62-215-11.nip.io/landings/persona-studio/"; do
            STATUS=$(curl -o /dev/null -sw "%{http_code}" \
              "$url" --max-time 15 || echo "000")
            echo "GET $url → HTTP $STATUS"
            [ "$STATUS" = "200" ] || { echo "✗ unexpected $STATUS"; exit 1; }
          done
          echo "✓ both endpoints live"
