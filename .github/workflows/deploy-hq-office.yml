name: deploy-hq-office

# Living office of agents (apps/hq-office) → https://hq2.aicex.club on the aicex box
# (vars.HETZNER_HOST, where *.aicex.club points). Each run uploads a release to
# /opt/hq-office/releases/<id>, switches /opt/hq-office/current to it and keeps the
# static container + edge Caddy site in place (apps/hq-office/deploy/server.sh), and runs the
# personal assistant (apps/hq-office/assistant, /api/assistant/*) next to it, with the working desk
# (/api/assistant/desk/*: tasks for agents) and its runner (apps/hq-office/runner, a systemd
# service under the bots' user that does the tasks with Claude Code and the team's skills).
# Also started by hq-office-history.yml after it adds tasks to tasks.auto.js.
#
# Secret: HETZNER_SSH_KEY. Variables: HETZNER_HOST, HETZNER_USER, HETZNER_SSH_PORT,
# HQ_OFFICE_DOMAIN (default hq2.aicex.club).
# Assistant: secrets HQ_OFFICE_ANTHROPIC_API_KEY (Claude), PERSONA_TRAIN_ELEVENLABS_API_KEY (voice),
# HQ_ASSISTANT_PASSWORD (owner login; without it the assistant is a guest demo only);
# optional variable HQ_ASSISTANT_VOICE_ID (otherwise the owner picks the cloned voice on the site).
# Morning agents: Telegram of the owner — secret HQ_NOTIFY_TG_BOT_TOKEN + vars.HQ_NOTIFY_TG_CHAT_ID, else the Office Worker
# or «Ремейк залёта» bot with the owner's id (vars.REMAKE_TG_OWNER_IDS);
# Telegram control of the office (assistant/tg.mjs): the own bot @AI_Growth_Office_Bot — secret HQ_NOTIFY_TG_BOT_TOKEN (or HQ_TG_BOT_TOKEN; never a bot
# another service polls or has a webhook on), owners — vars.HQ_TG_OWNER_IDS (else the owner id of the morning reports).
# «Балансы и подписки» checks the existing service keys of the monorepo + vars.HQ_SUBSCRIPTIONS_JSON (subscriptions without API,
# [{"name":"Claude Max","renews":15,"price":"$200"}]) and optional vars.HQ_META_AD_ACCOUNT; «Статистика соцсетей» — optional
# secrets HQ_IG_ACCESS_TOKEN, HQ_THREADS_ACCESS_TOKEN, HQ_YOUTUBE_API_KEY and vars HQ_IG_USER_ID, HQ_SOCIAL_IG (default ilia.paliy),
# HQ_SOCIAL_YT, HQ_SOCIAL_TIKTOK, HQ_SOCIAL_TG_CHANNEL (without them — Instagram through Apify only).

on:
  push:
    branches: [main]
    paths:
      - 'apps/hq-office/**'
      - '.claude/skills/remake-top-reel/references/**'
      - '.claude/skills/carousel-pro/references/**'
      # the twin's knowledge base is rebuilt when the business docs change
      - 'apps/**/*.md'
      - 'docs/**'
      - 'landings/**'
      - 'CLAUDE.md'
      - 'apps/command-center/registry/projects.mjs'
      - '.claude/skills/**'
      - '.github/workflows/deploy-hq-office.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hq-office
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ vars.HETZNER_HOST }}
      SSH_USER: ${{ vars.HETZNER_USER || 'root' }}
      SSH_PORT: ${{ vars.HETZNER_SSH_PORT || '22' }}
      DOMAIN: ${{ vars.HQ_OFFICE_DOMAIN || 'hq2.aicex.club' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check data files
        run: |
          for f in agents.js office.config.js dept-content.js agent-content.js skills-library.js tasks.js tasks.auto.js works.js assistant/server.mjs assistant/office.mjs assistant/voice.mjs assistant/desk.mjs assistant/tg.mjs assistant/twin.mjs assistant/kb.mjs assistant/team.mjs assistant/admin.mjs; do node --check "apps/hq-office/$f"; done
          python3 -m py_compile apps/hq-office/runner/runner.py && rm -rf apps/hq-office/runner/__pycache__
          node -e '
            global.window = {}; for (const f of ["agents.js", "office.config.js", "dept-content.js", "agent-content.js", "tasks.js", "tasks.auto.js", "works.js"])
              require("vm").runInThisContext(require("fs").readFileSync("apps/hq-office/" + f, "utf8"));
            const t = [...window.OFFICE_TASKS, ...window.OFFICE_TASKS_AUTO.tasks], ids = new Set();
            for (const x of t) { if (ids.has(x.id)) throw new Error("duplicate task id " + x.id); ids.add(x.id);
              if (!/^\d{4}-\d{2}-\d{2}$/.test(x.date) || !x.proof?.length) throw new Error("bad task " + x.id);
              for (const m of [...(x.media || []), ...x.proof]) for (const u of [m.src, m.url, m.poster])
                if (u && u.startsWith("media/") && !require("fs").existsSync("apps/hq-office/" + u)) throw new Error("missing " + u + " in " + x.id); }
            for (const p of Object.values(window.OFFICE_WORKS.previews))
              if (!/^https?:/.test(p) && !require("fs").existsSync("apps/hq-office/" + p)) throw new Error("missing preview " + p);
            console.log(t.length + " tasks ok");
            // the agents registry (agents.js): every agent has a dossier, a known department and handoffs to known agents
            const R = window.OFFICE_AGENTS, depts = new Set([...window.OFFICE_CONFIG.depts.map(d => d.id), "council"]);
            for (const [id, a] of Object.entries(R.list)) {
              if (!depts.has(a.dept)) throw new Error("agent " + id + ": unknown dept " + a.dept);
              if (!a.name || !a.role || !/^#[0-9a-f]{6}$/i.test(a.color)) throw new Error("agent " + id + ": name, role, color");
              if (!window.AGENT_CONTENT[id]) throw new Error("agent " + id + ": no dossier in agent-content.js (AGENT_CONTENT)");
              if (a.figure !== false && (!a.screen || !a.tasks?.length)) throw new Error("agent " + id + ": screen and tasks");
              for (const x of a.out || []) if (!R.list[x.to] && !["you", "head", "orchestrator"].includes(x.to)) throw new Error("agent " + id + ": hands to unknown " + x.to);
            }
            console.log(R.ids.length + " agents ok");'

      - name: Install SSH key
        env:
          KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          test -n "$HOST" || { echo "::error::vars.HETZNER_HOST is not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/id_deploy -p $SSH_PORT $SSH_USER@$HOST" >> "$GITHUB_ENV"

      - name: Build assistant
        working-directory: apps/hq-office/assistant
        run: |
          npm ci --omit=dev --no-audit --no-fund
          cp ../../../CLAUDE.md project-map.md
          # knowledge of the twin (twin/): the rules of the content skills, next to the server
          for f in remake-top-reel/references/script-rules.md remake-top-reel/references/styles.md carousel-pro/references/carousel-rules.md; do
            mkdir -p "twin-skills/$(dirname "$f")" && cp "../../../.claude/skills/$f" "twin-skills/$f"
          done
          node -e 'import("./twin.mjs").then(m => { const t = m.loadTwin(); if (t.sources.length < 4) throw new Error("twin knowledge is incomplete"); console.log(t.sources.length + " twin sources, " + t.text.length + " chars"); })'
          # the twin's knowledge base: registry, docs of every product, landing texts, skills (twin-kb/index.json)
          node kb.mjs build ../../..
          node -e 'import("./office.mjs").then(m => { const o = m.loadOffice(".."); if (!o.tasks) throw new Error("no tasks"); console.log(o.tasks + " tasks, " + o.text.length + " chars of office knowledge"); })'
          # tests of the working desk with a fake runner and a fake Claude (desk.test.mjs): the task's state machine
          npm test

      - name: Upload release
        run: |
          REL="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "REL=$REL" >> "$GITHUB_ENV"
          tar -C apps/hq-office --exclude=./deploy --exclude=./sync --exclude=./assistant --exclude=./runner --exclude=./README.md --exclude=./CLAUDE.md -czf - . \
            | $SSH "mkdir -p /opt/hq-office/releases/$REL && tar -xzf - -C /opt/hq-office/releases/$REL"
          tar -C apps/hq-office/assistant --exclude=./.data -czf - . \
            | $SSH "mkdir -p /opt/hq-office/assistant/releases/$REL && tar -xzf - -C /opt/hq-office/assistant/releases/$REL"
          # the transcriber (agent «Транскрибатор»): the skill goes with the runner and into the bots' user ~/.claude/skills
          mkdir -p apps/hq-office/runner/skills && cp -r .claude/skills/transcribe-reference .claude/skills/social-daily-stats .claude/skills/service-balances apps/hq-office/runner/skills/
          tar -C apps/hq-office/runner -czf - . \
            | $SSH "mkdir -p /opt/hq-office/runner/releases/$REL && tar -xzf - -C /opt/hq-office/runner/releases/$REL"

      - name: Assistant secrets
        env:
          ANTHROPIC: ${{ secrets.HQ_OFFICE_ANTHROPIC_API_KEY }}
          ELEVEN: ${{ secrets.PERSONA_TRAIN_ELEVENLABS_API_KEY }}
          PASS: ${{ secrets.HQ_ASSISTANT_PASSWORD }}
          VOICE: ${{ vars.HQ_ASSISTANT_VOICE_ID }}
          # the owner's Telegram: an explicit bot, else the Office Worker bot, else the «Ремейк залёта» bot (sending only —
          # its long-polling on remake-site is not affected); the chat is the owner's id (the bot must have been started once)
          TG_TOKEN: ${{ secrets.HQ_NOTIFY_TG_BOT_TOKEN || secrets.WORKER_TELEGRAM_BOT_TOKEN || secrets.REMAKE_TG_BOT_TOKEN }}
          TG_CHAT: ${{ vars.HQ_NOTIFY_TG_CHAT_ID || vars.WORKER_OWNER_TELEGRAM_ID || vars.REMAKE_TG_OWNER_IDS || vars.TG_AGENT_OWNER_TELEGRAM_ID }}
          # the office's own bot (@AI_Growth_Office_Bot): HQ_NOTIFY_TG_BOT_TOKEN, or a separate HQ_TG_BOT_TOKEN — the Telegram control
          # of the office (assistant/tg.mjs) listens to it. A shared bot (Office Worker, «Ремейк залёта») is not polled.
          OWN_BOT: ${{ secrets.HQ_TG_BOT_TOKEN || secrets.HQ_NOTIFY_TG_BOT_TOKEN }}
          OFFICE_OWNERS: ${{ vars.HQ_TG_OWNER_IDS || vars.HQ_NOTIFY_TG_CHAT_ID || vars.WORKER_OWNER_TELEGRAM_ID || vars.REMAKE_TG_OWNER_IDS || vars.TG_AGENT_OWNER_TELEGRAM_ID }}
        run: |
          [ -n "$ANTHROPIC" ] || echo "::warning::HQ_OFFICE_ANTHROPIC_API_KEY is not set — the assistant will not answer"
          [ -n "$PASS" ] || echo "::warning::HQ_ASSISTANT_PASSWORD is not set — the assistant runs as a guest demo only"
          TG_CHAT=$(printf '%s' "$TG_CHAT" | grep -oE -- '-?[0-9]+' | head -1 || true)
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] && echo "morning reports → Telegram chat …${TG_CHAT: -3}" \
            || echo "::warning::no Telegram bot or owner id (HQ_NOTIFY_TG_BOT_TOKEN + HQ_NOTIFY_TG_CHAT_ID) — morning reports stay in the office only"
          OWN=$([ -n "$OWN_BOT" ] && echo 1 || echo 0)
          OFFICE_OWNERS=$(printf '%s' "$OFFICE_OWNERS" | grep -oE '[0-9]{5,}' | paste -sd, - || true)
          [ "$OWN" = 1 ] && echo "Telegram: the office's own bot — the control panel is on (owners: $(printf '%s' "$OFFICE_OWNERS" | tr ',' '\n' | grep -c .))" \
            || echo "::warning::no own office bot (secret HQ_NOTIFY_TG_BOT_TOKEN of @AI_Growth_Office_Bot) — no Telegram control of the office"
          printf 'ANTHROPIC_API_KEY=%s\nELEVENLABS_API_KEY=%s\nHQ_ASSISTANT_PASSWORD=%s\nELEVENLABS_VOICE_ID=%s\nHQ_NOTIFY_TG_TOKEN=%s\nHQ_NOTIFY_TG_CHAT=%s\nHQ_NOTIFY_TG_OWN=%s\nHQ_PUBLIC_URL=https://%s\nHQ_TG_BOT_TOKEN=%s\nHQ_TG_OWNER_IDS=%s\n' \
            "$ANTHROPIC" "$ELEVEN" "$PASS" "$VOICE" "$TG_TOKEN" "$TG_CHAT" "$OWN" "$DOMAIN" "$OWN_BOT" "$OFFICE_OWNERS" \
            | $SSH "umask 077 && cat > /opt/hq-office/assistant.env"

      - name: Keys of the morning agents
        # read only by the scripts of service-balances and social-daily-stats (~/hq-runner/keys.env), not by Claude Code's environment
        env:
          HQ_OFFICE_ANTHROPIC_API_KEY: ${{ secrets.HQ_OFFICE_ANTHROPIC_API_KEY }}
          REMAKE_ANTHROPIC_API_KEY: ${{ secrets.REMAKE_ANTHROPIC_API_KEY }}
          STUDIO_KADRIK_ANTHROPIC_API_KEY: ${{ secrets.STUDIO_KADRIK_ANTHROPIC_API_KEY }}
          TRANSCRIBE_ANTHROPIC_API_KEY: ${{ secrets.TRANSCRIBE_ANTHROPIC_API_KEY }}
          TG_AGENT_ANTHROPIC_API_KEY: ${{ secrets.TG_AGENT_ANTHROPIC_API_KEY }}
          WORKER_ANTHROPIC_API_KEY: ${{ secrets.WORKER_ANTHROPIC_API_KEY }}
          REMAKE_OPENAI_API_KEY: ${{ secrets.REMAKE_OPENAI_API_KEY }}
          TRANSCRIBE_OPENAI_API_KEY: ${{ secrets.TRANSCRIBE_OPENAI_API_KEY }}
          PERSONA_TRAIN_ELEVENLABS_API_KEY: ${{ secrets.PERSONA_TRAIN_ELEVENLABS_API_KEY }}
          REMAKE_ELEVENLABS_API_KEY: ${{ secrets.REMAKE_ELEVENLABS_API_KEY }}
          WORKER_ELEVENLABS_API_KEY: ${{ secrets.WORKER_ELEVENLABS_API_KEY }}
          REMAKE_HEYGEN_API_KEY: ${{ secrets.REMAKE_HEYGEN_API_KEY }}
          PERSONA_TRAIN_HEYGEN_API_KEY: ${{ secrets.PERSONA_TRAIN_HEYGEN_API_KEY }}
          WORKER_HEYGEN_API_KEY: ${{ secrets.WORKER_HEYGEN_API_KEY }}
          REMAKE_APIFY_TOKEN: ${{ secrets.REMAKE_APIFY_TOKEN }}
          WORKER_APIFY_API_TOKEN: ${{ secrets.WORKER_APIFY_API_TOKEN }}
          TRANSCRIBE_APIFY_API_TOKEN: ${{ secrets.TRANSCRIBE_APIFY_API_TOKEN }}
          TRANSCRIBE_DEEPGRAM_API_KEY: ${{ secrets.TRANSCRIBE_DEEPGRAM_API_KEY }}
          AI_HUB_KIE_API_KEY: ${{ secrets.AI_HUB_KIE_API_KEY }}
          META_TOKEN: ${{ secrets.FUNNEL_META_TOKEN }}
          META_AD_ACCOUNT: ${{ vars.HQ_META_AD_ACCOUNT }}
          SUBS: ${{ vars.HQ_SUBSCRIPTIONS_JSON }}
          APIFY_TOKEN: ${{ secrets.REMAKE_APIFY_TOKEN || secrets.WORKER_APIFY_API_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.HQ_IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.HQ_IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.HQ_THREADS_ACCESS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.HQ_YOUTUBE_API_KEY }}
          SOCIAL_IG: ${{ vars.HQ_SOCIAL_IG || 'ilia.paliy' }}
          SOCIAL_YT: ${{ vars.HQ_SOCIAL_YT }}
          SOCIAL_TIKTOK: ${{ vars.HQ_SOCIAL_TIKTOK }}
          SOCIAL_TG_CHANNEL: ${{ vars.HQ_SOCIAL_TG_CHANNEL }}
          SOCIAL_TG_BOT_TOKEN: ${{ secrets.HQ_NOTIFY_TG_BOT_TOKEN || secrets.WORKER_TELEGRAM_BOT_TOKEN || secrets.REMAKE_TG_BOT_TOKEN }}
        run: |
          {
            for n in HQ_OFFICE_ANTHROPIC_API_KEY REMAKE_ANTHROPIC_API_KEY STUDIO_KADRIK_ANTHROPIC_API_KEY TRANSCRIBE_ANTHROPIC_API_KEY TG_AGENT_ANTHROPIC_API_KEY \
                     WORKER_ANTHROPIC_API_KEY REMAKE_OPENAI_API_KEY TRANSCRIBE_OPENAI_API_KEY PERSONA_TRAIN_ELEVENLABS_API_KEY REMAKE_ELEVENLABS_API_KEY \
                     WORKER_ELEVENLABS_API_KEY REMAKE_HEYGEN_API_KEY PERSONA_TRAIN_HEYGEN_API_KEY WORKER_HEYGEN_API_KEY REMAKE_APIFY_TOKEN WORKER_APIFY_API_TOKEN \
                     TRANSCRIBE_APIFY_API_TOKEN TRANSCRIBE_DEEPGRAM_API_KEY AI_HUB_KIE_API_KEY META_TOKEN META_AD_ACCOUNT APIFY_TOKEN IG_ACCESS_TOKEN IG_USER_ID \
                     THREADS_ACCESS_TOKEN YOUTUBE_API_KEY SOCIAL_IG SOCIAL_YT SOCIAL_TIKTOK SOCIAL_TG_CHANNEL SOCIAL_TG_BOT_TOKEN; do
              [ -n "${!n}" ] && printf '%s=%s\n' "$n" "${!n}"
            done
            [ -n "$SUBS" ] && printf 'SUBSCRIPTIONS_JSON=%s\n' "$(printf '%s' "$SUBS" | jq -c . 2>/dev/null || echo "::warning::HQ_SUBSCRIPTIONS_JSON is not valid JSON" >&2)"
            true
          } | $SSH "umask 077 && cat > /opt/hq-office/runner-keys.env"

      - name: Systems of the runner (MCP)
        # agents read ChatPlace / Windsor (Meta Ads) / HeyGen right away; actions that change data run only after
        # the owner's «Выполнить» on the desk. The secret is a Claude Code mcp-config, plus optional "policy"
        # {"<server>": {"read": [...], "write": [...]}} — see apps/hq-office/README.md («Системы исполнителя»)
        env:
          MCP_JSON: ${{ secrets.HQ_RUNNER_MCP_JSON }}
        run: |
          if [ -z "$MCP_JSON" ]; then echo "no HQ_RUNNER_MCP_JSON — agents work without outside systems"; $SSH "rm -f /opt/hq-office/runner-mcp.json"; exit 0; fi
          printf '%s' "$MCP_JSON" | jq -e '.mcpServers | type == "object"' >/dev/null || { echo "::warning::HQ_RUNNER_MCP_JSON is not a valid mcp-config (needs mcpServers) — skipped"; exit 0; }
          echo "runner systems: $(printf '%s' "$MCP_JSON" | jq -r '.mcpServers | keys | join(", ")')"
          printf '%s' "$MCP_JSON" | jq -c . | $SSH "umask 077 && cat > /opt/hq-office/runner-mcp.json"

      - name: Activate
        run: $SSH bash -s -- "$DOMAIN" "$REL" < apps/hq-office/deploy/server.sh

      - name: Smoke test
        run: |
          for path in / /tasks.js /tasks.auto.js /api/assistant/health /api/assistant/desk/history.js; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 8 --retry-delay 5 --retry-all-errors "https://$DOMAIN$path" || echo 000)
            echo "$code https://$DOMAIN$path"
            [ "$code" = 200 ] || exit 1
          done
