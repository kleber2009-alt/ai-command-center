name: deploy-viral-platform

# Deploy viral-platform (Next.js web + 5 BullMQ workers + own pgvector Postgres
# & Redis) to Hetzner as an isolated docker-compose project.
# Compose: /root/ai-command-center/viral-platform/docker-compose.prod.yml
# Web is exposed on host :3018; Caddy proxies viral.46-62-215-11.nip.io there
# (see viral-platform/deploy/Caddyfile.snippet).
#
# ─── Required GitHub secrets ───────────────────────────────────────
#   HETZNER_SSH_KEY
#   VP_ENV_FILE   — the entire /etc/viral-platform.env body (see DEPLOY.md):
#                   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB,
#                   DATABASE_URL (→ vp-postgres), REDIS_URL (→ vp-redis),
#                   CLERK_* / ANTHROPIC_API_KEY / OPENAI_API_KEY / DEEPGRAM_API_KEY
#                   / GEMINI_API_KEY / PEXELS_API_KEY / PIXABAY_API_KEY /
#                   R2_* / STRIPE_* / NEXT_PUBLIC_*.
#
# ─── Required GitHub repository variables ──────────────────────────
#   VP_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY    (inlined into the web build)
#   VP_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY

on:
  push:
    branches: [main]
    paths:
      - 'viral-platform/**'
      - '.github/workflows/deploy-viral-platform.yml'
      - '.github/actions/deploy-ssh/**'
  workflow_dispatch:
    inputs:
      ref:
        required: false
        default: 'main'

concurrency:
  group: deploy-viral-platform
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.ref || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/deploy-ssh
        with:
          app_name: viral-platform
          ref:      ${{ steps.ref.outputs.value }}
          ssh_key:  ${{ secrets.HETZNER_SSH_KEY }}
          envs:     'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY'
          # deploy-ssh writes this verbatim to /etc/viral-platform.env (0600 root).
          env_file: ${{ secrets.VP_ENV_FILE }}
          script: |
            set -e
            cd /root/ai-command-center/viral-platform
            COMPOSE="docker compose -f docker-compose.prod.yml --env-file /etc/viral-platform.env"

            echo "── build images ──"
            $COMPOSE build vp-web vp-worker-broll

            echo "── run DB migrations (extension + schema + halfvec HNSW) ──"
            $COMPOSE up -d vp-postgres vp-redis
            $COMPOSE run --rm vp-worker-broll pnpm --filter @vp/db migrate

            echo "── (re)create web + workers ──"
            $COMPOSE up -d --force-recreate \
              vp-web vp-worker-transcribe vp-worker-detect vp-worker-broll \
              vp-worker-library vp-worker-render

            echo "── health-check vp-web ──"
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:3018/ >/dev/null 2>&1; then
                echo "✓ healthy after ${i}×3s"; exit 0
              fi
              sleep 3
            done
            echo "✗ vp-web did not respond within 90s"
            docker logs --tail=120 vp-web || true
            exit 1
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.VP_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.VP_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
