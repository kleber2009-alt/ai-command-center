name: deploy-command-center

# Deploy apps/command-center (Next.js 14 — internal dashboard) to Hetzner.
# No docker-compose yet — uses raw `docker run`. Host port 3005 → container 3003.
# Caddy mapping: command-center.46-62-215-11.nip.io → localhost:3005.
# Attached to docker network `aisales_aisales-net` to reach `aisales-postgres`.
#
# ─── Required GitHub secrets ───────────────────────────────────────
#   HETZNER_SSH_KEY
#   COMMAND_CENTER_DATABASE_URL         (postgres://aisales:…@aisales-postgres:5432/aisales)
#   COMMAND_CENTER_AUTH_SECRET          (openssl rand -base64 32)
#   COMMAND_CENTER_ADMIN_PASSWORD
#
# ─── Required GitHub repository variables ──────────────────────────
#   COMMAND_CENTER_PUBLIC_URL           (https://command-center.46-62-215-11.nip.io)

on:
  push:
    branches: [main]
    paths:
      - 'apps/command-center/**'
      - '.github/workflows/deploy-command-center.yml'
      - '.github/actions/deploy-ssh/**'
  workflow_dispatch:
    inputs:
      ref:
        required: false
        default: 'main'

concurrency:
  group: deploy-command-center
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.ref || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/deploy-ssh
        with:
          app_name: command-center
          ref:      ${{ steps.ref.outputs.value }}
          ssh_key:  ${{ secrets.HETZNER_SSH_KEY }}
          env_file: |
            DATABASE_URL=${{ secrets.COMMAND_CENTER_DATABASE_URL }}
            AUTH_SECRET=${{ secrets.COMMAND_CENTER_AUTH_SECRET }}
            ADMIN_PASSWORD=${{ secrets.COMMAND_CENTER_ADMIN_PASSWORD }}
            PUBLIC_URL=${{ vars.COMMAND_CENTER_PUBLIC_URL }}
            NODE_ENV=production
          script: |
            cd /root/ai-command-center

            echo "── building command-center image ──"
            docker build \
              -f apps/command-center/Dockerfile \
              -t command-center:latest \
              --label "git_sha=$(git rev-parse --short HEAD)" \
              .

            echo "── restarting command-center container ──"
            docker stop command-center 2>/dev/null || true
            docker rm   command-center 2>/dev/null || true
            docker run -d \
              --name command-center \
              --restart unless-stopped \
              --env-file /etc/command-center.env \
              --network aisales_aisales-net \
              -p 127.0.0.1:3005:3003 \
              command-center:latest

            echo "── ensure Caddy mapping (idempotent: always points to :3005) ──"
            CADDYFILE=/etc/caddy/Caddyfile
            cp "$CADDYFILE" "${CADDYFILE}.bak.$(date +%Y%m%d_%H%M%S)"
            python3 - "$CADDYFILE" <<'PY'
            import re, sys
            p = sys.argv[1]
            src = open(p).read()
            block = (
                "command-center.46-62-215-11.nip.io {\n"
                "\treverse_proxy 127.0.0.1:3005\n"
                "\tencode zstd gzip\n"
                "\theader { X-Content-Type-Options nosniff; -Server }\n"
                "\tlog {\n"
                "\t\toutput file /var/log/caddy/command-center.log\n"
                "\t\tformat console\n"
                "\t}\n"
                "}"
            )
            pat = re.compile(r"command-center\.46-62-215-11\.nip\.io\s*\{[^{}]*(?:\{[^{}]*\}[^{}]*)*\}", re.S)
            if pat.search(src):
                src = pat.sub(block, src, count=1)
            else:
                src = src.rstrip() + "\n\n# ─── Command Center dashboard ───\n" + block + "\n"
            open(p, "w").write(src)
            PY
            caddy reload --config "$CADDYFILE" --adapter caddyfile

            echo "── health-check ──"
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:3005/ >/dev/null 2>&1; then
                echo "✓ healthy after ${i}×3s"; exit 0
              fi
              sleep 3
            done
            echo "✗ command-center did not respond within 60s"
            docker logs --tail=80 command-center || true
            exit 1
