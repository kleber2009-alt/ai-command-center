# Read-only snapshot of the prod box: arch, resources, containers, ports,
# Caddy sites, repo checkouts. Changes nothing on the server.
name: server-probe

on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/server-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ vars.HETZNER_HOST }}
          username: ${{ vars.HETZNER_USER || 'root' }}
          port:     ${{ vars.HETZNER_SSH_PORT || '22' }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "== host";      hostname; uname -m; nproc; free -h; df -h /
            echo "== docker";    docker version --format '{{.Server.Version}}'; docker compose version
            echo "== ports 80/443"; ss -ltnp | grep -E ':(80|443)\s' || true
            echo "== containers"
            docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Ports}}\t{{index .Labels "com.docker.compose.project"}}\t{{index .Labels "com.docker.compose.project.working_dir"}}'
            echo "== networks";  docker network ls --format '{{.Name}}'
            echo "== caddy containers"
            for c in $(docker ps --format '{{.Names}}' | grep -i caddy); do
              echo "--- $c mounts:"; docker inspect -f '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' "$c"
              echo "--- $c Caddyfile:"; docker exec "$c" cat /etc/caddy/Caddyfile 2>/dev/null | head -150
            done
            echo "== host caddy"; systemctl is-active caddy 2>/dev/null || true; ls /etc/caddy 2>/dev/null || true
            echo "== repo checkouts"
            for d in /root/ai-command-center /opt/* /srv/* /home/*/ai-command-center; do
              [ -d "$d/.git" ] && echo "$d @ $(git -C "$d" rev-parse --abbrev-ref HEAD) $(git -C "$d" log -1 --format='%h %cd' --date=short) remote=$(git -C "$d" remote get-url origin | sed -E 's#://[^@]+@#://***@#')"
            done
            echo "== /etc/*.env"; ls -la /etc/*.env 2>/dev/null || true
            echo "== listening"; ss -ltn | awk 'NR>1{print $4}' | sort -u | tr '\n' ' '; echo
            echo "== aicex env keys (values hidden)"
            for f in /etc/aicex/*.env; do
              echo "--- $f"; sed -E 's/^([A-Z0-9_]+)=.+$/\1=<set>/; s/^([A-Z0-9_]+)=$/\1=<EMPTY>/' "$f"
            done
            echo "== edge sites"; for f in /opt/edge/sites/*.caddy; do [ "$f" = /opt/edge/sites/aicex.caddy ] && continue; echo "--- $f"; cat "$f"; done
            echo "== funnel-analytics"
            docker inspect -f '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' funnel-analytics-web
            docker exec funnel-analytics-web cat /etc/caddy/Caddyfile 2>/dev/null | head -30
            ls -la /var/www/funnel-analytics /opt/funnel-analytics-data 2>&1 | head -30
            cat /etc/cron.d/funnel-analytics 2>/dev/null; ls -la /usr/local/bin/funnel-analytics-update 2>&1
            echo "--- env keys"; sed -E 's/^([A-Z0-9_]+)=.+$/\1=<set>/' /etc/funnel-analytics.env 2>/dev/null
            echo "--- log"; tail -40 /var/log/funnel-analytics.log 2>&1
            for c in aicex-ytdlp aicex-tg-agent aicex-transcribe; do
              echo "--- logs $c"; docker logs --tail=25 "$c" 2>&1 | sed -E 's/[0-9]{8,}:[A-Za-z0-9_-]{30,}/***/g'
            done
