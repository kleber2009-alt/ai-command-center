name: deploy-direct-crm

# «CRM AICEX» (apps/direct-crm) → https://crm.aicex.club (and the old name direct-crm.aicex.club) on the aicex box (vars.HETZNER_HOST,
# where *.aicex.club points). One project: «Аналитика» (dashboard, funnel, AI quality, chains) and «Директ» (queue, chats, teaching the AI).
# crm.aicex.club used to serve a static «AI Sales CRM» prototype; deploy/server.sh takes the name over only if that site is a
# separate /opt/edge/sites file serving nothing else (moved to /opt/edge/sites-disabled), else it says where the name is defined.
# Chats of the ChatPlace AI manager (Instagram Direct and the Telegram bots) are pulled every minute into SQLite, Claude reads
# each chat (priority, funnel stage, source, a grade of the AI's answers), the head of sales Bogdan works the queue and
# answers from the CRM. apps/direct-crm/deploy/server.sh builds the image, keeps /opt/direct-crm/data and wires the edge Caddy.
#
# Secrets: HETZNER_SSH_KEY;
#   ChatPlace — DIRECT_CRM_CHATPLACE_MCP_JSON, else the chatplace server from HQ_RUNNER_MCP_JSON (the office runner's mcp-config);
#   Claude — DIRECT_CRM_ANTHROPIC_API_KEY | HQ_OFFICE_ANTHROPIC_API_KEY (without it: chats only, no analysis);
#   logins — DIRECT_CRM_BOGDAN_PASSWORD (login «bogdan»), DIRECT_CRM_OWNER_PASSWORD | HQ_ASSISTANT_PASSWORD (login «ilia»),
#            or DIRECT_CRM_USERS_JSON {"login":{"name":"…","password":"…","role":"…"}} for more people.
# Variables: HETZNER_HOST, HETZNER_USER, HETZNER_SSH_PORT, DIRECT_CRM_DOMAIN (names, primary first; default
#   "crm.aicex.club direct-crm.aicex.club"),
#   DIRECT_CRM_MODEL (default claude-opus-5-5), DIRECT_CRM_BACKFILL_DAYS (14 — history pulled on the first start).

on:
  push:
    branches: [main]
    paths:
      - 'apps/direct-crm/**'
      - '.github/workflows/deploy-direct-crm.yml'
  workflow_dispatch:

concurrency:
  group: deploy-direct-crm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ vars.HETZNER_HOST }}
      SSH_USER: ${{ vars.HETZNER_USER || 'root' }}
      SSH_PORT: ${{ vars.HETZNER_SSH_PORT || '22' }}
      DOMAINS: ${{ vars.DIRECT_CRM_DOMAIN || 'crm.aicex.club direct-crm.aicex.club' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check
        working-directory: apps/direct-crm
        run: |
          npm ci --no-audit --no-fund
          for f in server.mjs check.mjs lib/*.mjs; do node --check "$f"; done
          node -e 'const h=require("fs").readFileSync("public/index.html","utf8");new Function([...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).join(";\n"));console.log("page script ok")'
          npm run -s check
          rm -rf node_modules

      - name: Install SSH key
        env:
          KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          test -n "$HOST" || { echo "::error::vars.HETZNER_HOST is not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/id_deploy -p $SSH_PORT $SSH_USER@$HOST" >> "$GITHUB_ENV"

      - name: Upload release
        run: |
          REL="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "REL=$REL" >> "$GITHUB_ENV"
          tar -C apps/direct-crm --exclude=./deploy --exclude=./check.mjs --exclude=./.data -czf - . \
            | $SSH "mkdir -p /opt/direct-crm/releases/$REL && tar -xzf - -C /opt/direct-crm/releases/$REL"

      - name: Secrets
        env:
          CP_OWN: ${{ secrets.DIRECT_CRM_CHATPLACE_MCP_JSON }}
          CP_OFFICE: ${{ secrets.HQ_RUNNER_MCP_JSON }}
          ANTHROPIC: ${{ secrets.DIRECT_CRM_ANTHROPIC_API_KEY || secrets.HQ_OFFICE_ANTHROPIC_API_KEY }}
          BOGDAN: ${{ secrets.DIRECT_CRM_BOGDAN_PASSWORD }}
          OWNER: ${{ secrets.DIRECT_CRM_OWNER_PASSWORD || secrets.HQ_ASSISTANT_PASSWORD }}
          USERS: ${{ secrets.DIRECT_CRM_USERS_JSON }}
          MODEL: ${{ vars.DIRECT_CRM_MODEL }}
          BACKFILL: ${{ vars.DIRECT_CRM_BACKFILL_DAYS }}
        run: |
          # only the chatplace server goes to the CRM, not the other systems of the office runner
          CP=""
          for src in "$CP_OWN" "$CP_OFFICE"; do
            [ -n "$src" ] || continue
            CP=$(printf '%s' "$src" | jq -c '(.mcpServers // {}) | to_entries | map(select((.key | test("chat.?place"; "i")) or ((.value.url // "") | test("chatplace"; "i")))) | first
              | if . then {mcpServers:{chatplace:.value}} else empty end' 2>/dev/null || true)
            [ -n "$CP" ] && break
          done
          if [ -n "$CP" ]; then echo "chatplace: $(printf '%s' "$CP" | jq -r '.mcpServers.chatplace.url' | sed -E 's#(https?://[^/]+).*#\1/…#')"
          else echo "::warning::no ChatPlace server in DIRECT_CRM_CHATPLACE_MCP_JSON / HQ_RUNNER_MCP_JSON — the CRM gets no chats"; fi
          [ -n "$ANTHROPIC" ] || echo "::warning::no Anthropic key — chats are kept, but not analyzed"
          [ -n "$BOGDAN$USERS" ] || echo "::warning::DIRECT_CRM_BOGDAN_PASSWORD is not set — Bogdan can't log in"
          [ -n "$OWNER$BOGDAN$USERS" ] || echo "::warning::no passwords at all — nobody can log in"
          line() { local x="${!2}"; printf '%s=%s\n' "$1" "${x//[$'\r\n']/}"; }
          {
            line CHATPLACE_MCP_JSON CP
            line ANTHROPIC_API_KEY ANTHROPIC
            line CRM_BOGDAN_PASSWORD BOGDAN
            line CRM_OWNER_PASSWORD OWNER
            line CRM_USERS_JSON USERS
            line CRM_MODEL MODEL
            line BACKFILL_DAYS BACKFILL
          } | grep -v '=$' | $SSH "mkdir -p /opt/direct-crm && umask 077 && cat > /opt/direct-crm/app.env"

      - name: Activate
        run: $SSH bash -s -- "$DOMAINS" "$REL" < apps/direct-crm/deploy/server.sh

      - name: Smoke test
        run: |
          # the CRM must answer on at least one name; each name says whether it is the CRM or something else
          served=""
          for d in $DOMAINS; do
            body=$(curl -sS --retry 8 --retry-delay 5 --retry-all-errors "https://$d/api/health" || true)
            if printf '%s' "$body" | grep -q '"ok":true'; then echo "✓ https://$d — the CRM"; served="${served:-$d}"
            else echo "! https://$d — not the CRM (another site or no answer)"; fi
          done
          [ -n "$served" ] || exit 1
          echo "DOMAIN=$served" >> "$GITHUB_ENV"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://$served/api/chats")
          echo "$code https://$served/api/chats (must be closed without login)"
          [ "$code" = 401 ]

      - name: Log of the CRM
        if: always() && env.SSH != ''
        run: |
          sleep 20
          curl -sS "https://${DOMAIN:-${DOMAINS%% *}}/api/health" | jq . || true
          $SSH "docker logs --tail=60 aicex-direct-crm 2>&1" || true
