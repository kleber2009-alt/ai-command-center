name: hq-office-history

# Keeps the task history of hq2.aicex.club fresh (apps/hq-office/sync/sync.mjs):
#  - after every push to main and once a day: merged PRs since the last run become task
#    cards in apps/hq-office/tasks.auto.js (PRs of one branch → one task);
#  - Run workflow with a link (Claude artifact, PR, site): that link becomes a task.
# A change is committed to main and the office is redeployed via deploy-hq-office.yml
# (a push made with GITHUB_TOKEN does not start workflows by itself, and does not
# start this one again).
#
# Secret HQ_OFFICE_ANTHROPIC_API_KEY (a key of its own, created for this workflow):
# Claude writes Russian titles and summaries. Without a key the PR title is used, and such
# tasks are rewritten by Claude on the first run that has a key.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      link:
        description: 'Ссылка: артефакт Claude, PR или сайт. Пусто — собрать новые PR'
        required: false
        type: string
      title:
        description: 'Название задачи (для артефакта Claude обязательно)'
        required: false
        type: string
      dept:
        description: 'Отдел'
        type: choice
        options: [auto, ceo, marketing, sales, traffic]
        default: auto
      summary:
        description: 'Одно-два предложения: что сделано'
        required: false
        type: string
      date:
        description: 'Дата ГГГГ-ММ-ДД (пусто — сегодня)'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: hq-office-history
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/hq-office/sync/package-lock.json

      - name: Install
        working-directory: apps/hq-office/sync
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Update history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.HQ_OFFICE_ANTHROPIC_API_KEY }}
          LINK: ${{ inputs.link }}
          TITLE: ${{ inputs.title }}
          DEPT: ${{ inputs.dept }}
          SUMMARY: ${{ inputs.summary }}
          DATE: ${{ inputs.date }}
        run: |
          if [ -n "$LINK" ]; then node apps/hq-office/sync/sync.mjs add; else node apps/hq-office/sync/sync.mjs prs; fi

      - name: Commit
        id: commit
        run: |
          if git diff --quiet -- apps/hq-office/tasks.auto.js; then echo "История без изменений"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/hq-office/tasks.auto.js
          git commit -q -m "hq-office: история задач пополнена автоматически" -m "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then echo "changed=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::Не удалось отправить tasks.auto.js в main"; exit 1

      - name: Deploy
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-hq-office.yml --ref main
