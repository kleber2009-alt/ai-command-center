name: deploy-ai-sales

# Auto-deploy ai-sales (FastAPI · aisales-api-v2 container on Hetzner)
# on push to main, or on manual workflow_dispatch from any branch.
#
# Architecture as wired today (May 2026):
#   · aisales-api-v2 runs as an orphan container (not under any compose
#     stack), image aisales-api:v0.2, listening 127.0.0.1:8001 → 8000
#   · /app inside the container is a read-only bind mount of the git
#     checkout at /home/aisales/ai-command-center/apps/ai-sales/code
#   · therefore: `git pull && docker restart aisales-api-v2` ships any
#     Python-source change without an image rebuild
#   · requirements.txt / Dockerfile changes still need a rebuild — out
#     of scope for this workflow; do that manually for now
#
# Required GitHub secrets:
#   HETZNER_SSH_KEY     · private SSH key (ed25519). The matching public
#                         key must be in ~/.ssh/authorized_keys for the
#                         deploy user on the Hetzner host.
#
# Optional repository variables (sensible defaults if unset):
#   HETZNER_HOST        · default 46.62.215.11
#   HETZNER_USER        · default aisales
#   HETZNER_SSH_PORT    · default 22
#   HETZNER_REPO_PATH   · default /home/aisales/ai-command-center
#   HETZNER_API_CONTAINER · default aisales-api-v2
#   HETZNER_API_PORT    · default 8001 (host-side port for healthcheck)

on:
  push:
    branches: [main]
    paths:
      - 'apps/ai-sales/code/**'
      - 'apps/ai-sales/agent-prompts/**'
      - 'apps/ai-sales/04-database/**'
      - '.github/workflows/deploy-ai-sales.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to deploy (defaults to main)'
        required: false
        default: 'main'
      restart_only:
        description: 'Skip git pull, just restart api container'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-ai-sales
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve target ref
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.event.inputs.ref || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.HETZNER_HOST || '46.62.215.11' }}
          username: ${{ vars.HETZNER_USER || 'aisales' }}
          port: ${{ vars.HETZNER_SSH_PORT || 22 }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          envs: TARGET_REF,REPO_PATH,RESTART_ONLY,API_CONTAINER,API_PORT
          script: |
            set -euo pipefail

            cd "$REPO_PATH"

            if [[ "$RESTART_ONLY" != "true" ]]; then
              echo "── fetching origin ──"
              git fetch --prune origin
              echo "── checking out $TARGET_REF ──"
              git checkout "$TARGET_REF"
              echo "── pulling fast-forward ──"
              git pull --ff-only origin "$TARGET_REF"
              echo "── HEAD now at: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s) ──"
            else
              echo "── restart_only=true, skipping git pull ──"
            fi

            echo "── restarting $API_CONTAINER ──"
            docker restart "$API_CONTAINER"

            echo "── waiting for /health on :$API_PORT (up to 30s) ──"
            for i in $(seq 1 15); do
              if curl -fsS "http://localhost:$API_PORT/health" > /dev/null; then
                echo "✓ healthy after ${i}x2s"
                curl -fsS "http://localhost:$API_PORT/"
                exit 0
              fi
              sleep 2
            done

            echo "✗ /health on :$API_PORT did not respond within 30s"
            docker logs --tail=50 "$API_CONTAINER"
            exit 1
        env:
          TARGET_REF: ${{ steps.ref.outputs.value }}
          REPO_PATH: ${{ vars.HETZNER_REPO_PATH || '/home/aisales/ai-command-center' }}
          RESTART_ONLY: ${{ github.event.inputs.restart_only || 'false' }}
          API_CONTAINER: ${{ vars.HETZNER_API_CONTAINER || 'aisales-api-v2' }}
          API_PORT: ${{ vars.HETZNER_API_PORT || '8001' }}

      - name: Public-facing smoke test
        run: |
          set -euo pipefail
          echo "── api root ──"
          curl -fsS https://api.46-62-215-11.nip.io/ | tee /tmp/root.json
          echo
          echo "── api /health ──"
          curl -fsS https://api.46-62-215-11.nip.io/health
