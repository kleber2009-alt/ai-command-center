# ═══ Netlify configuration ═══════════════════════════════════════
# · Functions directory: netlify/functions
# · API proxy /api/chat → /.netlify/functions/chat
# · 404 page: /404.html
# · ANTHROPIC_API_KEY → Site Settings → Environment Variables
# ═══════════════════════════════════════════════════════════════════

[build]
  publish = "."
  functions = "netlify/functions"

# ── API proxy redirects ──
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/notify-tg"
  to = "/.netlify/functions/notify-tg"
  status = 200
  force = true

# ── Phase 5: voice clone API ──
[[redirects]]
  from = "/api/voice-clone"
  to = "/.netlify/functions/voice-clone"
  status = 200
  force = true

[[redirects]]
  from = "/api/voice-generate"
  to = "/.netlify/functions/voice-generate"
  status = 200
  force = true

[[redirects]]
  from = "/api/voice-list"
  to = "/.netlify/functions/voice-list"
  status = 200
  force = true

# ── Clean URLs ──
[[redirects]]
  from = "/navigation"
  to = "/navigation.html"
  status = 200

[[redirects]]
  from = "/map"
  to = "/navigation.html"
  status = 200

[[redirects]]
  from = "/help"
  to = "/navigation.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/mini-app/index.html"
  status = 200

[[redirects]]
  from = "/miniapp"
  to = "/mini-app/index.html"
  status = 200

[[redirects]]
  from = "/tma"
  to = "/mini-app/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/cases"
  to = "/cases.html"
  status = 200

[[redirects]]
  from = "/roi"
  to = "/roi.html"
  status = 200

[[redirects]]
  from = "/compare"
  to = "/compare.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200

[[redirects]]
  from = "/glossary"
  to = "/glossary.html"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 200

[[redirects]]
