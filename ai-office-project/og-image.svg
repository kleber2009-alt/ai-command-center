<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c14"/>
      <stop offset=".5" stop-color="#1a2a4a"/>
      <stop offset="1" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8f060"/>
      <stop offset=".55" stop-color="#60c8f0"/>
      <stop offset="1" stop-color="#f06090"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".15" cy=".25" r=".4">
      <stop offset="0" stop-color="#c8f060" stop-opacity=".25"/>
      <stop offset="1" stop-color="#c8f060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".85" cy=".75" r=".4">
      <stop offset="0" stop-color="#60c8f0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#60c8f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx=".85" cy=".15" r=".3">
      <stop offset="0" stop-color="#f06090" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f06090" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ti { font: 800 96px/1.05 -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; fill: url(#title); letter-spacing: -2px; }
      .su { font: 500 32px/1.4 -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; fill: #c4ccdc; letter-spacing: -.2px; }
      .meta { font: 700 18px/1 'JetBrains Mono', monospace; fill: #c8f060; letter-spacing: 3px; text-transform: uppercase; }
      .badge { font: 700 16px/1 -apple-system, sans-serif; fill: #fff; letter-spacing: .5px; }
      .num { font: 800 56px/1 -apple-system, sans-serif; letter-spacing: -1px; }
      .num-lbl { font: 600 13px/1 -apple-system, sans-serif; fill: #7a82a0; letter-spacing: 1.5px; text-transform: uppercase; }
      .icon { font: 56px/1 -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <!-- Subtle grid -->
  <g opacity=".05" stroke="#fff" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Top brand strip -->
  <g transform="translate(72,68)">
    <rect width="14" height="14" rx="3" fill="#c8f060"/>
    <text x="28" y="13" class="meta">AI GROWTH OFFICE</text>
    <text x="350" y="13" class="meta" fill="#60c8f0">· 34 АГЕНТА · 3 ОТДЕЛА</text>
  </g>

  <!-- Main title -->
  <g transform="translate(72,200)">
    <text x="0" y="80" class="ti">Виртуальный</text>
    <text x="0" y="180" class="ti">AI-офис</text>
  </g>

  <!-- Subtitle -->
  <text x="72" y="430" class="su">34 AI-агента · контент, продажи, воронки,</text>
  <text x="72" y="468" class="su">аналитика. Заменяет команду из 10 спецов.</text>

  <!-- KPI strip at bottom -->
  <g transform="translate(72,520)">
    <text x="0" y="42" class="num" fill="#c8f060">34</text>
    <text x="0" y="68" class="num-lbl">AI-АГЕНТА</text>

    <text x="200" y="42" class="num" fill="#60c8f0">3</text>
    <text x="200" y="68" class="num-lbl">ОТДЕЛА</text>

    <text x="340" y="42" class="num" fill="#f06090">∞</text>
    <text x="340" y="68" class="num-lbl">СЦЕНАРИЕВ</text>

    <text x="500" y="42" class="num" fill="#fff060">5</text>
    <text x="500" y="68" class="num-lbl">МИНУТ ДО СТАРТА</text>
  </g>

  <!-- Right-side decorative office tower -->
  <g transform="translate(820,160)" opacity=".95">
    <!-- Tower base -->
    <rect x="0" y="100" width="240" height="320" rx="14" fill="#13162a" stroke="#c8f060" stroke-opacity=".25" stroke-width="2"/>

    <!-- Windows grid -->
    <g>
      <!-- Row 1 -->
      <rect x="20" y="120" width="40" height="40" rx="6" fill="#c8f060" opacity=".85"/>
      <rect x="76" y="120" width="40" height="40" rx="6" fill="#60c8f0" opacity=".55"/>
      <rect x="132" y="120" width="40" height="40" rx="6" fill="#f06090" opacity=".7"/>
      <rect x="188" y="120" width="40" height="40" rx="6" fill="#fff060" opacity=".4"/>
      <!-- Row 2 -->
      <rect x="20" y="176" width="40" height="40" rx="6" fill="#fff060" opacity=".4"/>
      <rect x="76" y="176" width="40" height="40" rx="6" fill="#c8f060" opacity=".9"/>
      <rect x="132" y="176" width="40" height="40" rx="6" fill="#60c8f0" opacity=".75"/>
      <rect x="188" y="176" width="40" height="40" rx="6" fill="#f06090" opacity=".4"/>
      <!-- Row 3 -->
      <rect x="20" y="232" width="40" height="40" rx="6" fill="#60c8f0" opacity=".7"/>
      <rect x="76" y="232" width="40" height="40" rx="6" fill="#f06090" opacity=".5"/>
      <rect x="132" y="232" width="40" height="40" rx="6" fill="#c8f060" opacity=".8"/>
      <rect x="188" y="232" width="40" height="40" rx="6" fill="#fff060" opacity=".55"/>
      <!-- Row 4 -->
      <rect x="20" y="288" width="40" height="40" rx="6" fill="#f06090" opacity=".65"/>
      <rect x="76" y="288" width="40" height="40" rx="6" fill="#fff060" opacity=".45"/>
      <rect x="132" y="288" width="40" height="40" rx="6" fill="#60c8f0" opacity=".8"/>
      <rect x="188" y="288" width="40" height="40" rx="6" fill="#c8f060" opacity=".7"/>
      <!-- Row 5 -->
      <rect x="20" y="344" width40="40" height="40" rx="6" fill="#fff060" opacity=".55"/>
      <rect x="76" y="344" width="40" height="40" rx="6" fill="#60c8f0" opacity=".4"/>
      <rect x="132" y="344" width="40" height="40" rx="6" fill="#f06090" opacity=".8"/>
      <rect x="188" y="344" width="40" height="40" rx="6" fill="#c8f060" opacity=".5"/>
    </g>

    <!-- Roof -->
    <rect x="-10" y="80" width="260" height="20" rx="4" fill="#c8f060"/>
    <rect x="100" y="40" width="40" height="40" rx="4" fill="#c8f060"/>
    <circle cx="120" cy="30" r="6" fill="#c8f060"/>
  </g>

  <!-- Bottom domain -->
  <text x="72" y="595" class="meta" fill="#7a82a0">AI-GROWTH-OFFICE.RU</text>

  <!-- Right corner badge -->
  <g transform="translate(1080,560)">
    <rect x="-90" y="-20" width="100" height="36" rx="18" fill="#c8f060"/>
    <text x="-40" y="3" text-anchor="middle" class="badge" fill="#080808">Pro · 1990 ₽</text>
  </g>
</svg>
