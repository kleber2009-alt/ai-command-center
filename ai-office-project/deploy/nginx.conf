# ═══════════════════════════════════════════════════════════════════════
# /etc/nginx/sites-available/ai-office
# ───────────────────────────────────────────────────────────────────────
# Опциональный reverse-proxy перед Node-сервером ai-office (8080).
#
# Зачем: gzip/Brotli, кэш статики, защита от мелкого DDoS, простой путь
# навесить TLS (sudo certbot --nginx) когда появится домен.
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ai-office
#   sudo ln -s /etc/nginx/sites-available/ai-office /etc/nginx/sites-enabled/ai-office
#   sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════════════

# Rate-limit /api/chat и voice-* (на случай если их начнут долбить
# через публичный URL). На статику не распространяется.
limit_req_zone $binary_remote_addr zone=ai_office_api:10m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Без домена: можно оставить _, Nginx будет матчить любой Host.
    # Когда появится домен — впиши его и запусти certbot.
    server_name _;

    # Реальные IP клиента в логах и заголовках.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 11 MB — потолок ElevenLabs Instant Voice Clone.
    client_max_body_size 12M;

    # Сжатие.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/html
        text/plain
        text/xml;

    access_log /var/log/nginx/ai-office.access.log;
    error_log  /var/log/nginx/ai-office.error.log warn;

    # ── /api/* — проксируем на Node, без буферизации (стримим SSE) ────
    location /api/ {
        limit_req zone=ai_office_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Не буферизовать — для стриминга ответов Anthropic.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── healthz без логов ─────────────────────────────────────────────
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8080/healthz;
    }

    # ── Всё остальное — статика через Node (он сам разруливает
    # clean-URL → .html и кэш-заголовки) ──────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
