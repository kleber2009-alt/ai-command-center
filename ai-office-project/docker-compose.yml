# ═══════════════════════════════════════════════════════════════════════
# docker-compose.yml — ai-office-project
# ───────────────────────────────────────────────────────────────────────
# One-shot deploy: `docker compose up -d --build`.
# Reads secrets from .env in the same directory (copy .env.example to
# .env and fill it in).
# ═══════════════════════════════════════════════════════════════════════

services:
  ai-office:
    build: .
    image: ai-office-project:latest
    container_name: ai-office
    restart: unless-stopped
    # Bind to host port 80 so the site is reachable at http://<server-ip>/
    # straight away. Change to "8080:8080" if you want to put Nginx in
    # front later.
    ports:
      - "80:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
