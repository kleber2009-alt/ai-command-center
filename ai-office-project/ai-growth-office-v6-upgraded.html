<script>
/* ══ CANVAS ══ */
const cv=document.getElementById('gc'), ctx=cv.getContext('2d');
let W,H;
function resize(){
  const w=document.getElementById('isoWrap');
  W=w.clientWidth; H=w.clientHeight-40;
  cv.width=W; cv.height=H;
  cv.style.width=W+'px'; cv.style.height=H+'px';
}
resize(); window.addEventListener('resize',resize);

/* ══ CAMERA ══ */
let cam={x:0,y:0,s:1,tx:0,ty:0,ts:1};
const updCam=()=>{cam.x+=(cam.tx-cam.x)*.1;cam.y+=(cam.ty-cam.y)*.1;cam.s+=(cam.ts-cam.s)*.1};
const resetCam=()=>{cam.tx=0;cam.ty=0;cam.ts=1};
const panTo=(x,y)=>{cam.tx=x;cam.ty=y};
const zoom=f=>{cam.ts=Math.max(.35,Math.min(2.4,cam.ts*f))};

/* drag */
let drag=false,_dx=0,_dy=0;
cv.addEventListener('mousedown',e=>{drag=true;_dx=e.clientX-cam.tx;_dy=e.clientY-cam.ty});
window.addEventListener('mousemove',e=>{if(drag){cam.tx=e.clientX-_dx;cam.ty=e.clientY-_dy}});
window.addEventListener('mouseup',()=>drag=false);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.91)},{passive:false});
let _pd=0,_ps=1;
cv.addEventListener('touchstart',e=>{
  if(e.touches.length===2){_pd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);_ps=cam.ts;}
  else{drag=true;_dx=e.touches[0].clientX-cam.tx;_dy=e.touches[0].clientY-cam.ty;}
},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);cam.ts=Math.max(.35,Math.min(2.4,_ps*d/_pd));}
  else if(drag){cam.tx=e.touches[0].clientX-_dx;cam.ty=e.touches[0].clientY-_dy;}
},{passive:true});
cv.addEventListener('touchend',()=>drag=false);

/* ══ ISO MATH ══ */
const TW=64,TH=32;
const iso=(gx,gy,gz=0)=>({x:(gx-gy)*(TW/2),y:(gx+gy)*(TH/2)-gz*22});

/* ══ DAY/NIGHT ══ */
// 0=dawn 1=day 2=dusk 3=night  cycle every 30s
let dayT=0; // 0..1 within cycle
const DAY_DUR=30000;
const DAY_SKY=[
  {r:255,g:200,b:120}, // dawn
  {r:255,g:255,b:255}, // day
  {r:220,g:140,b:80},  // dusk
  {r:20, g:20, b:50},  // night
];
function getSkyCol(t){
  const phases=DAY_SKY.length;
  const idx=Math.floor(t*phases)%phases;
  const next=(idx+1)%phases;
  const f=(t*phases)%1;
  const a=DAY_SKY[idx],b=DAY_SKY[next];
  return{r:a.r+(b.r-a.r)*f,g:a.g+(b.g-a.g)*f,b:a.b+(b.b-a.b)*f};
}
function skyAlpha(t){ // darkness overlay alpha
  const s=getSkyCol(t);
  return 1-(s.r+s.g+s.b)/(255*3);
}
const DAY_LABELS=['Рассвет','День','Закат','Ночь'];
function getDayLabel(t){return DAY_LABELS[Math.floor(t*4)%4];}

/* ══ PARTICLES ══ */
const particles=[];
function spawnParticle(x,y,type){
  particles.push({x,y,vx:(Math.random()-.5)*.8,vy:-Math.random()*1.2-.3,life:1,maxLife:1,type,size:type==='spark'?2.5:3});
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=.04; p.life-=.025;
    if(p.life<=0)particles.splice(i,1);
  }
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.life*.8;
    if(p.type==='spark'){ctx.fillStyle=`hsl(${50+Math.random()*20},100%,${60+p.life*30}%)`;}
    else if(p.type==='steam'){ctx.fillStyle=`rgba(200,220,255,${p.life*.4})`;p.size*=1.02;}
    else{ctx.fillStyle=`rgba(200,240,96,${p.life*.6})`;}
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

/* ══ FLOOR TRACKS (footprints) ══ */
const tracks=[];
function addTrack(x,y,now){tracks.push({x,y,born:now});if(tracks.length>40)tracks.shift();}
function drawTracks(now){
  tracks.forEach(t=>{
    const age=(now-t.born)/3000;
    if(age>1)return;
    ctx.save();ctx.globalAlpha=(1-age)*.18;
    ctx.fillStyle='#8b6040';
    ctx.beginPath();ctx.ellipse(t.x,t.y,3,2,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

/* ══ ISO DRAW HELPERS ══ */
function isoFloor(gx,gy,w,h,col){
  ctx.fillStyle=col;
  const tl=iso(gx,gy),tr=iso(gx+w,gy),br=iso(gx+w,gy+h),bl=iso(gx,gy+h);
  ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(tr.x,tr.y);ctx.lineTo(br.x,br.y);ctx.lineTo(bl.x,bl.y);ctx.closePath();ctx.fill();
  // Parquet grain
  ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=.4;
  for(let i=1;i<w;i++){const a=iso(gx+i,gy),b=iso(gx+i,gy+h);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  for(let i=1;i<h;i++){const a=iso(gx,gy+i),b=iso(gx+w,gy+i);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  ctx.strokeStyle='rgba(0,0,0,.07)';ctx.lineWidth=.5;
  ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(tr.x,tr.y);ctx.lineTo(br.x,br.y);ctx.lineTo(bl.x,bl.y);ctx.closePath();ctx.stroke();
}
function isoBox(gx,gy,w,h,gz,cTop,cL,cR){
  const tl=iso(gx,gy,gz),tr=iso(gx+w,gy,gz),br=iso(gx+w,gy+h,gz),bl=iso(gx,gy+h,gz);
  const btl=iso(gx,gy,0),btr=iso(gx+w,gy,0),bbr=iso(gx+w,gy+h,0),bbl=iso(gx,gy+h,0);
  ctx.fillStyle=cL||'rgba(0,0,0,.28)';
  ctx.beginPath();ctx.moveTo(bl.x,bl.y);ctx.lineTo(bbl.x,bbl.y);ctx.lineTo(bbr.x,bbr.y);ctx.lineTo(br.x,br.y);ctx.closePath();ctx.fill();
  ctx.fillStyle=cR||'rgba(0,0,0,.15)';
  ctx.beginPath();ctx.moveTo(tr.x,tr.y);ctx.lineTo(btr.x,btr.y);ctx.lineTo(bbr.x,bbr.y);ctx.lineTo(br.x,br.y);ctx.closePath();ctx.fill();
  ctx.fillStyle=cTop;
  ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(tr.x,tr.y);ctx.lineTo(br.x,br.y);ctx.lineTo(bl.x,bl.y);ctx.closePath();ctx.fill();
  // Top edge highlight
  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=.9;
  ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(tr.x,tr.y);ctx.lineTo(br.x,br.y);ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.10)';ctx.lineWidth=.5;
  ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(tr.x,tr.y);ctx.lineTo(br.x,br.y);ctx.lineTo(bl.x,bl.y);ctx.closePath();ctx.stroke();
}

/* ══ SCENE ══ */

    isoFloor(gx,gy,1,1,(gx+gy)%2===0?P.grass:P.grass2);

    ctx.save();ctx.globalAlpha=dk*.5;

  isoSofa(.75,.75);isoPlant(.2,.2,true);isoPlant(3.4,.2);

  // Side table next to sofa
  isoBox(2.0,2.0,.58,.58,.34,'#c8a458','#886420','#a87c30');

/* ══ IMPROVED SPRITES ══ */
const sheets={};
const LEG_PHASE=[0,1,2,3,4,3,2,1,0];

function makeSheet(a){
  const oc=document.createElement('canvas');oc.width=576;oc.height=256;
  const ox=oc.getContext('2d');
  for(let row=0;row<4;row++){
    for(let f=0;f<9;f++){

      const lo=Math.sin(ph/4*Math.PI)*5,ao=Math.sin(ph/4*Math.PI)*4.5,bob=ph===4?1.8:0;
      // shadow
      ox.save();ox.globalAlpha=.2;ox.fillStyle='#000';ox.beginPath();ox.ellipse(cx,cy+62,9,2.8,0,0,Math.PI*2);ox.fill();ox.restore();
      // legs with better shape
      ox.fillStyle=a.body;
      ox.save();ox.translate(cx-5,cy+42+bob);ox.rotate(lo*.055);ox.beginPath();ox.roundRect(-3.5,0,7.5,13,[3,3,4,4]);ox.fill();ox.restore();
      ox.save();ox.translate(cx+4,cy+42+bob);ox.rotate(-lo*.055);ox.beginPath();ox.roundRect(-3.5,0,7.5,13,[3,3,4,4]);ox.fill();ox.restore();
      // shoes with detail
      ox.fillStyle='#111';
      ox.save();ox.translate(cx-5,cy+54+bob);ox.rotate(lo*.055);ox.beginPath();ox.roundRect(-5,0,12,5,[2]);ox.fill();
      // shoe highlight
      ox.fillStyle='rgba(255,255,255,.1)';ox.beginPath();ox.roundRect(-4,0,10,2,[2]);ox.fill();
      ox.restore();
      ox.save();ox.translate(cx+4,cy+54+bob);ox.rotate(-lo*.055);ox.fillStyle='#111';ox.beginPath();ox.roundRect(-5,0,12,5,[2]);ox.fill();
      ox.fillStyle='rgba(255,255,255,.1)';ox.beginPath();ox.roundRect(-4,0,10,2,[2]);ox.fill();
      ox.restore();
      // body with shirt detail
      ox.fillStyle=a.body;ox.beginPath();ox.roundRect(cx-9.5,cy+25+bob,19,19,[3,3,2,2]);ox.fill();
      // shirt pocket / logo
      ox.fillStyle=a.acc||'rgba(200,240,96,.4)';ox.beginPath();ox.roundRect(cx-3,cy+26+bob,6,6,[1.5]);ox.fill();
      // body shading
      ox.fillStyle='rgba(0,0,0,.13)';ox.beginPath();ox.roundRect(cx+3,cy+25+bob,6.5,19,[0,3,2,0]);ox.fill();
      ox.fillStyle='rgba(255,255,255,.06)';ox.beginPath();ox.roundRect(cx-9.5,cy+25+bob,4,19,[3,0,0,2]);ox.fill();
      // belt
      ox.fillStyle='rgba(0,0,0,.25)';ox.fillRect(cx-9.5,cy+37+bob,19,2);
      // arms with gloves
      ox.fillStyle=a.body;
      ox.save();ox.translate(cx-12,cy+26+bob);ox.rotate(-ao*.065);ox.beginPath();ox.roundRect(-3.5,0,7.5,13,[4]);ox.fill();ox.restore();
      ox.save();ox.translate(cx+9,cy+26+bob);ox.rotate(ao*.065);ox.beginPath();ox.roundRect(-3.5,0,7.5,13,[4]);ox.fill();ox.restore();
      // hands
      ox.fillStyle=a.head;
      ox.save();ox.translate(cx-12,cy+26+bob);ox.rotate(-ao*.065);ox.beginPath();ox.arc(-1,14,4,0,Math.PI*2);ox.fill();
      // finger detail
      ox.fillStyle='rgba(0,0,0,.12)';ox.beginPath();ox.arc(0,14,4,0,Math.PI*2);ox.fill();
      ox.restore();
      ox.save();ox.translate(cx+9,cy+26+bob);ox.rotate(ao*.065);ox.fillStyle=a.head;ox.beginPath();ox.arc(0,14,4,0,Math.PI*2);ox.fill();ox.restore();
      // neck
      ox.fillStyle=a.head;ox.beginPath();ox.roundRect(cx-3,cy+21+bob,6,6,[2]);ox.fill();
      // HEAD — improved shape
      ox.fillStyle=a.head;ox.beginPath();ox.roundRect(cx-10.5,cy+5+bob,21,19,[6,6,5,5]);ox.fill();
      // chin shadow
      ox.fillStyle='rgba(0,0,0,.08)';ox.beginPath();ox.roundRect(cx-8,cy+19+bob,16,5,[0,0,5,5]);ox.fill();
      // HAIR — with better style
      ox.fillStyle=a.hair;ox.beginPath();ox.roundRect(cx-10.5,cy+5+bob,21,9,[6,6,2,2]);ox.fill();
      // hair side bits
      if(row===1){ox.fillRect(cx+9.5,cy+7+bob,3,7);ox.beginPath();ox.roundRect(cx+9.5,cy+13+bob,3,3,[0,0,2,0]);ox.fill();}
      if(row===3){ox.fillRect(cx-12.5,cy+7+bob,3,7);ox.beginPath();ox.roundRect(cx-12.5,cy+13+bob,3,3,[0,0,0,2]);ox.fill();}

        // mouth with smile
        ox.strokeStyle='rgba(0,0,0,.3)';ox.lineWidth=1.3;ox.lineCap='round';
        ox.beginPath();ox.arc(cx,cy+22+bob,3.5,.25,Math.PI-.25);ox.stroke();
        // cheeks
        ox.save();ox.globalAlpha=.12;ox.fillStyle='#ff8888';
        ox.beginPath();ox.ellipse(cx-5.5,cy+21+bob,3.5,2,-.1,0,Math.PI*2);ox.fill();
        ox.beginPath();ox.ellipse(cx+5.5,cy+21+bob,3.5,2,.1,0,Math.PI*2);ox.fill();
        ox.restore();
        // glasses (for some agents)
        if(a.id==='anlyt'||a.id==='str'){
          ox.strokeStyle='rgba(100,100,200,.5)';ox.lineWidth=1;
          ox.beginPath();ox.roundRect(cx-8,cy+14+bob,7,5,[2]);ox.stroke();
          ox.beginPath();ox.roundRect(cx+1,cy+14+bob,7,5,[2]);ox.stroke();
          ox.beginPath();ox.moveTo(cx-1,cy+16+bob);ox.lineTo(cx+1,cy+16+bob);ox.stroke();
        }
      } else if(row===0){
        // back — just hair bump
        ox.fillStyle=a.hair;ox.beginPath();ox.roundRect(cx-10.5,cy+5+bob,21,12,[6,6,2,2]);ox.fill();
      } else {
        const ex=row===3?cx+2:cx-2;
        // profile eye
        ox.fillStyle='#fff';ox.beginPath();ox.ellipse(ex,cy+16+bob,2.5,2,row===3?-.2:.2,0,Math.PI*2);ox.fill();
        ox.fillStyle='#3a3a8a';ox.beginPath();ox.arc(ex+(row===3?.6:-.6),cy+16.5+bob,1.5,0,Math.PI*2);ox.fill();
        ox.fillStyle='#111';ox.beginPath();ox.arc(ex+(row===3?.6:-.6),cy+16.5+bob,.9,0,Math.PI*2);ox.fill();
        ox.fillStyle='#fff';ox.beginPath();ox.arc(ex+(row===3?1:-.2),cy+15.8+bob,.5,0,Math.PI*2);ox.fill();
        // profile nose
        ox.strokeStyle='rgba(0,0,0,.18)';ox.lineWidth=1;ox.lineCap='round';
        ox.beginPath();ox.moveTo(ex+(row===3?4:-4),cy+18+bob);ox.lineTo(ex+(row===3?6:-6),cy+20+bob);ox.lineTo(ex+(row===3?4:-4),cy+20+bob);ox.stroke();
        // profile mouth
        ox.strokeStyle='rgba(0,0,0,.25)';ox.lineWidth=1.2;
        ox.beginPath();ox.arc(ex+(row===3?2:-2),cy+23+bob,2,.3,Math.PI-.3);ox.stroke();
      }
      // accessories per agent
      if(a.id==='trnd'){
        // antenna
        ox.strokeStyle='#1abc9c';ox.lineWidth=1.5;
        ox.beginPath();ox.moveTo(cx+8,cy+5+bob);ox.lineTo(cx+12,cy-2+bob);ox.stroke();
        ox.fillStyle='#1abc9c';ox.beginPath();ox.arc(cx+12,cy-3+bob,2,0,Math.PI*2);ox.fill();
      }
      if(a.id==='ceo'){
        // tie
        ox.fillStyle='#c8f060';
        ox.beginPath();ox.moveTo(cx-1,cy+25+bob);ox.lineTo(cx+1,cy+25+bob);ox.lineTo(cx+2,cy+35+bob);ox.lineTo(cx,cy+38+bob);ox.lineTo(cx-2,cy+35+bob);ox.closePath();ox.fill();
      }
      if(a.id==='hook'){
        // cap
        ox.fillStyle='#784212';
        ox.beginPath();ox.roundRect(cx-11,cy+4+bob,22,5,[4,4,0,0]);ox.fill();
        if(row===2||row===1){ox.beginPath();ox.roundRect(cx+8,cy+4+bob,5,3,[2,2,1,0]);ox.fill();}

/* ══ DRAW AGENT ══ */
const WALK=[1,2,3,4,5,6,7,8];
let lastTrack=0;

function drawAgent(a,now){
  const sh=sheets[a.id];if(!sh)return;
  const sp=iso(a.gx,a.gy,0);
  const bob=a.moving?0:Math.sin(now/900+a.gx*.4)*1.6;
  const frame=a.moving?WALK[Math.floor(now/105)%WALK.length]:0;
  const DW=38,DH=57;
  const sx=sp.x-DW/2,sy=sp.y-DH+bob;

  // Footprints when moving
  if(a.moving&&now-lastTrack>200){addTrack(sp.x,sp.y+4,now);lastTrack=now;}

  // Thinking particles
  if(a.st==='thinking'&&Math.random()<.03){
    spawnParticle(sp.x+(Math.random()-.5)*10,sy+8,'thought');
  }
  // Working sparks
  if(a.st==='working'&&Math.random()<.025){
    spawnParticle(sp.x+(Math.random()-.5)*8,sy+12,'spark');
  }

  // Shadow — bigger, softer
  ctx.save();ctx.globalAlpha=.28;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(sp.x,sp.y+5,15,5.5,0,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Agent glow at night
  const dk=skyAlpha(dayT);
  if(dk>.3){
    ctx.save();ctx.globalAlpha=dk*.35;
    const g=ctx.createRadialGradient(sp.x,sy+DH/2,0,sp.x,sy+DH/2,28);
    g.addColorStop(0,a.body+'88');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(sp.x,sy+DH/2,28,36,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Sprite
  ctx.save();ctx.imageSmoothingEnabled=false;

  // Name tag with background

    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(sp.x-5,by+bh);ctx.lineTo(sp.x+5,by+bh);ctx.lineTo(sp.x,by+bh+7);ctx.closePath();ctx.fill();

const dirTo=(ax,ay,tx,ty)=>{const dx=tx-ax,dy=ty-ay;return Math.abs(dx)>Math.abs(dy)?(dx>0?3:1):(dy>0?2:0);};

function tickIdle(now){
  if(now-lastIdle<2600)return;lastIdle=now;if(scenRunning)return;
  const a=AGENTS[Math.floor(Math.random()*AGENTS.length)];if(a.dest)return;
  const r=IDLE[a.id];if(!r)return;
  iiidx[a.id]=(iiidx[a.id]+1)%r.length;
  a.dest={gx:r[iiidx[a.id]].gx,gy:r[iiidx[a.id]].gy};
}

function updAgents(){
  AGENTS.forEach(a=>{
    if(!a.dest){a.moving=false;return;}
    const dx=a.dest.gx-a.gx,dy=a.dest.gy-a.gy,dist=Math.sqrt(dx*dx+dy*dy);
    a.moving=true;a.dir=dirTo(a.gx,a.gy,a.dest.gx,a.dest.gy);
    if(dist<SPD+.01){
      a.gx=a.dest.gx;a.gy=a.dest.gy;a.dest=null;a.moving=false;
      if(a._cb){a._cb();a._cb=null;}
    } else {a.gx+=dx/dist*SPD;a.gy+=dy/dist*SPD;}
  });
}

const beamCv = document.getElementById('beamCv');
const bctx   = beamCv.getContext('2d');
function resizeBeam() { beamCv.width = W; beamCv.height = H; beamCv.style.width=W+'px'; beamCv.style.height=H+'px'; }
window.addEventListener('resize', resizeBeam);

const beams = []; // {x1,y1,x2,y2,life,color,progress}

function spawnBeam(fromAgent, toAgent) {
  const sp1 = iso(fromAgent.gx, fromAgent.gy, 0);
  const sp2 = iso(toAgent.gx,   toAgent.gy,   0);
  beams.push({
    x1: sp1.x, y1: sp1.y - 20,
    x2: sp2.x, y2: sp2.y - 20,
    life: 1, progress: 0,
    color: fromAgent.acc || '#c8f060',
  });
}

function updateBeams() {
  for (let i = beams.length - 1; i >= 0; i--) {
    const b = beams[i];
    b.progress += 0.025;
    b.life -= 0.018;
    if (b.life <= 0 || b.progress >= 1.3) beams.splice(i, 1);
  }
}

function drawBeams() {
  bctx.clearRect(0, 0, W, H);
  bctx.save();
  bctx.translate(cam.x + W/2, cam.y + H/3);
  bctx.scale(cam.s, cam.s);

  beams.forEach(b => {
    const p  = Math.min(b.progress, 1);
    const hx = b.x1 + (b.x2 - b.x1) * p;
    const hy = b.y1 + (b.y2 - b.y1) * p;

    // Trail line
    const grad = bctx.createLinearGradient(b.x1, b.y1, hx, hy);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(0.6, b.color + '44');
    grad.addColorStop(1,   b.color + 'cc');
    bctx.strokeStyle = grad;
    bctx.lineWidth   = 2.5;
    bctx.shadowColor = b.color;
    bctx.shadowBlur  = 10;
    bctx.beginPath();
    bctx.moveTo(b.x1, b.y1);
    bctx.lineTo(hx,   hy);
    bctx.stroke();
    bctx.shadowBlur = 0;

    // Head orb
    const orbGrad = bctx.createRadialGradient(hx, hy, 0, hx, hy, 10);
    orbGrad.addColorStop(0, '#fff');
    orbGrad.addColorStop(0.3, b.color);
    orbGrad.addColorStop(1, 'transparent');
    bctx.save();
    bctx.globalAlpha = b.life * .9;
    bctx.fillStyle = orbGrad;
    bctx.beginPath();
    bctx.arc(hx, hy, 10, 0, Math.PI * 2);
    bctx.fill();
    // sparks around orb
    for (let s = 0; s < 5; s++) {
      const a = (now_g * 0.003 + s * 1.26);
      const r = 8 + Math.sin(now_g * 0.005 + s) * 3;
      bctx.fillStyle = b.color;
      bctx.globalAlpha = b.life * .5;
      bctx.beginPath();
      bctx.arc(hx + Math.cos(a)*r, hy + Math.sin(a)*r*.5, 2, 0, Math.PI*2);
      bctx.fill();
    }
    bctx.restore();
  });

  bctx.restore();
}

const MM_W  = 140, MM_H = 100;

// Map bounds in grid coords
const MAP_GX = -1, MAP_GY = -1, MAP_GW = 16, MAP_GH = 16;

function gridToMM(gx, gy) {
  return {

    y: (gy - MAP_GY) / MAP_GH * MM_H,
  };
}

// Room definitions for minimap
const MM_ROOMS = [
  {gx:0,gy:0,gw:4,gh:4,  col:'#c8a868',label:'Веранда'},
  {gx:4,gy:0,gw:5,gh:4,  col:'#c8a868',label:'Работа'},
  {gx:9,gy:0,gw:4,gh:4,  col:'#b8c4a0',label:'Lounge'},
  {gx:0,gy:4,gw:3,gh:5,  col:'#9aa080',label:'Архив'},
  {gx:3,gy:4,gw:6,gh:5,  col:'#c8a868',label:'Хаб'},
  {gx:9,gy:4,gw:4,gh:5,  col:'#8fa898',label:'Meeting'},
  {gx:0,gy:9,gw:7,gh:4,  col:'#c8a060',label:'Опен'},
  {gx:7,gy:9,gw:6,gh:4,  col:'#8fa898',label:'CEO'},
];

function drawMinimap() {
  mmCtx.clearRect(0, 0, MM_W, MM_H);
  // BG
  mmCtx.fillStyle = '#1a3a0a';
  mmCtx.fillRect(0, 0, MM_W, MM_H);

  // Rooms
  MM_ROOMS.forEach(r => {
    const tl = gridToMM(r.gx,       r.gy);
    const br = gridToMM(r.gx+r.gw,  r.gy+r.gh);
    mmCtx.fillStyle = r.col + 'bb';
    mmCtx.fillRect(tl.x, tl.y, br.x-tl.x, br.y-tl.y);
    mmCtx.strokeStyle = 'rgba(0,0,0,.3)';
    mmCtx.lineWidth = .5;
    mmCtx.strokeRect(tl.x, tl.y, br.x-tl.x, br.y-tl.y);
  });

  // Agents
  AGENTS.forEach(a => {
    const p = gridToMM(a.gx, a.gy);
    const col = SC[a.st] || '#fff';
    mmCtx.fillStyle = col;
    mmCtx.shadowColor = col;
    mmCtx.shadowBlur = 4;
    mmCtx.beginPath();
    mmCtx.arc(p.x, p.y, 2.8, 0, Math.PI*2);
    mmCtx.fill();
    mmCtx.shadowBlur = 0;
  });

  // Beams on minimap
  beams.forEach(b => {
    // convert screen back to grid is complex — skip, just show pulse at agents
  });

  // Viewport indicator
  // cam.x,y,s → what grid area is visible
  const vpW = W / cam.s / TW;
  const vpH = H / cam.s / TH * 2;
  const vpGX = (-cam.x / cam.s) / (TW/2) * .5 - MAP_GX;
  const vpGY = (-cam.y / cam.s) / (TH/2) * .5 - MAP_GY;
  const vpTL = gridToMM(vpGX, vpGY);
  const vpBR = gridToMM(vpGX+vpW, vpGY+vpH);
  const vp = document.getElementById('mmViewport');
  vp.style.left   = Math.max(0, vpTL.x) + 'px';
  vp.style.top    = Math.max(0, vpTL.y) + 'px';
  vp.style.width  = Math.min(MM_W, vpBR.x-vpTL.x) + 'px';
  vp.style.height = Math.min(MM_H, vpBR.y-vpTL.y) + 'px';
}

function minimapClick(e) {
  const r = document.getElementById('minimap').getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const gx = mx / MM_W * MAP_GW + MAP_GX;
  const gy = my / MM_H * MAP_GH + MAP_GY;
  // Pan camera to this grid pos
  const sp = iso(gx, gy, 0);
  cam.tx = -sp.x; cam.ty = -sp.y;
}

/* ══ SOUND ENGINE (Web Audio API) ══ */
let audioCtx = null, soundOn = false;

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, dur, type='sine', vol=0.08, delay=0) {
  if (!soundOn) return;
  try {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = type; osc.frequency.value = freq;
    const t = ac.currentTime + delay;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t); osc.stop(t + dur + 0.05);
  } catch(e) {}
}

function playStep() { playTone(180 + Math.random()*40, 0.06, 'triangle', 0.04); }
function playNotif() {
  playTone(523, 0.1, 'sine', 0.1);
  playTone(659, 0.1, 'sine', 0.1, 0.1);
  playTone(784, 0.15,'sine', 0.12, 0.2);
}
function playBeam() {
  playTone(880, 0.05, 'sine', 0.06);
  playTone(1100,0.08, 'sine', 0.05, 0.05);
  playTone(1320,0.12, 'sine', 0.04, 0.1);
}
function playAmbient(now) {
  // Very subtle random hum
  if (!soundOn) return;
  if (Math.random() < 0.003) playTone(60 + Math.random()*20, 0.4, 'sine', 0.015);
}

let stepTimer = 0;
function tickSteps(now) {
  if (now - stepTimer < 280) return; stepTimer = now;
  AGENTS.forEach(a => { if (a.moving) playStep(); });
}

function toggleSound() {
  soundOn = !soundOn;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundOn ? '🔊' : '🔇';
  btn.classList.toggle('on', soundOn);
  if (soundOn) { getAudio(); playNotif(); }
}

/* ══ ROOM HOVER ══ */
const ROOM_BOUNDS = MM_ROOMS.map(r => ({
  x1: r.gx, y1: r.gy, x2: r.gx + r.gw, y2: r.gy + r.gh, label: r.label
}));
let hoveredRoom = null;

cv.addEventListener('mousemove', e => {
  const r    = cv.getBoundingClientRect();
  const sx   = (e.clientX - r.left) * (cv.width / r.width);
  const sy   = (e.clientY - r.top)  * (cv.height / r.height);
  const wx   = (sx - cam.x - W/2) / cam.s;
  const wy   = (sy - cam.y - H/3) / cam.s;
  // iso to grid (approx)
  const gx   = (wx / (TW/2) + wy / (TH/2)) / 2;
  const gy   = (wy / (TH/2) - wx / (TW/2)) / 2;
  const room = ROOM_BOUNDS.find(rb => gx >= rb.x1 && gx < rb.x2 && gy >= rb.y1 && gy < rb.y2);
  const tip  = document.getElementById('roomTip');
  if (room && room !== hoveredRoom) {
    hoveredRoom = room;
    tip.textContent = room.label;
    tip.style.display = 'block';
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top  = (e.clientY - 28) + 'px';
  } else if (!room) {
    hoveredRoom = null;
    tip.style.display = 'none';
  } else {
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top  = (e.clientY - 28) + 'px';
  }
});
cv.addEventListener('mouseleave', () => {
  document.getElementById('roomTip').style.display = 'none';
  hoveredRoom = null;
});

/* ══ ROOM HIGHLIGHT OVERLAY ══ */
function drawRoomHover() {
  if (!hoveredRoom) return;
  const r = hoveredRoom;
  const tl = iso(r.x1, r.y1, 0), tr = iso(r.x2, r.y1, 0);
  const br = iso(r.x2, r.y2, 0), bl = iso(r.x1, r.y2, 0);
  ctx.save();
  ctx.globalAlpha = 0.12 + Math.sin(now_g * 0.004) * 0.04;
  ctx.fillStyle   = '#c8f060';
  ctx.beginPath();
  ctx.moveTo(tl.x,tl.y); ctx.lineTo(tr.x,tr.y);
  ctx.lineTo(br.x,br.y); ctx.lineTo(bl.x,bl.y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(200,240,96,.5)';
  ctx.lineWidth   = 1.5; ctx.stroke();
  ctx.restore();
}

/* ══ MAIN LOOP (V6) ══ */
function loop(now){
  now_g = now;
  // Update day/night
  dayT=(now%(DAY_DUR*4))/(DAY_DUR*4);
  document.getElementById('dayLabel').textContent=getDayLabel(dayT);

  updCam();

  // Resize beam canvas to match
  if (beamCv.width !== W || beamCv.height !== H) resizeBeam();

  ctx.save();
  ctx.clearRect(0,0,W,H);
  ctx.translate(cam.x+W/2, cam.y+H/3);
  ctx.scale(cam.s,cam.s);

  drawScene(now);
  drawTracks(now);
  drawRoomHover();
  tickIdle(now); tickSt(now); updAgents();
  updateParticles();
  tickSteps(now);
  playAmbient(now);

  // Y-sort agents
  [...AGENTS].sort((a,b)=>(a.gx+a.gy)-(b.gx+b.gy)).forEach(a=>drawAgent(a,now));
  drawParticles();

  ctx.restore();

  // Beam overlay (separate canvas, own transform)
  updateBeams();
  drawBeams();

  // Minimap
  drawMinimap();

  requestAnimationFrame(loop);
}
// Loop is started by genSpritesWithProgress() after all sprites load
