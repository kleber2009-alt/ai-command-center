# AI Sales · полный локальный стек
# Запуск: docker compose up -d
# Логи:   docker compose logs -f api
# Стоп:   docker compose down

version: "3.9"

services:

  # ============ Postgres 16 ============
  postgres:
    image: postgres:16-alpine
    container_name: aisales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aisales
      POSTGRES_USER: aisales
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aisales_local_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aisales_pg_data:/var/lib/postgresql/data
      - ../04-database/001_initial_schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../04-database/003_analytics_schema.sql:/docker-entrypoint-initdb.d/02-analytics.sql:ro
      - ../04-database/004_platform_metrics.sql:/docker-entrypoint-initdb.d/03-platform.sql:ro
      - ../04-database/005_platform_seed.sql:/docker-entrypoint-initdb.d/04-platform-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisales -d aisales"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Redis 7 ============
  redis:
    image: redis:7-alpine
    container_name: aisales-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-aisales_local_dev} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - aisales_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aisales_local_dev}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============ Qdrant ============
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aisales-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - aisales_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============ MinIO ============
  minio:
    image: minio/minio:latest
    container_name: aisales-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aisales}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aisales_local_dev}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"  # web console
    volumes:
      - aisales_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============ FastAPI backend ============
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aisales-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    environment:
      AISALES_MOCK: ${AISALES_MOCK:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENV: ${ENV:-dev}
      # DB
      POSTGRES_URL: postgresql+asyncpg://aisales:${POSTGRES_PASSWORD:-aisales_local_dev}@postgres:5432/aisales
      # Cache
      REDIS_URL: redis://:${REDIS_PASSWORD:-aisales_local_dev}@redis:6379/0
      # Vector
      QDRANT_URL: http://qdrant:6333
      # Storage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-aisales}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aisales_local_dev}
      MINIO_BUCKET: aisales-media
      # Cloud APIs (передавай через .env)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      # Channels
      IG_APP_SECRET: ${IG_APP_SECRET:-}
      IG_VERIFY_TOKEN: ${IG_VERIFY_TOKEN:-aisales-verify-changeme}
      IG_PAGE_TOKEN: ${IG_PAGE_TOKEN:-}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_WEBHOOK_SECRET: ${TG_WEBHOOK_SECRET:-}
      ILYA_TG_CHAT_ID: ${ILYA_TG_CHAT_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../agent-prompts:/app/../agent-prompts:ro
      - ../voice-input:/app/../voice-input:rw

  # ============ AI Command Center · Next.js dashboard ============
  dashboard:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: aisales-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://aisales:${POSTGRES_PASSWORD:-aisales_local_dev}@postgres:5432/aisales
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"

  # ============ Caddy reverse proxy ============
  # Терминирует HTTPS через Let's Encrypt (nip.io домен на проде)
  # и роутит:  /            → dashboard:3000
  #            /api/sales/* → api:8000   (без префикса)
  #            /webhooks/*  → api:8000
  caddy:
    image: caddy:2-alpine
    container_name: aisales-caddy
    restart: unless-stopped
    depends_on:
      - api
      - dashboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - aisales_caddy_data:/data
      - aisales_caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}

volumes:
  aisales_pg_data:
  aisales_redis_data:
  aisales_qdrant_data:
  aisales_minio_data:
  aisales_caddy_data:
  aisales_caddy_config:
