services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vp-postgres
    environment:
      POSTGRES_USER: viral
      POSTGRES_PASSWORD: viral
      POSTGRES_DB: viral_platform
    ports:
      - "5432:5432"
    volumes:
      - vp_pg_data:/var/lib/postgresql/data
      - ./packages/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viral -d viral_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vp-redis
    ports:
      - "6379:6379"
    volumes:
      - vp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO stands in for Cloudflare R2 locally (S3-compatible).
  minio:
    image: minio/minio:latest
    container_name: vp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: viral
      MINIO_ROOT_PASSWORD: viralsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - vp_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the video bucket on startup so the app has somewhere to upload.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 viral viralsecret;
      mc mb --ignore-existing local/viral-videos;
      mc anonymous set download local/viral-videos;
      exit 0;
      "

volumes:
  vp_pg_data:
  vp_redis_data:
  vp_minio_data:
