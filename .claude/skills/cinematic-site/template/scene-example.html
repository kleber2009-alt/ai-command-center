<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>AI Office — 3D scene for renders</title>
<!--
  Procedural "night office" scene. Not shipped to visitors: it is rendered
  offline (see render.js) into the hero scrub video, the poster and the stills.
  Contract (used by .claude/skills/cinematic-site/scripts/render-frames.js):
    window.SCENE_READY  -> true when assets are built
    window.SHOTS        -> { name: {...} } list of still shots
    window.renderAt(shot, t) -> renders shot at t∈[0,1], returns JPEG dataURL
-->
<style>html,body{margin:0;background:#0b0b0c;overflow:hidden}canvas{display:block}</style>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

await document.fonts.load('500 56px Manrope').catch(() => {});
const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1280, H = +Q.get('h') || 720;
const GOLD = 0xc8a46a, GOLD_HI = 0xffd9a0;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0c);
scene.fog = new THREE.FogExp2(0x0b0b0c, 0.018);
const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 400);

// ---------- helpers ----------
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const mat = (o) => new THREE.MeshStandardMaterial(o);
function box(w, h, d, m, x, y, z) { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.castShadow = b.receiveShadow = true; scene.add(b); return b; }
function textTex(txt, { size = 64, color = '#c8a46a', spacing = 18, weight = 500 } = {}) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  g.font = `${weight} ${size}px Manrope, Arial, sans-serif`;
  const chars = [...txt]; let wdt = 0; chars.forEach(ch => wdt += g.measureText(ch).width + spacing);
  c.width = Math.ceil(wdt + 40); c.height = size * 1.6;
  g.font = `${weight} ${size}px Manrope, Arial, sans-serif`; g.fillStyle = color; g.textBaseline = 'middle';
  let x = 20; chars.forEach(ch => { g.fillText(ch, x, c.height / 2); x += g.measureText(ch).width + spacing; });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return { t, aspect: c.width / c.height };
}

// ---------- materials ----------
const M = {
  floor: mat({ color: 0x0d0d0f, roughness: 0.32, metalness: 0.35 }),
  rug: mat({ color: 0x151517, roughness: 0.9 }),
  walnut: mat({ color: 0x2a1f16, roughness: 0.45, metalness: 0.05 }),
  gold: mat({ color: GOLD, roughness: 0.28, metalness: 1 }),
  leather: mat({ color: 0x121214, roughness: 0.6 }),
  body: mat({ color: 0x1b1a19, roughness: 0.25, metalness: 0.85 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x9fb0c0, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.07, depthWrite: false }),
  strip: new THREE.MeshBasicMaterial({ color: 0xffe2b0 }),
  screenBack: mat({ color: 0x0e0e10, roughness: 0.4, metalness: 0.6 }),
};

// dim "dashboard" on every monitor: gold bars + text lines, never a white blob
function screenTex() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 140; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 140); gr.addColorStop(0, '#2a2117'); gr.addColorStop(1, '#15110c');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 140);
  g.fillStyle = 'rgba(232,200,140,.85)'; g.fillRect(14, 14, 70, 6);
  g.fillStyle = 'rgba(232,210,170,.35)'; for (let i = 0; i < 6; i++) g.fillRect(14, 32 + i * 9, 40 + rnd() * 50, 3);
  for (let i = 0; i < 9; i++) { const h = 18 + rnd() * 70; g.fillStyle = i === 6 ? 'rgba(255,214,150,.95)' : 'rgba(200,164,106,.6)'; g.fillRect(124 + i * 13, 124 - h, 8, h); }
  g.strokeStyle = 'rgba(255,220,160,.7)'; g.lineWidth = 2; g.beginPath(); g.moveTo(14, 124);
  for (let x = 14; x < 110; x += 12) g.lineTo(x, 124 - 10 - rnd() * 28 - (x - 14) * 0.2); g.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ---------- floor ----------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), M.floor);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// ---------- zones & agents (from apps/ai-office: 10 agents, 6 departments) ----------
const ZONES = [
  { id: 'strategy', name: 'СТРАТЕГИЯ', x: -12.5, z: -5.5, agents: [['sofia', 0]] },
  { id: 'ceo', name: 'УПРАВЛЕНИЕ', x: 0, z: -5.5, agents: [['max', 0]] },
  { id: 'product', name: 'ПРОДУКТ И QA', x: 12.5, z: -5.5, agents: [['oscar', -2.4], ['vera', 2.4]] },
  { id: 'content', name: 'КОНТЕНТ', x: -12.5, z: 5.5, agents: [['mark', -2.4], ['hunter', 2.4]] },
  { id: 'sales', name: 'ПРОДАЖИ', x: 0, z: 5.5, agents: [['alisa', -2.4], ['leo', 2.4]] },
  { id: 'analytics', name: 'АНАЛИТИКА', x: 12.5, z: 5.5, agents: [['nika', -2.4], ['trend', 2.4]] },
];
const ZW = 11.4, ZD = 9.4;
const AG = {}; // id -> {pos, head, light, zone}

ZONES.forEach(z => {
  const rug = new THREE.Mesh(new THREE.PlaneGeometry(ZW - 0.6, ZD - 0.6), M.rug);
  rug.rotation.x = -Math.PI / 2; rug.position.set(z.x, 0.005, z.z); rug.receiveShadow = true; scene.add(rug);
  // gold inlay frame
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(ZW - 0.3, ZD - 0.3)), new THREE.LineBasicMaterial({ color: GOLD, transparent: true, opacity: 0.55 }));
  e.rotation.x = -Math.PI / 2; e.position.set(z.x, 0.012, z.z); scene.add(e);
  // floor signage
  const { t, aspect } = textTex(z.name, { size: 56, spacing: 22 });
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(0.62 * aspect, 0.62), new THREE.MeshBasicMaterial({ map: t, transparent: true, opacity: 0.85, depthWrite: false }));
  sign.rotation.x = -Math.PI / 2; sign.position.set(z.x, 0.02, z.z + ZD / 2 - 0.85); scene.add(sign);
  // ceiling light strip
  box(ZW - 3, 0.04, 0.12, M.strip, z.x, 4.6, z.z);
  const pl = new THREE.PointLight(0xffc98a, 14, 14, 1.6); pl.position.set(z.x, 4.2, z.z); scene.add(pl);

  z.agents.forEach(([id, dx]) => {
    const x = z.x + dx, dz = z.z - 0.6;
    // desk
    box(2.6, 0.08, 1.25, M.walnut, x, 1.02, dz);
    [[-1.2, -0.5], [1.2, -0.5], [-1.2, 0.5], [1.2, 0.5]].forEach(([a, b]) => box(0.05, 1, 0.05, M.gold, x + a, 0.5, dz + b));
    // monitor facing +z (toward the agent and camera)
    box(1.25, 0.72, 0.04, M.screenBack, x, 1.62, dz - 0.35);
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(1.17, 0.64), new THREE.MeshBasicMaterial({ map: screenTex() }));
    scr.position.set(x, 1.62, dz - 0.325); scene.add(scr);
    box(0.06, 0.32, 0.06, M.gold, x, 1.22, dz - 0.36);
    // chair
    box(0.75, 0.08, 0.7, M.leather, x, 0.62, dz + 1.05);
    box(0.75, 0.85, 0.08, M.leather, x, 1.05, dz + 1.42);
    box(0.06, 0.6, 0.06, M.gold, x, 0.3, dz + 1.05);
    // agent: dark metal body + glowing core
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.55, 8, 16), M.body);
    body.position.set(x, 1.18, dz + 1.1); body.castShadow = true; scene.add(body);
    const headMat = new THREE.MeshStandardMaterial({ color: 0x221a10, emissive: 0xffc77a, emissiveIntensity: 1.2, roughness: 0.3 });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 32, 16), headMat);
    head.position.set(x, 1.86, dz + 1.1); scene.add(head);
    const halo = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.012, 8, 48), new THREE.MeshBasicMaterial({ color: GOLD }));
    halo.position.copy(head.position); halo.rotation.x = Math.PI / 2; scene.add(halo);
    const light = new THREE.PointLight(0xffd59a, 2.2, 5, 2); light.position.set(x, 1.9, dz + 0.6); scene.add(light);
    AG[id] = { pos: new THREE.Vector3(x, 1.86, dz + 1.1), head, headMat, light, halo, zone: z };
  });
});

// glass partitions between zones (with gold edges)
function glassWall(w, x, z, rotY) {
  const g = new THREE.Mesh(new THREE.BoxGeometry(w, 2.6, 0.04), M.glass); g.position.set(x, 1.3, z); g.rotation.y = rotY; scene.add(g);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(g.geometry), new THREE.LineBasicMaterial({ color: GOLD, transparent: true, opacity: 0.35 }));
  e.position.copy(g.position); e.rotation.y = rotY; scene.add(e);
}
[-6.25, 6.25].forEach(x => { glassWall(ZD - 1.4, x, -5.5, Math.PI / 2); glassWall(ZD - 1.4, x, 5.5, Math.PI / 2); });
[-12.5, 12.5].forEach(x => glassWall(ZW - 4, x, 0, 0));

// ---------- window wall + city ----------
for (let x = -40; x <= 40; x += 3.2) box(0.1, 6, 0.1, M.gold, x, 3, -12.2);
box(84, 0.12, 0.14, M.gold, 0, 6, -12.2);
box(84, 0.12, 0.14, M.gold, 0, 0.06, -12.2);

function windowsTex() {
  const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 64, 256);
  for (let y = 4; y < 252; y += 8) for (let x = 4; x < 60; x += 8) if (rnd() > 0.45) { g.fillStyle = `rgba(255,${190 + rnd() * 50 | 0},${120 + rnd() * 60 | 0},${0.35 + rnd() * 0.65})`; g.fillRect(x, y, 4, 4); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
const wt = windowsTex();
for (let i = 0; i < 90; i++) {
  const w = 3 + rnd() * 7, h = 10 + rnd() * rnd() * 70, x = -110 + rnd() * 220, z = -40 - rnd() * 70;
  const t = wt.clone(); t.needsUpdate = true; t.repeat.set(w / 4.5, h / 13); t.offset.set(rnd(), rnd());
  const m = new THREE.MeshStandardMaterial({ color: 0x08080a, emissive: 0xffc27a, emissiveMap: t, emissiveIntensity: 0.9, roughness: 0.6, fog: false });
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), m); b.position.set(x, h / 2, z); scene.add(b);
}
// the tall tower
{
  const g = new THREE.CylinderGeometry(0.4, 4.2, 150, 6, 1);
  const t = wt.clone(); t.needsUpdate = true; t.repeat.set(4, 40);
  const m = new THREE.MeshStandardMaterial({ color: 0x0a0a0c, emissive: 0xffd4a0, emissiveMap: t, emissiveIntensity: 1.1, fog: false });
  const tw = new THREE.Mesh(g, m); tw.position.set(14, 75, -95); scene.add(tw);
}
// horizon glow
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#060607'); gr.addColorStop(0.55, '#141018'); gr.addColorStop(0.82, '#4a3420'); gr.addColorStop(1, '#0b0b0c');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sky = new THREE.Mesh(new THREE.PlaneGeometry(600, 160), new THREE.MeshBasicMaterial({ map: t, fog: false }));
  sky.position.set(0, 60, -170); scene.add(sky);
}

// ---------- task handoff arcs ----------
const LINKS = [['max', 'sofia'], ['sofia', 'mark'], ['mark', 'hunter'], ['hunter', 'alisa'], ['alisa', 'leo'], ['leo', 'nika'], ['nika', 'trend'], ['max', 'oscar'], ['oscar', 'vera'], ['trend', 'mark']];
const pulses = [];
const arcMat = new THREE.MeshBasicMaterial({ color: GOLD, transparent: true, opacity: 0.55 });
LINKS.forEach(([a, b], i) => {
  const A = AG[a].pos, B = AG[b].pos, mid = A.clone().add(B).multiplyScalar(0.5); mid.y += 2.2 + A.distanceTo(B) * 0.12;
  const curve = new THREE.QuadraticBezierCurve3(A.clone().add(new THREE.Vector3(0, 0.3, 0)), mid, B.clone().add(new THREE.Vector3(0, 0.3, 0)));
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 64, 0.012, 6), arcMat));
  const p = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 8), new THREE.MeshBasicMaterial({ color: 0xfff0d0 }));
  scene.add(p); pulses.push({ curve, p, off: i * 0.137 });
});

// ---------- dust ----------
{
  const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { pos[i * 3] = -22 + rnd() * 44; pos[i * 3 + 1] = rnd() * 5; pos[i * 3 + 2] = -12 + rnd() * 26; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffd9a0, size: 0.03, transparent: true, opacity: 0.6 })));
}

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x2a2620, 0x050505, 0.6));
const key = new THREE.DirectionalLight(0xffd9a8, 0.7); key.position.set(-14, 22, 18); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -26, right: 26, top: 18, bottom: -18, near: 1, far: 70 });
scene.add(key);

// ---------- post ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.6, 0.5, 0.8); composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- shots ----------
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const ease = t => -(Math.cos(Math.PI * t) - 1) / 2; // sine in-out: motion spread over the whole scroll
const SHOTS = {
  // scroll-scrubbed hero: aerial establishing shot -> glide down into the CEO desk
  hero: { path: [V(-7, 21, 27), V(-4, 13, 20), V(3.2, 4.4, 4.5), V(2.6, 2.7, -0.8)], look: [V(0, 0, -2), V(0, 0.8, -3), V(0, 1.6, -5), V(0, 1.7, -6.4)], focus: 'max' },
  wide: { pos: V(-14, 22, 30), look: V(1, 0, -1) },
  low: { pos: V(-3, 2.1, 13), look: V(2, 2.6, -14) },
  side: { pos: V(30, 9, 10), look: V(0, 1, -2) },
  top: { pos: V(0.01, 46, 6), look: V(0, 0, -0.5) },
  city: { pos: V(4, 2.4, -4), look: V(10, 9, -60) },
  founder: { pos: V(3.4, 2.0, -0.6), look: V(-0.2, 1.8, -6.2), focus: 'max' },
};
// card stills: over-the-shoulder views, angle varies per agent so a grid of 10 doesn't repeat
const ANG = [[3.0, 1.25, 4.1, -0.35], [-3.2, 0.9, 3.8, 0.4], [2.0, 3.4, 3.0, -0.2], [-2.2, 0.15, 4.4, 0.3], [4.2, 2.2, 2.2, -1.8]];
Object.entries(AG).forEach(([id, a], i) => {
  const p = a.pos, [dx, dy, dz, lx] = ANG[i % ANG.length];
  SHOTS['agent-' + id] = { pos: V(p.x + dx, p.y + dy, p.z + dz), look: V(p.x + lx, p.y - 0.45, p.z - 1.0), focus: id };
});

function setFocus(id) {
  Object.entries(AG).forEach(([k, a]) => {
    const on = !id || k === id;
    a.headMat.emissiveIntensity = k === id ? 1.5 : on ? 1.2 : 0.7;
    a.light.intensity = k === id ? 4 : 2.2;
  });
}
function along(arr, t) { // catmull-rom through control points
  return new THREE.CatmullRomCurve3(arr, false, 'centripetal').getPoint(t);
}
window.SHOTS = Object.keys(SHOTS);
window.renderAt = (name, t = 0) => {
  const s = SHOTS[name]; if (!s) throw new Error('no shot ' + name);
  if (s.path) { const e = ease(t); camera.position.copy(along(s.path, e)); camera.lookAt(along(s.look, e)); }
  else { camera.position.copy(s.pos); camera.lookAt(s.look); }
  setFocus(s.focus);
  const ph = s.path ? t * 2.2 : 0.35;
  pulses.forEach(({ curve, p, off }) => p.position.copy(curve.getPoint((ph + off) % 1)));
  Object.values(AG).forEach((a, i) => { a.halo.rotation.z = (s.path ? t * 3 : 0) + i; a.halo.rotation.x = Math.PI / 2 + Math.sin(i + t * 4) * 0.25; });
  composer.render();
  return renderer.domElement.toDataURL('image/jpeg', 0.9);
};
window.SCENE_READY = true;
</script>
</body></html>
